s y opuestas sobre cuerpos distintos (3ª). El momento lineal (momentum) p = mv se conserva en sistemas cerrados, y la fuerza es la rapidez de cambio del momento: F = Δ(mv)/Δt; el impulso (impulse) es FΔt.\n\nEl trabajo (work) es W = Fs cos θ y la potencia (power) es P = W/t = Fv. La energía se conserva: cinética Ek = ½mv² y potencial gravitatoria ΔEp = mgΔh. En materiales, la densidad es ρ = m/V. La ley de Hooke (Hooke's law) dice F = kΔL hasta el límite de proporcionalidad (limit of proportionality). El esfuerzo (tensile stress) es F/A, la deformación (tensile strain) es ΔL/L, y el módulo de Young (Young modulus) es E = esfuerzo ÷ deformación. La energía elástica almacenada es ½FΔL, igual al área bajo la gráfica fuerza-extensión.", "analogia": "El momento lineal es como el 'empuje' de un carrito del súper: un carrito lleno (más masa) a la misma velocidad es mucho más difícil de frenar que uno vacío. Y las bolsas de aire de un coche funcionan alargando el tiempo de frenado: el mismo cambio de momento en más tiempo significa menos fuerza sobre ti.", "ejemplo": "Dejas caer una pelota desde 20 m (sin resistencia del aire). Con v² = u² + 2as: v² = 0 + 2 × 9.81 × 20 = 392.4, así que v ≈ 19.8 m s⁻¹. Lo mismo sale por energía: mgh = ½mv².", "puntos": ["Escalares: solo magnitud; vectores: magnitud y dirección (scalars / vectors).", "Equilibrio: fuerza resultante cero y momentos horarios = antihorarios (principle of moments).", "SUVAT solo vale con aceleración constante; en v-t, pendiente = aceleración y área = desplazamiento.", "F = ma y F = Δp/Δt; el momento lineal se conserva en colisiones si no hay fuerzas externas (conservation of momentum).", "Colisión elástica (elastic): se conserva la energía cinética; inelástica (inelastic): no.", "Módulo de Young E = esfuerzo/deformación; energía elástica = área bajo la gráfica F-ΔL (elastic strain energy)."], "formulas": ["v = u + at", "s = ½(u + v)t", "s = ut + ½at²", "v² = u² + 2as", "F = ma; F = Δ(mv)/Δt; p = mv", "Momento = Fd", "W = Fs cos θ; P = W/t = Fv", "Ek = ½mv²; ΔEp = mgΔh", "eficiencia = potencia útil ÷ potencia de entrada", "F = kΔL; E = (F/A) ÷ (ΔL/L) = FL/(AΔL)", "Energía elástica = ½FΔL; ρ = m/V"], "glosario": [{"en": "resultant force", "es": "fuerza resultante"}, {"en": "momentum", "es": "momento lineal (cantidad de movimiento)"}, {"en": "terminal speed", "es": "velocidad terminal"}, {"en": "tensile stress", "es": "esfuerzo de tensión"}, {"en": "elastic limit", "es": "límite elástico"}], "flashcards": [{"q": "¿Qué representa el área bajo una gráfica velocidad-tiempo?", "a": "El desplazamiento."}, {"q": "Enuncia la 3ª ley de Newton", "a": "Si A ejerce una fuerza sobre B, B ejerce una fuerza igual y opuesta sobre A (del mismo tipo)."}, {"q": "¿Qué es el impulso?", "a": "FΔt, igual al cambio de momento lineal; es el área bajo una gráfica fuerza-tiempo."}, {"q": "¿Cuándo alcanza un paracaidista su velocidad terminal?", "a": "Cuando la resistencia del aire iguala su peso y la fuerza resultante es cero."}, {"q": "Unidad del módulo de Young", "a": "Pa (N m⁻²), igual que el esfuerzo, porque la deformación no tiene unidades."}, {"q": "¿Qué es un material frágil (brittle)?", "a": "Uno que se rompe sin deformación plástica apreciable, como el vidrio."}], "preguntas": [{"q": "Un coche parte del reposo y acelera a 2.0 m s⁻² durante 5.0 s. ¿Distancia recorrida?", "op": ["10 m", "50 m", "20 m", "25 m"], "ok": 3, "exp": "s = ut + ½at² = 0 + ½ × 2.0 × 5.0² = 25 m. 10 m es la velocidad final (v = at), no la distancia."}, {"q": "Una bola de 0.50 kg a 4.0 m s⁻¹ rebota a 4.0 m s⁻¹ en sentido opuesto. ¿Cambio de momento?", "op": ["0", "4.0 kg m s⁻¹", "2.0 kg m s⁻¹", "8.0 kg m s⁻¹"], "ok": 1, "exp": "Δp = m(v − u) = 0.50 × (−4.0 − 4.0) = −4.0 kg m s⁻¹, magnitud 4.0. Decir 0 olvida que el momento es un vector."}, {"q": "Un motor levanta 200 N a 3.0 m en 4.0 s. ¿Potencia útil?", "op": ["150 W", "600 W", "2400 W", "267 W"], "ok": 0, "exp": "W = Fs = 200 × 3.0 = 600 J; P = 600/4.0 = 150 W. 600 es el trabajo, no la potencia."}, {"q": "Si duplicas la longitud de un alambre (mismo material, misma fuerza y área), su extensión...", "op": ["se reduce a la mitad", "no cambia", "se duplica", "se cuadruplica"], "ok": 2, "exp": "ΔL = FL/(AE): la extensión es proporcional a L, así que se duplica. E solo depende del material."}, {"q": "En el punto más alto de un proyectil lanzado en ángulo...", "op": ["la velocidad es cero", "la aceleración es cero", "la velocidad horizontal es cero", "la velocidad vertical es cero"], "ok": 3, "exp": "Solo la componente vertical es cero; la horizontal sigue constante y la aceleración sigue siendo g hacia abajo."}], "feynman": "Explica a tu hermano por qué es más seguro caer sobre un colchón que sobre el piso, usando las palabras 'momento', 'tiempo' y 'fuerza' y nada de fórmulas.", "conexion": ["En deportes (tenis, fútbol), ¿por qué 'acompañar' el golpe con la raqueta o el pie hace que la pelota salga más rápido? Relaciónalo con el impulso.", "En ingeniería y arquitectura, ¿por qué se usa acero y no vidrio para las vigas de un puente? Piensa en módulo de Young, ductilidad y fragilidad."], "examen": {"q": "A steel wire of length 2.0 m and diameter 0.50 mm extends by 1.6 mm when a load of 40 N is applied. Calculate the Young modulus of the steel.", "marks": 4, "ms": "1. A = π(0.25 × 10⁻³)² = 1.96 × 10⁻⁷ m². 2. Stress = 40 / 1.96 × 10⁻⁷ = 2.04 × 10⁸ Pa. 3. Strain = 1.6 × 10⁻³ / 2.0 = 8.0 × 10⁻⁴. 4. E = stress/strain = 2.5 × 10¹¹ Pa (accept 2.5–2.6 × 10¹¹ Pa)."}}, {"id": "FIS05", "materia": "Física", "mesa": "AQA", "rama": "Física", "tema": "Electricidad", "temaEN": "Electricity", "explicacion": "La corriente eléctrica (current) es la rapidez de flujo de carga: I = ΔQ/Δt, en amperes (A). La diferencia de potencial (potential difference, p.d.) es la energía transferida por unidad de carga: V = W/Q, en volts. La resistencia (resistance) es R = V/I, en ohms (Ω). Un conductor óhmico (ohmic conductor) a temperatura constante tiene I proporcional a V. Una lámpara de filamento aumenta su resistencia al calentarse; un diodo (diode) solo conduce en un sentido; un termistor NTC (thermistor) baja su resistencia al subir la temperatura y un LDR la baja con más luz.\n\nLa resistencia de un alambre depende de su material, longitud y área: R = ρL/A, donde ρ es la resistividad (resistivity, Ω m). Algunos materiales se vuelven superconductores (superconductors) por debajo de su temperatura crítica: resistencia cero. En serie (series), la corriente es la misma y las resistencias se suman; en paralelo (parallel), el voltaje es el mismo y 1/R_T = 1/R₁ + 1/R₂. La carga y la energía se conservan (leyes de Kirchhoff). La potencia es P = IV = I²R = V²/R.\n\nUn divisor de potencial (potential divider) son dos resistencias en serie que reparten el voltaje en proporción a sus valores; con un termistor o un LDR se hacen sensores de temperatura o luz. Toda fuente real tiene resistencia interna (internal resistance, r). La fuerza electromotriz (EMF, ε) es la energía que la fuente da a cada coulomb; parte se 'pierde' dentro de la fuente (lost volts = Ir) y el resto es el voltaje en las terminales (terminal p.d.): ε = I(R + r) = V + Ir. Si graficas V contra I, la pendiente es −r y la intersección con el eje V es ε.", "analogia": "Un circuito es como un sistema de agua: la batería es una bomba que sube el agua (da energía, EMF), la corriente es cuánta agua pasa por segundo y las resistencias son tubos angostos. La resistencia interna es como una fuga dentro de la propia bomba: parte de la energía se pierde antes de llegar a los tubos.", "ejemplo": "Una batería con ε = 6.0 V y r = 0.50 Ω alimenta una resistencia R = 2.5 Ω. I = ε/(R + r) = 6.0 ÷ 3.0 = 2.0 A. Lost volts = Ir = 1.0 V; voltaje en terminales V = IR = 5.0 V.", "puntos": ["I = ΔQ/Δt; V = W/Q; R = V/I (current, p.d., resistance).", "R = ρL/A: más largo, más resistencia; más grueso, menos (resistivity).", "Serie: misma I, R_T = R₁ + R₂; paralelo: mismo V, 1/R_T = 1/R₁ + 1/R₂.", "Termistor NTC: R baja al subir T; LDR: R baja con más luz (sensors).", "Divisor de potencial: V_out = V_in × R₂/(R₁ + R₂) (potential divider).", "ε = I(R + r): parte de la energía se pierde en la resistencia interna (EMF and internal resistance)."], "formulas": ["I = ΔQ/Δt", "V = W/Q", "R = V/I", "P = IV = I²R = V²/R; E = IVt", "R = ρL/A", "Serie: R_T = R₁ + R₂ + …", "Paralelo: 1/R_T = 1/R₁ + 1/R₂ + …", "V_out = V_in × R₂/(R₁ + R₂)", "ε = I(R + r) = V + Ir", "e = 1.60 × 10⁻¹⁹ C"], "glosario": [{"en": "potential difference", "es": "diferencia de potencial"}, {"en": "resistivity", "es": "resistividad"}, {"en": "internal resistance", "es": "resistencia interna"}, {"en": "terminal p.d.", "es": "voltaje en las terminales"}, {"en": "superconductor", "es": "superconductor"}], "flashcards": [{"q": "Define la diferencia de potencial", "a": "Energía transferida por unidad de carga entre dos puntos (V = W/Q)."}, {"q": "¿Qué es la EMF?", "a": "La energía que la fuente transfiere a cada unidad de carga que pasa por ella."}, {"q": "¿Cómo cambia la resistencia de un termistor NTC al calentarse?", "a": "Disminuye."}, {"q": "Dos resistencias de 6 Ω en paralelo dan...", "a": "3 Ω."}, {"q": "En una gráfica V–I de una batería, ¿qué indican pendiente e intersección?", "a": "Pendiente = −r; intersección con el eje V = ε."}, {"q": "¿Qué es un superconductor?", "a": "Un material con resistividad cero por debajo de su temperatura crítica."}], "preguntas": [{"q": "Una carga de 30 C pasa en 1 minuto. ¿Corriente?", "op": ["30 A", "0.5 A", "2 A", "1800 A"], "ok": 1, "exp": "I = Q/t = 30/60 = 0.5 A. Hay que convertir el minuto a 60 s."}, {"q": "Resistencias de 4 Ω y 12 Ω en paralelo:", "op": ["16 Ω", "8 Ω", "0.33 Ω", "3 Ω"], "ok": 3, "exp": "1/R = 1/4 + 1/12 = 4/12 → R = 3 Ω. En paralelo siempre es menor que la más pequeña; 16 Ω sería en serie."}, {"q": "Un alambre de cobre (ρ = 1.7 × 10⁻⁸ Ω m) mide 10 m con diámetro 1.0 mm. ¿Resistencia?", "op": ["0.22 Ω", "0.054 Ω", "0.87 Ω", "2.2 Ω"], "ok": 0, "exp": "A = π(0.50 × 10⁻³)² = 7.85 × 10⁻⁷ m²; R = ρL/A = 1.7 × 10⁻⁸ × 10 / 7.85 × 10⁻⁷ ≈ 0.22 Ω. 0.054 Ω usa el diámetro como radio."}, {"q": "Divisor: V_in = 12 V, R₁ = 2 kΩ, R₂ = 4 kΩ. ¿V_out en R₂?", "op": ["4 V", "6 V", "8 V", "3 V"], "ok": 2, "exp": "V_out = 12 × 4/(2 + 4) = 8 V. La resistencia mayor se lleva la mayor parte del voltaje; 4 V es el de R₁."}, {"q": "Al aumentar la corriente que da una batería real, su voltaje en terminales...", "op": ["aumenta", "disminuye", "no cambia", "se vuelve igual a la EMF"], "ok": 1, "exp": "V = ε − Ir: con más I hay más lost volts y V baja. Solo es igual a ε cuando I = 0."}], "feynman": "Explica a tu papá por qué las luces del coche se atenúan un poco cuando arranca el motor, usando 'resistencia interna' y 'voltios perdidos'.", "conexion": ["Tu celular dice 'batería al 20%' y se apaga antes con frío: ¿cómo cambia la resistencia interna con la temperatura y por qué importa?", "En el recibo de luz se cobran kWh: ¿cuánto cuesta dejar un cargador de 5 W conectado todo el año a un precio dado? Relaciónalo con E = Pt."], "examen": {"q": "A cell is connected to a variable resistor. When the current is 0.20 A the terminal p.d. is 1.40 V; when the current is 0.60 A the terminal p.d. is 1.20 V. Calculate the internal resistance and the EMF of the cell.", "marks": 4, "ms": "1. Uses ε = V + Ir for both readings: ε = 1.40 + 0.20r and ε = 1.20 + 0.60r. 2. 0.40r = 0.20 (or gradient = −ΔV/ΔI). 3. r = 0.50 Ω. 4. ε = 1.40 + 0.20 × 0.50 = 1.50 V."}}, {"id": "ECO01", "materia": "Economía", "mesa": "Edexcel", "rama": "Microeconomía", "tema": "Naturaleza de la economía", "temaEN": "Nature of economics: scarcity, opportunity cost, PPF, specialisation and economic agents", "explicacion": "La economía es una ciencia social (social science) que estudia cómo las personas, las empresas y los gobiernos deciden usar recursos escasos para satisfacer deseos ilimitados. Ese choque entre recursos limitados y deseos infinitos se llama el problema económico (economic problem) o escasez (scarcity). Los recursos son los factores de producción (factors of production): tierra (land), trabajo (labour), capital (capital) y espíritu empresarial (enterprise). Como no alcanza para todo, siempre hay que elegir: qué producir, cómo producirlo y para quién.\n\nCada elección tiene un costo de oportunidad (opportunity cost): el valor de la siguiente mejor alternativa a la que renuncias. La frontera de posibilidades de producción (production possibility frontier, PPF) lo muestra con una gráfica: las combinaciones máximas de dos bienes que una economía puede producir usando todos sus recursos de forma eficiente. Un punto sobre la curva es eficiente (productively efficient), uno dentro indica recursos desempleados o mal usados, y uno fuera es inalcanzable por ahora. Si la PPF se desplaza hacia afuera hay crecimiento económico (economic growth). Suele ser cóncava porque los recursos no sirven igual para todo, así que el costo de oportunidad aumenta.\n\nLa especialización (specialisation) y la división del trabajo (division of labour), que Adam Smith explicó en 1776 con su fábrica de alfileres, aumentan la productividad, aunque generan monotonía y dependencia; para intercambiar lo que cada quien produce se necesita dinero (money), que funciona como medio de cambio, medida de valor, depósito de valor y medio de pago diferido. Los agentes económicos (economic agents) son consumidores, productores y gobierno, y se organizan en economías de libre mercado (free market), dirigidas (command) o mixtas (mixed). Ojo con distinguir afirmaciones positivas (positive statements), que se pueden comprobar con datos, de las normativas (normative statements), que son juicios de valor.", "analogia": "Tienes 300 pesos y una tarde libre, Claudia. Si vas al cine con tus amigas, renuncias a comprar ese libro y a estudiar para tu examen. Lo que más te hubiera gustado de lo que dejaste es tu costo de oportunidad: no es todo lo que no hiciste, solo la mejor alternativa sacrificada.", "ejemplo": "Durante la pandemia de 2020, el gobierno del Reino Unido destinó miles de millones de libras al NHS y al esquema de protección del empleo (furlough). Ese dinero tuvo un costo de oportunidad: no se usó en otras áreas o requirió más deuda pública. En México, cuando el gobierno invierte en una refinería como Dos Bocas, el costo de oportunidad podría ser escuelas, hospitales o energía renovable que no se financiaron.", "puntos": ["La escasez (scarcity) obliga a elegir porque los recursos son finitos y los deseos infinitos.", "El costo de oportunidad (opportunity cost) es la siguiente mejor alternativa a la que se renuncia.", "La PPF (production possibility frontier) muestra eficiencia, ineficiencia, inalcanzabilidad y crecimiento económico.", "La especialización y la división del trabajo (division of labour) elevan la productividad, pero tienen desventajas como monotonía y dependencia.", "Las afirmaciones positivas (positive) se comprueban con datos; las normativas (normative) contienen juicios de valor (value judgements).", "Las economías pueden ser de libre mercado (free market), dirigidas (command) o mixtas (mixed economy)."], "formulas": ["Opportunity cost = valor de la siguiente mejor alternativa sacrificada", "Opportunity cost en la PPF = unidades del bien Y sacrificadas ÷ unidades extra del bien X ganadas", "Factores de producción: land (rent), labour (wages), capital (interest), enterprise (profit)", "Adam Smith (1776), The Wealth of Nations: división del trabajo en la fábrica de alfileres", "Funciones del dinero: medium of exchange, measure of value, store of value, method of deferred payment"], "glosario": [{"en": "scarcity", "es": "escasez"}, {"en": "opportunity cost", "es": "costo de oportunidad"}, {"en": "production possibility frontier (PPF)", "es": "frontera de posibilidades de producción"}, {"en": "division of labour", "es": "división del trabajo"}, {"en": "normative statement", "es": "afirmación normativa"}], "flashcards": [{"q": "¿Qué es el problema económico (economic problem)?", "a": "Recursos escasos frente a deseos ilimitados; obliga a elegir."}, {"q": "Define costo de oportunidad (opportunity cost).", "a": "El valor de la siguiente mejor alternativa a la que se renuncia."}, {"q": "¿Qué indica un punto dentro de la PPF?", "a": "Ineficiencia: hay recursos desempleados o mal asignados."}, {"q": "¿Qué provoca un desplazamiento hacia afuera de la PPF?", "a": "Más o mejores recursos: tecnología, inversión, más población activa (crecimiento económico)."}, {"q": "¿Por qué la PPF suele ser cóncava?", "a": "Porque los recursos no son igual de aptos para todo y el costo de oportunidad aumenta."}, {"q": "Da un ejemplo de afirmación normativa.", "a": "'El gobierno debería subir el salario mínimo': contiene un juicio de valor."}], "preguntas": [{"q": "¿Cuál es la mejor definición de costo de oportunidad?", "op": ["El precio pagado por un bien", "La siguiente mejor alternativa sacrificada", "El total de todas las alternativas posibles", "El costo de producir una unidad extra"], "ok": 1, "exp": "El costo de oportunidad es solo la siguiente mejor alternativa a la que renuncias, no la suma de todas ni el precio monetario."}, {"q": "Un punto fuera de la PPF representa:", "op": ["Desempleo de recursos", "Eficiencia productiva", "Asignación eficiente", "Una combinación inalcanzable con los recursos actuales"], "ok": 3, "exp": "Fuera de la curva no se puede producir con los recursos y la tecnología actuales."}, {"q": "¿Cuál de estas es una afirmación positiva (positive statement)?", "op": ["La inflación en el Reino Unido fue mayor en 2022 que en 2019", "El gobierno debería bajar los impuestos", "Es injusto que existan monopolios", "Los ricos deberían pagar más impuestos"], "ok": 0, "exp": "Se puede comprobar con datos; las otras contienen juicios de valor (normativas)."}, {"q": "¿Qué causaría un desplazamiento hacia adentro de la PPF?", "op": ["Un avance tecnológico", "Mayor inmigración de trabajadores", "Un desastre natural que destruye capital", "Más inversión en educación"], "ok": 2, "exp": "Destruir recursos reduce la capacidad productiva, así que la PPF se mueve hacia adentro."}, {"q": "Una desventaja de la división del trabajo es:", "op": ["Mayor productividad", "Monotonía y desmotivación de los trabajadores", "Menores costos por unidad", "Trabajadores más hábiles en su tarea"], "ok": 1, "exp": "Repetir la misma tarea puede aburrir y desmotivar; las demás opciones son ventajas."}], "feynman": "Explícale a tu hermano de 10 años por qué no puedes tenerlo todo y qué es lo que 'pierdes' cada vez que eliges algo, usando solo tu domingo y tus ganas de hacer cosas como ejemplo.", "conexion": ["¿Cómo cambiaría la PPF de México si invirtiera fuertemente en educación y tecnología durante 10 años? ¿Y si se enfrentara a una crisis que dejara a mucha gente sin trabajo?", "¿Por qué una economía mixta como la del Reino Unido no deja todo al libre mercado ni todo al gobierno?"], "examen": {"q": "With the help of a production possibility frontier (PPF) diagram, explain how investment in new technology could affect the UK economy and the opportunity cost of producing more capital goods today.", "marks": 8, "ms": "Knowledge/Application/Analysis (6): correct PPF with labelled axes (e.g. capital goods vs consumer goods); definition of opportunity cost as next best alternative forgone; movement along the PPF towards capital goods shows consumer goods sacrificed now; outward shift of PPF in future due to increased productive capacity; reference to UK context. Evaluation (2): e.g. depends on whether resources are fully employed (point inside PPF means no opportunity cost), time lag, size of investment, whether technology is adopted effectively."}}, {"id": "ECO02", "materia": "Economía", "mesa": "Edexcel", "rama": "Microeconomía", "tema": "Mercados: oferta y demanda", "temaEN": "How markets work: demand, supply, elasticities and price determination", "explicacion": "Un mercado (market) es cualquier lugar o sistema donde compradores y vendedores intercambian. La demanda (demand) es la cantidad que los consumidores están dispuestos y pueden comprar a cada precio; por la ley de la demanda, si sube el precio baja la cantidad demandada, por eso la curva tiene pendiente negativa. Un cambio en el precio provoca un movimiento a lo largo de la curva (movement along), mientras que un cambio en otros factores, como ingreso, gustos, precio de bienes sustitutos (substitutes) o complementarios (complements), publicidad o población, provoca un desplazamiento de la curva (shift).\n\nLa oferta (supply) es la cantidad que los productores están dispuestos y pueden vender a cada precio; tiene pendiente positiva porque a mayor precio hay más incentivo de ganancia. Se desplaza por costos de producción, tecnología, impuestos indirectos, subsidios, número de empresas o clima. Donde se cruzan oferta y demanda está el equilibrio (equilibrium): el precio en el que la cantidad demandada es igual a la ofrecida. Si el precio está arriba hay excedente (excess supply) y si está abajo hay escasez (excess demand), y el precio se ajusta.\n\nLas elasticidades miden qué tanto reaccionan las cantidades. La elasticidad precio de la demanda (price elasticity of demand, PED) mide la respuesta de la cantidad demandada ante cambios en el precio: si es mayor que 1 en valor absoluto es elástica, si es menor que 1 es inelástica, y esto determina qué pasa con el ingreso total (total revenue). La elasticidad ingreso (income elasticity of demand, YED) distingue bienes normales (positiva) de inferiores (negativa); la elasticidad cruzada (cross elasticity, XED) identifica sustitutos (positiva) y complementarios (negativa); y la elasticidad precio de la oferta (price elasticity of supply, PES) depende del tiempo, la capacidad sobrante y las existencias. La especificación también pide conocer que los consumidores no siempre son racionales (behavioural economics): influyen la conducta de otros, los hábitos y la mala capacidad de cálculo.", "analogia": "Piensa en los boletos para un concierto de Taylor Swift o de Bad Bunny: muchísima gente los quiere (alta demanda) y hay pocos lugares (oferta fija). Por eso el precio se dispara en la reventa. Si el artista abriera tres fechas más, la oferta crecería y el precio bajaría.", "ejemplo": "En 2022, tras la invasión de Ucrania, el precio del gas en el Reino Unido se disparó porque la oferta mundial cayó; como la demanda de gas para calefacción es muy inelástica (PED baja), los hogares siguieron comprándolo y su gasto total subió mucho. En México, el aguacate muestra lo mismo: una mala cosecha en Michoacán reduce la oferta y sube el precio en el supermercado.", "puntos": ["Un cambio en el precio mueve a lo largo de la curva (movement along); otros factores la desplazan (shift).", "El equilibrio (equilibrium) ocurre donde la cantidad demandada es igual a la cantidad ofrecida.", "PED elástica (>1): bajar el precio sube el ingreso total (total revenue); PED inelástica (<1): subir el precio sube el ingreso total.", "YED positiva = bien normal (normal good); YED negativa = bien inferior (inferior good); YED > 1 = bien de lujo (luxury).", "XED positiva = sustitutos (substitutes); XED negativa = complementarios (complements).", "La PES (price elasticity of supply) es mayor en el largo plazo y cuando hay capacidad sobrante (spare capacity) o inventarios."], "formulas": ["PED = %ΔQd / %ΔP", "YED = %ΔQd / %ΔY (ingreso)", "XED = %ΔQd del bien A / %ΔP del bien B", "PES = %ΔQs / %ΔP", "Total revenue (TR) = Precio × Cantidad", "% de cambio = (valor nuevo − valor anterior) / valor anterior × 100"], "glosario": [{"en": "demand", "es": "demanda"}, {"en": "supply", "es": "oferta"}, {"en": "equilibrium price", "es": "precio de equilibrio"}, {"en": "price elasticity of demand (PED)", "es": "elasticidad precio de la demanda"}, {"en": "inferior good", "es": "bien inferior"}], "flashcards": [{"q": "¿Qué provoca un movimiento a lo largo de la curva de demanda?", "a": "Solo un cambio en el precio del propio bien."}, {"q": "Nombra tres factores que desplazan la demanda.", "a": "Ingreso, gustos/moda, precio de sustitutos o complementarios, publicidad, población."}, {"q": "Si la PED es −0.4, ¿qué tipo de demanda es?", "a": "Inelástica (precio inelastic): la cantidad cambia menos que el precio."}, {"q": "¿Qué signo tiene la XED de dos bienes complementarios?", "a": "Negativo (por ejemplo, impresoras y cartuchos de tinta)."}, {"q": "¿Qué pasa en el mercado si el precio está por encima del equilibrio?", "a": "Hay excedente (excess supply) y el precio tiende a bajar."}, {"q": "¿Por qué la PES es mayor en el largo plazo?", "a": "Las empresas tienen tiempo para ampliar capacidad, contratar y entrar al mercado."}], "preguntas": [{"q": "Si el precio de un bien sube 10% y la cantidad demandada cae 20%, la PED es:", "op": ["−0.5, inelástica", "−2, elástica", "−2, inelástica", "−0.2, elástica"], "ok": 1, "exp": "PED = −20% / 10% = −2. Como su valor absoluto es mayor que 1, es elástica."}, {"q": "¿Qué causaría un desplazamiento a la derecha de la oferta de trigo?", "op": ["Un aumento del precio del trigo", "Una sequía", "Un nuevo impuesto indirecto", "Una mejora en la tecnología agrícola"], "ok": 3, "exp": "La tecnología reduce costos y aumenta la oferta; el precio solo mueve a lo largo de la curva."}, {"q": "Una YED de −0.6 indica que el bien es:", "op": ["Inferior", "De lujo", "Normal necesario", "Complementario"], "ok": 0, "exp": "YED negativa: al subir el ingreso se compra menos, como el transporte en autobús para algunas personas."}, {"q": "Si la demanda es inelástica, una empresa que sube su precio verá que su ingreso total:", "op": ["Disminuye", "No cambia", "Aumenta", "Se vuelve cero"], "ok": 2, "exp": "Con demanda inelástica la cantidad cae proporcionalmente menos que la subida del precio, así que TR aumenta."}, {"q": "Si sube el precio del café, ¿qué pasa con la demanda de té (sustituto)?", "op": ["Aumenta: la curva se desplaza a la derecha", "Disminuye: se desplaza a la izquierda", "Se mueve a lo largo de la curva", "No cambia"], "ok": 0, "exp": "Los consumidores cambian al sustituto más barato; XED positiva."}], "feynman": "Explica con un ejemplo de tu cafetería favorita por qué subir el precio de un café puede hacer que la cafetería gane más o gane menos dinero, sin usar la palabra 'elasticidad' hasta el final.", "conexion": ["¿Por qué crees que los gobiernos prefieren poner impuestos a productos con demanda inelástica como el tabaco o la gasolina?", "¿Cómo podría la economía conductual (behavioural economics) explicar que la gente siga comprando un producto cuando el precio sube?"], "examen": {"q": "Using a supply and demand diagram, explain the likely impact of a poor harvest on the equilibrium price and quantity of coffee, and examine how the price elasticity of demand for coffee affects the size of the price change.", "marks": 8, "ms": "Knowledge/Application/Analysis (6): diagram with supply shifting left; new equilibrium with higher price and lower quantity; explanation of excess demand at original price driving price up; definition of PED; with inelastic demand the price rise is larger and quantity fall smaller. Evaluation (2): e.g. availability of substitutes (tea, energy drinks), time period, stockpiles held by producers, global vs local market, size of harvest shortfall."}}, {"id": "ECO03", "materia": "Economía", "mesa": "Edexcel", "rama": "Microeconomía", "tema": "Mecanismo de precios", "temaEN": "Price mechanism: rationing, incentive and signalling functions; consumer and producer surplus", "explicacion": "El mecanismo de precios (price mechanism) es la forma en que, en un libre mercado, los precios coordinan las decisiones de millones de personas sin que nadie dé órdenes. Adam Smith lo llamó la 'mano invisible' (invisible hand). Los precios responden a cambios en la oferta y la demanda, y así deciden qué se produce, cuánto y para quién. Para la especificación de Edexcel debes saber explicar sus tres funciones.\n\nPrimero, la función de racionamiento (rationing function): cuando algo escasea, el precio sube y solo lo compran quienes están dispuestos y pueden pagar más, así se reparte lo poco que hay. Segundo, la función de señalización (signalling function): un precio alto avisa a productores y consumidores que hay escasez o que algo es más deseado, y un precio bajo indica lo contrario. Tercero, la función de incentivo (incentive function): un precio más alto motiva a las empresas a producir más porque esperan más ganancias, y desplaza recursos hacia ese mercado. Con estas funciones los recursos se reasignan (resource allocation) de mercados en declive a mercados en expansión.\n\nEl excedente del consumidor (consumer surplus) es la diferencia entre lo máximo que el consumidor estaría dispuesto a pagar y lo que de hecho paga; en la gráfica es el área entre la curva de demanda y el precio. El excedente del productor (producer surplus) es la diferencia entre el precio que recibe el productor y el precio mínimo al que estaría dispuesto a vender; es el área entre el precio y la curva de oferta. Si la demanda aumenta, el precio sube y por lo general crece el excedente del productor; si la oferta aumenta y el precio baja, crece el excedente del consumidor. La suma de ambos es el bienestar total (economic welfare).", "analogia": "Imagina un tianguis donde las fresas se acaban rápido. El vendedor sube el precio (racionamiento: solo compra quien de verdad las quiere), los demás puestos ven que las fresas se venden caras (señal) y la próxima semana traen más fresas porque ganarán más (incentivo). Nadie se puso de acuerdo, el precio hizo todo el trabajo.", "ejemplo": "Cuando la demanda de coches eléctricos creció en el Reino Unido, los precios altos de las baterías señalaron escasez e incentivaron inversiones, como la gigafábrica de baterías anunciada en Somerset por Tata (Agratas). En México, el auge del nearshoring elevó la demanda y las rentas de naves industriales en Monterrey, lo que señaló a los desarrolladores que construyeran más parques industriales.", "puntos": ["Las tres funciones del precio: racionamiento (rationing), señalización (signalling) e incentivo (incentive).", "El mecanismo de precios reasigna recursos (resource allocation) sin un planificador central: la 'mano invisible' (invisible hand) de Adam Smith.", "El excedente del consumidor (consumer surplus) es lo que estaría dispuesto a pagar menos lo que paga.", "El excedente del productor (producer surplus) es el precio recibido menos el precio mínimo aceptable.", "Un aumento de la demanda sube el precio y tiende a aumentar el excedente del productor.", "El mecanismo de precios puede fallar (market failure), lo que justifica la intervención del gobierno."], "formulas": ["Consumer surplus = área bajo la curva de demanda y sobre el precio (triángulo = ½ × base × altura)", "Producer surplus = área sobre la curva de oferta y bajo el precio", "Economic welfare (bienestar) = consumer surplus + producer surplus", "Adam Smith (1776): concepto de la 'invisible hand'"], "glosario": [{"en": "price mechanism", "es": "mecanismo de precios"}, {"en": "rationing function", "es": "función de racionamiento"}, {"en": "signalling function", "es": "función de señalización"}, {"en": "incentive function", "es": "función de incentivo"}, {"en": "consumer surplus", "es": "excedente del consumidor"}], "flashcards": [{"q": "¿Cuáles son las tres funciones del mecanismo de precios?", "a": "Racionamiento, señalización e incentivo."}, {"q": "¿Qué hace la función de racionamiento?", "a": "Reparte bienes escasos subiendo el precio para que solo compren quienes pueden y quieren pagar."}, {"q": "Define excedente del consumidor.", "a": "Diferencia entre el precio máximo que pagaría el consumidor y el precio de mercado."}, {"q": "Define excedente del productor.", "a": "Diferencia entre el precio de mercado y el precio mínimo al que el productor vendería."}, {"q": "¿Qué pasa con el excedente del consumidor si el precio de equilibrio baja?", "a": "Aumenta, porque los consumidores pagan menos de lo que estaban dispuestos."}, {"q": "¿Quién habló de la 'mano invisible'?", "a": "Adam Smith, en The Wealth of Nations (1776)."}], "preguntas": [{"q": "Cuando un precio alto motiva a las empresas a producir más, actúa la función de:", "op": ["Racionamiento", "Señalización", "Incentivo", "Redistribución"], "ok": 2, "exp": "El incentivo es la motivación de ganancia que lleva a aumentar la producción."}, {"q": "En un diagrama de oferta y demanda, el excedente del consumidor es el área:", "op": ["Sobre el precio y bajo la curva de demanda", "Bajo el precio y sobre la curva de oferta", "Bajo la curva de oferta", "Entre las dos curvas a la derecha del equilibrio"], "ok": 0, "exp": "Es la diferencia entre la disposición a pagar (curva de demanda) y el precio pagado."}, {"q": "Si la oferta de un bien aumenta y el precio cae, normalmente:", "op": ["El excedente del consumidor disminuye", "El excedente del consumidor aumenta", "Desaparece el excedente del productor", "No cambia ningún excedente"], "ok": 1, "exp": "Precio más bajo y mayor cantidad amplían el triángulo del excedente del consumidor."}, {"q": "¿Qué función del precio reparte entradas escasas para una final de fútbol entre los aficionados?", "op": ["Incentivo", "Señalización", "Subsidio", "Racionamiento"], "ok": 3, "exp": "El precio alto limita la compra a quienes están dispuestos y pueden pagar."}, {"q": "Un aumento del precio de los vuelos a Cancún informa a las aerolíneas de que hay alta demanda. Esto es la función de:", "op": ["Señalización", "Racionamiento", "Excedente del productor", "Costo de oportunidad"], "ok": 0, "exp": "El precio funciona como información (señal) sobre cambios en el mercado."}], "feynman": "Explícale a una amiga cómo el precio de las fresas en el mercado 'habla' a vendedores y compradores sin que nadie organice nada, usando las palabras racionar, avisar y motivar.", "conexion": ["¿Qué pasaría con las tres funciones del precio si el gobierno fijara un precio máximo muy bajo para la gasolina?", "¿Por qué un aumento en la demanda puede beneficiar a los productores pero perjudicar a algunos consumidores? Piensa en el excedente de cada uno."], "examen": {"q": "Explain how the price mechanism would allocate resources following a large increase in demand for electric vehicles in the UK. Use a diagram to illustrate the change in producer surplus.", "marks": 8, "ms": "Knowledge/Application/Analysis (6): demand curve shifts right; excess demand at original price; price rises - rationing function; higher price signals to producers and acts as incentive to expand output and move resources (e.g. labour, capital) into EV production; diagram showing increase in producer surplus area (above supply, below price). Evaluation (2): e.g. supply may be inelastic in the short run (battery shortages), time lags, government subsidies distort signals, information gaps may weaken signalling."}}, {"id": "ECO04", "materia": "Economía", "mesa": "Edexcel", "rama": "Microeconomía", "tema": "Fallas del mercado", "temaEN": "Market failure: externalities, public goods and information gaps", "explicacion": "Hay una falla de mercado (market failure) cuando el libre mercado asigna mal los recursos y el resultado no es el mejor para la sociedad: se produce demasiado o muy poco de algo. Edexcel pide tres tipos principales: las externalidades (externalities), la falta de bienes públicos (under-provision of public goods) y las brechas de información (information gaps). La falla puede ser completa, cuando el mercado ni siquiera existe (missing market), o parcial, cuando existe pero produce una cantidad incorrecta.\n\nUna externalidad es un efecto sobre terceros (third parties) que no participan en la transacción. En una externalidad negativa de producción, como la contaminación de una fábrica, el costo social (social cost) es mayor que el costo privado (private cost), así que el mercado sobreproduce y se genera una pérdida de bienestar (welfare loss). En una externalidad positiva de consumo, como la educación o la vacunación, el beneficio social (social benefit) supera al privado y el mercado subproduce. El equilibrio social óptimo está donde el costo marginal social (MSC) es igual al beneficio marginal social (MSB).\n\nLos bienes públicos (public goods), como el alumbrado público o la defensa nacional, son no rivales (non-rival), porque que tú los uses no reduce lo que hay para otros, y no excluibles (non-excludable), porque no se puede impedir que alguien los use. Por eso aparece el problema del polizón (free rider problem): nadie quiere pagar y el mercado no los provee. Los bienes privados (private goods) son rivales y excluibles. Por último, las brechas de información (information gaps) ocurren cuando compradores o vendedores no tienen información completa o una parte sabe más que la otra (asymmetric information), como en la venta de coches usados, lo que lleva a decisiones equivocadas y a mala asignación de recursos.", "analogia": "Si tu vecino hace una fiesta con música a todo volumen hasta las 3 a.m., él y sus invitados disfrutan (beneficio privado), pero tú no duermes y no recibes nada a cambio: eso es una externalidad negativa. Si tu vecina planta un jardín precioso que todos disfrutan al pasar sin pagar, eso es una externalidad positiva.", "ejemplo": "En el Reino Unido, la contaminación de los coches en Londres llevó a crear la Ultra Low Emission Zone (ULEZ), porque los conductores no pagaban el costo de la contaminación que respiran otros. En la Ciudad de México, la contaminación del aire es una externalidad negativa clásica y por eso existe el programa Hoy No Circula. El alumbrado público de cualquier colonia es un ejemplo de bien público.", "puntos": ["Falla de mercado (market failure): mala asignación de recursos; puede ser completa (missing market) o parcial.", "Externalidad negativa (negative externality): costo social > costo privado, hay sobreproducción y pérdida de bienestar (welfare loss).", "Externalidad positiva (positive externality): beneficio social > beneficio privado, hay subconsumo (under-consumption).", "Bienes públicos (public goods): no rivales (non-rival) y no excluibles (non-excludable), lo que genera el problema del polizón (free rider problem).", "Brechas de información (information gaps) e información asimétrica (asymmetric information) llevan a malas decisiones.", "El óptimo social (socially optimal output) se da donde MSC = MSB."], "formulas": ["Social cost = private cost + external cost", "Social benefit = private benefit + external benefit", "Socially optimal output: MSC = MSB", "Externalidad negativa: MSC > MPC (sobreproducción); externalidad positiva: MSB > MPB (subconsumo)", "Welfare loss = triángulo entre MSC y MSB desde la cantidad óptima hasta la cantidad de mercado"], "glosario": [{"en": "market failure", "es": "falla de mercado"}, {"en": "negative externality", "es": "externalidad negativa"}, {"en": "public good", "es": "bien público"}, {"en": "free rider problem", "es": "problema del polizón"}, {"en": "asymmetric information", "es": "información asimétrica"}], "flashcards": [{"q": "Define falla de mercado.", "a": "Cuando el libre mercado asigna mal los recursos y no maximiza el bienestar social."}, {"q": "¿Qué es una externalidad?", "a": "Un costo o beneficio que recae sobre terceros ajenos a la transacción."}, {"q": "¿Cuáles son las dos características de un bien público?", "a": "No rival y no excluible."}, {"q": "¿Qué es el problema del polizón?", "a": "La gente usa el bien sin pagar, así que las empresas privadas no lo ofrecen."}, {"q": "¿Dónde está el nivel socialmente óptimo de producción?", "a": "Donde el costo marginal social es igual al beneficio marginal social (MSC = MSB)."}, {"q": "Da un ejemplo de información asimétrica.", "a": "Un vendedor de coches usados sabe más sobre los defectos que el comprador."}], "preguntas": [{"q": "Una fábrica contamina un río y afecta a los pescadores. Esto es:", "op": ["Una externalidad positiva de consumo", "Un bien público", "Una externalidad negativa de producción", "Un bien de mérito"], "ok": 2, "exp": "La producción impone un costo externo a terceros (los pescadores)."}, {"q": "En presencia de una externalidad negativa, el mercado libre:", "op": ["Produce más que el óptimo social", "Produce menos que el óptimo social", "Produce exactamente el óptimo", "No produce nada"], "ok": 0, "exp": "Como el costo social supera al privado, se produce más de lo socialmente deseable."}, {"q": "¿Cuál es el mejor ejemplo de bien público puro?", "op": ["Una pizza", "Un faro (lighthouse)", "Un boleto de cine", "Un servicio de streaming"], "ok": 1, "exp": "Un faro no es rival ni excluible: cualquier barco ve su luz sin reducirla para otros."}, {"q": "La vacunación genera:", "op": ["Una externalidad negativa de producción", "Información asimétrica", "Un bien privado puro", "Una externalidad positiva de consumo"], "ok": 3, "exp": "Al vacunarte proteges también a otros, así que el beneficio social supera al privado."}, {"q": "El problema del polizón surge porque los bienes públicos son:", "op": ["No excluibles", "Rivales", "Muy baratos", "Producidos por monopolios"], "ok": 0, "exp": "Al no poder excluir a quien no paga, nadie tiene incentivo a pagar."}], "feynman": "Usa la fiesta ruidosa de un vecino para explicar a un niño por qué el mercado 'se equivoca' cuando hay externalidades y por qué alguien tendría que intervenir.", "conexion": ["¿Por qué crees que el gobierno británico financia el NHS y la educación en lugar de dejarlos completamente al mercado?", "¿Cómo podrían las reseñas en internet reducir las brechas de información? ¿Pueden crear nuevos problemas?"], "examen": {"q": "Explain, with the aid of an externalities diagram, why the free market may over-produce goods that create pollution, such as petrol cars in UK cities.", "marks": 8, "ms": "Knowledge/Application/Analysis (6): definition of negative externality and third parties; diagram with MPC (supply) below MSC, demand = MPB = MSB; free market output where MPC = MPB greater than social optimum where MSC = MSB; welfare loss triangle correctly shaded; applied to UK cities (air pollution, health costs, NHS). Evaluation (2): e.g. difficulty of measuring external costs, size of externality varies by location/time, existing interventions such as ULEZ or fuel duty already internalise part of the externality."}}, {"id": "ECO05", "materia": "Economía", "mesa": "Edexcel", "rama": "Microeconomía", "tema": "Intervención del gobierno", "temaEN": "Government intervention: indirect taxes, subsidies, maximum and minimum prices, regulation and government failure", "explicacion": "Cuando hay fallas de mercado, el gobierno puede intervenir (government intervention) para corregirlas. Los impuestos indirectos (indirect taxes) se cobran sobre el gasto en bienes y desplazan la oferta hacia la izquierda: pueden ser específicos (specific tax), una cantidad fija por unidad, o ad valorem, un porcentaje como el IVA (VAT). Su objetivo es internalizar la externalidad para acercarse al óptimo social. Cuánto del impuesto paga el consumidor y cuánto el productor (incidence of tax) depende de la PED: si la demanda es inelástica, el consumidor carga con la mayor parte. Los subsidios (subsidies) hacen lo contrario: bajan costos, desplazan la oferta a la derecha y fomentan bienes con externalidades positivas.\n\nOtra herramienta es el control de precios. Un precio máximo (maximum price) se fija por debajo del equilibrio para hacer algo más accesible, como algunas rentas o alimentos básicos, pero crea escasez (excess demand) y puede generar mercados negros. Un precio mínimo (minimum price) se fija por encima del equilibrio para proteger a productores o reducir consumo, como el salario mínimo o el precio mínimo por unidad de alcohol; genera excedentes. También existen la regulación (regulation), los permisos de contaminación negociables (tradable pollution permits), la provisión estatal (state provision) de bienes públicos y la provisión de información (information provision).\n\nPero intervenir no siempre sale bien. La falla de gobierno (government failure) ocurre cuando la intervención provoca una asignación de recursos peor que antes o crea nuevas distorsiones. Sus causas incluyen distorsión de las señales de precio (distortion of price signals), consecuencias no deseadas (unintended consequences), costos administrativos excesivos (excessive administrative costs), información imperfecta (information gaps) y conflicto de objetivos (conflicting objectives). Por eso en el examen siempre debes evaluar si el remedio es mejor que la enfermedad.", "analogia": "Es como cuando tu mamá pone una regla de 'nada de celular después de las 10 p.m.' para que duermas mejor (corregir una falla). Funciona si la cumples, pero si te hace esconder el celular bajo la almohada y dormir aún menos, la regla salió peor: eso sería una falla de gobierno.", "ejemplo": "En 2014 México aplicó un impuesto de 1 peso por litro a las bebidas azucaradas; estudios del Instituto Nacional de Salud Pública encontraron una caída en las compras de alrededor de 6% el primer año y más después. El Reino Unido introdujo en 2018 el Soft Drinks Industry Levy, que llevó a muchas marcas a reducir el azúcar. Escocia aplica desde 2018 un precio mínimo por unidad de alcohol (minimum unit pricing) y el Reino Unido tiene el National Living Wage como precio mínimo del trabajo.", "puntos": ["Impuestos indirectos (indirect taxes): específicos (specific) o ad valorem; desplazan la oferta a la izquierda.", "La incidencia del impuesto (tax incidence) recae más en el consumidor cuanto más inelástica sea la demanda.", "Subsidios (subsidies): desplazan la oferta a la derecha y aumentan el consumo de bienes con externalidades positivas.", "Precio máximo (maximum price) por debajo del equilibrio genera escasez; precio mínimo (minimum price) por encima genera excedentes.", "Otras herramientas: regulación (regulation), permisos negociables (tradable pollution permits), provisión estatal (state provision) e información.", "Falla de gobierno (government failure): la intervención empeora la asignación de recursos (unintended consequences, administrative costs, information gaps)."], "formulas": ["Precio con impuesto específico: la oferta sube verticalmente en el monto del impuesto por unidad", "Ingreso fiscal (tax revenue) = impuesto por unidad × cantidad vendida", "Costo del subsidio para el gobierno = subsidio por unidad × cantidad", "Incidencia: carga del consumidor = (nuevo precio − precio original) × Q; resto la paga el productor", "UK Soft Drinks Industry Levy (2018); México IEPS a bebidas azucaradas, 1 peso/litro (2014); Escocia minimum unit pricing 50p por unidad (2018)"], "glosario": [{"en": "indirect tax", "es": "impuesto indirecto"}, {"en": "subsidy", "es": "subsidio"}, {"en": "maximum price", "es": "precio máximo"}, {"en": "minimum price", "es": "precio mínimo"}, {"en": "government failure", "es": "falla de gobierno"}], "flashcards": [{"q": "¿Cuál es la diferencia entre un impuesto específico y uno ad valorem?", "a": "El específico es una cantidad fija por unidad; el ad valorem es un porcentaje del precio (como el IVA/VAT)."}, {"q": "¿Quién paga más un impuesto si la demanda es inelástica?", "a": "El consumidor."}, {"q": "¿Qué provoca un precio máximo por debajo del equilibrio?", "a": "Escasez (excess demand), colas y posibles mercados negros."}, {"q": "Da un ejemplo de precio mínimo en el Reino Unido.", "a": "El National Living Wage o el precio mínimo por unidad de alcohol en Escocia."}, {"q": "Define falla de gobierno.", "a": "Cuando la intervención del gobierno lleva a una asignación de recursos peor o a nuevas distorsiones."}, {"q": "¿Qué son los permisos de contaminación negociables?", "a": "Derechos a contaminar una cantidad limitada que las empresas pueden comprar y vender."}], "preguntas": [{"q": "Un impuesto indirecto sobre el tabaco provocará:", "op": ["Un desplazamiento a la derecha de la demanda", "Un desplazamiento a la izquierda de la oferta", "Un desplazamiento a la derecha de la oferta", "Ningún cambio en el precio"], "ok": 1, "exp": "El impuesto aumenta el costo de producción y reduce la oferta."}, {"q": "Un precio máximo efectivo en la renta de vivienda probablemente cause:", "op": ["Excedente de viviendas disponibles", "Precios más altos", "Escasez de viviendas en renta", "Más construcción de viviendas"], "ok": 2, "exp": "Por debajo del equilibrio la cantidad demandada supera a la ofrecida."}, {"q": "Si la demanda de un bien es muy inelástica, un impuesto indirecto:", "op": ["Reducirá mucho el consumo", "Lo pagará principalmente el productor", "No generará ingresos fiscales", "Generará mucho ingreso fiscal y reducirá poco el consumo"], "ok": 3, "exp": "La cantidad cae poco, así que el gobierno recauda mucho pero el efecto en el consumo es pequeño."}, {"q": "¿Cuál es un ejemplo de falla de gobierno?", "op": ["Un subsidio que termina beneficiando a empresas que ya iban a invertir de todos modos", "Una fábrica que contamina", "Un faro sin financiamiento privado", "Un monopolio que sube precios"], "ok": 0, "exp": "El subsidio no cambia el comportamiento y desperdicia recursos públicos (unintended consequence)."}, {"q": "Un subsidio a los paneles solares busca principalmente:", "op": ["Reducir el consumo de paneles", "Aumentar el consumo de un bien con externalidades positivas", "Crear un precio máximo", "Aumentar la recaudación"], "ok": 1, "exp": "Baja el costo y el precio, acercando la producción al óptimo social."}], "feynman": "Explica a un amigo por qué el impuesto mexicano a los refrescos podría funcionar, y luego por qué podría fallar, como si estuvieras en un debate de un minuto.", "conexion": ["¿Sería mejor un impuesto o una regulación (por ejemplo, prohibir la publicidad) para reducir el consumo de comida chatarra entre adolescentes? Justifica.", "¿Por qué un precio máximo pensado para ayudar a los pobres podría terminar perjudicándolos?"], "examen": {"q": "Evaluate the effectiveness of an indirect tax, such as the UK Soft Drinks Industry Levy, as a method of correcting market failure.", "marks": 15, "ms": "Knowledge/Application/Analysis (9): negative externalities of consumption/demerit good (obesity, NHS costs); tax shifts supply left, raises price, reduces quantity towards social optimum; diagram showing internalisation of externality; tax revenue can fund health spending; reference to reformulation of drinks after 2018. Evaluation (6): depends on PED (often inelastic, so small fall in consumption but high revenue); difficulty of setting tax equal to external cost; regressive impact on low-income households; substitution to untaxed sugary products; black markets/cross-border shopping; compare with alternatives such as regulation, education/information provision. Levels: L1 1-3, L2 4-6, L3 7-9 for KAA; evaluation 0-6 with justified judgement."}}, {"id": "ECO06", "materia": "Economía", "mesa": "Edexcel", "rama": "Macroeconomía", "tema": "Medidas macroeconómicas", "temaEN": "Measures of economic performance: economic growth (GDP), inflation, employment and unemployment, balance of payments", "explicacion": "La macroeconomía estudia la economía en su conjunto. La primera medida es el crecimiento económico (economic growth), que es el aumento del producto interno bruto real (real GDP), es decir, del valor de todos los bienes y servicios producidos en un país en un año, ajustado por inflación. Distingue PIB nominal (nominal GDP, a precios actuales) de PIB real (real GDP), PIB total de PIB per cápita (GDP per capita) y valor (value) de volumen (volume). Para comparar países se usa la paridad de poder adquisitivo (purchasing power parity, PPP). El PIB no mide perfectamente el bienestar: deja fuera la economía informal, la distribución del ingreso o el medio ambiente; por eso existen indicadores como el Índice de Felicidad y el Índice de Desarrollo Humano (HDI).\n\nLa inflación (inflation) es el aumento sostenido del nivel general de precios; la deflación (deflation) es una caída sostenida y la desinflación (disinflation) es cuando la inflación baja pero sigue siendo positiva. En el Reino Unido se mide principalmente con el Índice de Precios al Consumidor (Consumer Prices Index, CPI), que usa una canasta (basket of goods) ponderada según el gasto de los hogares (Living Costs and Food Survey); también existe el RPI, que incluye pagos de hipotecas. El gobierno fija para el Bank of England una meta de inflación del 2% (CPI). La inflación puede ser de demanda (demand-pull) o de costos (cost-push).\n\nEl desempleo (unemployment) se mide con la Encuesta de Fuerza Laboral (Labour Force Survey) según la definición de la OIT (ILO): personas sin empleo que buscaron trabajo en las últimas 4 semanas y pueden empezar en 2 semanas; también existe el Claimant Count de quienes reciben prestaciones. Hay desempleo friccional (frictional), estructural (structural), estacional (seasonal) y cíclico (cyclical/demand-deficient), y también subempleo (underemployment). Por último, la balanza de pagos (balance of payments) registra las transacciones con el resto del mundo; su cuenta corriente (current account) incluye comercio de bienes, comercio de servicios, ingreso primario (primary income) e ingreso secundario (secondary income). El Reino Unido suele tener un déficit en cuenta corriente, con déficit en bienes y superávit en servicios.", "analogia": "Medir la economía es como el chequeo médico de un país: el PIB es como la estatura y el peso (¿está creciendo?), la inflación es la temperatura (si sube mucho, algo va mal), el desempleo es como revisar si todos los órganos trabajan, y la balanza de pagos es como revisar cuánto 'entra' y 'sale' del cuerpo.", "ejemplo": "En octubre de 2022 la inflación CPI del Reino Unido llegó a 11.1%, la más alta en unos 40 años, muy por encima de la meta de 2%, sobre todo por los precios de energía y alimentos (cost-push). En México, el Banco de México (Banxico) tiene una meta de inflación de 3% con un intervalo de ±1 punto, y las remesas que envían los mexicanos desde Estados Unidos son un ingreso secundario muy importante en la cuenta corriente.", "puntos": ["Crecimiento económico (economic growth) = aumento del PIB real (real GDP); distinguir nominal vs real y total vs per cápita (per capita).", "La inflación del Reino Unido se mide con el CPI y la meta es 2%, delegada al Bank of England.", "Tipos de inflación: de demanda (demand-pull) y de costos (cost-push); también deflación (deflation) y desinflación (disinflation).", "El desempleo se mide con la Labour Force Survey (definición ILO) o el Claimant Count.", "Tipos de desempleo: friccional, estructural, estacional y cíclico (frictional, structural, seasonal, cyclical).", "Cuenta corriente (current account): comercio de bienes + servicios + ingreso primario + ingreso secundario."], "formulas": ["Real GDP = Nominal GDP ÷ (índice de precios / 100)", "GDP per capita = GDP ÷ población", "Tasa de inflación = (índice este año − índice año anterior) / índice año anterior × 100", "Unemployment rate = desempleados ÷ población económicamente activa (labour force) × 100", "Current account = trade in goods + trade in services + primary income + secondary income", "UK inflation target: CPI 2%; Banxico: 3% ± 1%"], "glosario": [{"en": "real GDP", "es": "PIB real"}, {"en": "inflation", "es": "inflación"}, {"en": "Consumer Prices Index (CPI)", "es": "Índice de Precios al Consumidor"}, {"en": "unemployment", "es": "desempleo"}, {"en": "current account", "es": "cuenta corriente"}], "flashcards": [{"q": "¿Diferencia entre PIB nominal y real?", "a": "El real está ajustado por inflación; el nominal usa precios actuales."}, {"q": "¿Cuál es la meta de inflación del Reino Unido?", "a": "2% medida con el CPI, que debe alcanzar el Bank of England."}, {"q": "¿Qué es la desinflación?", "a": "Una caída en la tasa de inflación, aunque los precios siguen subiendo."}, {"q": "¿Cómo define la ILO a un desempleado?", "a": "Sin trabajo, buscó empleo en las últimas 4 semanas y puede empezar en las próximas 2."}, {"q": "¿Qué es el desempleo estructural?", "a": "El que surge cuando las habilidades de los trabajadores ya no coinciden con las que piden las industrias (por ejemplo, el cierre de minas)."}, {"q": "¿Qué componentes tiene la cuenta corriente?", "a": "Comercio de bienes, comercio de servicios, ingreso primario e ingreso secundario."}], "preguntas": [{"q": "Si el PIB nominal creció 6% y la inflación fue 4%, el crecimiento real aproximado fue:", "op": ["10%", "6%", "4%", "2%"], "ok": 3, "exp": "Crecimiento real ≈ crecimiento nominal − inflación = 6% − 4% = 2%."}, {"q": "La desinflación significa que:", "op": ["La tasa de inflación baja pero sigue siendo positiva", "Los precios caen", "La inflación sube", "El PIB cae dos trimestres"], "ok": 0, "exp": "Los precios siguen subiendo, solo que más lento."}, {"q": "Un aumento en los precios mundiales del petróleo provoca principalmente inflación:", "op": ["De demanda (demand-pull)", "Estructural", "De costos (cost-push)", "Deflacionaria"], "ok": 2, "exp": "Sube el costo de producción para las empresas, que trasladan el aumento a los precios."}, {"q": "Las remesas que los migrantes envían a México se registran en la cuenta corriente como:", "op": ["Comercio de bienes", "Ingreso secundario (secondary income)", "Comercio de servicios", "Ingreso primario"], "ok": 1, "exp": "Son transferencias corrientes sin contrapartida, que forman parte del ingreso secundario."}, {"q": "Un trabajador que deja su empleo y tarda tres semanas en encontrar otro está en desempleo:", "op": ["Cíclico", "Estructural", "Estacional", "Friccional"], "ok": 3, "exp": "Es el desempleo temporal mientras se cambia de un empleo a otro."}], "feynman": "Explica a tu abuela por qué si su pensión sube 5% pero la inflación es 8%, en realidad es 'más pobre', usando la idea de valores reales.", "conexion": ["¿Por qué el PIB per cápita podría no reflejar bien el bienestar de la gente en México, considerando la economía informal y la desigualdad?", "¿Qué ventajas y desventajas tiene que el Reino Unido tenga un déficit en cuenta corriente durante muchos años?"], "examen": {"q": "Examine two limitations of using real GDP per capita to compare living standards between the UK and Mexico.", "marks": 8, "ms": "Knowledge/Application/Analysis (6): definition of real GDP per capita; limitation 1 e.g. size of informal/hidden economy (large in Mexico) understates output; limitation 2 e.g. income inequality/distribution, need for PPP adjustment, does not include environment, leisure, quality of goods, or non-market activity; data applied to UK and Mexico. Evaluation (2): e.g. which limitation is more significant, use of alternative measures such as HDI or happiness indices, GDP still correlates with health and education outcomes."}}, {"id": "ECO07", "materia": "Economía", "mesa": "Edexcel", "rama": "Macroeconomía", "tema": "Crecimiento económico", "temaEN": "Aggregate demand, aggregate supply, national income and economic growth", "explicacion": "La demanda agregada (aggregate demand, AD) es el gasto total en los bienes y servicios de una economía a cada nivel de precios: AD = C + I + G + (X − M), donde C es consumo (consumption, la parte más grande, alrededor del 60% en el Reino Unido), I es inversión (investment), G es gasto del gobierno (government spending) y X − M son las exportaciones netas (net exports). La curva AD tiene pendiente negativa. Se desplaza por cambios en tasas de interés, confianza, riqueza, tipo de cambio, política fiscal o ingreso de otros países. La oferta agregada (aggregate supply, AS) es la producción total que las empresas están dispuestas a ofrecer: la SRAS cambia con los costos (salarios, materias primas, impuestos), y la LRAS representa la capacidad productiva y cambia con la cantidad y calidad de los factores de producción. Existen dos visiones de la LRAS: la clásica (vertical) y la keynesiana (horizontal cuando hay mucha capacidad sobrante y luego vertical).\n\nEl ingreso nacional (national income) fluye en un flujo circular (circular flow of income) entre hogares y empresas. Las inyecciones (injections: I, G, X) aumentan el flujo y las fugas (withdrawals/leakages: ahorro S, impuestos T, importaciones M) lo reducen. El efecto multiplicador (multiplier effect) indica que un aumento inicial en una inyección provoca un aumento mayor en el ingreso nacional, porque el gasto de una persona es el ingreso de otra. Su tamaño depende de la propensión marginal a consumir (MPC) y de las fugas.\n\nEl crecimiento económico (economic growth) en el corto plazo es crecimiento real (actual growth), aumento del PIB real por mayor AD o por usar capacidad ociosa; en el largo plazo es crecimiento potencial (potential growth), un aumento de la LRAS o desplazamiento hacia afuera de la PPF. La brecha de producción (output gap) es la diferencia entre el PIB real y el potencial: negativa si hay capacidad ociosa y positiva si la economía está sobrecalentada. El ciclo económico (trade/business cycle) tiene fases de auge (boom), recesión (recession, dos trimestres seguidos de crecimiento negativo), depresión y recuperación (recovery). Crecer trae más empleo e ingresos fiscales, pero también puede generar inflación, daño ambiental y desigualdad.", "analogia": "La economía es como una fiesta de cumpleaños: la demanda agregada son todos los invitados con hambre, y la oferta agregada es cuánta comida puede preparar la cocina. Si llegan más invitados (más AD) y la cocina ya está al máximo, la comida 'sube de precio' (inflación). Si contratas otro chef y compras un horno más grande (más LRAS), puedes alimentar a más sin problemas. Y el multiplicador es como cuando una invitada trae pastel y los demás, contentos, se animan a traer más cosas.", "ejemplo": "Tras la crisis de 2008, el Reino Unido entró en recesión y la demanda agregada cayó; el Bank of England bajó la tasa de interés a 0.5% en 2009 y aplicó quantitative easing para impulsar C e I. En México, el nearshoring (empresas que trasladan fábricas desde Asia) aumenta la inversión (I) y las exportaciones (X), lo que sube la AD a corto plazo y, al crear nuevas plantas y capacidades, también la LRAS a largo plazo.", "puntos": ["AD = C + I + G + (X − M); el consumo (consumption) es el componente más grande.", "La SRAS cambia por costos de producción; la LRAS por la cantidad y calidad de los factores de producción (productive capacity).", "Hay dos visiones de la LRAS: clásica (vertical) y keynesiana (Keynesian, con tramo horizontal).", "El efecto multiplicador (multiplier effect) hace que una inyección aumente el ingreso nacional en una cantidad mayor.", "Crecimiento real (actual growth) vs crecimiento potencial (potential growth); brecha de producción (output gap) positiva o negativa.", "Recesión (recession): dos trimestres consecutivos de crecimiento negativo del PIB real."], "formulas": ["AD = C + I + G + (X − M)", "Multiplier = 1 / (1 − MPC) = 1 / MPW", "MPW = MPS + MPT + MPM (propensiones marginales a ahorrar, pagar impuestos e importar)", "Cambio en el ingreso nacional = multiplicador × cambio inicial en la inyección", "Injections: I, G, X; Withdrawals: S, T, M", "Output gap = PIB real − PIB potencial"], "glosario": [{"en": "aggregate demand", "es": "demanda agregada"}, {"en": "long-run aggregate supply (LRAS)", "es": "oferta agregada de largo plazo"}, {"en": "multiplier effect", "es": "efecto multiplicador"}, {"en": "output gap", "es": "brecha de producción"}, {"en": "recession", "es": "recesión"}], "flashcards": [{"q": "¿Cuáles son los componentes de la AD?", "a": "Consumo, inversión, gasto del gobierno y exportaciones netas: C + I + G + (X − M)."}, {"q": "¿Qué desplaza la SRAS?", "a": "Cambios en costos: salarios, materias primas, energía, impuestos a empresas, tipo de cambio."}, {"q": "¿Qué desplaza la LRAS?", "a": "Cambios en cantidad o calidad de factores: educación, tecnología, inversión, migración, infraestructura."}, {"q": "Si la MPC es 0.75, ¿cuál es el multiplicador?", "a": "1 / (1 − 0.75) = 4."}, {"q": "¿Qué es una brecha de producción negativa?", "a": "Cuando el PIB real está por debajo del potencial: hay capacidad ociosa y desempleo."}, {"q": "¿Cuáles son las inyecciones del flujo circular?", "a": "Inversión, gasto del gobierno y exportaciones."}], "preguntas": [{"q": "¿Cuál de estos factores desplaza la AD a la derecha?", "op": ["Un aumento de las tasas de interés", "Una apreciación de la libra", "Una caída en la confianza del consumidor", "Un aumento del gasto del gobierno en infraestructura"], "ok": 3, "exp": "G es componente de la AD; las demás opciones la reducen."}, {"q": "Si la MPC es 0.8, una inyección de £10 mil millones aumenta el ingreso nacional en:", "op": ["£50 mil millones", "£8 mil millones", "£10 mil millones", "£80 mil millones"], "ok": 0, "exp": "Multiplicador = 1/(1−0.8) = 5; 5 × £10 mil millones = £50 mil millones."}, {"q": "Una mejora en la educación y capacitación de los trabajadores provocaría principalmente:", "op": ["Un desplazamiento a la izquierda de la SRAS", "Un desplazamiento a la derecha de la LRAS", "Una caída de la AD", "Un aumento de las importaciones"], "ok": 1, "exp": "Mejora la calidad del trabajo y la capacidad productiva a largo plazo."}, {"q": "Una recesión técnica se define como:", "op": ["Un año de inflación negativa", "Desempleo mayor a 10%", "Dos trimestres consecutivos de crecimiento negativo del PIB real", "Un déficit en cuenta corriente"], "ok": 2, "exp": "Es la definición estándar usada en el Reino Unido."}, {"q": "Un aumento en los precios del petróleo afecta principalmente a:", "op": ["La SRAS, que se desplaza a la izquierda", "La LRAS, que se desplaza a la derecha", "La AD, que se desplaza a la derecha", "Las exportaciones netas solamente"], "ok": 0, "exp": "Sube los costos de producción, así que la SRAS disminuye (cost-push)."}], "feynman": "Explica el efecto multiplicador contando la historia de 100 pesos que gastas en una taquería y cómo ese dinero sigue viajando por el pueblo.", "conexion": ["¿Por qué un aumento de la AD puede ser bueno cuando hay una brecha de producción negativa pero malo cuando la economía está cerca de su capacidad máxima?", "¿Qué políticas podría usar México para que el nearshoring aumente no solo la AD sino también la LRAS a largo plazo?"], "examen": {"q": "Using an AD/AS diagram, examine the likely effects of a significant increase in investment by firms on the UK economy.", "marks": 8, "ms": "Knowledge/Application/Analysis (6): investment as a component of AD; AD shifts right, raising real GDP and price level (diagram); multiplier effect amplifies impact; in the long run investment increases productive capacity, shifting LRAS right, allowing non-inflationary growth; applied to UK context. Evaluation (2): e.g. effect on price level depends on spare capacity/output gap; size of multiplier depends on leakages (UK has high MPM); time lags before LRAS increases; depends on business confidence and interest rates."}}, {"id": "ECO08", "materia": "Economía", "mesa": "Edexcel", "rama": "Macroeconomía", "tema": "Políticas macroeconómicas", "temaEN": "Macroeconomic objectives and policies: demand-side (monetary and fiscal) and supply-side policies", "explicacion": "Los gobiernos tienen objetivos macroeconómicos (macroeconomic objectives): crecimiento económico sostenido, inflación baja y estable (en el Reino Unido, 2% CPI), bajo desempleo, equilibrio en la cuenta corriente de la balanza de pagos, equilibrio presupuestario (balanced budget), protección del medio ambiente y una distribución del ingreso más equitativa. Muchas veces chocan entre sí (conflicts and trade-offs): por ejemplo, crecer rápido puede subir la inflación y empeorar el déficit en cuenta corriente. La curva de Phillips (Phillips curve) de corto plazo muestra ese posible intercambio entre inflación y desempleo.\n\nLas políticas de demanda (demand-side policies) actúan sobre la AD. La política monetaria (monetary policy) la decide el Comité de Política Monetaria (Monetary Policy Committee, MPC) del Bank of England, independiente desde 1997 y formado por 9 miembros: usa la tasa de interés oficial (Bank Rate) y el quantitative easing (QE), que consiste en comprar bonos para inyectar dinero. Subir las tasas encarece el crédito, incentiva el ahorro, reduce C e I y tiende a apreciar la libra, lo que baja la AD y la inflación. La política fiscal (fiscal policy) la decide el gobierno (el Chancellor of the Exchequer) usando impuestos y gasto público: puede ser expansiva (expansionary) o contractiva (contractionary), y se habla de impuestos directos (direct) e indirectos (indirect) y de déficit presupuestario (budget deficit) frente a deuda nacional (national debt).\n\nLas políticas de oferta (supply-side policies) buscan aumentar la LRAS, es decir, la capacidad productiva. Pueden ser de mercado (market-based), como reducir impuestos para incentivar el trabajo, desregular, privatizar o reducir el poder sindical, o intervencionistas (interventionist), como invertir en educación, capacitación e infraestructura o subsidiar la investigación. Su ventaja es que permiten crecer sin inflación y mejorar la competitividad, pero tardan mucho en dar resultados (time lags), pueden ser costosas y algunas aumentan la desigualdad. En el examen evalúa siempre: tamaño del efecto, retrasos (time lags), nivel de confianza, capacidad ociosa y conflictos entre objetivos.", "analogia": "Piensa en la economía como un coche: la política monetaria y la fiscal son el acelerador y el freno (aumentan o reducen la velocidad, es decir, la AD), mientras que las políticas de oferta son como mejorar el motor: tardan en instalarse, pero después el coche puede ir más rápido sin sobrecalentarse.", "ejemplo": "Entre diciembre de 2021 y agosto de 2023, el Bank of England subió la Bank Rate de 0.1% a 5.25% para bajar una inflación que llegó a 11.1%, muy por encima de la meta de 2%; la inflación bajó en 2024, aunque la economía creció poco. En México, Banxico también subió su tasa de interés hasta 11.25% en 2023 para controlar la inflación, y luego empezó a bajarla en 2024. Un ejemplo de política de oferta en el Reino Unido son los apprenticeships (aprendizajes técnicos) y la inversión en infraestructura.", "puntos": ["Objetivos macro: crecimiento, inflación de 2% (CPI), bajo desempleo, equilibrio en cuenta corriente, equilibrio fiscal, medio ambiente y equidad.", "Política monetaria (monetary policy): Bank Rate y quantitative easing (QE), decididas por el MPC del Bank of England, independiente desde 1997.", "Política fiscal (fiscal policy): impuestos y gasto público; puede ser expansiva (expansionary) o contractiva (contractionary).", "Políticas de oferta (supply-side policies): de mercado (market-based) o intervencionistas (interventionist); desplazan la LRAS a la derecha.", "Hay conflictos entre objetivos (trade-offs), como inflación vs desempleo en la curva de Phillips (Phillips curve).", "Al evaluar considera los retrasos (time lags), la magnitud del multiplicador y la capacidad ociosa (spare capacity)."], "formulas": ["UK inflation target = 2% CPI (fijada por el Chancellor; si se desvía más de 1 punto, el Gobernador escribe una carta explicativa)", "Monetary Policy Committee (MPC): 9 miembros; Bank of England independiente desde 1997", "Budget deficit = gasto del gobierno − ingresos fiscales (en un año); National debt = suma acumulada de los déficits", "Mecanismo de transmisión: ↑ Bank Rate → ↑ costo del crédito y ↑ ahorro → ↓ C e I, ↑ libra → ↓ X − M → ↓ AD → ↓ inflación", "Banxico: meta de inflación de 3% ± 1%"], "glosario": [{"en": "monetary policy", "es": "política monetaria"}, {"en": "fiscal policy", "es": "política fiscal"}, {"en": "supply-side policies", "es": "políticas de oferta"}, {"en": "quantitative easing", "es": "flexibilización cuantitativa"}, {"en": "budget deficit", "es": "déficit presupuestario"}], "flashcards": [{"q": "¿Quién decide la tasa de interés en el Reino Unido?", "a": "El Monetary Policy Committee (MPC) del Bank of England, de 9 miembros."}, {"q": "¿Qué es el quantitative easing?", "a": "Que el banco central compre bonos para aumentar la oferta monetaria y bajar tasas de largo plazo."}, {"q": "¿Qué es la política fiscal expansiva?", "a": "Aumentar el gasto público o bajar impuestos para elevar la AD."}, {"q": "Da un ejemplo de política de oferta intervencionista.", "a": "Invertir en educación, capacitación o infraestructura."}, {"q": "Diferencia entre déficit y deuda nacional.", "a": "El déficit es el faltante de un año; la deuda es la suma acumulada de déficits pasados."}, {"q": "¿Qué muestra la curva de Phillips de corto plazo?", "a": "Una relación inversa (trade-off) entre inflación y desempleo."}], "preguntas": [{"q": "Si el Bank of England sube la Bank Rate, lo más probable es que:", "op": ["Aumente el consumo con crédito", "Se deprecie la libra", "Disminuya la AD y baje la inflación", "Suba la inversión de las empresas"], "ok": 2, "exp": "Tasas más altas encarecen el crédito, fomentan el ahorro y reducen C e I."}, {"q": "¿Cuál de las siguientes es una política de oferta?", "op": ["Subir la tasa de interés", "Aumentar las prestaciones sociales", "Hacer quantitative easing", "Financiar programas de capacitación técnica"], "ok": 3, "exp": "La capacitación mejora la calidad del trabajo y desplaza la LRAS."}, {"q": "La meta de inflación que el gobierno da al Bank of England es:", "op": ["2% medida con el CPI", "3% medida con el RPI", "0% medida con el CPI", "2% medida con el PIB"], "ok": 0, "exp": "Es una meta simétrica de 2% CPI."}, {"q": "Un posible conflicto entre objetivos macro es:", "op": ["Bajar la inflación y aumentar la productividad", "Crecer más rápido y empeorar el déficit en cuenta corriente", "Bajar el desempleo y aumentar el ingreso", "Mejorar la educación y la productividad"], "ok": 1, "exp": "Con más ingreso se compran más importaciones, lo que empeora la cuenta corriente."}, {"q": "Una desventaja típica de las políticas de oferta es que:", "op": ["Suben siempre la inflación", "No afectan la LRAS", "Tardan mucho en tener efecto (time lags)", "Solo funcionan en recesión"], "ok": 2, "exp": "Educar a trabajadores o construir infraestructura tarda años en elevar la productividad."}], "feynman": "Explica a un compañero cómo una subida de la tasa de interés del Bank of England puede hacer que bajen los precios del súper, como si fuera una cadena de fichas de dominó.", "conexion": ["¿Por qué crees que se le dio independencia al Bank of England en 1997 en lugar de dejar que los políticos decidan las tasas de interés?", "Si México quisiera crecer más sin generar inflación, ¿qué combinación de políticas de demanda y de oferta recomendarías y por qué?"], "examen": {"q": "Evaluate the effectiveness of raising interest rates as a policy to reduce inflation in the UK.", "marks": 15, "ms": "Knowledge/Application/Analysis (9): role of MPC and 2% CPI target; transmission mechanism - higher cost of borrowing and mortgage repayments, increased incentive to save, lower C and I, appreciation of sterling reduces X−M, lower AD, lower demand-pull inflation; AD/AS diagram; UK context e.g. Bank Rate rising to 5.25% by 2023. Evaluation (6): less effective against cost-push inflation (energy, food prices); time lags of 18-24 months; many UK mortgages are fixed-rate; conflict with growth and unemployment, risk of recession; impact on government debt interest; depends on confidence and global factors; consider alternatives such as fiscal or supply-side policies. Justified overall judgement required for top-level evaluation."}}, {"id": "PSI01", "materia": "Psicología", "mesa": "AQA", "rama": "Psicología", "tema": "Psicología social", "temaEN": "Social influence: conformity, obedience, resistance to social influence, minority influence and social change", "explicacion": "La influencia social (social influence) estudia cómo los demás cambian lo que pensamos y hacemos. La conformidad (conformity) es cambiar tu conducta o tus opiniones por la presión real o imaginada de un grupo. Kelman (1958) describió tres tipos: sumisión (compliance), cuando aceptas en público pero no en privado; identificación (identification), cuando te adaptas porque valoras al grupo; e internalización (internalisation), cuando de verdad cambias de opinión. Deutsch y Gerard (1955) la explican con la influencia social normativa (normative social influence, NSI), por el deseo de encajar, y la informativa (informational social influence, ISI), por el deseo de tener la razón. En el estudio de Asch (1951), con las líneas, los participantes se conformaron con la respuesta equivocada del grupo en alrededor del 37% de los ensayos críticos; la conformidad aumentaba con el tamaño del grupo (hasta unos 3 cómplices), con la unanimidad y con la dificultad de la tarea. Zimbardo (1973), con el experimento de la prisión de Stanford, estudió la conformidad con roles sociales (social roles).\n\nLa obediencia (obedience) es seguir órdenes directas de una figura de autoridad. Milgram (1963) encontró que el 65% de sus 40 participantes llegó a aplicar las supuestas descargas de 450 voltios, y todos llegaron a 300 V. Sus variaciones mostraron que la obediencia baja con la proximidad de la víctima, en un lugar menos prestigioso o cuando quien da las órdenes no lleva uniforme. Las explicaciones situacionales son el estado agéntico (agentic state), en el que la persona se ve como un instrumento de la autoridad, y la legitimidad de la autoridad (legitimacy of authority); la disposicional es la personalidad autoritaria (authoritarian personality) de Adorno et al. (1950).\n\nPara resistir la influencia social (resistance to social influence) ayudan el apoyo social (social support), como tener un aliado que también disiente, y un locus de control interno (internal locus of control) (Rotter, 1966). La influencia de la minoría (minority influence) funciona por consistencia (consistency), compromiso (commitment) y flexibilidad (flexibility): Moscovici et al. (1969) mostraron que una minoría consistente que decía 'verde' ante diapositivas azules logró respuestas 'verde' en el 8.42% de los ensayos, frente al 1.25% con una minoría inconsistente. Así se explica el cambio social (social change), como el movimiento sufragista, a través del efecto bola de nieve (snowball effect) y la conformidad a las normas sociales.", "analogia": "Imagina que en clase todos dicen que la respuesta es la B y tú estabas segura de que era la C. Si dices B solo para no quedar mal, eso es influencia normativa; si cambias porque piensas 'seguramente ellos saben más', es informativa. Y si una amiga insiste con calma durante semanas en que la C era correcta, y poco a poco otros la escuchan, eso es influencia de la minoría.", "ejemplo": "Las campañas del Reino Unido para reducir el consumo de alcohol en jóvenes usan normas sociales ('la mayoría de los estudiantes bebe menos de lo que crees'). En México, el movimiento por el voto femenino, conseguido a nivel federal en 1953, comenzó como una minoría consistente y comprometida que con el tiempo cambió la opinión de la mayoría.", "puntos": ["Tipos de conformidad (conformity): compliance, identification e internalisation (Kelman, 1958).", "Explicaciones: influencia social normativa (NSI) e informativa (ISI) (Deutsch y Gerard, 1955).", "Asch (1951): ~37% de conformidad en ensayos críticos; variables: tamaño del grupo, unanimidad y dificultad de la tarea.", "Milgram (1963): 65% obedeció hasta 450 V; explicaciones: estado agéntico (agentic state) y legitimidad de la autoridad.", "Resistencia: apoyo social (social support) y locus de control interno (internal locus of control).", "Influencia de la minoría (minority influence): consistencia, compromiso y flexibilidad, que llevan al cambio s
