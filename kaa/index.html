<style>
:root{
  --bg:#F4F1EA;--surface:#FFFFFF;--surface-2:#ECE8DE;--ink:#1B2333;--muted:#5E6676;--line:#DDD8CC;
  --navy:#1F2A44;--navy-ink:#FFFFFF;--accent:#E0623A;--accent-soft:#FBE4DA;--ok:#2F8A5B;--ok-soft:#DDF0E5;--warn:#B7791F;--warn-soft:#F8EBCF;--bad:#C0392B;--bad-soft:#F8DCD8;
  --mat:#3559C7;--bio:#2F8A5B;--qui:#8B44AC;--fis:#D2691E;--eco:#B8860B;--psi:#C2417A;--his:#7A5230;--esp:#D23C3C;--lit:#2C7A8C;--own:#5E6676;
  --shadow:0 1px 2px rgb(20 25 40/.06),0 6px 20px rgb(20 25 40/.06);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161F;--surface:#1A202B;--surface-2:#232A37;--ink:#E7EAF0;--muted:#9AA3B2;--line:#2E3645;
  --navy:#9DB4F0;--navy-ink:#12161F;--accent:#F08A66;--accent-soft:#3A2620;--ok:#5CC08B;--ok-soft:#1E3529;--warn:#E2B657;--warn-soft:#3A3020;--bad:#F07A6C;--bad-soft:#3A2220;
  --mat:#8FA8F5;--bio:#6CC79A;--qui:#C79AE0;--fis:#F0A060;--eco:#E2C060;--psi:#F08AB8;--his:#D2A57A;--esp:#F08080;--lit:#6CC4D6;--own:#AAB2C0;
  --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161F;--surface:#1A202B;--surface-2:#232A37;--ink:#E7EAF0;--muted:#9AA3B2;--line:#2E3645;
  --navy:#9DB4F0;--navy-ink:#12161F;--accent:#F08A66;--accent-soft:#3A2620;--ok:#5CC08B;--ok-soft:#1E3529;--warn:#E2B657;--warn-soft:#3A3020;--bad:#F07A6C;--bad-soft:#3A2220;
  --mat:#8FA8F5;--bio:#6CC79A;--qui:#C79AE0;--fis:#F0A060;--eco:#E2C060;--psi:#F08AB8;--his:#D2A57A;--esp:#F08080;--lit:#6CC4D6;--own:#AAB2C0;
  --shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1rem;font-family:Inter,system-ui,sans-serif;font-weight:700}
a{color:var(--navy)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font:700 13px Inter,sans-serif;letter-spacing:.04em;flex:none}
.brand b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.05rem}.brand small{color:var(--muted);font-size:.78rem}
.brand{flex:1;min-width:0}
main{padding-block:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.tight{padding:12px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.86rem}.tiny{font-size:.76rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 14px;font:600 .9rem Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:600 .82rem Inter,sans-serif;color:var(--muted);cursor:pointer;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:700;background:var(--surface-2);color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.kpi{display:flex;flex-direction:column}.kpi b{font-size:1.5rem;font-family:Fraunces,Georgia,serif}.kpi span{font-size:.8rem;color:var(--muted)}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.item:first-child{border-top:0}
.item .sw{width:6px;align-self:stretch;border-radius:4px;flex:none}
.item .tx{flex:1;min-width:0}.item .tx b{display:block}
.note{border-left:4px solid var(--navy);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}.note.warn{border-color:var(--warn);background:var(--warn-soft)}.note.acc{border-color:var(--accent);background:var(--accent-soft)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none}
ul.clean{margin:0;padding-left:18px}ul.clean li{margin:4px 0}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.flash{min-height:180px;display:grid;place-items:center;text-align:center;font-size:1.1rem;cursor:pointer;border:2px dashed var(--line);border-radius:16px;padding:18px;background:var(--surface)}
.flash.back{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin:6px 0;font:500 .95rem Inter,sans-serif;color:var(--ink);cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
textarea{min-height:110px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:600}
.cornell{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}
@media (max-width:560px){.cornell{grid-template-columns:1fr}}
.timer{font:700 3.4rem/1 Fraunces,Georgia,serif;text-align:center;letter-spacing:.02em}
.ring{display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:.72rem;font-weight:700;color:var(--muted)}
.cal .cd{min-height:54px;border-radius:10px;background:var(--surface-2);padding:4px;font-size:.72rem;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit;border:1px solid transparent}
.cal .cd.off{background:transparent;opacity:.35}.cal .cd.hoy{border-color:var(--accent)}.cal .cd b{font-size:.8rem}
.cal .cd i{display:block;height:5px;border-radius:3px}
.blk{border-radius:10px;padding:8px 10px;color:#fff;font-weight:600;font-size:.85rem}
.mind{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:.72rem;font-weight:600;color:var(--muted);text-decoration:none}
nav.bottom a svg{width:22px;height:22px}
nav.bottom a[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;border-radius:999px;box-shadow:0 6px 18px rgb(0 0 0/.18)}
.crumb{font-size:.86rem;text-decoration:none;color:var(--muted)}
.hero{border-radius:18px;padding:16px;color:#fff}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.big{font-size:1.05rem}
pre.f{white-space:pre-wrap;font:inherit;margin:0}
[hidden]{display:none!important}
.alert{border-radius:12px;padding:8px 12px;font-weight:600;font-size:.86rem}
.a-rojo{background:var(--bad-soft);color:var(--bad)}.a-amarillo{background:var(--warn-soft);color:var(--warn)}.a-verde{background:var(--ok-soft);color:var(--ok)}
.agenda{display:flex;flex-direction:column}
.ag{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}.ag:first-child{border-top:0}
.ag .h{font:700 .9rem Inter,sans-serif;color:var(--muted);padding-top:2px}.ag.done .tx{opacity:.5;text-decoration:line-through}
.steps{display:flex;gap:4px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}.steps i.on{background:var(--accent)}
details.tree>summary{cursor:pointer;list-style:none;padding:8px 0;font-weight:700}details.tree>summary::-webkit-details-marker{display:none}
details.tree>summary:before{content:"▸ ";color:var(--muted)}details.tree[open]>summary:before{content:"▾ "}
.sub{padding:8px 0 8px 14px;border-left:2px solid var(--line);margin-left:6px}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2)}.badge.off{opacity:.45;filter:grayscale(1)}.badge b{display:block}
.badge .e{font-size:1.6rem}
</style>

<script id="content" type="application/json">[{"id": "MAT01", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Matemáticas Puras", "tema": "Álgebra avanzada", "temaEN": "Algebra and functions", "explicacion": "Claudia, el álgebra de A-Level es la caja de herramientas que vas a usar en TODO lo demás. Empieza con las leyes de los exponentes (laws of indices): por ejemplo, a² × a³ = a⁵ y a^(1/2) = √a. Luego vienen los radicales (surds), que son raíces que no dan número exacto, como √2; aprendes a simplificarlos (√12 = 2√3) y a quitar raíces del denominador (rationalising the denominator).\n\nDespués trabajas con ecuaciones cuadráticas (quadratics): las resuelves factorizando, con la fórmula general (quadratic formula) o completando el cuadrado (completing the square). El discriminante (discriminant) b² − 4ac te dice cuántas raíces reales hay: positivo = dos, cero = una (repetida), negativo = ninguna. También resuelves ecuaciones simultáneas (simultaneous equations), incluso una lineal con una cuadrática, por sustitución.\n\nFinalmente están las desigualdades (inequalities), lineales y cuadráticas (para las cuadráticas, dibuja la parábola y mira dónde está arriba o abajo del eje x), y el teorema del factor (factor theorem): si f(a) = 0, entonces (x − a) es factor de f(x). Con eso puedes factorizar cúbicas usando división algebraica (algebraic division).", "analogia": "El álgebra es como la cocina básica: picar, hervir y freír (exponentes, factorizar, despejar). Ningún platillo elegante sale si no dominas esas técnicas, y en cálculo o mecánica te piden 'cocinar' sin pensarlo dos veces.", "ejemplo": "Resuelve 2x² − 7x + 3 = 0.\nPaso 1: Busca dos números que multiplicados den 2 × 3 = 6 y sumados den −7: son −6 y −1.\nPaso 2: Separa: 2x² − 6x − x + 3 = 0 → 2x(x − 3) − 1(x − 3) = 0.\nPaso 3: Factoriza: (2x − 1)(x − 3) = 0.\nPaso 4: x = 1/2 o x = 3. Comprueba: 2(9) − 21 + 3 = 0 ✓.", "puntos": ["Las leyes de los exponentes (laws of indices) incluyen exponentes negativos y fraccionarios: a⁻ⁿ = 1/aⁿ y a^(m/n) = (ⁿ√a)ᵐ.", "Para racionalizar (rationalise the denominator) multiplica por el conjugado: 1/(√3 − 1) × (√3 + 1)/(√3 + 1).", "El discriminante (discriminant) b² − 4ac decide el número de raíces reales: > 0 dos, = 0 una repetida, < 0 ninguna.", "Completar el cuadrado (completing the square) da el vértice (turning point) de la parábola.", "En desigualdades cuadráticas (quadratic inequalities) haz un bosquejo: la respuesta puede ser una región entre raíces o dos regiones separadas.", "Teorema del factor (factor theorem): f(a) = 0 ⇔ (x − a) es factor de f(x)."], "formulas": ["aᵐ × aⁿ = aᵐ⁺ⁿ", "aᵐ ÷ aⁿ = aᵐ⁻ⁿ", "(aᵐ)ⁿ = aᵐⁿ", "a⁻ⁿ = 1/aⁿ ; a^(m/n) = (ⁿ√a)ᵐ", "√(ab) = √a × √b", "x = (−b ± √(b² − 4ac)) / (2a)", "x² + bx + c = (x + b/2)² − (b/2)² + c", "f(a) = 0 ⇔ (x − a) es factor de f(x)"], "glosario": [{"en": "surd", "es": "radical / raíz irracional"}, {"en": "discriminant", "es": "discriminante"}, {"en": "completing the square", "es": "completar el cuadrado"}, {"en": "simultaneous equations", "es": "ecuaciones simultáneas"}, {"en": "factor theorem", "es": "teorema del factor"}], "flashcards": [{"q": "¿Cuánto vale 27^(2/3)?", "a": "9 (raíz cúbica de 27 = 3, y 3² = 9)."}, {"q": "Simplifica √50.", "a": "5√2."}, {"q": "¿Qué indica b² − 4ac < 0?", "a": "Que no hay raíces reales: la parábola no toca el eje x."}, {"q": "¿Cómo racionalizas 1/(2 + √5)?", "a": "Multiplicas arriba y abajo por (2 − √5)."}, {"q": "Si f(−1) = 0, ¿qué factor tiene f(x)?", "a": "(x + 1)."}, {"q": "¿Qué método usas para resolver y = x + 1 con x² + y² = 25?", "a": "Sustitución: reemplazas y en la ecuación cuadrática."}], "preguntas": [{"q": "¿Cuánto vale 8^(2/3)?", "op": ["16/3", "4", "2", "12"], "ok": 1, "exp": "8^(1/3) = 2 y 2² = 4. 16/3 sale de multiplicar 8 × 2/3 (error común); 2 es solo la raíz cúbica; 12 no tiene relación."}, {"q": "¿Para qué valor de k la ecuación x² + 4x + k = 0 tiene raíces iguales (equal roots)?", "op": ["2", "−4", "4", "16"], "ok": 2, "exp": "Raíces iguales ⇒ b² − 4ac = 0 ⇒ 16 − 4k = 0 ⇒ k = 4. Los demás valores no hacen cero el discriminante."}, {"q": "Racionaliza 1/(√3 − 1).", "op": ["(√3 − 1)/2", "√3 + 1", "(√3 + 1)/4", "(√3 + 1)/2"], "ok": 3, "exp": "Multiplicas por (√3 + 1): el denominador es 3 − 1 = 2, así que queda (√3 + 1)/2. Las otras opciones tienen el signo o el denominador mal."}, {"q": "Resuelve x² − x − 6 > 0.", "op": ["x < −2 o x > 3", "−2 < x < 3", "x < −3 o x > 2", "x > 3"], "ok": 0, "exp": "(x − 3)(x + 2) > 0; la parábola está arriba del eje x fuera de las raíces −2 y 3. '−2 < x < 3' es donde es negativa; las otras tienen raíces equivocadas o faltan regiones."}, {"q": "¿Cuál es el residuo (remainder) al dividir x³ + 2x − 5 entre (x − 1)?", "op": ["2", "0", "−5", "−2"], "ok": 3, "exp": "Por el teorema del residuo, f(1) = 1 + 2 − 5 = −2. 0 implicaría que (x − 1) es factor; −5 es f(0); 2 es un error de signo."}], "feynman": "Explícale a un amigo de 12 años por qué si f(3) = 0 entonces (x − 3) 'cabe exactamente' dentro de f(x), usando la idea de dividir números enteros sin residuo.", "conexion": ["En economía, el punto de equilibrio entre ingresos y costos se encuentra resolviendo ecuaciones simultáneas: ¿qué representaría cada ecuación en un negocio de renta de vestidos?", "¿Por qué el discriminante es útil en física para saber si un objeto lanzado alcanza o no cierta altura?"], "examen": {"q": "f(x) = 2x³ − 7x² + 7x − 2\n(a) Use the factor theorem to show that (x − 2) is a factor of f(x).\n(b) Hence factorise f(x) completely.", "marks": 4, "ms": "(a) M1: attempts f(2) = 16 − 28 + 14 − 2. A1: f(2) = 0 so (x − 2) is a factor (conclusion required).\n(b) M1: divides or compares coefficients to obtain quadratic factor (2x² − 3x + 1). A1: f(x) = (x − 2)(2x − 1)(x − 1)."}}, {"id": "MAT02", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Matemáticas Puras", "tema": "Funciones", "temaEN": "Algebra and functions: graphs and transformations", "explicacion": "Una función (function) es una regla que a cada x le asigna un valor f(x). En A-Level necesitas saber dibujar (sketch) las gráficas típicas: cúbicas (cubics), cuárticas (quartics) y recíprocas (reciprocal graphs) como y = k/x y y = k/x². Un sketch no tiene que ser perfecto, pero sí mostrar la forma correcta y los puntos donde corta los ejes.\n\nUna pista clave: si una raíz es repetida, la gráfica toca el eje x sin cruzarlo (por ejemplo, (x − 2)² en una cúbica). Las recíprocas tienen asíntotas (asymptotes), líneas a las que la curva se acerca pero nunca toca, como x = 0 y y = 0 para y = 1/x. Los puntos donde dos gráficas se cruzan son las soluciones de igualar sus ecuaciones.\n\nLas transformaciones (transformations) mueven o estiran una gráfica: f(x) + a sube a unidades; f(x + a) mueve a unidades a la IZQUIERDA (¡al revés de lo que parece!); af(x) estira verticalmente con factor a; f(ax) estira horizontalmente con factor 1/a; −f(x) refleja en el eje x y f(−x) en el eje y.", "analogia": "Las transformaciones son como los filtros y la herramienta de editar en Instagram: puedes mover la foto, estirarla o voltearla como espejo, pero la foto original (la forma de la gráfica) sigue siendo la misma.", "ejemplo": "Parte de y = x² (vértice en (0, 0)).\nPaso 1: y = (x − 3)² mueve la gráfica 3 a la derecha → vértice (3, 0).\nPaso 2: y = (x − 3)² + 2 la sube 2 → vértice (3, 2).\nPaso 3: Comprueba con x = 3: y = 0 + 2 = 2 ✓. La curva corta el eje y cuando x = 0: y = 9 + 2 = 11 → (0, 11).", "puntos": ["Una raíz repetida (repeated root) hace que la gráfica toque el eje x sin cruzarlo.", "y = k/x y y = k/x² tienen asíntotas (asymptotes) en x = 0 y y = 0.", "f(x + a) es una traslación (translation) horizontal de −a: ¡se mueve al lado contrario del signo!", "af(x) es un estiramiento vertical (vertical stretch) de factor a; f(ax) es un estiramiento horizontal (horizontal stretch) de factor 1/a.", "−f(x) refleja en el eje x y f(−x) refleja en el eje y (reflection).", "Los puntos de intersección (points of intersection) se hallan igualando las ecuaciones de las dos curvas."], "formulas": ["y = f(x) + a : traslación (0, a)", "y = f(x + a) : traslación (−a, 0)", "y = af(x) : estiramiento vertical, factor a", "y = f(ax) : estiramiento horizontal, factor 1/a", "y = −f(x) : reflexión en el eje x ; y = f(−x) : reflexión en el eje y", "y ∝ x ⇒ y = kx ; y ∝ 1/x ⇒ y = k/x"], "glosario": [{"en": "asymptote", "es": "asíntota"}, {"en": "translation", "es": "traslación"}, {"en": "stretch", "es": "estiramiento"}, {"en": "reflection", "es": "reflexión"}, {"en": "sketch", "es": "bosquejo / gráfica a mano"}], "flashcards": [{"q": "¿Qué hace y = f(x) − 5?", "a": "Baja la gráfica 5 unidades."}, {"q": "¿Qué hace y = f(x + 2)?", "a": "Mueve la gráfica 2 unidades a la izquierda."}, {"q": "¿Qué hace y = f(3x)?", "a": "Estiramiento horizontal con factor 1/3."}, {"q": "¿Cuáles son las asíntotas de y = 2/x²?", "a": "x = 0 y y = 0."}, {"q": "¿Cómo se ve una cúbica positiva con factor (x − 1)²?", "a": "Toca el eje x en x = 1 sin cruzarlo."}, {"q": "¿Cómo hallas dónde se cruzan dos curvas?", "a": "Igualas sus ecuaciones y resuelves."}], "preguntas": [{"q": "La transformación y = f(x − 4) mueve la gráfica…", "op": ["4 unidades a la izquierda", "4 unidades a la derecha", "4 unidades hacia arriba", "4 unidades hacia abajo"], "ok": 1, "exp": "f(x − 4) es traslación (4, 0): a la derecha. 'Izquierda' sería f(x + 4); arriba/abajo serían f(x) ± 4."}, {"q": "¿Qué transformación es y = 2f(x)?", "op": ["Estiramiento horizontal, factor 2", "Estiramiento horizontal, factor ½", "Estiramiento vertical, factor 2", "Reflexión en el eje x"], "ok": 2, "exp": "Multiplicar fuera de f estira verticalmente (y se duplica). Los estiramientos horizontales vienen de f(ax); la reflexión sería −f(x)."}, {"q": "¿Cuáles son las asíntotas de y = 3/x?", "op": ["x = 0 y y = 0", "x = 3 y y = 0", "solo x = 0", "x = 0 y y = 3"], "ok": 0, "exp": "x no puede ser 0 y y nunca llega a 0. El 3 solo estira la curva, no mueve las asíntotas."}, {"q": "¿Qué transformación es y = f(2x)?", "op": ["Estiramiento vertical, factor 2", "Estiramiento horizontal, factor 2", "Traslación de 2 a la derecha", "Estiramiento horizontal, factor ½"], "ok": 3, "exp": "Dentro de f, multiplicar x por 2 'aprieta' la gráfica a la mitad: factor ½. Las demás confunden el efecto de dentro y fuera de la función."}, {"q": "¿En cuántos puntos se cruzan y = x² y y = 1/x?", "op": ["0", "2", "1", "3"], "ok": 2, "exp": "x² = 1/x ⇒ x³ = 1 ⇒ x = 1 (única raíz real). Solo un punto: (1, 1)."}], "feynman": "Explica con tus palabras por qué f(x + 3) mueve la gráfica a la IZQUIERDA y no a la derecha. Pista: ¿qué valor de x da ahora el mismo resultado que antes daba x = 0?", "conexion": ["En física, la intensidad de la luz o del sonido sigue y = k/x² respecto a la distancia: ¿qué significa la asíntota y = 0 en la vida real?", "Si el precio de renta de un vestido sube $50 a todos los clientes, ¿qué transformación le pasa a la gráfica de ingresos?"], "examen": {"q": "The curve C has equation y = f(x), where f(x) = (x + 1)(x − 2)².\n(a) Sketch C, showing the coordinates of any points where C meets the coordinate axes.\n(b) On a separate diagram, sketch y = f(x + 2), showing the coordinates of any points where it meets the axes.", "marks": 4, "ms": "(a) B1: positive cubic shape. B1: crosses x-axis at (−1, 0) and touches (turning point) at (2, 0). B1: meets y-axis at (0, 4).\n(b) B1: same shape translated 2 left, crossing at (−3, 0) and touching at (0, 0) (which is also the y-intercept)."}}, {"id": "MAT03", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Matemáticas Puras", "tema": "Geometría de coordenadas", "temaEN": "Coordinate geometry in the (x, y) plane", "explicacion": "La geometría de coordenadas une álgebra y dibujo. Empezamos con rectas (straight lines): su pendiente (gradient) es m = (y₂ − y₁)/(x₂ − x₁), y su ecuación puede escribirse como y = mx + c, y − y₁ = m(x − x₁) o ax + by + c = 0 (Edexcel suele pedir esta última con a, b, c enteros).\n\nDos rectas son paralelas (parallel) si tienen la misma pendiente y perpendiculares (perpendicular) si el producto de pendientes es −1. También usas el punto medio (midpoint) y la distancia entre dos puntos (Pitágoras disfrazado).\n\nLa circunferencia (circle) con centro (a, b) y radio r tiene ecuación (x − a)² + (y − b)² = r². Si te la dan 'expandida', completa el cuadrado para hallar centro y radio. Propiedades clave: la tangente (tangent) es perpendicular al radio en el punto de contacto, la mediatriz (perpendicular bisector) de una cuerda (chord) pasa por el centro, y el ángulo en un semicírculo es recto.", "analogia": "Las coordenadas son como la dirección de una casa en Google Maps: con dos números ubicas cualquier punto, y con una ecuación describes todo un camino (una recta) o una rotonda (un círculo).", "ejemplo": "Encuentra centro y radio de x² + y² − 6x + 4y − 12 = 0.\nPaso 1: Agrupa: (x² − 6x) + (y² + 4y) = 12.\nPaso 2: Completa el cuadrado: (x − 3)² − 9 + (y + 2)² − 4 = 12.\nPaso 3: (x − 3)² + (y + 2)² = 25.\nPaso 4: Centro (3, −2), radio √25 = 5.", "puntos": ["Pendiente (gradient) m = cambio en y / cambio en x.", "Rectas paralelas (parallel lines) tienen igual pendiente; perpendiculares (perpendicular) cumplen m₁ × m₂ = −1.", "Edexcel suele pedir la forma ax + by + c = 0 con a, b, c enteros (integers).", "Ecuación de la circunferencia (equation of a circle): (x − a)² + (y − b)² = r².", "La tangente (tangent) es perpendicular al radio (radius) en el punto de contacto.", "Para ver si una recta corta un círculo, sustituye y usa el discriminante (discriminant): > 0 corta en 2, = 0 tangente, < 0 no lo toca."], "formulas": ["m = (y₂ − y₁)/(x₂ − x₁)", "y − y₁ = m(x − x₁)", "y = mx + c ; ax + by + c = 0", "Perpendiculares: m₁ × m₂ = −1", "Punto medio = ((x₁ + x₂)/2, (y₁ + y₂)/2)", "Distancia = √((x₂ − x₁)² + (y₂ − y₁)²)", "(x − a)² + (y − b)² = r²"], "glosario": [{"en": "gradient", "es": "pendiente"}, {"en": "perpendicular bisector", "es": "mediatriz"}, {"en": "chord", "es": "cuerda"}, {"en": "tangent", "es": "tangente"}, {"en": "midpoint", "es": "punto medio"}], "flashcards": [{"q": "Pendiente de una recta perpendicular a una con m = 3/4", "a": "−4/3."}, {"q": "Centro y radio de (x − 2)² + (y + 5)² = 49", "a": "Centro (2, −5), radio 7."}, {"q": "Distancia entre (1, 1) y (4, 5)", "a": "√(9 + 16) = 5."}, {"q": "¿Qué relación hay entre tangente y radio?", "a": "Son perpendiculares en el punto de contacto."}, {"q": "¿Por dónde pasa la mediatriz de una cuerda?", "a": "Por el centro del círculo."}, {"q": "Ángulo en un semicírculo", "a": "90° (ángulo recto)."}], "preguntas": [{"q": "Pendiente de la recta que pasa por (1, 2) y (4, 11):", "op": ["3", "1/3", "−3", "9"], "ok": 0, "exp": "(11 − 2)/(4 − 1) = 9/3 = 3. 1/3 invierte la fracción; 9 olvida dividir; −3 tiene signo mal."}, {"q": "Pendiente de una recta perpendicular a y = 2x + 1:", "op": ["2", "−2", "½", "−½"], "ok": 3, "exp": "Necesitas m × 2 = −1 ⇒ m = −½. 2 sería paralela; −2 y ½ solo cambian signo o invierten, no ambas cosas."}, {"q": "Centro y radio de (x + 1)² + (y − 4)² = 9:", "op": ["(1, −4), r = 3", "(−1, 4), r = 9", "(−1, 4), r = 3", "(1, 4), r = 3"], "ok": 2, "exp": "El centro tiene los signos opuestos a los de dentro del paréntesis: (−1, 4); el radio es √9 = 3, no 9."}, {"q": "Punto medio de (2, 5) y (8, −1):", "op": ["(3, 3)", "(5, 2)", "(6, −6)", "(10, 4)"], "ok": 1, "exp": "((2 + 8)/2, (5 − 1)/2) = (5, 2). (10, 4) olvida dividir entre 2; (6, −6) es la diferencia."}, {"q": "¿Para qué valores de k la recta y = x + k es tangente a x² + y² = 8?", "op": ["k = ±2√2", "k = ±8", "k = ±2", "k = ±4"], "ok": 3, "exp": "Sustituyendo: 2x² + 2kx + k² − 8 = 0; discriminante 4k² − 8(k² − 8) = 64 − 4k² = 0 ⇒ k = ±4. ±2√2 es el radio, no k."}], "feynman": "Explica sin fórmulas por qué la ecuación de un círculo es básicamente el teorema de Pitágoras. Dibuja un punto en el círculo, el centro y un triángulo rectángulo.", "conexion": ["En diseño de modas, ¿cómo usarías la ecuación de un círculo para trazar el corte de una falda circular?", "¿Cómo usan los GPS la idea de 'distancia entre dos puntos' y círculos para ubicar tu teléfono (trilateración)?"], "examen": {"q": "The circle C has equation (x − 3)² + (y + 2)² = 25. The point P(6, 2) lies on C.\nFind an equation of the tangent to C at P, giving your answer in the form ax + by + c = 0, where a, b and c are integers.", "marks": 4, "ms": "B1: centre (3, −2). M1: gradient of radius = (2 − (−2))/(6 − 3) = 4/3. M1: tangent gradient −3/4 and uses y − 2 = −3/4(x − 6). A1: 3x + 4y − 26 = 0 (or any integer multiple)."}}, {"id": "MAT04", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Matemáticas Puras", "tema": "Secuencias", "temaEN": "Sequences and series (binomial expansion)", "explicacion": "En el Year 1 de Edexcel, este tema se centra en la expansión binomial (binomial expansion): cómo desarrollar (a + b)ⁿ cuando n es un entero positivo, sin multiplicar paréntesis una y otra vez. Las sucesiones aritméticas y geométricas (arithmetic and geometric sequences) completas se ven en el Year 2, pero aquí sientas las bases.\n\nLos coeficientes salen del triángulo de Pascal (Pascal's triangle) o de la combinación ⁿCᵣ = n!/(r!(n − r)!), que cuenta de cuántas formas eliges r cosas de n. En cada término, las potencias de a bajan y las de b suben, y siempre suman n. Hay n + 1 términos.\n\nTruco de examen: cuando el término tiene un número, como (2 − x)⁶, mete TODO entre paréntesis: (−x)² o (3x)². Muchos puntos se pierden por olvidar elevar el coeficiente o el signo. Además, con x pequeña puedes usar los primeros términos para aproximar (approximation) valores como 1.99⁶.", "analogia": "La expansión binomial es como hacer combinaciones de outfits: si tienes n prendas y eliges r de un tipo, ⁿCᵣ te dice cuántas combinaciones distintas puedes armar sin listarlas una por una.", "ejemplo": "Encuentra los 3 primeros términos de (1 + 2x)⁵.\nPaso 1: Coeficientes de la fila 5 de Pascal: 1, 5, 10, …\nPaso 2: 1⁵ = 1.\nPaso 3: 5 × (2x) = 10x.\nPaso 4: 10 × (2x)² = 10 × 4x² = 40x².\nResultado: 1 + 10x + 40x² + …", "puntos": ["La expansión binomial (binomial expansion) de (a + b)ⁿ tiene n + 1 términos.", "Los coeficientes son ⁿCᵣ (combinations), también visibles en el triángulo de Pascal (Pascal's triangle).", "En cada término las potencias suman n: ⁿCᵣ aⁿ⁻ʳ bʳ.", "Pon el término completo entre paréntesis: (2x)², (−x)³, para no perder coeficientes ni signos.", "Con x pequeña, los primeros términos dan una buena aproximación (approximation).", "Las sucesiones aritméticas y geométricas (arithmetic / geometric sequences) se estudian a fondo en el Year 2."], "formulas": ["(a + b)ⁿ = aⁿ + ⁿC₁aⁿ⁻¹b + ⁿC₂aⁿ⁻²b² + … + bⁿ", "ⁿCᵣ = n! / (r!(n − r)!)", "(1 + x)ⁿ = 1 + nx + n(n − 1)x²/2! + n(n − 1)(n − 2)x³/3! + …", "n! = n × (n − 1) × … × 2 × 1", "Year 2 (avance): uₙ = a + (n − 1)d ; uₙ = arⁿ⁻¹"], "glosario": [{"en": "binomial expansion", "es": "desarrollo / expansión binomial"}, {"en": "coefficient", "es": "coeficiente"}, {"en": "ascending powers of x", "es": "potencias ascendentes de x"}, {"en": "factorial", "es": "factorial"}, {"en": "term", "es": "término"}], "flashcards": [{"q": "¿Cuántos términos tiene (a + b)⁹?", "a": "10."}, {"q": "¿Cuánto vale ⁶C₂?", "a": "15."}, {"q": "Fila 4 del triángulo de Pascal", "a": "1 4 6 4 1."}, {"q": "Tercer término de (1 + x)⁸", "a": "28x²."}, {"q": "Error típico con (3x)²", "a": "Escribir 3x² en vez de 9x²."}, {"q": "¿Qué significa 'ascending powers of x'?", "a": "Ordenar de menor a mayor potencia: constante, x, x², …"}], "preguntas": [{"q": "¿Cuánto vale ⁵C₂?", "op": ["20", "10", "5", "25"], "ok": 1, "exp": "5!/(2!3!) = 120/12 = 10. 20 sería 5 × 4 sin dividir entre 2!; 25 = 5²."}, {"q": "Coeficiente de x² en (1 + 3x)⁴:", "op": ["12", "36", "54", "81"], "ok": 2, "exp": "⁴C₂ × 3² = 6 × 9 = 54. 12 es el coeficiente de x; 36 olvida algo del coeficiente; 81 es el de x⁴."}, {"q": "¿Cuántos términos tiene (a + b)⁷?", "op": ["8", "7", "14", "6"], "ok": 0, "exp": "Siempre hay n + 1 términos: 7 + 1 = 8."}, {"q": "Coeficiente de x³ en (2 + x)⁵:", "op": ["10", "80", "20", "40"], "ok": 3, "exp": "⁵C₃ × 2² × x³ = 10 × 4 = 40. 10 olvida el 2²; 80 usa 2³."}, {"q": "Fila de Pascal para n = 4:", "op": ["1 3 3 1", "1 4 4 1", "1 4 6 4 1", "1 5 10 10 5 1"], "ok": 2, "exp": "n = 4 tiene 5 números: 1 4 6 4 1. 1 3 3 1 es n = 3 y la última es n = 5."}], "feynman": "Explica por qué el coeficiente de x² en (1 + x)⁴ es 6 contando de cuántas formas puedes escoger 'x' de exactamente 2 de los 4 paréntesis.", "conexion": ["En biología, la probabilidad de tener 2 hijas de 4 hijos usa ⁴C₂: ¿cómo se relaciona con la expansión de (½ + ½)⁴?", "Si VOGA ofrece 8 accesorios y una clienta elige 3, ¿cuántas combinaciones distintas hay? ¿Qué coeficiente binomial es?"], "examen": {"q": "(a) Find the first 3 terms, in ascending powers of x, of the binomial expansion of (2 − x)⁶, giving each term in its simplest form.\n(b) Hence find an approximation to 1.99⁶, giving your answer to 3 decimal places.", "marks": 4, "ms": "(a) B1: 64. M1: correct structure, e.g. ⁶C₁ × 2⁵ × (−x) and ⁶C₂ × 2⁴ × (−x)². A1: 64 − 192x + 240x².\n(b) B1: uses x = 0.01 to obtain 64 − 1.92 + 0.024 = 62.104."}}, {"id": "MAT05", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Matemáticas Puras", "tema": "Trigonometría", "temaEN": "Trigonometry", "explicacion": "La trigonometría estudia la relación entre ángulos y lados. En triángulos que NO son rectángulos usas la regla del seno (sine rule) cuando conoces un lado y su ángulo opuesto, y la regla del coseno (cosine rule) cuando tienes dos lados y el ángulo entre ellos, o los tres lados. El área es ½ab sin C. Ojo con el caso ambiguo (ambiguous case) de la regla del seno: a veces hay dos triángulos posibles (un ángulo agudo y otro obtuso).\n\nTambién estudias las gráficas de sin, cos y tan: seno y coseno se repiten cada 360° y oscilan entre −1 y 1; tan se repite cada 180° y tiene asíntotas en 90°, 270°, … Las identidades (identities) clave son tan θ = sin θ / cos θ y sin²θ + cos²θ = 1.\n\nPara resolver ecuaciones trigonométricas (trigonometric equations) en un intervalo, usa la calculadora para el valor principal y después la simetría de la gráfica (o el diagrama CAST) para hallar las demás soluciones. Como avance: los radianes (radians) son otra unidad de ángulo, con 180° = π rad; en Edexcel se usan a fondo en el Year 2.", "analogia": "Las gráficas de seno y coseno son como la marea o una rueda de la fortuna: suben y bajan siempre igual, así que si conoces una vuelta (360°), conoces todas.", "ejemplo": "Resuelve 2 sin θ = 1 para 0° ≤ θ < 360°.\nPaso 1: sin θ = 1/2.\nPaso 2: Calculadora: θ = sin⁻¹(0.5) = 30°.\nPaso 3: El seno es positivo en el 1.º y 2.º cuadrante, así que la otra solución es 180° − 30° = 150°.\nResultado: θ = 30° o 150°.", "puntos": ["Regla del seno (sine rule): úsala con un lado y su ángulo opuesto; cuidado con el caso ambiguo (ambiguous case).", "Regla del coseno (cosine rule): úsala con dos lados y el ángulo incluido, o con tres lados.", "Área de un triángulo (area of a triangle) = ½ab sin C.", "Identidades (identities): tan θ = sin θ / cos θ y sin²θ + cos²θ = 1.", "sin y cos tienen periodo (period) 360°; tan tiene periodo 180°.", "En ecuaciones, busca TODAS las soluciones en el intervalo (interval) dado, usando simetría o CAST."], "formulas": ["a/sin A = b/sin B = c/sin C", "a² = b² + c² − 2bc cos A", "Área = ½ab sin C", "tan θ = sin θ / cos θ", "sin²θ + cos²θ = 1", "sin(180° − θ) = sin θ ; cos(360° − θ) = cos θ ; tan(180° + θ) = tan θ", "180° = π radianes (avance Year 2)"], "glosario": [{"en": "sine rule", "es": "regla / ley del seno"}, {"en": "cosine rule", "es": "regla / ley del coseno"}, {"en": "identity", "es": "identidad"}, {"en": "period", "es": "periodo"}, {"en": "ambiguous case", "es": "caso ambiguo"}], "flashcards": [{"q": "¿Cuándo usas la regla del coseno?", "a": "Con dos lados y el ángulo entre ellos, o con los tres lados."}, {"q": "sin²θ + cos²θ = ?", "a": "1."}, {"q": "Periodo de y = tan x", "a": "180°."}, {"q": "Si sin θ = 0.5, soluciones en [0°, 360°)", "a": "30° y 150°."}, {"q": "Área con lados 4 y 5 y ángulo 90° entre ellos", "a": "½ × 4 × 5 × 1 = 10."}, {"q": "¿A cuántos grados equivale π radianes?", "a": "180°."}], "preguntas": [{"q": "En un triángulo, b = 5, c = 7 y A = 60°. Halla a (3 s.f.).", "op": ["6.24", "8.60", "39", "5.57"], "ok": 0, "exp": "a² = 25 + 49 − 2(5)(7)cos 60° = 74 − 35 = 39, a = √39 ≈ 6.24. 39 olvida la raíz; 8.60 = √74 olvida restar el término del coseno."}, {"q": "Área de un triángulo con lados 6 cm y 8 cm y ángulo incluido de 30°:", "op": ["24 cm²", "48 cm²", "12 cm²", "20.8 cm²"], "ok": 2, "exp": "½ × 6 × 8 × sin 30° = 24 × 0.5 = 12. 24 olvida el seno; 48 olvida el ½; 20.8 usa sin 60°."}, {"q": "Periodo de y = tan x:", "op": ["360°", "90°", "720°", "180°"], "ok": 3, "exp": "La tangente se repite cada 180°. 360° es el periodo de sin y cos."}, {"q": "Si sin θ = 3/5 y θ es agudo, ¿cuánto vale cos θ?", "op": ["3/4", "4/5", "2/5", "5/4"], "ok": 1, "exp": "cos²θ = 1 − 9/25 = 16/25, cos θ = 4/5 (positivo por ser agudo). 3/4 es tan θ; 5/4 es mayor que 1, imposible."}, {"q": "Resuelve tan θ = 1 para 0° ≤ θ < 360°.", "op": ["45° y 135°", "45° y 315°", "45° y 225°", "solo 45°"], "ok": 2, "exp": "tan es positiva en el 1.º y 3.º cuadrante: 45° y 45° + 180° = 225°. En 135° y 315° tan vale −1."}], "feynman": "Explícale a alguien por qué sin²θ + cos²θ = 1 dibujando un triángulo rectángulo con hipotenusa 1 y usando Pitágoras.", "conexion": ["En física, las ondas de sonido y la corriente alterna se modelan con y = sin x: ¿qué representaría el periodo en una canción?", "Un topógrafo mide dos lados de un terreno triangular y el ángulo entre ellos: ¿qué regla usaría para el tercer lado y para el área?"], "examen": {"q": "Solve, for 0° ≤ x < 360°,\n2cos²x + 3sin x = 3\nShow each stage of your working.", "marks": 5, "ms": "M1: uses cos²x = 1 − sin²x to form 2sin²x − 3sin x + 1 = 0. M1: solves quadratic in sin x: (2sin x − 1)(sin x − 1) = 0. A1: sin x = ½ or sin x = 1. A1: x = 30°, 150°. A1: x = 90° (all three, no extras in range)."}}, {"id": "MAT06", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Matemáticas Puras", "tema": "Vectores", "temaEN": "Vectors", "explicacion": "Un vector (vector) es una cantidad con magnitud (tamaño) y dirección, a diferencia de un escalar (scalar), que solo tiene tamaño. En 2D lo escribes como a = 3i + 4j, donde i y j son vectores unitarios (unit vectors) en las direcciones x y y, o como vector columna (column vector) con 3 arriba y 4 abajo.\n\nLa magnitud (magnitude) es |a| = √(3² + 4²) = 5, y la dirección se da con el ángulo respecto a i usando tan θ = y/x (haz un dibujo para no equivocarte de cuadrante). Un vector unitario en la dirección de a es a/|a|. Dos vectores son paralelos (parallel) si uno es múltiplo escalar del otro.\n\nLos vectores de posición (position vectors) van del origen a un punto: OA = a. Para ir de A a B, AB = b − a ('fin menos inicio'). Con esto resuelves problemas geométricos (demostrar que puntos son colineales, hallar puntos medios) y preparas el terreno para mecánica, donde fuerza, velocidad y aceleración son vectores.", "analogia": "Un vector es como las instrucciones para llegar a la tienda: 'camina 3 cuadras al este y 4 al norte'. La magnitud es qué tan lejos está en línea recta (5 cuadras) y la dirección hacia dónde mirar.", "ejemplo": "Sea a = 5i − 12j.\nPaso 1: Magnitud: |a| = √(5² + (−12)²) = √169 = 13.\nPaso 2: Vector unitario: (5i − 12j)/13.\nPaso 3: Ángulo con i: tan θ = 12/5 ⇒ θ ≈ 67.4°, por DEBAJO de i (porque la componente j es negativa).", "puntos": ["Un vector (vector) tiene magnitud y dirección; un escalar (scalar) solo magnitud.", "Magnitud (magnitude): |xi + yj| = √(x² + y²).", "Vector unitario (unit vector) en dirección de a: a/|a|.", "AB = b − a usando vectores de posición (position vectors).", "Vectores paralelos (parallel vectors): uno es múltiplo escalar del otro.", "Para la dirección usa tan θ = y/x y un dibujo para saber el cuadrante."], "formulas": ["|xi + yj| = √(x² + y²)", "Vector unitario â = a / |a|", "AB = OB − OA = b − a", "tan θ = y / x (ángulo con i)", "a ∥ b ⇔ a = λb", "Distancia entre A y B = |b − a|"], "glosario": [{"en": "magnitude", "es": "magnitud / módulo"}, {"en": "unit vector", "es": "vector unitario"}, {"en": "position vector", "es": "vector de posición"}, {"en": "scalar", "es": "escalar"}, {"en": "resultant", "es": "resultante"}], "flashcards": [{"q": "|3i + 4j| = ?", "a": "5."}, {"q": "Si OA = 2i + j y OB = 5i + 5j, ¿AB?", "a": "3i + 4j."}, {"q": "¿Cómo sabes si dos vectores son paralelos?", "a": "Uno es múltiplo escalar del otro."}, {"q": "Vector unitario de 6i + 8j", "a": "0.6i + 0.8j."}, {"q": "Diferencia entre velocidad y rapidez (speed)", "a": "La velocidad es vector; la rapidez es su magnitud."}, {"q": "¿Qué es un vector resultante?", "a": "La suma de dos o más vectores."}], "preguntas": [{"q": "|6i − 8j| = ?", "op": ["14", "10", "2", "√28"], "ok": 1, "exp": "√(36 + 64) = √100 = 10. 14 suma componentes; 2 las resta; √28 resta cuadrados."}, {"q": "Si a = 2i + 3j y b = −i + 4j, ¿cuánto es 2a − b?", "op": ["3i + 2j", "5i + 10j", "5i + 2j", "i + 7j"], "ok": 2, "exp": "2a = 4i + 6j; menos b: (4 − (−1))i + (6 − 4)j = 5i + 2j. Las demás tienen errores de signo o suman b."}, {"q": "¿Cuál es paralelo a 2i − 3j?", "op": ["−4i + 6j", "3i − 2j", "4i + 6j", "2i + 3j"], "ok": 0, "exp": "−4i + 6j = −2(2i − 3j). En las otras la razón entre componentes no es la misma."}, {"q": "OA = i + 2j y OB = 4i + 6j. ¿AB?", "op": ["5i + 8j", "−3i − 4j", "3i + 8j", "3i + 4j"], "ok": 3, "exp": "AB = b − a = 3i + 4j. −3i − 4j es BA; 5i + 8j suma en vez de restar."}, {"q": "Vector unitario en la dirección de 3i + 4j:", "op": ["3i + 4j", "0.6i + 0.8j", "0.75i + j", "5i"], "ok": 1, "exp": "Divides entre |3i + 4j| = 5: 0.6i + 0.8j, cuya magnitud es 1. Las demás no tienen magnitud 1 o cambian la dirección."}], "feynman": "Explica, usando un mapa de tu colonia, por qué AB = b − a: ¿cómo llegas de A a B si solo sabes cómo llegar desde tu casa (el origen) a cada punto?", "conexion": ["En física, si nadas a 2 m/s cruzando un río con corriente de 1 m/s, ¿cómo te ayuda sumar vectores a saber hacia dónde terminas?", "En videojuegos, el movimiento de personajes se programa con vectores: ¿qué representaría un vector unitario multiplicado por la rapidez?"], "examen": {"q": "The points A and B have position vectors 2i − j and 5i + 3j respectively, relative to a fixed origin O.\n(a) Find the vector AB.\n(b) Find |AB|.\n(c) Find the angle that AB makes with the unit vector i, giving your answer in degrees to one decimal place.", "marks": 4, "ms": "(a) B1: AB = 3i + 4j.\n(b) M1: √(3² + 4²). A1: |AB| = 5.\n(c) B1: tan⁻¹(4/3) = 53.1°."}}, {"id": "MAT07", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Matemáticas Puras", "tema": "Diferenciación", "temaEN": "Differentiation", "explicacion": "Diferenciar (differentiate) es calcular la pendiente de una curva en cada punto. Como una curva no es recta, la idea es acercarse: tomas dos puntos muy cercanos, x y x + h, calculas la pendiente de la cuerda y haces que h → 0. Esto se llama derivar desde primeros principios (differentiation from first principles) y Edexcel puede pedírtelo para x² o x³.\n\nLa regla práctica es la de la potencia (power rule): si y = xⁿ, entonces dy/dx = nxⁿ⁻¹. Funciona con exponentes negativos y fraccionarios, así que antes de derivar reescribe √x como x^(1/2) y 1/x² como x⁻². Las constantes desaparecen y los coeficientes se multiplican.\n\nCon la derivada (derivative) encuentras tangentes (tangents) y normales (normals), si la función crece (increasing, dy/dx > 0) o decrece (decreasing, dy/dx < 0), y los puntos estacionarios (stationary points), donde dy/dx = 0. La segunda derivada (second derivative) d²y/dx² te dice su naturaleza: negativa = máximo, positiva = mínimo.", "analogia": "Derivar es como mirar el velocímetro de un coche: la gráfica de distancia te dice dónde estás, pero la derivada te dice qué tan rápido cambias en ese instante exacto.", "ejemplo": "Deriva f(x) = x² desde primeros principios.\nPaso 1: f(x + h) − f(x) = (x + h)² − x² = 2xh + h².\nPaso 2: Divide entre h: 2x + h.\nPaso 3: Cuando h → 0, queda f'(x) = 2x.\nComprobación con la regla de la potencia: 2x²⁻¹ = 2x ✓.", "puntos": ["Primeros principios (first principles): f'(x) = lím (h → 0) de [f(x + h) − f(x)] / h.", "Regla de la potencia (power rule): d/dx(xⁿ) = nxⁿ⁻¹; reescribe raíces y fracciones como potencias antes.", "La tangente (tangent) tiene pendiente f'(a); la normal (normal) tiene pendiente −1/f'(a).", "Función creciente (increasing): f'(x) > 0; decreciente (decreasing): f'(x) < 0.", "Puntos estacionarios (stationary points): dy/dx = 0.", "Segunda derivada (second derivative): d²y/dx² < 0 máximo (maximum), > 0 mínimo (minimum)."], "formulas": ["f'(x) = lím (h → 0) [f(x + h) − f(x)] / h", "y = xⁿ ⇒ dy/dx = nxⁿ⁻¹", "y = k ⇒ dy/dx = 0", "Tangente: y − y₁ = m(x − x₁), m = f'(x₁)", "Normal: pendiente = −1/f'(x₁)", "Estacionario: dy/dx = 0 ; d²y/dx² < 0 máx., > 0 mín."], "glosario": [{"en": "derivative", "es": "derivada"}, {"en": "gradient function", "es": "función pendiente / derivada"}, {"en": "stationary point", "es": "punto estacionario"}, {"en": "normal", "es": "normal (recta perpendicular a la tangente)"}, {"en": "first principles", "es": "primeros principios"}], "flashcards": [{"q": "Deriva 5x⁴", "a": "20x³."}, {"q": "Deriva 1/x", "a": "−1/x² (es x⁻¹ → −x⁻²)."}, {"q": "¿Qué condición define un punto estacionario?", "a": "dy/dx = 0."}, {"q": "Si la tangente tiene pendiente 2, ¿la normal?", "a": "−1/2."}, {"q": "d²y/dx² > 0 en un punto estacionario significa…", "a": "Mínimo."}, {"q": "Deriva 7", "a": "0."}], "preguntas": [{"q": "Deriva 4x³:", "op": ["12x²", "4x²", "12x³", "x⁴"], "ok": 0, "exp": "Multiplica por el exponente y réstale 1: 3 × 4x² = 12x². x⁴ sería integrar; las otras olvidan un paso."}, {"q": "Deriva √x:", "op": ["2√x", "1/(2√x)", "½x²", "−1/(2√x)"], "ok": 1, "exp": "√x = x^(1/2) ⇒ ½x^(−1/2) = 1/(2√x). El signo negativo y las otras formas son errores al bajar el exponente."}, {"q": "Pendiente de y = x² + 3x en x = 2:", "op": ["10", "4", "7", "5"], "ok": 2, "exp": "dy/dx = 2x + 3 = 7 en x = 2. 10 es el valor de y, no la pendiente."}, {"q": "Si la tangente en un punto tiene pendiente 4, la normal tiene pendiente:", "op": ["4", "−4", "¼", "−¼"], "ok": 3, "exp": "Normal ⊥ tangente ⇒ m = −1/4. Solo cambiar signo o solo invertir no da producto −1."}, {"q": "En un punto, dy/dx = 0 y d²y/dx² > 0. Es un…", "op": ["Máximo", "Punto de inflexión siempre", "Mínimo", "Punto no estacionario"], "ok": 2, "exp": "Segunda derivada positiva ⇒ la curva 'sonríe' ⇒ mínimo. Es estacionario porque dy/dx = 0."}], "feynman": "Explica, sin la palabra 'límite', qué estás haciendo cuando derivas desde primeros principios: imagina que acercas dos puntos sobre una montaña hasta que casi se tocan.", "conexion": ["En economía, el beneficio máximo de un negocio se encuentra con dy/dx = 0: ¿cómo lo usarías para elegir el precio de renta de un vestido?", "En física, la velocidad es la derivada del desplazamiento: ¿qué significa físicamente que dv/dt = 0?"], "examen": {"q": "The curve C has equation y = x³ − 6x² + 9x + 2.\n(a) Find dy/dx.\n(b) Find the coordinates of the stationary points of C.\n(c) Determine the nature of each stationary point.", "marks": 6, "ms": "(a) M1 A1: dy/dx = 3x² − 12x + 9.\n(b) M1: sets dy/dx = 0 and solves 3(x − 1)(x − 3) = 0. A1: (1, 6) and (3, 2).\n(c) M1: finds d²y/dx² = 6x − 12 and evaluates (−6 at x = 1, 6 at x = 3). A1: (1, 6) is a maximum and (3, 2) is a minimum."}}, {"id": "MAT08", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Matemáticas Puras", "tema": "Integración", "temaEN": "Integration", "explicacion": "Integrar (integrate) es lo contrario de derivar. Si te dan la derivada, la integral te devuelve la función original. La regla de la potencia al revés es: ∫xⁿ dx = xⁿ⁺¹/(n + 1) + c, para n ≠ −1. Súmale 1 al exponente y divide entre el nuevo exponente.\n\nEsa '+ c' es la constante de integración (constant of integration) y es obligatoria en integrales indefinidas (indefinite integrals): al derivar se pierde cualquier constante, así que no sabemos cuál era. Si te dan un punto de la curva, sustituyes para hallar c.\n\nLa integral definida (definite integral) ∫ₐᵇ f(x) dx da un número: evalúas en b y restas el valor en a (sin + c). Representa el área bajo la curva (area under a curve) entre x = a y x = b. Cuidado: si la curva está debajo del eje x, la integral sale negativa, así que calcula esas partes por separado y toma el valor absoluto. También puedes hallar el área entre una curva y una recta.", "analogia": "Integrar es como rebobinar un video: la derivada te mostró la 'velocidad' de cambio, y la integral reconstruye el recorrido completo. La '+ c' es que no sabes desde qué punto empezó a grabarse.", "ejemplo": "Encuentra f(x) si f'(x) = 3x² − 2 y f(1) = 4.\nPaso 1: Integra: f(x) = x³ − 2x + c.\nPaso 2: Sustituye x = 1: 1 − 2 + c = 4.\nPaso 3: c = 5.\nResultado: f(x) = x³ − 2x + 5.", "puntos": ["Integrar (integration) es el proceso inverso de derivar.", "∫xⁿ dx = xⁿ⁺¹/(n + 1) + c, para n ≠ −1.", "Nunca olvides la constante de integración (constant of integration) en integrales indefinidas.", "Integral definida (definite integral): [F(x)]ₐᵇ = F(b) − F(a).", "El área bajo la curva (area under a curve) se calcula con una integral definida; las regiones bajo el eje x salen negativas.", "Reescribe raíces y fracciones como potencias antes de integrar: 1/x² = x⁻²."], "formulas": ["∫xⁿ dx = xⁿ⁺¹/(n + 1) + c, n ≠ −1", "∫k dx = kx + c", "∫ₐᵇ f(x) dx = F(b) − F(a)", "Área = ∫ₐᵇ y dx (si y ≥ 0)", "Área entre curvas = ∫ₐᵇ (y_arriba − y_abajo) dx"], "glosario": [{"en": "integral", "es": "integral"}, {"en": "constant of integration", "es": "constante de integración"}, {"en": "definite integral", "es": "integral definida"}, {"en": "limits", "es": "límites de integración"}, {"en": "area under a curve", "es": "área bajo la curva"}], "flashcards": [{"q": "∫x³ dx", "a": "x⁴/4 + c."}, {"q": "∫6 dx", "a": "6x + c."}, {"q": "¿Por qué se añade + c?", "a": "Porque al derivar una constante se pierde."}, {"q": "∫₀¹ 3x² dx", "a": "1."}, {"q": "¿Qué pasa si el área está bajo el eje x?", "a": "La integral es negativa; tomas el valor absoluto."}, {"q": "∫x^(1/2) dx", "a": "(2/3)x^(3/2) + c."}], "preguntas": [{"q": "∫5x⁴ dx = ?", "op": ["20x³ + c", "x⁵ + c", "5x⁵ + c", "x⁵"], "ok": 1, "exp": "5x⁵/5 + c = x⁵ + c. 20x³ es derivar; 5x⁵ no divide entre 5; x⁵ sin + c pierde la marca."}, {"q": "∫₁³ 2x dx = ?", "op": ["8", "9", "4", "6"], "ok": 0, "exp": "[x²]₁³ = 9 − 1 = 8. 9 olvida restar el límite inferior."}, {"q": "∫x⁻² dx = ?", "op": ["−2x⁻³ + c", "x⁻¹ + c", "−1/x + c", "ln x + c"], "ok": 2, "exp": "x⁻¹/(−1) + c = −1/x + c. −2x⁻³ es la derivada; x⁻¹ olvida el signo; ln x sería para x⁻¹, no x⁻²."}, {"q": "∫₀² (x² − 4) dx = −16/3. ¿Cuál es el área entre la curva y el eje x de x = 0 a x = 2?", "op": ["−16/3", "0", "32/3", "16/3"], "ok": 3, "exp": "Un área siempre es positiva: la región está bajo el eje x, así que el área es |−16/3| = 16/3."}, {"q": "Si f'(x) = 2x y f(0) = 3, entonces f(x) =", "op": ["x²", "x² + 3", "2x² + 3", "x² − 3"], "ok": 1, "exp": "Integrando: x² + c; con f(0) = 3 ⇒ c = 3. x² olvida c; 2x² + 3 integra mal."}], "feynman": "Explica por qué el área bajo una gráfica velocidad-tiempo es la distancia recorrida, y cómo eso se conecta con que integrar es 'sumar muchísimos rectángulos delgados'.", "conexion": ["En mecánica, s = ∫v dt: ¿cómo calcularías la distancia que recorre un coche si conoces su velocidad en cada instante?", "En negocios, si conoces la tasa de ventas por día, ¿qué representaría integrarla durante un mes?"], "examen": {"q": "The curve C has equation y = 4x − x².\nThe finite region R is bounded by C and the x-axis.\nUse algebraic integration to find the exact area of R.", "marks": 4, "ms": "B1: limits x = 0 and x = 4. M1: integrates, xⁿ → xⁿ⁺¹: 2x² − x³/3. M1: substitutes limits correctly and subtracts: (32 − 64/3) − 0. A1: 32/3."}}, {"id": "MAT09", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Estadística", "tema": "Muestreo de datos", "temaEN": "Statistical sampling", "explicacion": "En estadística casi nunca puedes preguntarle a TODOS. La población (population) es el grupo completo que te interesa; si estudias a todos, haces un censo (census), que es exacto pero caro y lento. Por eso tomas una muestra (sample): un subconjunto que, si está bien elegido, representa a la población. La lista de todos los miembros de los que eliges se llama marco muestral (sampling frame).\n\nLos métodos aleatorios (random sampling) son: aleatorio simple (simple random sampling), donde cada miembro tiene la misma probabilidad, usando números aleatorios; sistemático (systematic sampling), donde eliges cada k-ésimo elemento de una lista ordenada empezando en un punto aleatorio; y estratificado (stratified sampling), donde la población se divide en grupos (strata) y tomas de cada uno una cantidad proporcional a su tamaño.\n\nLos métodos no aleatorios (non-random) son por cuotas (quota sampling), donde el entrevistador llena cuotas por grupo, y de oportunidad (opportunity / convenience sampling), donde usas a quien esté disponible. Son rápidos y baratos pero pueden tener sesgo (bias). Edexcel también te pide conocer el gran conjunto de datos (large data set) de clima del Met Office.", "analogia": "Muestrear es como probar la sopa: no te tomas toda la olla para saber si le falta sal, solo una cucharada, pero primero la revuelves bien (eso es hacerlo aleatorio) para que la cucharada represente toda la olla.", "ejemplo": "Una escuela tiene 240 alumnos de Year 12 y 360 de Year 13 (600 en total). Quieres una muestra estratificada de 50.\nPaso 1: Year 12: 240/600 × 50 = 20.\nPaso 2: Year 13: 360/600 × 50 = 30.\nPaso 3: Comprueba: 20 + 30 = 50 ✓. Luego, dentro de cada grupo, eliges con muestreo aleatorio simple.", "puntos": ["Población (population) = todos; censo (census) = estudiar a todos; muestra (sample) = una parte.", "Marco muestral (sampling frame): la lista de unidades de las que se elige la muestra.", "Aleatorio simple (simple random): numera a todos y usa números aleatorios.", "Sistemático (systematic): cada k-ésimo elemento, con k = N/n y un inicio aleatorio.", "Estratificado (stratified): muestra proporcional a cada estrato (stratum).", "Cuotas (quota) y oportunidad (opportunity) no son aleatorios y pueden introducir sesgo (bias)."], "formulas": ["Tamaño en estrato = (tamaño del estrato / tamaño de la población) × tamaño de la muestra", "Intervalo sistemático k = N / n"], "glosario": [{"en": "population", "es": "población"}, {"en": "census", "es": "censo"}, {"en": "sampling frame", "es": "marco muestral"}, {"en": "stratified sampling", "es": "muestreo estratificado"}, {"en": "bias", "es": "sesgo"}], "flashcards": [{"q": "Ventaja de un censo", "a": "Da resultados exactos/completos."}, {"q": "Desventaja de un censo", "a": "Es caro y lento; no sirve si el proceso destruye el objeto (p. ej. probar fusibles)."}, {"q": "¿Qué necesita el muestreo aleatorio simple?", "a": "Un marco muestral (lista completa)."}, {"q": "Lista de 300, muestra sistemática de 15: ¿k?", "a": "20."}, {"q": "¿Qué método usa un entrevistador que llena '20 hombres y 20 mujeres'?", "a": "Muestreo por cuotas (quota sampling)."}, {"q": "Desventaja del muestreo de oportunidad", "a": "No es representativo; puede estar sesgado."}], "preguntas": [{"q": "Un censo (census) es…", "op": ["una observación de todos los miembros de la población", "una muestra elegida al azar", "una lista de toda la población", "una muestra por cuotas"], "ok": 0, "exp": "Censo = medir a TODA la población. La lista es el marco muestral; las otras son tipos de muestras."}, {"q": "Lista de 500 personas, muestra sistemática de 25: ¿cada cuántas eliges?", "op": ["25", "20", "50", "10"], "ok": 1, "exp": "k = 500/25 = 20. Las otras no dan exactamente 25 personas al recorrer la lista."}, {"q": "¿Qué método NECESITA un marco muestral (sampling frame)?", "op": ["Muestreo por cuotas (quota)", "Muestreo de oportunidad (opportunity)", "Muestreo aleatorio simple (simple random)", "Ninguno"], "ok": 2, "exp": "Para dar a cada miembro la misma probabilidad, necesitas numerarlos a todos en una lista. Cuotas y oportunidad no requieren lista."}, {"q": "En una población de 400, el 30 % son hombres. En una muestra estratificada de 40, ¿cuántos hombres?", "op": ["28", "30", "120", "12"], "ok": 3, "exp": "30 % de 40 = 12. 28 serían las mujeres; 120 es el 30 % de 400."}, {"q": "Una desventaja del muestreo por cuotas es que…", "op": ["es muy caro", "no es aleatorio, así que puede haber sesgo", "necesita un marco muestral", "siempre da resultados exactos"], "ok": 1, "exp": "El entrevistador decide a quién preguntar, lo que puede sesgar. De hecho es barato y no necesita marco muestral."}], "feynman": "Explica a un amigo por qué preguntar solo a tus amigas de Instagram si les gusta un vestido no representa a todas las clientas, y qué método usarías en su lugar.", "conexion": ["En biología, ¿cómo usarías muestreo estratificado para estimar las especies de plantas en un parque con zona de sombra y zona soleada?", "VOGA quiere saber la opinión de sus clientas: ¿qué ventajas y desventajas tendría una encuesta por cuotas frente a una aleatoria simple?"], "examen": {"q": "A factory employs 120 workers on the day shift and 80 workers on the night shift. The manager wants to take a stratified sample of 25 workers.\n(a) Find the number of workers that should be sampled from each shift.\n(b) Describe how the sample of day-shift workers could be selected.\n(c) Give one advantage of stratified sampling over opportunity sampling.", "marks": 4, "ms": "(a) B1: day 15, night 10 (120/200 × 25 and 80/200 × 25).\n(b) M1: number the day-shift workers 1–120. A1: use random number generator/table to select 15 different numbers (ignore repeats).\n(c) B1: e.g. sample is representative of the proportion in each shift / random so reduces bias."}}, {"id": "MAT10", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Estadística", "tema": "Probabilidad", "temaEN": "Probability", "explicacion": "La probabilidad (probability) mide qué tan posible es que pase algo, de 0 (imposible) a 1 (seguro). El espacio muestral (sample space) es la lista de todos los resultados posibles. La probabilidad de que NO ocurra A es P(A') = 1 − P(A).\n\nDos eventos son mutuamente excluyentes (mutually exclusive) si no pueden pasar a la vez: entonces P(A ∪ B) = P(A) + P(B). Son independientes (independent) si uno no afecta al otro: entonces P(A ∩ B) = P(A) × P(B). En general, P(A ∪ B) = P(A) + P(B) − P(A ∩ B) (restas lo que contaste dos veces).\n\nPara organizar la información usas diagramas de Venn (Venn diagrams), muy útiles con dos o tres eventos, y diagramas de árbol (tree diagrams), ideales para sucesos en etapas: multiplicas a lo largo de las ramas y sumas entre caminos. Ojo con 'sin reemplazo' (without replacement): las probabilidades de la segunda rama cambian.", "analogia": "Un diagrama de árbol es como planear tu outfit: primero eliges vestido (rama 1) y luego zapatos (rama 2). Para una combinación concreta multiplicas, y si te sirven varias combinaciones, las sumas.", "ejemplo": "Una bolsa tiene 3 canicas rojas y 2 azules. Sacas dos sin reemplazo. ¿P(ambas rojas)?\nPaso 1: P(1.ª roja) = 3/5.\nPaso 2: Quedan 2 rojas de 4: P(2.ª roja) = 2/4.\nPaso 3: Multiplica por la rama: 3/5 × 2/4 = 6/20 = 3/10.", "puntos": ["La probabilidad (probability) va de 0 a 1 y P(A') = 1 − P(A).", "Mutuamente excluyentes (mutually exclusive): P(A ∩ B) = 0 y P(A ∪ B) = P(A) + P(B).", "Independientes (independent): P(A ∩ B) = P(A) × P(B).", "Regla general de la suma (addition rule): P(A ∪ B) = P(A) + P(B) − P(A ∩ B).", "Diagramas de árbol (tree diagrams): multiplica en las ramas, suma entre caminos.", "Sin reemplazo (without replacement), las probabilidades de la segunda etapa cambian."], "formulas": ["P(A') = 1 − P(A)", "P(A ∪ B) = P(A) + P(B) − P(A ∩ B)", "Mutuamente excluyentes: P(A ∪ B) = P(A) + P(B)", "Independientes: P(A ∩ B) = P(A) × P(B)", "Suma de probabilidades de todos los resultados = 1"], "glosario": [{"en": "mutually exclusive", "es": "mutuamente excluyentes"}, {"en": "independent", "es": "independientes"}, {"en": "sample space", "es": "espacio muestral"}, {"en": "tree diagram", "es": "diagrama de árbol"}, {"en": "complement", "es": "complemento"}], "flashcards": [{"q": "P(A) = 0.3, ¿P(A')?", "a": "0.7."}, {"q": "¿Qué significa A ∩ B?", "a": "Que ocurren A y B a la vez (intersección)."}, {"q": "¿Qué significa A ∪ B?", "a": "Que ocurre A, B o ambos (unión)."}, {"q": "Prueba de independencia", "a": "Comprobar si P(A ∩ B) = P(A) × P(B)."}, {"q": "En un árbol, ¿multiplicas o sumas a lo largo de una rama?", "a": "Multiplicas."}, {"q": "Si A y B son mutuamente excluyentes, P(A ∩ B) = ?", "a": "0."}], "preguntas": [{"q": "Lanzas un dado justo. P(par o mayor que 4) = ?", "op": ["5/6", "2/3", "1/2", "1/3"], "ok": 1, "exp": "Par = {2, 4, 6}, >4 = {5, 6}; la unión es {2, 4, 5, 6}: 4/6 = 2/3. 5/6 cuenta el 6 dos veces."}, {"q": "A y B son mutuamente excluyentes, P(A) = 0.2 y P(B) = 0.5. P(A ∪ B) = ?", "op": ["0.1", "0.6", "0.7", "0.3"], "ok": 2, "exp": "Se suman: 0.7. 0.1 sería P(A) × P(B), que solo aplica a independientes."}, {"q": "A y B son independientes, P(A) = 0.5 y P(B) = 0.4. P(A ∩ B) = ?", "op": ["0.2", "0.9", "0.1", "0.45"], "ok": 0, "exp": "0.5 × 0.4 = 0.2. 0.9 es la suma, que no es la intersección."}, {"q": "Si P(A) = 0.35, entonces P(A') = ?", "op": ["0.35", "0.53", "0.30", "0.65"], "ok": 3, "exp": "1 − 0.35 = 0.65."}, {"q": "Lanzas dos monedas. P(al menos un águila) = ?", "op": ["1/2", "1/4", "3/4", "1"], "ok": 2, "exp": "1 − P(ningún águila) = 1 − 1/4 = 3/4. 1/4 es justo P(ninguna)."}], "feynman": "Explica la diferencia entre 'mutuamente excluyentes' e 'independientes' con un ejemplo de tu día: ¿pueden dos eventos ser ambas cosas a la vez (con probabilidades distintas de cero)?", "conexion": ["En biología (genética), ¿cómo usarías un diagrama de árbol para la probabilidad de que dos padres portadores tengan un hijo con cierta característica?", "En una tienda, si el 40 % de clientas renta y el 30 % compra accesorios, ¿qué necesitarías saber para calcular cuántas hacen ambas cosas?"], "examen": {"q": "The events A and B are such that P(A) = 0.4, P(B) = 0.3 and P(A ∪ B) = 0.58.\n(a) Find P(A ∩ B).\n(b) Show that A and B are independent.\n(c) Find P(A' ∩ B').", "marks": 4, "ms": "(a) M1: 0.4 + 0.3 − 0.58. A1: 0.12.\n(b) B1: P(A) × P(B) = 0.4 × 0.3 = 0.12 = P(A ∩ B), so independent (conclusion needed).\n(c) B1: 1 − 0.58 = 0.42."}}, {"id": "MAT11", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Estadística", "tema": "Distribuciones estadísticas", "temaEN": "Statistical distributions (with Data presentation and interpretation)", "explicacion": "Una variable aleatoria discreta (discrete random variable) toma valores contables, como el número de éxitos. Su distribución de probabilidad (probability distribution) lista cada valor con su probabilidad, y todas suman 1. La más importante del Year 1 es la distribución binomial (binomial distribution), X ~ B(n, p): n ensayos fijos, dos resultados (éxito/fracaso), probabilidad p constante y ensayos independientes.\n\nPara probabilidades exactas usas P(X = r) = ⁿCᵣ pʳ(1 − p)ⁿ⁻ʳ, y para acumuladas (cumulative), como P(X ≤ r), usas la calculadora o tablas. Truco clave: P(X ≥ r) = 1 − P(X ≤ r − 1). Lee el enunciado con cuidado: 'más de 3' es X ≥ 4 y 'a lo sumo 3' es X ≤ 3.\n\nEn presentación e interpretación de datos (data presentation and interpretation) calculas media (mean), mediana (median), cuartiles (quartiles), rango intercuartílico (IQR) y desviación estándar (standard deviation). Usas histogramas (histograms), donde el ÁREA representa la frecuencia (eje y = densidad de frecuencia, frequency density), diagramas de caja (box plots) y diagramas de dispersión (scatter diagrams) para ver correlación. Un valor atípico (outlier) suele definirse como algo fuera de Q1 − 1.5 × IQR o Q3 + 1.5 × IQR (el examen te dirá el criterio).", "analogia": "La binomial es como lanzar tiros libres en básquet: tiras n veces, cada tiro entra o no, y tu probabilidad de encestar es la misma cada vez. La fórmula te dice qué tan probable es encestar exactamente r.", "ejemplo": "X ~ B(10, 0.3). Calcula P(X = 2).\nPaso 1: ¹⁰C₂ = 45.\nPaso 2: 0.3² = 0.09 y 0.7⁸ ≈ 0.057648.\nPaso 3: P(X = 2) = 45 × 0.09 × 0.057648 ≈ 0.2335 (4 d.p.).", "puntos": ["Condiciones binomiales (binomial conditions): n fijo, dos resultados, p constante, ensayos independientes.", "P(X = r) = ⁿCᵣ pʳ(1 − p)ⁿ⁻ʳ; para P(X ≤ r) usa la función acumulada (cumulative) de la calculadora.", "P(X ≥ r) = 1 − P(X ≤ r − 1).", "En un histograma (histogram), densidad de frecuencia (frequency density) = frecuencia ÷ ancho de clase; el área es la frecuencia.", "Valores atípicos (outliers): normalmente fuera de Q1 − 1.5 × IQR y Q3 + 1.5 × IQR.", "Correlación (correlation) no implica causalidad (causation)."], "formulas": ["P(X = r) = ⁿCᵣ pʳ(1 − p)ⁿ⁻ʳ", "Σ P(X = x) = 1", "P(X ≥ r) = 1 − P(X ≤ r − 1)", "x̄ = Σx / n ; con frecuencias x̄ = Σfx / Σf", "σ² = Σx²/n − x̄² ; σ = √σ²", "Densidad de frecuencia = frecuencia ÷ ancho de clase", "IQR = Q3 − Q1 ; atípico si < Q1 − 1.5 × IQR o > Q3 + 1.5 × IQR"], "glosario": [{"en": "binomial distribution", "es": "distribución binomial"}, {"en": "cumulative probability", "es": "probabilidad acumulada"}, {"en": "frequency density", "es": "densidad de frecuencia"}, {"en": "outlier", "es": "valor atípico"}, {"en": "standard deviation", "es": "desviación estándar"}], "flashcards": [{"q": "Notación de una binomial con 20 ensayos y p = 0.1", "a": "X ~ B(20, 0.1)."}, {"q": "'Al menos 3' en símbolos", "a": "X ≥ 3."}, {"q": "¿Cómo calculas P(X > 5) con la acumulada?", "a": "1 − P(X ≤ 5)."}, {"q": "¿Qué representa el área de una barra en un histograma?", "a": "La frecuencia."}, {"q": "Fórmula de la varianza (variance)", "a": "σ² = Σx²/n − x̄²."}, {"q": "¿Qué muestra un diagrama de caja (box plot)?", "a": "Mínimo, Q1, mediana, Q3, máximo (y atípicos)."}], "preguntas": [{"q": "¿Cuál NO es condición para un modelo binomial?", "op": ["Número fijo de ensayos (fixed number of trials)", "Dos resultados posibles", "La probabilidad de éxito cambia en cada ensayo", "Ensayos independientes"], "ok": 2, "exp": "En la binomial p debe ser CONSTANTE. Las otras tres sí son condiciones."}, {"q": "X ~ B(5, 0.5). P(X = 5) = ?", "op": ["0.5", "0.03125", "0.15625", "0.3125"], "ok": 1, "exp": "0.5⁵ = 1/32 = 0.03125. 0.15625 = P(X = 1); 0.3125 = P(X = 2)."}, {"q": "Una clase de ancho 10 tiene frecuencia 30. Su densidad de frecuencia es:", "op": ["300", "0.33", "3", "40"], "ok": 2, "exp": "30 ÷ 10 = 3. 300 multiplica; 0.33 divide al revés."}, {"q": "Q1 = 20 y Q3 = 30. Usando Q3 + 1.5 × IQR, el límite superior para atípicos es:", "op": ["40", "35", "50", "45"], "ok": 3, "exp": "IQR = 10; 30 + 15 = 45. 35 suma solo 0.5 × IQR; 40 suma solo un IQR."}, {"q": "Si P(X ≤ 3) = 0.65, entonces P(X ≥ 4) = ?", "op": ["0.35", "0.65", "0.30", "1.65"], "ok": 0, "exp": "X ≥ 4 es el complemento de X ≤ 3: 1 − 0.65 = 0.35. 1.65 no puede ser una probabilidad."}], "feynman": "Explica por qué en un histograma con clases de distinto ancho no puedes poner la frecuencia en el eje y. Usa el ejemplo de una barra que agrupa a los de 20 a 40 años contra otra de 40 a 45.", "conexion": ["En control de calidad, si el 2 % de los vestidos llega con defecto, ¿cómo usarías B(50, 0.02) para decidir si un lote es normal?", "En biología, ¿por qué la proporción de semillas que germinan puede modelarse con una binomial y qué condición podría fallar?"], "examen": {"q": "The random variable X ~ B(12, 0.25).\n(a) Find P(X = 3).\n(b) Find P(X ≤ 2).\nGive your answers to 4 decimal places.", "marks": 4, "ms": "(a) M1: ¹²C₃ (0.25)³ (0.75)⁹. A1: 0.2581.\n(b) M1: P(X = 0) + P(X = 1) + P(X = 2) or use of cumulative function/tables. A1: 0.3907."}}, {"id": "MAT12", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Mecánica", "tema": "Cinemática", "temaEN": "Kinematics", "explicacion": "La cinemática (kinematics) describe el movimiento sin preguntar qué lo causa. Distingue entre cantidades vectoriales y escalares: desplazamiento (displacement) es vector y distancia (distance) es escalar; velocidad (velocity) es vector y rapidez (speed) es escalar. La aceleración (acceleration) es el ritmo de cambio de la velocidad. Unidades SI: m, m s⁻¹, m s⁻².\n\nCon aceleración constante usas las ecuaciones suvat (s desplazamiento, u velocidad inicial, v velocidad final, a aceleración, t tiempo). Truco: anota los tres datos que tienes y el que buscas, y elige la ecuación que no tenga la variable que te sobra. Para caída libre (free fall) usa a = g = 9.8 m s⁻² hacia abajo; elige una dirección positiva y respétala.\n\nEn una gráfica velocidad-tiempo (velocity-time graph), la pendiente es la aceleración y el área bajo la curva es el desplazamiento. Si la aceleración NO es constante, usas cálculo: v = ds/dt, a = dv/dt, y al revés s = ∫v dt, v = ∫a dt. ¡No uses suvat si la aceleración varía!", "analogia": "Las suvat son como una receta con cinco ingredientes: si conoces tres, siempre puedes descubrir los otros dos. Solo tienes que elegir la receta (ecuación) que use los ingredientes que tienes.", "ejemplo": "Un coche va a 4 m/s y acelera a 2 m/s² durante 5 s.\nDatos: u = 4, a = 2, t = 5.\nPaso 1: v = u + at = 4 + 2 × 5 = 14 m/s.\nPaso 2: s = ut + ½at² = 4 × 5 + ½ × 2 × 25 = 20 + 25 = 45 m.\nComprobación: s = ½(u + v)t = ½ × 18 × 5 = 45 m ✓.", "puntos": ["Desplazamiento (displacement) y velocidad (velocity) son vectores; distancia y rapidez (speed) son escalares.", "Las ecuaciones suvat (suvat equations) solo valen con aceleración constante (constant acceleration).", "En caída libre (free fall), a = g = 9.8 m s⁻² hacia abajo.", "En una gráfica v-t, la pendiente (gradient) es la aceleración y el área es el desplazamiento.", "Con aceleración variable (variable acceleration): v = ds/dt, a = dv/dt.", "Elige siempre una dirección positiva y usa signos coherentes."], "formulas": ["v = u + at", "s = ut + ½at²", "s = vt − ½at²", "s = ½(u + v)t", "v² = u² + 2as", "v = ds/dt ; a = dv/dt = d²s/dt²", "s = ∫v dt ; v = ∫a dt", "g = 9.8 m s⁻²"], "glosario": [{"en": "displacement", "es": "desplazamiento"}, {"en": "velocity", "es": "velocidad"}, {"en": "acceleration", "es": "aceleración"}, {"en": "deceleration", "es": "desaceleración"}, {"en": "at rest", "es": "en reposo"}], "flashcards": [{"q": "¿Qué representa el área bajo una gráfica v-t?", "a": "El desplazamiento."}, {"q": "¿Qué representa la pendiente de una gráfica v-t?", "a": "La aceleración."}, {"q": "Valor de g en Edexcel", "a": "9.8 m s⁻²."}, {"q": "Ecuación suvat sin t", "a": "v² = u² + 2as."}, {"q": "'Released from rest' significa…", "a": "u = 0."}, {"q": "Si s = 2t³, ¿v?", "a": "v = 6t²."}], "preguntas": [{"q": "La pendiente de una gráfica velocidad-tiempo representa…", "op": ["la aceleración", "el desplazamiento", "la rapidez media", "la distancia"], "ok": 0, "exp": "Pendiente = cambio de velocidad / tiempo = aceleración. El área es el desplazamiento."}, {"q": "Parte del reposo con a = 3 m/s² durante 4 s. ¿v final?", "op": ["7 m/s", "12 m/s", "24 m/s", "48 m/s"], "ok": 1, "exp": "v = 0 + 3 × 4 = 12 m/s. 7 suma 3 + 4; 24 es la distancia recorrida."}, {"q": "u = 10 m/s, v = 0, a = −2 m/s². ¿Distancia hasta detenerse?", "op": ["50 m", "5 m", "25 m", "20 m"], "ok": 2, "exp": "v² = u² + 2as ⇒ 0 = 100 − 4s ⇒ s = 25 m. 5 es el tiempo, no la distancia; 50 olvida el factor 2."}, {"q": "Se suelta una piedra (desde el reposo) y cae 2 s. ¿Cuánto cae? (g = 9.8)", "op": ["9.8 m", "39.2 m", "4.9 m", "19.6 m"], "ok": 3, "exp": "s = ½ × 9.8 × 2² = 19.6 m. 39.2 olvida el ½; 4.9 es lo que cae en 1 s."}, {"q": "Si s = t³ − 2t, ¿cuál es la velocidad en t = 2?", "op": ["4 m/s", "10 m/s", "12 m/s", "8 m/s"], "ok": 1, "exp": "v = ds/dt = 3t² − 2 = 12 − 2 = 10 m/s. 4 es el desplazamiento s(2); 12 olvida restar 2."}], "feynman": "Explica a alguien por qué el área bajo una gráfica velocidad-tiempo es la distancia, empezando con el caso más simple: ir a velocidad constante durante cierto tiempo.", "conexion": ["En seguridad vial, ¿cómo usarías v² = u² + 2as para explicar por qué la distancia de frenado se cuadruplica si duplicas la velocidad?", "En deportes, ¿cómo describirías con suvat el salto de una atleta desde que despega hasta que alcanza su altura máxima?"], "examen": {"q": "A ball is projected vertically upwards with speed 19.6 m s⁻¹ from a point on horizontal ground. The ball is modelled as a particle moving freely under gravity.\n(a) Find the greatest height above the ground reached by the ball.\n(b) Find the total time from when the ball is projected until it hits the ground.", "marks": 4, "ms": "(a) M1: uses v² = u² + 2as with v = 0, u = 19.6, a = −9.8: 0 = 19.6² − 19.6s. A1: s = 19.6 m.\n(b) M1: uses s = ut + ½at² with s = 0: 0 = 19.6t − 4.9t² (or doubles time to top, t = 2). A1: t = 4 s."}}, {"id": "MAT13", "materia": "Matemáticas", "mesa": "Edexcel", "rama": "Mecánica", "tema": "Fuerzas y Leyes de Newton", "temaEN": "Forces and Newton's laws", "explicacion": "Una fuerza (force) es un empujón o jalón y se mide en newtons (N). Las más comunes son el peso (weight) W = mg, que actúa hacia abajo; la reacción normal (normal reaction) R, perpendicular a la superficie; la tensión (tension) en cuerdas; el empuje (thrust) en varillas; y la resistencia (resistance). Siempre empieza con un diagrama de fuerzas (force diagram).\n\nLas leyes de Newton (Newton's laws): 1) si la fuerza resultante es cero, el objeto sigue en reposo o a velocidad constante (equilibrium); 2) F = ma, donde F es la fuerza resultante (resultant force) en la dirección del movimiento; 3) a toda acción le corresponde una reacción igual y opuesta. Las fuerzas también pueden darse como vectores, F = (3i + 2j) N, y entonces a = F/m es un vector.\n\nEn partículas conectadas (connected particles) con una cuerda ligera e inextensible (light inextensible string) sobre una polea lisa (smooth pulley), la tensión es la misma en toda la cuerda y ambas partículas tienen la misma aceleración. Escribe F = ma para cada partícula por separado (o para el sistema entero) y resuelve como ecuaciones simultáneas. Los supuestos de modelado (modelling assumptions) como 'partícula', 'ligera' o 'lisa' simplifican el problema.", "analogia": "Las fuerzas son como un juego de jalar la cuerda: si ambos equipos jalan igual, nadie se mueve (equilibrio). Si un equipo jala más, la diferencia (la fuerza resultante) es la que acelera a todos.", "ejemplo": "Una caja de 5 kg se jala con 20 N sobre el suelo y hay una resistencia de 5 N.\nPaso 1: Fuerza resultante: 20 − 5 = 15 N.\nPaso 2: F = ma ⇒ 15 = 5a.\nPaso 3: a = 3 m/s².", "puntos": ["Segunda ley de Newton (Newton's second law): F = ma, con F la fuerza resultante (resultant force).", "Peso (weight): W = mg, con g = 9.8 m s⁻².", "La reacción normal (normal reaction) es perpendicular a la superficie de contacto.", "Cuerda ligera e inextensible (light inextensible string): misma tensión y misma aceleración en ambos extremos.", "En equilibrio (equilibrium) la fuerza resultante es cero.", "Con fuerzas en forma i, j: suma componentes para la resultante y a = F/m."], "formulas": ["F = ma", "W = mg", "g = 9.8 m s⁻²", "Equilibrio: ΣF = 0", "Fuerzas vectoriales: F = ma con F y a vectores; |F| = √(Fx² + Fy²)", "Ascensor (lift) acelerando hacia arriba: R − mg = ma"], "glosario": [{"en": "resultant force", "es": "fuerza resultante"}, {"en": "normal reaction", "es": "reacción normal"}, {"en": "tension", "es": "tensión"}, {"en": "smooth pulley", "es": "polea lisa (sin fricción)"}, {"en": "equilibrium", "es": "equilibrio"}], "flashcards": [{"q": "Peso de una masa de 10 kg", "a": "98 N."}, {"q": "¿Qué dice la tercera ley de Newton?", "a": "Toda acción tiene una reacción igual y opuesta."}, {"q": "¿Qué implica 'light string'?", "a": "Masa despreciable: la tensión es igual en toda la cuerda."}, {"q": "¿Qué implica 'inextensible'?", "a": "No se estira: las partículas tienen la misma aceleración."}, {"q": "¿Qué implica 'smooth'?", "a": "No hay fricción."}, {"q": "Si un objeto se mueve a velocidad constante, ¿fuerza resultante?", "a": "Cero."}], "preguntas": [{"q": "Peso de una masa de 4 kg (g = 9.8):", "op": ["4 N", "9.8 N", "39.2 N", "0.41 N"], "ok": 2, "exp": "W = mg = 4 × 9.8 = 39.2 N. 4 es la masa (en kg, no N); 0.41 divide en vez de multiplicar."}, {"q": "Una fuerza resultante de 12 N actúa sobre 3 kg. ¿Aceleración?", "op": ["4 m/s²", "36 m/s²", "0.25 m/s²", "15 m/s²"], "ok": 0, "exp": "a = F/m = 12/3 = 4. 36 multiplica; 0.25 invierte la división."}, {"q": "Una persona de 60 kg está en un ascensor que acelera hacia arriba a 2 m/s². ¿Reacción del piso? (g = 9.8)", "op": ["588 N", "468 N", "120 N", "708 N"], "ok": 3, "exp": "R − 60g = 60 × 2 ⇒ R = 588 + 120 = 708 N. 588 es el peso (sería con a = 0); 468 sería acelerando hacia abajo."}, {"q": "Las fuerzas (3i + 2j) N y (i − 5j) N actúan sobre una partícula de 2 kg. ¿Magnitud de la aceleración?", "op": ["5 m/s²", "2.5 m/s²", "3.5 m/s²", "10 m/s²"], "ok": 1, "exp": "Resultante 4i − 3j, |F| = 5 N, a = 5/2 = 2.5 m/s². 5 olvida dividir entre la masa."}, {"q": "En un modelo, decir que la cuerda es 'ligera' (light) significa que…", "op": ["la cuerda no se estira", "su masa es despreciable, así que la tensión es igual en toda la cuerda", "la polea no tiene fricción", "la partícula no tiene tamaño"], "ok": 1, "exp": "'Light' = sin masa ⇒ tensión uniforme. 'No se estira' es 'inextensible'; 'sin fricción' es 'smooth'; 'sin tamaño' es 'particle'."}], "feynman": "Explica por qué cuando un ascensor arranca hacia arriba te sientes más pesada, usando la idea de fuerza resultante y F = ma.", "conexion": ["En física de deportes, ¿por qué un velocista empuja el suelo hacia atrás para avanzar? Relaciónalo con la tercera ley de Newton.", "Si arrastras un perchero con ruedas lleno de vestidos, ¿qué fuerzas actúan y cómo cambia la aceleración si duplicas la masa con la misma fuerza?"], "examen": {"q": "Two particles A and B, of mass 5 kg and 3 kg respectively, are attached to the ends of a light inextensible string. The string passes over a small smooth fixed pulley. The particles are released from rest with the string taut and the hanging parts of the string vertical.\n(a) Find the acceleration of the particles.\n(b) Find the tension in the string.\n(c) State how you used the fact that the string is inextensible.", "marks": 6, "ms": "(a) M1: equation of motion for A: 5g − T = 5a. M1: equation of motion for B: T − 3g = 3a (or whole system 2g = 8a). A1: a = 2.45 m s⁻².\n(b) M1: substitutes to find T. A1: T = 36.75 N (accept 36.8 N or 15g/4).\n(c) B1: the acceleration of A and B is the same (same magnitude)."}}, {"id": "BIO01", "materia": "Biología", "mesa": "AQA", "rama": "Biología", "tema": "Moléculas biológicas", "temaEN": "Biological molecules", "explicacion": "Claudia, casi todo lo que hay en tu cuerpo está hecho de unas pocas familias de moléculas: carbohidratos (carbohydrates), lípidos (lipids), proteínas (proteins) y ácidos nucleicos (nucleic acids). Muchas son polímeros (polymers): cadenas largas de unidades pequeñas llamadas monómeros (monomers). Los monómeros se unen por condensación (condensation reaction), que libera una molécula de agua, y se separan por hidrólisis (hydrolysis), que usa una molécula de agua.\n\nLos carbohidratos dan energía y estructura: la glucosa (glucose) es un monosacárido; dos monosacáridos forman un disacárido unido por un enlace glucosídico (glycosidic bond); el almidón (starch) y el glucógeno (glycogen) almacenan energía y la celulosa (cellulose) da soporte a las plantas. Los triglicéridos (triglycerides) se forman con un glicerol y tres ácidos grasos unidos por enlaces éster (ester bonds); los fosfolípidos (phospholipids) forman las membranas. Las proteínas son cadenas de aminoácidos (amino acids) unidos por enlaces peptídicos (peptide bonds) y su forma en 3D (primary, secondary, tertiary, quaternary structure) determina su función.\n\nLas enzimas (enzymes) son proteínas que aceleran reacciones al bajar la energía de activación (activation energy). Su sitio activo (active site) tiene una forma complementaria al sustrato (induced-fit model). El ADN (DNA) y el ARN (RNA) son polímeros de nucleótidos (nucleotides). El ATP es la 'moneda de energía' de la célula: al hidrolizarse a ADP + Pi libera energía. Y el agua (water) es polar, forma puentes de hidrógeno (hydrogen bonds), tiene alto calor específico (high specific heat capacity) y es un excelente disolvente (solvent).", "analogia": "Los polímeros son como collares de cuentas: cada cuenta es un monómero. Para unir una cuenta 'sale' una gota de agua (condensación) y para soltarla tienes que 'meter' una gota de agua (hidrólisis). Una enzima es como una llave que solo abre su cerradura: si la calientas demasiado, la llave se deforma (desnaturalización) y ya no abre.", "ejemplo": "Cuando masticas pan, la amilasa (amylase) de tu saliva empieza a hidrolizar el almidón en maltosa (maltose). Por eso, si dejas un trozo de pan en la boca un rato, empieza a saber dulce.", "puntos": ["Condensación une monómeros y libera agua; hidrólisis los separa usando agua (condensation / hydrolysis).", "α-glucosa forma almidón y glucógeno (energía); β-glucosa forma celulosa (estructura) (α-glucose / β-glucose).", "Un triglicérido = 1 glicerol + 3 ácidos grasos unidos por enlaces éster (ester bonds).", "La estructura terciaria de una proteína se mantiene por puentes de hidrógeno, enlaces iónicos y puentes disulfuro (disulfide bridges).", "Las enzimas bajan la energía de activación; temperatura, pH y concentración de sustrato afectan su velocidad (rate of reaction).", "El ATP se hidroliza a ADP +
