 Pi por la ATP hidrolasa (ATP hydrolase) y libera energía para la célula."], "formulas": ["monosacárido + monosacárido → disacárido + H₂O", "glucosa + glucosa → maltosa; glucosa + fructosa → sacarosa; glucosa + galactosa → lactosa", "ATP + H₂O → ADP + Pi (+ energía)", "Pruebas: Benedict (reductores → rojo ladrillo), yodo (almidón → azul-negro), Biuret (proteína → morado), emulsión (lípidos → blanco lechoso)"], "glosario": [{"en": "hydrolysis", "es": "hidrólisis"}, {"en": "glycosidic bond", "es": "enlace glucosídico"}, {"en": "active site", "es": "sitio activo"}, {"en": "denaturation", "es": "desnaturalización"}, {"en": "peptide bond", "es": "enlace peptídico"}], "flashcards": [{"q": "¿Qué enlace une dos monosacáridos?", "a": "Un enlace glucosídico (glycosidic bond), formado por condensación."}, {"q": "¿Qué prueba detecta azúcares no reductores?", "a": "Hervir con ácido (HCl), neutralizar y luego hacer Benedict: da rojo ladrillo."}, {"q": "¿Qué determina la estructura primaria de una proteína?", "a": "La secuencia de aminoácidos."}, {"q": "¿Qué es el modelo de ajuste inducido?", "a": "El sitio activo cambia ligeramente de forma al unirse el sustrato, formando el complejo enzima-sustrato."}, {"q": "Diferencia entre inhibidor competitivo y no competitivo", "a": "El competitivo ocupa el sitio activo; el no competitivo se une a otro sitio y cambia la forma del sitio activo."}, {"q": "¿Por qué el agua es buen disolvente?", "a": "Porque es polar y atrae iones y otras moléculas polares."}], "preguntas": [{"q": "¿Qué reacción une dos aminoácidos?", "op": ["Hidrólisis", "Condensación", "Oxidación", "Desnaturalización"], "ok": 1, "exp": "Se forma un enlace peptídico por condensación y se libera agua. La hidrólisis hace lo contrario; oxidación y desnaturalización no forman enlaces peptídicos."}, {"q": "¿Qué polisacárido está formado por β-glucosa?", "op": ["Almidón", "Glucógeno", "Amilopectina", "Celulosa"], "ok": 3, "exp": "La celulosa está formada por β-glucosa en cadenas rectas unidas por puentes de hidrógeno (microfibrils). Almidón (amilosa y amilopectina) y glucógeno son de α-glucosa."}, {"q": "Un inhibidor competitivo...", "op": ["tiene forma similar al sustrato y se une al sitio activo", "se une a otro sitio y cambia el sitio activo", "aumenta la energía de activación", "desnaturaliza la enzima"], "ok": 0, "exp": "Compite con el sustrato por el sitio activo; su efecto se reduce al aumentar la concentración de sustrato. La opción B describe al no competitivo; C y D son falsas."}, {"q": "¿Qué resultado da la prueba de Biuret positiva?", "op": ["Rojo ladrillo", "Azul-negro", "Morado (lila)", "Emulsión blanca"], "ok": 2, "exp": "El reactivo de Biuret pasa de azul a morado con enlaces peptídicos. Rojo ladrillo es Benedict, azul-negro es yodo y emulsión blanca es lípidos."}, {"q": "¿Cuántas moléculas de agua se liberan al formar un triglicérido?", "op": ["1", "3", "2", "4"], "ok": 1, "exp": "Se forman 3 enlaces éster (uno por cada ácido graso) y cada condensación libera una molécula de agua."}], "feynman": "Explícale a tu hermano pequeño por qué un huevo cocido nunca vuelve a ser crudo, usando las palabras 'forma', 'proteína' y 'calor'.", "conexion": ["En química estudias enlaces de hidrógeno: ¿cómo explican que el hielo flote y que eso proteja la vida en los lagos?", "¿Por qué las personas con intolerancia a la lactosa tienen problemas al tomar leche? Relaciónalo con enzimas e hidrólisis."], "examen": {"q": "Describe how the induced-fit model explains the action of an enzyme, and explain why a high temperature reduces the rate of an enzyme-controlled reaction.", "marks": 4, "ms": "1. Substrate binds to active site, which changes shape slightly / moulds around substrate. 2. Forms enzyme-substrate complex; puts strain on bonds / lowers activation energy. 3. High temperature breaks hydrogen (and ionic) bonds in tertiary structure. 4. Active site changes shape / enzyme denatured, so fewer enzyme-substrate complexes form."}}, {"id": "BIO02", "materia": "Biología", "mesa": "AQA", "rama": "Biología", "tema": "Estructura celular", "temaEN": "Cell structure", "explicacion": "Hay dos grandes tipos de células. Las eucariotas (eukaryotic cells), como las de animales, plantas, hongos y protistas, tienen núcleo (nucleus) y organelos rodeados de membrana (membrane-bound organelles): mitocondrias (mitochondria), retículo endoplásmico rugoso y liso (rough/smooth endoplasmic reticulum), aparato de Golgi (Golgi apparatus), lisosomas (lysosomes) y ribosomas 80S. Las plantas además tienen pared de celulosa (cell wall), cloroplastos (chloroplasts) y una vacuola permanente.\n\nLas procariotas (prokaryotic cells), como las bacterias, son más pequeñas y sencillas: no tienen núcleo, su ADN es circular y está libre en el citoplasma, tienen ribosomas 70S (más pequeños), pared de mureína (murein / peptidoglycan) y a veces plásmidos (plasmids), cápsula (capsule) y flagelo (flagellum). Los virus no son células: son partículas acelulares (acellular) con material genético, cápside (capsid) y proteínas de unión (attachment proteins).\n\nPara estudiar las células usamos microscopios. El óptico (light microscope) tiene baja resolución (≈0.2 µm); el electrónico de transmisión (TEM) da la mejor resolución en 2D, y el de barrido (SEM) da imágenes 3D. Recuerda: aumento (magnification) = tamaño de la imagen ÷ tamaño real. Para separar organelos se usa el fraccionamiento celular (cell fractionation): homogeneización en una solución fría, isotónica y con buffer, y luego ultracentrifugación (ultracentrifugation), donde primero sedimentan los núcleos (más pesados), luego las mitocondrias y después los ribosomas.", "analogia": "Una célula eucariota es como una fábrica: el núcleo es la oficina del jefe con los planos (ADN), los ribosomas son los obreros que arman productos (proteínas), el Golgi es el área de empaque y envío, y las mitocondrias son la planta de energía. Una bacteria es como un puesto ambulante: todo en un solo espacio, sin oficinas separadas.", "ejemplo": "Si en una foto de microscopio una mitocondria mide 20 mm (20 000 µm) y el aumento es ×10 000, su tamaño real es 20 000 µm ÷ 10 000 = 2 µm.", "puntos": ["Eucariotas: núcleo y organelos con membrana; procariotas: sin núcleo, ADN circular, ribosomas 70S (prokaryotes).", "Resolución (resolution) es la capacidad de distinguir dos puntos cercanos como separados; aumento (magnification) es cuántas veces se agranda.", "TEM: mayor resolución, muestra en 2D, muestras muertas y en vacío; SEM: imagen 3D de la superficie.", "Fraccionamiento: solución fría (frena enzimas), isotónica (evita que los organelos revienten o se arruguen) y con buffer (mantiene el pH).", "La ultracentrifugación separa organelos de más pesado a más ligero: núcleos → mitocondrias/cloroplastos → retículo/ribosomas.", "Las bacterias se dividen por fisión binaria (binary fission); los virus se replican solo dentro de células huésped."], "formulas": ["Aumento = tamaño de la imagen ÷ tamaño real (I = A × M → M = I/A)", "1 mm = 1000 µm; 1 µm = 1000 nm"], "glosario": [{"en": "resolution", "es": "resolución"}, {"en": "magnification", "es": "aumento"}, {"en": "organelle", "es": "organelo"}, {"en": "binary fission", "es": "fisión binaria"}, {"en": "ultracentrifugation", "es": "ultracentrifugación"}], "flashcards": [{"q": "¿Qué organelo produce ATP en la respiración aeróbica?", "a": "La mitocondria (mitochondrion)."}, {"q": "Función del aparato de Golgi", "a": "Modificar y empaquetar proteínas y lípidos en vesículas; forma lisosomas."}, {"q": "¿Por qué la solución del fraccionamiento es isotónica?", "a": "Para que no entre ni salga agua por ósmosis y los organelos no se dañen."}, {"q": "¿De qué está hecha la pared bacteriana?", "a": "De mureína (peptidoglycan)."}, {"q": "¿Qué ribosomas tienen las procariotas?", "a": "Ribosomas 70S (más pequeños que los 80S de eucariotas)."}, {"q": "¿Qué microscopio da imágenes 3D?", "a": "El microscopio electrónico de barrido (SEM)."}], "preguntas": [{"q": "¿Qué estructura NO se encuentra en una célula procariota?", "op": ["Ribosomas", "Membrana celular", "Núcleo", "Pared celular"], "ok": 2, "exp": "Las procariotas no tienen núcleo; su ADN está libre en el citoplasma. Sí tienen ribosomas (70S), membrana y pared de mureína."}, {"q": "Una imagen mide 15 mm y el aumento es ×500. ¿Tamaño real?", "op": ["30 µm", "7.5 µm", "300 µm", "3 µm"], "ok": 0, "exp": "15 mm = 15 000 µm; 15 000 ÷ 500 = 30 µm. Las demás salen de errores de conversión o de multiplicar en lugar de dividir."}, {"q": "¿Por qué la solución de homogeneización está fría?", "op": ["Para que los organelos floten", "Para reducir la actividad de enzimas que dañarían los organelos", "Para evitar la ósmosis", "Para mantener el pH"], "ok": 1, "exp": "El frío reduce la actividad de enzimas (proteasas, etc.) que digerirían los organelos. Evitar ósmosis es por ser isotónica y mantener el pH es por el buffer."}, {"q": "¿Qué microscopio tiene la mayor resolución?", "op": ["Óptico", "SEM", "Lupa", "TEM"], "ok": 3, "exp": "El TEM tiene la mayor resolución (≈0.1 nm) porque los electrones atraviesan una muestra muy delgada. El SEM tiene algo menos; el óptico mucho menos."}, {"q": "En la ultracentrifugación, ¿qué sedimenta primero?", "op": ["Ribosomas", "Núcleos", "Mitocondrias", "Lisosomas"], "ok": 1, "exp": "Los núcleos son los organelos más grandes y densos, así que forman el primer sedimento (pellet) a menor velocidad."}], "feynman": "Explica con tus palabras la diferencia entre 'ver algo más grande' (aumento) y 'ver algo más nítido' (resolución), usando el ejemplo de hacer zoom a una foto pixelada.", "conexion": ["Los antibióticos atacan estructuras como la pared de mureína o los ribosomas 70S: ¿por qué no dañan nuestras células?", "En física estudiarás la difracción: ¿por qué la longitud de onda corta de los electrones permite mejor resolución que la luz?"], "examen": {"q": "Describe how cell fractionation and ultracentrifugation can be used to obtain a sample of mitochondria from liver tissue.", "marks": 4, "ms": "1. Homogenise / blend the tissue. 2. In cold, isotonic, buffered solution (any two reasons: cold reduces enzyme activity; isotonic prevents osmotic damage; buffer prevents protein denaturation). 3. Filter to remove large debris / whole cells. 4. Centrifuge at low speed, nuclei form pellet; remove supernatant and spin at higher speed so mitochondria form the next pellet."}}, {"id": "BIO03", "materia": "Biología", "mesa": "AQA", "rama": "Biología", "tema": "Transporte a través de membranas", "temaEN": "Transport across membranes", "explicacion": "Las membranas celulares siguen el modelo de mosaico fluido (fluid-mosaic model): una bicapa de fosfolípidos (phospholipid bilayer) con proteínas que 'flotan' en ella, además de colesterol (cholesterol), glucoproteínas (glycoproteins) y glucolípidos (glycolipids). Las colas de los fosfolípidos son hidrofóbicas, así que las moléculas pequeñas y no polares (como O₂ y CO₂) pasan fácil, pero los iones y moléculas polares grandes necesitan proteínas.\n\nLa difusión simple (simple diffusion) es el movimiento neto de partículas de donde hay más a donde hay menos, sin gastar ATP. La difusión facilitada (facilitated diffusion) es igual, pero usa proteínas de canal (channel proteins) o transportadoras (carrier proteins). La ósmosis (osmosis) es la difusión de agua a través de una membrana parcialmente permeable, de un potencial hídrico (water potential, ψ) más alto (menos negativo) a uno más bajo (más negativo). El agua pura tiene ψ = 0 kPa.\n\nEl transporte activo (active transport) mueve sustancias en contra del gradiente de concentración usando proteínas transportadoras y ATP. El cotransporte (co-transport) aprovecha un gradiente: en el íleon, la bomba sodio-potasio saca Na⁺ de la célula epitelial hacia la sangre; luego el Na⁺ entra desde el lumen por difusión facilitada y 'arrastra' glucosa con él en la misma proteína. La glucosa después pasa a la sangre por difusión facilitada.", "analogia": "La difusión es como el olor de palomitas que se reparte solito por toda la casa. El transporte activo es como subir maletas por una escalera: necesitas energía (ATP) para ir 'cuesta arriba'. El cotransporte es como un amigo que baja corriendo una rampa y te lleva de la mano para que tú pases también.", "ejemplo": "Si pones una rebanada de papa en agua con mucha sal, la papa pierde agua por ósmosis (el agua va hacia el potencial hídrico más negativo, la solución salada) y queda blanda y más ligera.", "puntos": ["Modelo de mosaico fluido: bicapa de fosfolípidos con proteínas intrínsecas y extrínsecas (fluid-mosaic model).", "Difusión simple y facilitada son pasivas: no usan ATP y van a favor del gradiente (passive transport).", "Ósmosis: el agua va de ψ más alto (menos negativo) a ψ más bajo (más negativo) (water potential).", "Transporte activo: contra el gradiente, con proteínas transportadoras y ATP (active transport).", "Cotransporte de glucosa/Na⁺ en el íleon depende del gradiente de Na⁺ creado por la bomba Na⁺/K⁺ (co-transport).", "Más superficie, mayor gradiente y menor distancia aumentan la velocidad de difusión (rate of diffusion)."], "formulas": ["ψ del agua pura = 0 kPa; las soluciones tienen ψ negativo", "Velocidad de difusión ∝ (superficie × diferencia de concentración) ÷ grosor de la membrana (ley de Fick)", "Bomba Na⁺/K⁺: 3 Na⁺ salen y 2 K⁺ entran por cada ATP"], "glosario": [{"en": "water potential", "es": "potencial hídrico"}, {"en": "channel protein", "es": "proteína de canal"}, {"en": "carrier protein", "es": "proteína transportadora"}, {"en": "concentration gradient", "es": "gradiente de concentración"}, {"en": "partially permeable", "es": "parcialmente permeable"}], "flashcards": [{"q": "¿Qué es la ósmosis?", "a": "Movimiento neto de agua de mayor a menor potencial hídrico a través de una membrana parcialmente permeable."}, {"q": "¿Qué tiene el transporte activo que no tiene la difusión facilitada?", "a": "Usa ATP y va en contra del gradiente."}, {"q": "Función del colesterol en la membrana", "a": "Regula la fluidez y la hace más estable."}, {"q": "¿Qué le pasa a un glóbulo rojo en agua pura?", "a": "Entra agua por ósmosis y se revienta (lysis)."}, {"q": "¿Cómo sale la glucosa de la célula del íleon a la sangre?", "a": "Por difusión facilitada."}, {"q": "¿Qué crea el gradiente de Na⁺ en el cotransporte?", "a": "La bomba sodio-potasio, que saca Na⁺ activamente usando ATP."}], "preguntas": [{"q": "Una célula con ψ = −300 kPa está en una solución con ψ = −500 kPa. ¿Qué pasa?", "op": ["Entra agua a la célula", "No hay movimiento neto", "Sale agua de la célula", "Entra soluto por ósmosis"], "ok": 2, "exp": "El agua va de ψ más alto (−300) a más bajo (−500), así que sale de la célula. La ósmosis mueve agua, no solutos."}, {"q": "¿Cuál usa ATP?", "op": ["Transporte activo", "Ósmosis", "Difusión facilitada", "Difusión simple"], "ok": 0, "exp": "Solo el transporte activo usa ATP; los otros tres son pasivos y van a favor del gradiente."}, {"q": "¿Por qué los iones no atraviesan fácilmente la bicapa?", "op": ["Son demasiado grandes", "Están cargados y el centro de la bicapa es hidrofóbico", "Las membranas no tienen proteínas", "Siempre van contra el gradiente"], "ok": 1, "exp": "Las colas de ácidos grasos son hidrofóbicas y repelen partículas cargadas; por eso los iones necesitan canales o transportadoras."}, {"q": "Si se inhibe la respiración en las células del íleon, la absorción de glucosa...", "op": ["aumenta", "no cambia", "se vuelve ósmosis", "disminuye"], "ok": 3, "exp": "Sin ATP la bomba Na⁺/K⁺ se detiene, se pierde el gradiente de Na⁺ y el cotransporte de glucosa disminuye."}, {"q": "¿Qué factor DISMINUYE la velocidad de difusión?", "op": ["Mayor superficie", "Mayor temperatura", "Membrana más gruesa", "Mayor gradiente"], "ok": 2, "exp": "Una mayor distancia de difusión (membrana más gruesa) la hace más lenta; los demás factores la aumentan."}], "feynman": "Explica, como si fuera un TikTok de 30 segundos, por qué las fresas con azúcar 'sueltan jugo' después de un rato.", "conexion": ["¿Por qué los sueros en el hospital deben ser isotónicos con la sangre? Piensa en lo que pasaría con agua pura.", "En química aprendes sobre gradientes de concentración y equilibrio: ¿en qué se parece la difusión a una reacción que llega al equilibrio?"], "examen": {"q": "Explain how glucose is absorbed from the lumen of the ileum into the blood by co-transport.", "marks": 4, "ms": "1. Sodium ions actively transported out of epithelial cell into blood by Na⁺/K⁺ pump, using ATP. 2. Creates a lower Na⁺ concentration inside the cell / concentration gradient for Na⁺. 3. Na⁺ moves into cell from lumen by facilitated diffusion via a co-transporter protein, carrying glucose with it (against its gradient). 4. Glucose moves out of cell into blood by facilitated diffusion."}}, {"id": "BIO04", "materia": "Biología", "mesa": "AQA", "rama": "Biología", "tema": "Sistema inmunológico", "temaEN": "Cell recognition and the immune system", "explicacion": "Cada célula tiene en su superficie moléculas, casi siempre proteínas, llamadas antígenos (antigens), que funcionan como una 'credencial'. Tu sistema inmune reconoce lo propio (self) y lo ajeno (non-self): patógenos (pathogens), células de otra persona (trasplantes), células anormales (cáncer) y toxinas. La primera defensa no específica es la fagocitosis (phagocytosis): un fagocito (phagocyte) engulle al patógeno en un fagosoma (phagosome), los lisosomas se fusionan y sus enzimas (lisozimas, lysozymes) lo hidrolizan. Luego el fagocito presenta los antígenos en su superficie (antigen-presenting cell).\n\nLa respuesta específica usa linfocitos. Los linfocitos T colaboradores (helper T cells) tienen receptores que se unen al antígeno presentado; se activan, se dividen por mitosis y estimulan a fagocitos, a linfocitos T citotóxicos (cytotoxic T cells, que matan células infectadas con perforina) y a linfocitos B. Esto es la respuesta celular (cellular response). En la respuesta humoral (humoral response), el linfocito B con el anticuerpo complementario se activa (clonal selection), se divide (clonal expansion) y forma células plasmáticas (plasma cells), que secretan anticuerpos, y células de memoria (memory cells).\n\nUn anticuerpo (antibody) es una proteína con forma de Y: cuatro cadenas polipeptídicas, una región constante y una variable con dos sitios de unión al antígeno. Forma complejos antígeno-anticuerpo y aglutina (agglutination) patógenos. La primera infección da la respuesta primaria (lenta); la segunda, gracias a las células de memoria, da una respuesta secundaria rápida y fuerte. Las vacunas (vaccines) dan inmunidad activa artificial; la inmunidad colectiva (herd immunity) protege a quien no se vacuna. El VIH (HIV) infecta y destruye linfocitos T colaboradores, y sin ellos el cuerpo no puede montar respuesta: esto es el SIDA (AIDS).", "analogia": "Tu cuerpo es una escuela con seguridad. Los antígenos son credenciales; el fagocito es el guardia que detiene al intruso y enseña su credencial falsa al coordinador (linfocito T colaborador). El coordinador avisa a los linfocitos B, que imprimen miles de 'esposas' a la medida (anticuerpos), y guarda una foto del intruso (células de memoria) para reconocerlo al instante la próxima vez.", "ejemplo": "Si te vacunas contra la influenza, recibes antígenos del virus (inactivado o en partes). Tus linfocitos B forman células de memoria; si después te expones al virus real, produces anticuerpos tan rápido que muchas veces ni te enfermas.", "puntos": ["Los antígenos permiten distinguir lo propio de lo ajeno (self / non-self).", "Fagocitosis: engullir, fagosoma, fusión con lisosoma, hidrólisis y presentación de antígeno (antigen presentation).", "Respuesta celular: linfocitos T; respuesta humoral: linfocitos B, células plasmáticas y anticuerpos (humoral response).", "Anticuerpos: 4 cadenas polipeptídicas, región variable específica a un antígeno (variable region).", "Inmunidad activa (vacunas, infección) vs pasiva (anticuerpos recibidos, sin memoria) (active / passive immunity).", "La variabilidad antigénica (antigenic variability) explica por qué necesitamos una vacuna de la gripe nueva cada año."], "formulas": [], "glosario": [{"en": "antigen", "es": "antígeno"}, {"en": "antibody", "es": "anticuerpo"}, {"en": "plasma cell", "es": "célula plasmática"}, {"en": "memory cell", "es": "célula de memoria"}, {"en": "herd immunity", "es": "inmunidad colectiva"}], "flashcards": [{"q": "¿Qué es un antígeno?", "a": "Una molécula (normalmente proteína) que desencadena una respuesta inmune."}, {"q": "¿Qué hacen las células plasmáticas?", "a": "Secretan anticuerpos específicos."}, {"q": "¿Por qué la respuesta secundaria es más rápida?", "a": "Por las células de memoria que se dividen rápidamente en células plasmáticas."}, {"q": "¿Qué células infecta el VIH?", "a": "Linfocitos T colaboradores (helper T cells)."}, {"q": "Diferencia entre inmunidad activa y pasiva", "a": "Activa: tú produces anticuerpos y hay memoria; pasiva: recibes anticuerpos, es inmediata y temporal."}, {"q": "¿Qué es un anticuerpo monoclonal?", "a": "Anticuerpos idénticos producidos por un solo clon de células plasmáticas; se usan en pruebas (ELISA, embarazo) y tratamientos."}], "preguntas": [{"q": "¿Qué células producen anticuerpos?", "op": ["Linfocitos T citotóxicos", "Fagocitos", "Células plasmáticas", "Glóbulos rojos"], "ok": 2, "exp": "Las células plasmáticas, derivadas de linfocitos B, secretan anticuerpos. Los T citotóxicos matan células infectadas y los fagocitos engullen patógenos."}, {"q": "Recibir anticuerpos de la madre por la leche es...", "op": ["Inmunidad pasiva", "Inmunidad activa", "Vacunación", "Inmunidad colectiva"], "ok": 0, "exp": "Se reciben anticuerpos ya hechos: es pasiva, inmediata y sin células de memoria."}, {"q": "¿Por qué los antibióticos no funcionan contra el VIH?", "op": ["Porque el VIH es una bacteria resistente", "Porque el VIH tiene pared de mureína", "Porque destruyen linfocitos T", "Porque los virus no tienen las estructuras (pared, ribosomas 70S) que atacan los antibióticos"], "ok": 3, "exp": "Los virus usan la maquinaria de la célula huésped y no tienen pared ni ribosomas propios, así que los antibióticos no tienen blanco."}, {"q": "La región del anticuerpo que se une al antígeno es...", "op": ["la región constante", "la región variable", "el puente disulfuro", "la región bisagra"], "ok": 1, "exp": "La región variable tiene una forma complementaria a un antígeno concreto. La constante es igual en anticuerpos de la misma clase."}, {"q": "La selección clonal se refiere a...", "op": ["la activación del linfocito B con el receptor complementario al antígeno", "la división de fagocitos", "la mutación del antígeno", "la fusión de lisosomas"], "ok": 0, "exp": "Solo se 'selecciona' el linfocito con el receptor que encaja con el antígeno; luego se clona por mitosis (expansión clonal)."}], "feynman": "Explica a tu abuela, sin usar la palabra 'anticuerpo' más de una vez, por qué una vacuna te protege aunque te la hayan puesto hace años.", "conexion": ["¿Qué cuestiones éticas hay en hacer obligatorias las vacunas o en probar anticuerpos monoclonales en animales?", "En matemáticas, la inmunidad colectiva se modela con porcentajes: ¿por qué basta vacunar a una gran parte, y no a todos, para frenar una epidemia?"], "examen": {"q": "Describe the role of B lymphocytes in the humoral response and explain why a second infection by the same pathogen produces a faster response.", "marks": 4, "ms": "1. B cell with complementary receptor/antibody binds the antigen (clonal selection). 2. Activated/stimulated by helper T cells; divides by mitosis (clonal expansion). 3. Differentiates into plasma cells that secrete specific antibodies. 4. Memory cells also produced; on reinfection they divide rapidly into plasma cells, so more antibodies are produced faster (secondary response)."}}, {"id": "BIO05", "materia": "Biología", "mesa": "AQA", "rama": "Biología", "tema": "Intercambio de sustancias", "temaEN": "Organisms exchange substances with their environment", "explicacion": "Todo organismo necesita intercambiar sustancias (O₂, CO₂, nutrientes, calor) con su ambiente. Lo clave es la relación superficie/volumen (surface area to volume ratio): cuanto más grande es un organismo, menor es esa relación. Un organismo unicelular difunde todo por su superficie, pero uno grande necesita superficies de intercambio especializadas (specialised exchange surfaces) y un sistema de transporte masivo (mass transport), como la sangre.\n\nLas superficies de intercambio tienen gran área, paredes delgadas (distancia de difusión corta) y un gradiente de concentración mantenido. En los humanos, el aire entra por la tráquea (trachea), bronquios (bronchi) y bronquiolos (bronchioles) hasta los alvéolos (alveoli), donde el O₂ difunde a la sangre. En la inspiración (inspiration) los músculos intercostales externos y el diafragma se contraen, aumenta el volumen del tórax y baja la presión, así que entra aire. Los peces usan branquias (gills) con flujo a contracorriente (countercurrent flow); los insectos, tráqueas (tracheae) y espiráculos (spiracles); las plantas, estomas (stomata) y mesófilo esponjoso.\n\nEn la digestión (digestion), enzimas hidrolizan moléculas grandes en pequeñas: amilasa → maltosa, y maltasa (disaccharidase) → glucosa; lipasa → monoglicéridos y ácidos grasos (con ayuda de sales biliares, bile salts, que emulsionan); endopeptidasas, exopeptidasas y dipeptidasas → aminoácidos. La absorción ocurre en el íleon (ileum), cuyas vellosidades (villi) y microvellosidades (microvilli) aumentan la superficie. Los lípidos forman micelas (micelles), se reensamblan como triglicéridos y salen en quilomicrones (chylomicrons). Luego la hemoglobina (haemoglobin) transporta el O₂: su curva de disociación se desplaza a la derecha con más CO₂ (efecto Bohr, Bohr effect), liberando más O₂ en los tejidos activos.", "analogia": "La relación superficie/volumen es como enfriar sopa: si la dejas en una olla grande tarda mucho, pero si la repartes en platos hondos (más superficie por volumen) se enfría rápido. Por eso los organismos grandes 'reparten' su superficie en pliegues: alvéolos, vellosidades, branquias.", "ejemplo": "Un cubo de 1 cm de lado tiene superficie 6 cm² y volumen 1 cm³ (SA:V = 6:1). Un cubo de 2 cm tiene 24 cm² y 8 cm³ (SA:V = 3:1). Al duplicar el lado, la relación se reduce a la mitad.", "puntos": ["Organismos grandes tienen menor relación superficie/volumen y necesitan superficies especializadas y transporte masivo (SA:V ratio).", "Ley de Fick: más área, mayor gradiente y menor distancia = difusión más rápida (Fick's law).", "Inspiración: intercostales externos y diafragma se contraen → volumen ↑, presión ↓, entra aire (ventilation).", "El flujo a contracorriente en las branquias mantiene un gradiente de O₂ en toda la laminilla (countercurrent flow).", "Las enzimas digestivas hidrolizan carbohidratos, lípidos y proteínas; la absorción ocurre en el íleon (ileum).", "El efecto Bohr desplaza la curva de disociación de la hemoglobina a la derecha: libera más O₂ donde hay más CO₂ (Bohr effect)."], "formulas": ["Ventilación pulmonar = volumen corriente × frecuencia respiratoria (pulmonary ventilation = tidal volume × ventilation rate)", "SA:V de un cubo de lado L = 6L² ÷ L³ = 6/L", "Velocidad de difusión ∝ (área × diferencia de concentración) ÷ grosor"], "glosario": [{"en": "alveoli", "es": "alvéolos"}, {"en": "villi", "es": "vellosidades"}, {"en": "countercurrent flow", "es": "flujo a contracorriente"}, {"en": "bile salts", "es": "sales biliares"}, {"en": "oxyhaemoglobin dissociation curve", "es": "curva de disociación de la oxihemoglobina"}], "flashcards": [{"q": "¿Qué pasa con la relación superficie/volumen al crecer un organismo?", "a": "Disminuye."}, {"q": "¿Qué músculos se contraen en la espiración forzada?", "a": "Los intercostales internos (y músculos abdominales)."}, {"q": "¿Por qué el flujo a contracorriente es eficiente?", "a": "Mantiene un gradiente de concentración de O₂ a lo largo de toda la laminilla branquial."}, {"q": "¿Qué hacen las sales biliares?", "a": "Emulsionan lípidos en gotitas, aumentando la superficie para la lipasa."}, {"q": "¿Qué es un quilomicrón?", "a": "Una lipoproteína formada en las células epiteliales que transporta triglicéridos a la linfa (lacteal)."}, {"q": "¿Qué es el efecto Bohr?", "a": "Con más CO₂ la hemoglobina tiene menor afinidad por O₂; la curva se desplaza a la derecha."}], "preguntas": [{"q": "¿Cuál tiene la mayor relación superficie/volumen?", "op": ["Un elefante", "Un ratón", "Un caballo", "Una ballena"], "ok": 1, "exp": "Cuanto más pequeño el organismo, mayor su SA:V; el ratón es el más pequeño de las opciones."}, {"q": "Durante la inspiración, la presión en los pulmones...", "op": ["aumenta por encima de la atmosférica", "es igual a la atmosférica todo el tiempo", "baja por debajo de la atmosférica", "depende solo de los bronquios"], "ok": 2, "exp": "Al aumentar el volumen del tórax, la presión baja por debajo de la atmosférica y el aire entra a favor del gradiente de presión."}, {"q": "¿Qué enzima hidroliza la maltosa?", "op": ["Amilasa", "Lipasa", "Exopeptidasa", "Maltasa"], "ok": 3, "exp": "La maltasa (una disacaridasa unida a la membrana del íleon) hidroliza maltosa en dos glucosas. La amilasa produce maltosa a partir de almidón."}, {"q": "Un aumento de CO₂ en la sangre de un músculo activo hace que la hemoglobina...", "op": ["libere más O₂", "retenga más O₂", "deje de transportar O₂", "se desnaturalice"], "ok": 0, "exp": "El CO₂ baja el pH y reduce la afinidad de la hemoglobina por O₂ (efecto Bohr), liberando más O₂ donde se necesita."}, {"q": "En los insectos, el intercambio de gases ocurre principalmente por...", "op": ["la sangre (hemolinfa)", "las branquias", "las traqueolas (tracheoles)", "la piel"], "ok": 2, "exp": "El aire entra por los espiráculos y viaja por tráqueas y traqueolas directamente hasta los tejidos; la hemolinfa no transporta O₂ de forma importante."}], "feynman": "Explica por qué un globo de agua grande tarda más en calentarse al sol que varios globos pequeños con la misma agua, y conéctalo con por qué tenemos pulmones.", "conexion": ["En geometría calculas área y volumen: ¿por qué los elefantes tienen orejas enormes y los animales del Ártico son grandes y redondeados?", "¿Cómo afecta fumar (alquitrán, enfisema) a la superficie de intercambio y a la ley de Fick?"], "examen": {"q": "Explain how the structure of the alveoli and their blood supply enables efficient gas exchange.", "marks": 4, "ms": "1. Many alveoli give a large surface area. 2. Alveolar epithelium and capillary endothelium are one cell thick / flattened cells, giving a short diffusion pathway. 3. Ventilation replaces air / maintains a steep concentration gradient of O₂ and CO₂. 4. Good blood supply / blood flow removes oxygen (carries it away), maintaining the gradient."}}, {"id": "BIO06", "materia": "Biología", "mesa": "AQA", "rama": "Biología", "tema": "Información genética", "temaEN": "Genetic information", "explicacion": "El ADN (DNA) es una doble hélice de dos cadenas de nucleótidos antiparalelas, unidas por puentes de hidrógeno entre bases complementarias: A con T y C con G. Un gen (gene) es una secuencia de bases en el ADN que codifica la secuencia de aminoácidos de un polipéptido (o un ARN funcional). Cada tres bases forman un triplete (triplet / codon). El código genético es universal (universal), no se superpone (non-overlapping) y es degenerado (degenerate): varios tripletes pueden codificar el mismo aminoácido.\n\nEn eucariotas, el ADN del núcleo es lineal y está asociado a proteínas llamadas histonas (histones), formando cromosomas (chromosomes). Muchos genes tienen intrones (introns, que no codifican) y exones (exons, que sí codifican). En procariotas, el ADN es corto, circular y sin histonas; mitocondrias y cloroplastos tienen ADN parecido al bacteriano. El lugar fijo de un gen en un cromosoma se llama locus.\n\nLa síntesis de proteínas (protein synthesis) tiene dos fases. En la transcripción (transcription), en el núcleo, la ARN polimerasa (RNA polymerase) usa una cadena de ADN como molde para formar pre-ARNm; luego se cortan los intrones (splicing) y queda el ARNm (mRNA). En la traducción (translation), en el ribosoma, cada ARNt (tRNA) con su anticodón (anticodon) complementario trae un aminoácido; se forman enlaces peptídicos usando ATP. Una mutación génica (gene mutation), como sustitución (substitution) o deleción (deletion), cambia la secuencia de bases; una deleción produce un corrimiento del marco de lectura (frameshift).", "analogia": "El ADN es el libro de recetas original que nunca sale de la biblioteca (núcleo). El ARNm es una fotocopia de una sola receta que llevas a la cocina (ribosoma). Los ARNt son los ayudantes que traen cada ingrediente (aminoácido) en el orden que dice la receta, leyendo de tres en tres letras.", "ejemplo": "Si un fragmento de ADN molde dice TAC GGA, el ARNm será AUG CCU, y los anticodones de los ARNt serán UAC y GGA. AUG es el codón de inicio y codifica metionina.", "puntos": ["Bases complementarias: A–T y C–G en ADN; en ARN el uracilo (U) reemplaza a la timina (complementary base pairing).", "El código genético es universal, no superpuesto y degenerado (degenerate code).", "ADN eucariota: lineal, con histonas, intrones y exones; procariota: circular, sin histonas (histones).", "Transcripción en el núcleo: ARN polimerasa → pre-ARNm → splicing → ARNm (transcription).", "Traducción en ribosomas: codón del ARNm + anticodón del ARNt; enlaces peptídicos (translation).", "Una sustitución puede no cambiar el aminoácido (código degenerado); una deleción causa frameshift (gene mutation)."], "formulas": ["Número de bases = 3 × número de aminoácidos (sin contar el codón de paro)", "Reglas de Chargaff: %A = %T y %C = %G en ADN de doble cadena"], "glosario": [{"en": "codon", "es": "codón"}, {"en": "anticodon", "es": "anticodón"}, {"en": "splicing", "es": "corte y empalme"}, {"en": "genome", "es": "genoma"}, {"en": "proteome", "es": "proteoma"}], "flashcards": [{"q": "¿Qué es un gen?", "a": "Una secuencia de bases del ADN que codifica la secuencia de aminoácidos de un polipéptido o un ARN funcional."}, {"q": "¿Qué significa que el código es degenerado?", "a": "Que un aminoácido puede ser codificado por más de un triplete."}, {"q": "¿Qué enzima forma el pre-ARNm?", "a": "La ARN polimerasa."}, {"q": "¿Qué es el genoma y el proteoma?", "a": "Genoma: todo el ADN de una célula; proteoma: todas las proteínas que la célula puede producir."}, {"q": "¿Por qué una deleción suele ser más grave que una sustitución?", "a": "Porque cambia el marco de lectura y altera todos los codones siguientes."}, {"q": "¿Qué son los mutágenos?", "a": "Agentes que aumentan la tasa de mutación, como la radiación UV o ciertas sustancias químicas."}], "preguntas": [{"q": "Si el 30% de las bases de un ADN son adenina, ¿qué porcentaje es citosina?", "op": ["30%", "40%", "20%", "70%"], "ok": 2, "exp": "A = T = 30%, juntos 60%. Queda 40% para C + G, así que C = 20%."}, {"q": "¿Dónde ocurre la traducción?", "op": ["En los ribosomas", "En el núcleo", "En el aparato de Golgi", "En la mitocondria (solo)"], "ok": 0, "exp": "La traducción ocurre en los ribosomas del citoplasma o del RER. La transcripción ocurre en el núcleo."}, {"q": "¿Qué molécula lleva el anticodón?", "op": ["ARNm", "ADN", "ARN polimerasa", "ARNt"], "ok": 3, "exp": "El ARNt tiene el anticodón, complementario al codón del ARNm, y transporta un aminoácido específico."}, {"q": "Una sustitución que no cambia el aminoácido es posible porque el código es...", "op": ["universal", "degenerado", "no superpuesto", "complementario"], "ok": 1, "exp": "Al ser degenerado, varios codones codifican el mismo aminoácido, así que el nuevo codón puede dar el mismo aminoácido."}, {"q": "¿Qué se elimina durante el splicing?", "op": ["Exones", "Codones de inicio", "Intrones", "Histonas"], "ok": 2, "exp": "El splicing elimina los intrones (no codificantes) del pre-ARNm y une los exones."}], "feynman": "Explica con una receta de cocina por qué un error de una sola letra puede arruinar todo un pastel (deleción) o no cambiar nada (sustitución silenciosa).", "conexion": ["En química, ¿qué tipo de enlace une las dos cadenas del ADN y por qué es útil que sea débil para copiarlo?", "¿Qué dilemas éticos plantea conocer tu secuencia genética (pruebas de ADN comerciales, seguros médicos)?"], "examen": {"q": "Describe how a polypeptide is produced by translation of mRNA.", "marks": 4, "ms": "1. mRNA attaches to a ribosome. 2. tRNA anticodons bind to complementary mRNA codons. 3. Each tRNA carries a specific amino acid. 4. Amino acids joined by peptide bonds (condensation reaction) using ATP; ribosome moves along mRNA to the next codon until a stop codon."}}, {"id": "BIO07", "materia": "Biología", "mesa": "AQA", "rama": "Biología", "tema": "Variación celular", "temaEN": "Genetic diversity and adaptation", "explicacion": "La diversidad genética (genetic diversity) es el número de alelos (alleles) diferentes de los genes en una población. Surge por mutaciones (mutations) y por la meiosis (meiosis). Cuanta más diversidad, más probable es que algunos individuos sobrevivan a un cambio en el ambiente: es la base de la selección natural (natural selection). Las mutaciones cromosómicas incluyen la no disyunción (non-disjunction), que produce un cromosoma de más o de menos, como en el síndrome de Down.\n\nLa meiosis produce cuatro células haploides (haploid) genéticamente diferentes a partir de una diploide (diploid), mediante dos divisiones. Genera variación por dos mecanismos: el entrecruzamiento (crossing over), donde cromátidas de cromosomas homólogos intercambian fragmentos, y la segregación independiente (independent segregation), donde cada par homólogo se orienta al azar. Además, la fecundación aleatoria (random fertilisation) une gametos al azar. En cambio, la mitosis (mitosis) produce dos células idénticas para crecer y reparar.\n\nEn la selección natural, un alelo que da ventaja aumenta en frecuencia porque sus portadores sobreviven y se reproducen más. Puede ser direccional (directional selection, favorece un extremo, como la resistencia a antibióticos) o estabilizadora (stabilising selection, favorece el promedio, como el peso al nacer). Las adaptaciones pueden ser anatómicas, fisiológicas o de comportamiento. Y en organismos pluricelulares, las células se diferencian (cell differentiation) y especializan (specialisation) en tejidos, órganos y sistemas.", "analogia": "La meiosis es como barajar dos mazos de cartas (los de mamá y papá), intercambiar algunas cartas entre ellos (crossing over) y luego repartir al azar: casi imposible que salgan dos manos iguales. La mitosis, en cambio, es como fotocopiar una mano exacta.", "ejemplo": "Con 23 pares de cromosomas, la segregación independiente da 2²³ ≈ 8.4 millones de combinaciones posibles de cromosomas en los gametos, sin contar el entrecruzamiento.", "puntos": ["La diversidad genética es el número de alelos distintos en una población (genetic diversity).", "La meiosis forma 4 células haploides diferentes con dos divisiones (meiosis I y II).", "Variación por entrecruzamiento e independencia en la segregación (crossing over / independent segregation).", "No disyunción: los cromosomas no se separan bien y el gameto queda con uno de más o de menos (non-disjunction).", "Selección direccional favorece un extremo; estabilizadora favorece el valor medio (directional / stabilising selection).", "La resistencia bacteriana a antibióticos es un ejemplo clásico de selección natural (antibiotic resistance)."], "formulas": ["Combinaciones por segregación independiente = 2ⁿ (n = número de pares homólogos)", "Combinaciones en el cigoto (fecundación) = (2ⁿ)²", "Diploide humano 2n = 46; haploide n = 23"], "glosario": [{"en": "allele", "es": "alelo"}, {"en": "homologous chromosomes", "es": "cromosomas homólogos"}, {"en": "haploid", "es": "haploide"}, {"en": "genetic bottleneck", "es": "cuello de botella genético"}, {"en": "founder effect", "es": "efecto fundador"}], "flashcards": [{"q": "¿Cuántas células produce la meiosis y cómo son?", "a": "Cuatro células haploides, genéticamente diferentes."}, {"q": "¿Qué es el entrecruzamiento?", "a": "Intercambio de fragmentos entre cromátidas de cromosomas homólogos en la meiosis I."}, {"q": "¿Qué es un cuello de botella genético?", "a": "Una gran reducción de la población que disminuye la diversidad genética."}, {"q": "Ejemplo de selección estabilizadora", "a": "El peso de los bebés al nacer: los muy pequeños o muy grandes tienen menor supervivencia."}, {"q": "¿Qué causa la no disyunción?", "a": "Que los cromosomas homólogos o cromátidas no se separen en la meiosis."}, {"q": "¿Por qué la meiosis es importante en la reproducción sexual?", "a": "Reduce a la mitad el número de cromosomas, así la fecundación restaura el número diploide, y genera variación."}], "preguntas": [{"q": "¿Cuántas combinaciones de cromosomas da la segregación independiente si 2n = 8?", "op": ["8", "16", "4", "64"], "ok": 1, "exp": "2n = 8 significa n = 4 pares; 2⁴ = 16 combinaciones. 8 y 4 confunden el número de cromosomas o de pares con las combinaciones, y 64 no corresponde a ninguna fórmula (con la fecundación serían (2⁴)² = 256)."}, {"q": "¿En qué fase ocurre el entrecruzamiento?", "op": ["Meiosis I", "Meiosis II", "Mitosis", "Interfase"], "ok": 0, "exp": "Ocurre cuando los homólogos se emparejan (bivalentes) en la meiosis I; en la meiosis II se separan cromátidas, sin homólogos emparejados."}, {"q": "La aparición de bacterias resistentes a la penicilina es un ejemplo de...", "op": ["selección estabilizadora", "efecto fundador", "mutación inducida por el antibiótico", "selección direccional"], "ok": 3, "exp": "Las bacterias con la mutación resistente ya existían; el antibiótico las favorece y su alelo aumenta: selección direccional. El antibiótico no 'causa' la mutación."}, {"q": "¿Qué diferencia a la mitosis de la meiosis?", "op": ["La mitosis produce gametos", "La mitosis produce células genéticamente idénticas", "La meiosis tiene una sola división", "La meiosis produce células diploides"], "ok": 1, "exp": "La mitosis da dos células idénticas a la madre. La meiosis tiene dos divisiones y produce gametos haploides."}, {"q": "Una población pequeña que coloniza una isla tiene baja diversidad. Esto es...", "op": ["selección estabilizadora", "entrecruzamiento", "efecto fundador", "no disyunción"], "ok": 2, "exp": "El efecto fundador ocurre cuando pocos individuos fundan una nueva población y llevan solo parte de los alelos."}], "feynman": "Explica a una amiga por qué ella y su hermana no son idénticas aunque tengan los mismos papás, usando solo una baraja de cartas como ayuda.", "conexion": ["En matemáticas, ¿cómo usarías probabilidad (2ⁿ) para calcular cuántos tipos de gametos distintos puede formar una persona?", "¿Por qué el uso excesivo de antibióticos en hospitales y granjas es un problema de salud pública?"], "examen": {"q": "Explain how meiosis produces genetic variation in gametes.", "marks": 4, "ms": "1. Homologous chromosomes pair up / form bivalents. 2. Crossing over: chromatids exchange sections / alleles at chiasmata, producing new combinations of alleles. 3. Independent segregation: homologous pairs line up randomly, so any combination of maternal and paternal chromosomes can go into each daughter cell. 4. Produces haploid cells that are genetically different from each other."}}, {"id": "BIO08", "materia": "Biología", "mesa": "AQA", "rama": "Biología", "tema": "Relaciones entre organismos", "temaEN": "Species and taxonomy, biodiversity", "explicacion": "Una especie (species) es un grupo de organismos parecidos que pueden reproducirse entre sí y tener descendencia fértil (fertile offspring). Por eso una mula (cruce de caballo y burra) no forma una especie nueva: es estéril. Para que dos individuos se reproduzcan suelen necesitar cortejo (courtship behaviour), que permite reconocer a la propia especie, a una pareja fértil y sincronizar la reproducción.\n\nLa clasificación filogenética (phylogenetic classification) agrupa a los seres vivos según su historia evolutiva, en una jerarquía (hierarchy) de grupos sin superposición: dominio (domain), reino (kingdom), filo (phylum), clase (class), orden (order), familia (family), género (genus) y especie. Cada especie tiene un nombre binomial (binomial name), como Homo sapiens: género con mayúscula y especie con minúscula, en cursiva. Hoy la clasificación usa secuencias de ADN, de aminoácidos y respuestas inmunológicas para comparar qué tan emparentados están dos organismos.\n\nLa biodiversidad (biodiversity) puede medirse a distintos niveles: en un hábitat (habitat) o en toda la Tierra. La riqueza de especies (species richness) es el número de especies, pero el índice de diversidad (index of diversity) también considera cuántos individuos hay de cada una. La agricultura (farming) reduce la biodiversidad al eliminar setos, usar monocultivos (monocultures) y pesticidas, aunque hay prácticas de conservación que equilibran producción y diversidad.", "analogia": "La clasificación es como la dirección de tu casa: país, estado, ciudad, colonia, calle, número. Cada nivel es más específico, y dos casas en la misma calle (mismo género) son 'vecinas cercanas', igual que dos especies del mismo género están muy emparentadas.", "ejemplo": "Un jardín tiene 3 especies: 10 tréboles, 5 margaritas y 5 dientes de león (N = 20). d = N(N−1) ÷ Σn(n−1) = 20×19 ÷ (10×9 + 5×4 + 5×4) = 380 ÷ 130 ≈ 2.92.", "puntos": ["Especie: organismos que se reproducen entre sí y dan descendencia fértil (species).", "Jerarquía: Dominio, Reino, Filo, Clase, Orden, Familia, Género, Especie (taxonomic hierarchy).", "Nombre binomial: Género + especie, p. ej. Homo sapiens (binomial nomenclature).", "El cortejo permite reconocer especie, sexo y madurez sexual (courtship behaviour).", "El índice de diversidad considera número de especies y de individuos de cada una (index of diversity).", "Comparar secuencias de ADN, ARNm y aminoácidos revela parentesco evolutivo (genetic relationships)."], "formulas": ["Índice de diversidad: d = N(N − 1) ÷ Σ n(n − 1)", "N = número total de organismos de todas las especies; n = número de organismos de cada especie"], "glosario": [{"en": "species richness", "es": "riqueza de especies"}, {"en": "phylogeny", "es": "filogenia"}, {"en": "fertile offspring", "es": "descendencia fértil"}, {"en": "monoculture", "es": "monocultivo"}, {"en": "habitat", "es": "hábitat"}], "flashcards": [{"q": "¿Por qué la mula no es una especie?", "a": "Porque es estéril: no puede tener descendencia fértil."}, {"q": "Orden de la jerarquía taxonómica", "a": "Dominio, reino, filo, clase, orden, familia, género, especie."}, {"q": "¿Qué mide la riqueza de especies?", "a": "Solo el número de especies distintas en una comunidad."}, {"q": "¿Cómo se escribe un nombre binomial?", "a": "En cursiva; género con mayúscula y especie con minúscula (Panthera leo)."}, {"q": "¿Qué técnicas modernas ayudan a clasificar?", "a": "Comparar secuencias de bases del ADN, de aminoácidos y técnicas inmunológicas."}, {"q": "Dos formas en que la agricultura reduce la biodiversidad", "a": "Eliminar setos/bosques y usar monocultivos o pesticidas."}], "preguntas": [{"q": "¿Qué nivel es más específico que 'familia'?", "op": ["Orden", "Clase", "Filo", "Género"], "ok": 3, "exp": "El orden es: ... orden, familia, género, especie. Género está debajo de familia; orden, clase y filo están por encima."}, {"q": "Dos especies del mismo género...", "op": ["están en la misma familia", "pueden estar en distintas familias", "están en distintos órdenes", "pertenecen a distintos reinos"], "ok": 0, "exp": "La jerarquía no se superpone: si comparten género, comparten todos los niveles superiores, incluida la familia."}, {"q": "Una comunidad A: 50 y 50 individuos de 2 especies. B: 98 y 2. ¿Qué es cierto?", "op": ["B tiene mayor índice de diversidad", "Ambas tienen la misma riqueza, pero A tiene mayor índice de diversidad", "A tiene mayor riqueza de especies", "Tienen el mismo índice de diversidad"], "ok": 1, "exp": "Ambas tienen 2 especies (misma riqueza), pero A está más equilibrada y su índice es mayor (A ≈ 2.02; B ≈ 1.04)."}, {"q": "¿Qué evidencia indica un parentesco más cercano entre dos especies?", "op": ["Que vivan en el mismo hábitat", "Que coman lo mismo", "Mayor similitud en la secuencia de bases del ADN", "Que tengan el mismo tamaño"], "ok": 2, "exp": "Cuantas más bases iguales comparten, más reciente es su ancestro común. Hábitat, dieta o tamaño pueden coincidir por convergencia."}, {"q": "El cortejo es importante porque...", "op": ["aumenta la mutación", "permite reconocer a individuos de la misma especie para aparearse", "evita la meiosis", "garantiza descendencia estéril"], "ok": 1, "exp": "Las señales de cortejo son específicas de cada especie, así se asegura un apareamiento que dé descendencia fértil."}], "feynman": "Explica a un niño de 10 años por qué un perro chihuahua y un gran danés son la misma especie, pero un caballo y un burro no.", "conexion": ["En geografía estudias la deforestación: ¿cómo afecta a la biodiversidad y qué tiene que ver con lo que comemos?", "¿Cómo usarías una hoja de cálculo para calcular el índice de diversidad de un parque cerca de tu casa?"], "examen": {"q": "A field contains 4 species: 20 of species A, 10 of B, 6 of C and 4 of D. Use the formula d = N(N − 1) / Σn(n − 1) to calculate the index of diversity, and suggest why the index of diversity is more useful than species richness.", "marks": 4, "ms": "1. N = 40; N(N − 1) = 1560. 2. Σn(n − 1) = 380 + 90 + 30 + 12 = 512. 3. d = 1560 / 512 = 3.05 (accept 3.0–3.05). 4. Index of diversity takes into account the number of individuals of each species / evenness, not just the number of species."}}, {"id": "QUI01", "materia": "Química", "mesa": "AQA", "rama": "Química Física", "tema": "Estructura atómica", "temaEN": "Atomic structure", "explicacion": "Claudia, todo átomo tiene un núcleo diminuto con protones (protons, carga +1, masa relativa 1) y neutrones (neutrons, carga 0, masa 1), rodeado de electrones (electrons, carga −1, masa ≈ 1/1840). El número atómico (atomic number, Z) es el número de protones y define al elemento; el número másico (mass number, A) es protones + neutrones. Los isótopos (isotopes) tienen el mismo Z pero distinto número de neutrones, así que reaccionan igual químicamente.\n\nEl espectrómetro de masas de tiempo de vuelo (time of flight (TOF) mass spectrometer) mide la masa de las partículas: primero las ioniza (por electrospray o impacto de electrones), luego las acelera para que todas tengan la misma energía cinética, después vuelan por un tubo (las más ligeras llegan antes) y finalmente un detector registra cada ion. Con las abundancias calculamos la masa atómica relativa (relative atomic mass, Ar).\n\nLos electrones se acomodan en niveles (shells), subniveles (sub-shells: s, p, d) y orbitales (orbitals) que caben máximo 2 electrones con espín opuesto. La energía de ionización (ionisation energy) es la energía para quitar un mol de electrones a un mol de átomos gaseosos; depende de la carga nuclear, la distancia y el apantallamiento (shielding). Sus patrones son la prueba experimental de los niveles y subniveles.", "analogia": "Piensa en el átomo como un edificio de departamentos: los pisos son los niveles (shells), cada departamento es un subnivel (s, p, d) y cada cuarto es un orbital donde caben máximo dos personas (electrones) que se acomodan en sentido contrario. Los inquilinos llenan primero los pisos bajos, que son los más baratos en energía, y cuesta más sacar a alguien que vive cerca del portero (el núcleo).", "ejemplo": "El cloro tiene dos isótopos: ³⁵Cl (75%) y ³⁷Cl (25%). Ar = (35 × 75 + 37 × 25) / 100 = (2625 + 925) / 100 = 35.5. Por eso en la tabla periódica el cloro aparece con 35.5 y no con un número entero.", "puntos": ["Protones y neutrones están en el núcleo; los electrones en niveles de energía (shells) alrededor.", "Los isótopos (isotopes) tienen igual número de protones y distinto número de neutrones; misma química, distinta masa.", "El TOF mass spectrometer tiene 4 etapas: ionización (ionisation), aceleración (acceleration), vuelo (ion drift) y detección (detection).", "Configuración electrónica (electron configuration): se llena 1s 2s 2p 3s 3p 4s 3d; excepciones Cr (3d⁵4s¹) y Cu (3d¹⁰4s¹).", "Primera energía de ionización (first ionisation energy): X(g) → X⁺(g) + e⁻; aumenta a lo largo del periodo y disminuye al bajar en el grupo.", "Las caídas de Mg → Al (electrón en 3p, mayor energía) y P → S (repulsión por electrones apareados en 3p) prueban la existencia de subniveles (sub-shells)."], "formulas": ["Ar = Σ(masa del isótopo × abundancia) / Σ(abundancias)", "Ionización por impacto de electrones (electron impact): X(g) + e⁻ → X⁺(g) + 2e⁻", "Ionización por electrospray (electrospray ionisation): X(g) + H⁺ → XH⁺(g)", "Primera energía de ionización: X(g) → X⁺(g) + e⁻", "KE = ½mv²  y  t = d / v"], "glosario": [{"en": "isotope", "es": "isótopo"}, {"en": "relative atomic mass", "es": "masa atómica relativa"}, {"en": "sub-shell", "es": "subnivel"}, {"en": "shielding", "es": "apantallamiento"}, {"en": "ionisation energy", "es": "energía de ionización"}], "flashcards": [{"q": "¿Qué es un isótopo (isotope)?", "a": "Átomos del mismo elemento con igual número de protones y distinto número de neutrones."}, {"q": "¿Cuántos electrones caben en un orbital?", "a": "Máximo 2, con espín opuesto (opposite spins)."}, {"q": "Configuración electrónica del Fe (Z = 26)", "a": "1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s²"}, {"q": "¿Qué ion forma el electrospray ionisation?", "a": "XH⁺: la molécula gana un protón (H⁺)."}, {"q": "¿Por qué la energía de ionización baja de Mg a Al?", "a": "El electrón del Al está en el subnivel 3p, de mayor energía y algo más apantallado que el 3s."}, {"q": "¿Por qué las sucesivas energías de ionización siempre aumentan?", "a": "Cada electrón se quita de un ion cada vez más positivo, que atrae más fuerte a los electrones restantes."}], "preguntas": [{"q": "¿Cuántos neutrones tiene el ion ²⁷Al³⁺ (Z = 13)?", "op": ["10", "13", "14", "27"], "ok": 2, "exp": "Neutrones = número másico − protones = 27 − 13 = 14. La carga 3+ solo cambia los electrones, no los neutrones."}, {"q": "¿Qué elemento tiene la configuración [Ar] 3d⁵ 4s¹?", "op": ["Cromo (Cr)", "Manganeso (Mn)", "Vanadio (V)", "Hierro (Fe)"], "ok": 0, "exp": "El cromo es una excepción: un subnivel 3d semilleno (3d⁵) es más estable, así que un electrón del 4s pasa al 3d."}, {"q": "En un TOF mass spectrometer, ¿qué iones llegan primero al detector?", "op": ["Los de mayor masa", "Los de menor m/z", "Los de mayor carga negativa", "Todos llegan a la vez"], "ok": 1, "exp": "Todos tienen la misma energía cinética (KE = ½mv²), así que los más ligeros (menor m/z) viajan más rápido y llegan antes."}, {"q": "¿Por qué la primera energía de ionización del azufre es menor que la del fósforo?", "op": ["El azufre tiene menos protones", "El electrón del azufre está en un nivel más alejado", "El azufre tiene más apantallamiento por un nivel extra", "En el azufre se quita un electrón de un orbital 3p con dos electrones apareados que se repelen"], "ok": 3, "exp": "En S (3p⁴) dos electrones comparten orbital; la repulsión entre ellos hace más fácil quitar uno."}, {"q": "¿Qué tendencia sigue la primera energía de ionización al bajar en el Grupo 2?", "op": ["Aumenta, porque hay más protones", "Disminuye, porque el electrón externo está más lejos y más apantallado", "Se mantiene constante", "Aumenta, porque el radio disminuye"], "ok": 1, "exp": "Aunque hay más protones, el mayor radio atómico y el mayor apantallamiento (shielding) pesan más, así que la atracción sobre el electrón externo es menor."}], "feynman": "Explícale a un niño de 10 años por qué cuesta más 'arrancar' el segundo electrón de un átomo que el primero, usando solo la idea de imanes y distancias.", "conexion": ["¿Cómo explica la configuración electrónica (electron configuration) que el sodio y el potasio reaccionen de forma parecida con el agua?", "Si dos isótopos tienen la misma química, ¿cómo podría un espectrómetro de masas ayudar a detectar si un atleta tomó una sustancia prohibida?"], "examen": {"q": "Explain why the first ionisation energy generally increases across Period 3, and explain why the first ionisation energy of aluminium is lower than that of magnesium.", "marks": 4, "ms": "1: Nuclear charge / number of protons increases across the period. 2: Electrons are added to the same shell / similar shielding, so outer electron is more strongly attracted (atomic radius decreases). 3: Aluminium's outer electron is in a 3p sub-shell (Mg's is in 3s). 4: The 3p sub-shell is higher in energy (and slightly more shielded by 3s electrons), so less energy is needed to remove it."}}, {"id": "QUI02", "materia": "Química", "mesa": "AQA", "rama": "Química Física", "tema": "Moles", "temaEN": "Amount of substance", "explicacion": "El mol (mole) es la unidad para contar partículas en química: un mol contiene 6.022 × 10²³ partículas, la constante de Avogadro (Avogadro constant, L). Como los átomos son diminutos, contamos en 'paquetes' de moles. La masa de un mol de una sustancia es su masa molar (molar mass), que numéricamente vale su Mr en g mol⁻¹; por eso n = m / Mr.\n\nCon los moles deducimos fórmulas. La fórmula empírica (empirical formula) es la proporción entera más simple de átomos; la fórmula molecular (molecular formula) es el número real de átomos en una molécula. En disoluciones usamos concentración (concentration): c = n / V, con V en dm³. Para gases usamos la ecuación de los gases ideales (ideal gas equation) pV = nRT, con p en Pa, V en m³ y T en K.\n\nEn la industria importa cuánto producto obtenemos realmente. El rendimiento porcentual (percentage yield) compara lo obtenido con lo teórico, y la economía atómica (atom economy) mide qué fracción de la masa de los reactivos termina en el producto deseado: una economía atómica alta significa menos desperdicio y un proceso más sostenible.", "analogia": "Un mol es como una 'docena' gigante: igual que una docena siempre son 12 huevos, un mol siempre son 6.022 × 10²³ partículas. Y la fórmula empírica es como una receta reducida: si un pastel lleva 6 tazas de harina y 12 de leche, la proporción simple es 1 : 2.", "ejemplo": "¿Qué volumen ocupan 0.500 mol de gas a 298 K y 100 kPa? V = nRT / p = (0.500 × 8.31 × 298) / 100 000 = 0.0124 m³ = 12.4 dm³. Recuerda: kPa → Pa (×1000) y m³ → dm³ (×1000).", "puntos": ["Un mol (mole) contiene 6.022 × 10²³ partículas: la constante de Avogadro (Avogadro constant).", "Número de moles (amount of substance): n = m / Mr.", "La fórmula empírica (empirical formula) es la proporción entera más simple; la molecular (molecular formula) es el número real de átomos.", "Concentración (concentration): c = n / V, en mol dm⁻³; 1 dm³ = 1000 cm³.", "Ecuación de los gases ideales (ideal gas equation): pV = nRT con p en Pa, V en m³, T en K y R = 8.31 J K⁻¹ mol⁻¹.", "Rendimiento porcentual (percentage yield) y economía atómica (atom economy) miden la eficiencia de una reacción."], "formulas": ["n = m / Mr", "N = n × L   (L = 6.022 × 10²³ mol⁻¹)", "c = n / V   (V en dm³)", "pV = nRT   (R = 8.31 J K⁻¹ mol⁻¹)", "% yield = (masa real / masa teórica) × 100", "% atom economy = (Mr del producto deseado / Σ Mr de todos los reactivos) × 100"], "glosario": [{"en": "mole", "es": "mol"}, {"en": "empirical formula", "es": "fórmula empírica"}, {"en": "concentration", "es": "concentración"}, {"en": "percentage yield", "es": "rendimiento porcentual"}, {"en": "atom economy", "es": "economía atómica"}], "flashcards": [{"q": "¿Cuántas partículas hay en 1 mol?", "a": "6.022 × 10²³ (constante de Avogadro)."}, {"q": "Fórmula para moles a partir de masa", "a": "n = m / Mr"}, {"q": "¿Unidades de pV = nRT?", "a": "p en Pa, V en m³, T en K, R = 8.31 J K⁻¹ mol⁻¹."}, {"q": "¿Cómo pasas cm³ a dm³?", "a": "Divides entre 1000."}, {"q": "Diferencia entre fórmula empírica y molecular", "a": "La empírica es la proporción más simple (CH₂O); la molecular es la real (C₆H₁₂O₆)."}, {"q": "¿Por qué el rendimiento real casi nunca es 100%?", "a": "Reacciones incompletas o reversibles, reacciones secundarias y pérdidas al separar o purificar."}], "preguntas": [{"q": "¿Cuántos moles hay en 4.40 g de CO₂ (Mr = 44.0)?", "op": ["0.100 mol", "1.00 mol", "0.0100 mol", "10.0 mol"], "ok": 0, "exp": "n = m / Mr = 4.40 / 44.0 = 0.100 mol."}, {"q": "Se disuelven 0.0250 mol de NaOH en 250 cm³ de disolución. ¿Cuál es la concentración?", "op": ["0.00625 mol dm⁻³", "0.0250 mol dm⁻³", "6.25 mol dm⁻³", "0.100 mol dm⁻³"], "ok": 3, "exp": "V = 250 / 1000 = 0.250 dm³; c = 0.0250 / 0.250 = 0.100 mol dm⁻³."}, {"q": "Un compuesto tiene 40.0% C, 6.7% H y 53.3% O en masa. ¿Cuál es su fórmula empírica?", "op": ["C₂H₄O", "CH₂O", "CHO", "CH₄O"], "ok": 1, "exp": "C: 40.0/12.0 = 3.33; H: 6.7/1.0 = 6.7; O: 53.3/16.0 = 3.33. Dividiendo entre 3.33: 1 : 2 : 1 → CH₂O."}, {"q": "¿Cuál es la economía atómica para obtener CaO en CaCO₃ → CaO + CO₂? (Mr: CaCO₃ = 100.1, CaO = 56.1)", "op": ["44.0%", "100%", "56.0%", "78.4%"], "ok": 2, "exp": "Atom economy = 56.1 / 100.1 × 100 = 56.0%. El CO₂ es producto no deseado."}, {"q": "Al usar pV = nRT, ¿qué conversión es correcta?", "op": ["25 °C = 25 K", "150 cm³ = 1.50 × 10⁻⁴ m³", "100 kPa = 100 Pa", "1 dm³ = 1 m³"], "ok": 1, "exp": "1 m³ = 10⁶ cm³, así que 150 cm³ = 150 × 10⁻⁶ = 1.50 × 10⁻⁴ m³. Además 25 °C = 298 K y 100 kPa = 100 000 Pa."}], "feynman": "Explica qué es un mol a una amiga que nunca ha estudiado química, usando comparaciones con docenas, paquetes o cajas, sin decir 'Avogadro' hasta el final.", "conexion": ["¿Por qué una empresa farmacéutica preferiría una ruta de síntesis con alta economía atómica (atom economy) aunque su rendimiento (yield) sea un poco menor?", "¿Cómo usarías la ecuación pV = nRT para calcular la Mr de un líquido volátil a partir de la masa de su vapor?"], "examen": {"q": "A 0.150 g sample of a volatile liquid was vaporised. The vapour occupied a volume of 6.50 × 10⁻⁵ m³ at 373 K and 101 kPa. Calculate the relative molecular mass (Mr) of the liquid. Give your answer to 3 significant figures. (R = 8.31 J K⁻¹ mol⁻¹)", "marks": 4, "ms": "1: Convert pressure: 101 kPa = 101 000 Pa. 2: n = pV / RT = (101 000 × 6.50 × 10⁻⁵) / (8.31 × 373). 3: n = 2.12 × 10⁻³ mol. 4: Mr = 0.150 / 2.12 × 10⁻³ = 70.8 (allow 70.7–70.9)."}}, {"id": "QUI03", "materia": "Química", "mesa": "AQA", "rama": "Química Física", "tema": "Enlaces químicos", "temaEN": "Bonding", "explicacion": "Hay tres tipos principales de enlace. El enlace iónico (ionic bonding) es la atracción electrostática entre iones de carga opuesta en una red (lattice), como en el NaCl. El enlace covalente (covalent bond) es un par de electrones compartido entre dos átomos; si ambos electrones vienen del mismo átomo se llama enlace dativo o de coordinación (dative/co-ordinate bond). El enlace metálico (metallic bonding) es la atracción entre iones positivos y un 'mar' de electrones deslocalizados (delocalised electrons).\n\nLa forma de una molécula se predice con la teoría VSEPR (electron pair repulsion theory): los pares de electrones alrededor del átomo central se repelen y se colocan lo más lejos posible. Los pares solitarios (lone pairs) repelen más que los pares enlazantes, así que cada par solitario cierra el ángulo unos 2.5°: CH₄ 109.5°, NH₃ 107°, H₂O 104.5°.\n\nLa electronegatividad (electronegativity) es la capacidad de un átomo de atraer el par de electrones de un enlace covalente; si es distinta entre los átomos, el enlace es polar (polar bond). Entre moléculas hay fuerzas intermoleculares (intermolecular forces): dipolo inducido–dipolo (induced dipole–dipole o van der Waals), dipolo permanente–dipolo (permanent dipole–dipole) y el puente de hidrógeno (hydrogen bonding), el más fuerte, que ocurre cuando H está unido a N, O o F.", "analogia": "El enlace covalente es como dos amigas que comparten unos audífonos: ambas 'tienen' el par. El iónico es como un imán: uno regaló un electrón y ahora son + y − que se atraen. Y la electronegatividad es quién jala más fuerte los audífonos: si una jala más, el cable queda más de su lado (enlace polar).", "ejemplo": "¿Por qué el agua (H₂O, Mr 18) hierve a 100 °C y el H₂S (Mr 34) a −60 °C, si el H₂S es más pesado? Porque el oxígeno es muy electronegativo y forma puentes de hidrógeno (hydrogen bonds) entre moléculas de agua; el azufre no. Romper esos puentes requiere mucha más energía.", "puntos": ["Enlace iónico (ionic bonding): atracción electrostática entre iones de carga opuesta en una red gigante (giant ionic lattice).", "Enlace covalente (covalent bond): par de electrones compartido; dativo (dative) si ambos vienen del mismo átomo, como en NH₄⁺.", "Enlace metálico (metallic bonding): iones positivos en un mar de electrones deslocalizados (delocalised electrons); por eso los metales conducen.", "VSEPR: los pares se repelen; pares solitarios (lone pairs) repelen más y reducen ~2.5° el ángulo por cada par.", "Electronegatividad (electronegativity) en escala de Pauling: F es el más electronegativo; diferencias crean enlaces polares (polar bonds).", "Fuerzas intermoleculares (intermolecular forces), de menor a mayor: van der Waals < dipolo permanente < puente de hidrógeno (hydrogen bonding)."], "formulas": ["Lineal (linear): 2 pares, 180° (CO₂)", "Trigonal plana (trigonal planar): 3 pares, 120° (BF₃)", "Tetraédrica (tetrahedral): 4 pares, 109.5° (CH₄)", "Piramidal trigonal (trigonal pyramidal): 3 enlaces + 1 par solitario, 107° (NH₃)", "Angular (bent/non-linear): 2 enlaces + 2 pares solitarios, 104.5° (H₂O)", "Bipirámide trigonal (trigonal bipyramidal): 5 pares, 90° y 120° (PCl₅); octaédrica (octahedral): 6 pares, 90° (SF₆)"], "glosario": [{"en": "lone pair", "es": "par solitario"}, {"en": "electronegativity", "es": "electronegatividad"}, {"en": "delocalised electrons", "es": "electrones deslocalizados"}, {"en": "hydrogen bond", "es": "puente de hidrógeno"}, {"en": "dative covalent bond", "es": "enlace covalente dativo"}], "flashcards": [{"q": "Define electronegatividad (electronegativity)", "a": "La capacidad de un átomo para atraer el par de electrones de un enlace covalente."}, {"q": "Forma y ángulo de NH₃", "a": "Piramidal trigonal (trigonal pyramidal), 107°."}, {"q": "¿Cuándo hay puente de hidrógeno?", "a": "Cuando H está unido a N, O o F y hay un par solitario en N, O o F de otra molécula."}, {"q": "¿Por qué el CO₂ es no polar si sus enlaces C=O son polares?", "a": "Es lineal y simétrico: los dipolos se cancelan."}, {"q": "¿Por qué el grafito conduce electricidad?", "a": "Cada C forma 3 enlaces y le queda un electrón deslocalizado que se mueve entre las capas."}, {"q": "¿Por qué los compuestos iónicos conducen fundidos pero no sólidos?", "a": "Fundidos o disueltos los iones pueden moverse; en el sólido están fijos en la red."}], "preguntas": [{"q": "¿Qué forma tiene la molécula de SF₆?", "op": ["Tetraédrica", "Bipirámide trigonal", "Octaédrica", "Plana cuadrada"], "ok": 2, "exp": "El S tiene 6 pares enlazantes y ningún par solitario: se colocan a 90° en forma octaédrica (octahedral)."}, {"q": "¿Cuál es el ángulo de enlace en el agua?", "op": ["104.5°", "107°", "109.5°", "120°"], "ok": 0, "exp": "4 pares de electrones (2 enlazantes y 2 solitarios); los dos pares solitarios reducen el ángulo tetraédrico 109.5° hasta ~104.5°."}, {"q": "¿Qué molécula es polar?", "op": ["CO₂", "CCl₄", "BF₃", "CHCl₃"], "ok": 3, "exp": "En CHCl₃ los dipolos no se cancelan porque la molécula no es simétrica; las otras tres son simétricas y no polares."}, {"q": "¿Por qué el diamante tiene un punto de fusión muy alto?", "op": ["Tiene fuertes fuerzas de van der Waals", "Hay que romper muchos enlaces covalentes fuertes en su red gigante", "Tiene iones con carga alta", "Tiene electrones deslocalizados"], "ok": 1, "exp": "El diamante es macromolecular (giant covalent): fundirlo implica romper muchísimos enlaces covalentes C–C."}, {"q": "¿Qué explica que el punto de ebullición de los alcanos aumente con la longitud de la cadena?", "op": ["Más puentes de hidrógeno", "Mayor polaridad del enlace C–H", "Más electrones y más superficie de contacto, así que fuerzas de van der Waals más fuertes", "Enlaces covalentes más fuertes"], "ok": 2, "exp": "Moléculas más grandes tienen más electrones, lo que produce dipolos inducidos (induced dipoles) más fuertes entre moléculas."}], "feynman": "Explica con un dibujo mental de globos atados a un punto por qué el NH₃ no es plano sino una 'pirámide', y por qué su ángulo es menor que el del CH₄.", "conexion": ["¿Cómo explica el puente de hidrógeno (hydrogen bonding) que el hielo flote sobre el agua líquida y por qué eso es vital para los peces en invierno?", "¿Por qué los metales son maleables (malleable) pero los compuestos iónicos se rompen al golpearlos?"], "examen": {"q": "Explain why water (H₂O) has a much higher boiling point than hydrogen sulfide (H₂S), even though H₂S has a larger Mr.", "marks": 4, "ms": "1: Water forms hydrogen bonds between molecules. 2: Because O is highly electronegative / O–H bond is very polar, and O has lone pairs. 3: H₂S only has (permanent dipole–dipole and) van der Waals forces, as S is less electronegative. 4: Hydrogen bonds are stronger than these forces, so more energy is needed to separate water molecules."}}, {"id": "QUI04", "materia": "Química", "mesa": "AQA", "rama": "Química Física", "tema": "Energética", "temaEN": "Energetics", "explicacion": "El cambio de entalpía (enthalpy change, ΔH) es el calor intercambiado a presión constante. En una reacción exotérmica (exothermic) se libera energía y ΔH es negativo (como en una combustión); en una endotérmica (endothermic) se absorbe energía y ΔH es positivo. Las condiciones estándar (standard conditions) son 100 kPa y 298 K, y se marcan con ° (ΔH°).\n\nEn el laboratorio medimos ΔH por calorimetría (calorimetry): calentamos agua y medimos su cambio de temperatura. El calor es q = mcΔT, donde m es la masa del agua, c = 4.18 J g⁻¹ K⁻¹ y ΔT el cambio de temperatura. Luego dividimos entre los moles de reactivo: ΔH = −q / n. Los valores experimentales suelen salir menos exotérmicos que los de tablas por pérdidas de calor y combustión incompleta.\n\nLa ley de Hess (Hess's law) dice que el cambio de entalpía de una reacción es el mismo sin importar la ruta, así que podemos calcular ΔH que no se pueden medir directamente usando entalpías de formación (ΔfH) o de combustión (ΔcH). También podemos estimar ΔH con entalpías de enlace medias (mean bond enthalpies): romper enlaces requiere energía y formarlos la libera.", "analogia": "La ley de Hess es como subir de la planta baja al tercer piso de un edificio: da igual si usas la escalera, el elevador o paras en el segundo piso; la diferencia de altura total es la misma. La entalpía es la 'altura' energética.", "ejemplo": "Se queman 0.230 g de etanol (Mr 46.0 → 0.00500 mol) y calientan 100 g de agua en 12.0 K. q = 100 × 4.18 × 12.0 = 5016 J = 5.02 kJ. ΔcH = −5.02 / 0.00500 = −1000 kJ mol⁻¹ (aprox.). El valor de tablas es −1367 kJ mol⁻¹: la diferencia se debe a la pérdida de calor al ambiente.", "puntos": ["Exotérmica (exothermic): ΔH negativo; endotérmica (endothermic): ΔH positivo.", "Condiciones estándar (standard conditions): 100 kPa y 298 K; las sustancias en su estado estándar.", "Entalpía de formación estándar (standard enthalpy of formation, ΔfH°): 1 mol de compuesto formado a partir de sus elementos en estados estándar; para un elemento es 0.", "Entalpía de combustión estándar (standard enthalpy of combustion, ΔcH°): 1 mol de sustancia quemada completamente en oxígeno.", "Calorimetría (calorimetry): q = mcΔT y ΔH = −q / n.", "Ley de Hess (Hess's law) y entalpías de enlace medias (mean bond enthalpies) permiten calcular ΔH indirectamente."], "formulas": ["q = mcΔT   (c del agua = 4.18 J g⁻¹ K⁻¹)", "ΔH = −q / n   (q en kJ)", "ΔH = ΣΔfH(productos) − ΣΔfH(reactivos)", "ΔH = ΣΔcH(reactivos) − ΣΔcH(productos)", "ΔH = Σ(enlaces rotos) − Σ(enlaces formados)"], "glosario": [{"en": "enthalpy change", "es": "cambio de entalpía"}, {"en": "exothermic", "es": "exotérmico"}, {"en": "calorimetry", "es": "calorimetría"}, {"en": "Hess's law", "es": "ley de Hess"}, {"en": "mean bond enthalpy", "es": "entalpía de enlace media"}], "flashcards": [{"q": "¿Signo de ΔH en una reacción exotérmica?", "a": "Negativo: se libera energía al entorno."}, {"q": "¿Cuáles son las condiciones estándar?", "a": "100 kPa y 298 K."}, {"q": "Fórmula de calorimetría", "a": "q = mcΔT"}, {"q": "¿Cuánto vale ΔfH° de O₂(g)?", "a": "0 kJ mol⁻¹, porque es un elemento en su estado estándar."}, {"q": "¿Por qué el ΔcH experimental sale menos negativo que el de tablas?", "a": "Pérdidas de calor al entorno, combustión incompleta y evaporación del combustible."}, {"q": "¿Por qué ΔH con entalpías de enlace medias es solo aproximado?", "a": "Son promedios de muchos compuestos distintos y se aplican a moléculas en estado gaseoso."}], "preguntas": [{"q": "50.0 g de agua aumentan su temperatura 6.00 K. ¿Cuánto calor se absorbió? (c = 4.18 J g⁻¹ K⁻¹)", "op": ["1254 J", "300 J", "209 J", "25.1 J"], "ok": 0, "exp": "q = mcΔT = 50.0 × 4.18 × 6.00 = 1254 J."}, {"q": "Calcula ΔH para H₂ + Cl₂ → 2HCl. (H–H 436, Cl–Cl 243, H–Cl 432 kJ mol⁻¹)", "op": ["+185 kJ mol⁻¹", "−247 kJ mol⁻¹", "−185 kJ mol⁻¹", "+679 kJ mol⁻¹"], "ok": 2, "exp": "Rotos: 436 + 243 = 679. Formados: 2 × 432 = 864. ΔH = 679 − 864 = −185 kJ mol⁻¹."}, {"q": "¿Qué ecuación representa la entalpía estándar de formación del agua líquida?", "op": ["2H₂(g) + O₂(g) → 2H₂O(l)", "H₂(g) + ½O₂(g) → H₂O(l)", "H₂O(l) → H₂(g) + ½O₂(g)", "2H(g) + O(g) → H₂O(l)"], "ok": 1, "exp": "Debe formarse exactamente 1 mol de compuesto a partir de sus elementos en estado estándar (H₂ y O₂ gaseosos)."}, {"q": "¿Qué afirma la ley de Hess?", "op": ["La energía siempre se libera en una reacción", "La velocidad de reacción no depende de la ruta", "Las entalpías de enlace son siempre iguales", "El cambio de entalpía es independiente de la ruta seguida"], "ok": 3, "exp": "Hess's law: el ΔH total depende solo del estado inicial y final, no del camino."}, {"q": "Si al disolver una sal la temperatura del agua baja, la reacción es…", "op": ["Exotérmica, ΔH negativo", "Endotérmica, ΔH positivo", "Exotérmica, ΔH positivo", "Endotérmica, ΔH negativo"], "ok": 1, "exp": "La reacción absorbe calor del agua (el entorno se enfría): es endotérmica y ΔH > 0."}], "feynman": "Explica por qué romper un enlace siempre 'cuesta' energía y formarlo la 'paga', usando el ejemplo de separar dos imanes pegados.", "conexion": ["¿Cómo usarías la ley de Hess para calcular la entalpía de formación del metano, que no se puede medir directamente, a partir de entalpías de combustión?", "¿Qué cambios harías al experimento de calorimetría (calorimetry) para reducir las pérdidas de calor y acercarte al valor de tablas?"], "examen": {"q": "Use the data to calculate the standard enthalpy of combustion of methane: CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(l). ΔfH° / kJ mol⁻¹: CH₄(g) −75; CO₂(g) −394; H₂O(l) −286. State why no value is needed for O₂(g).", "marks": 4, "ms": "1: ΔH = ΣΔfH(products) − ΣΔfH(reactants). 2: Products = −394 + 2(−286) = −966. 3: ΔH = −966 − (−75) = −891 kJ mol⁻¹. 4: O₂ is an element in its standard state, so its ΔfH° = 0."}}, {"id": "QUI05", "materia": "Química", "mesa": "AQA", "rama": "Química Física", "tema": "Cinética", "temaEN": "Kinetics", "explicacion": "La cinética estudia qué tan rápido ocurren las reacciones. La teoría de colisiones (collision theory) dice que, para reaccionar, las partículas deben chocar con la orientación correcta y con una energía igual o mayor a la energía de activación (activation energy, Ea), que es la energía mínima necesaria para que la reacción empiece. La mayoría de los choques no tienen éxito.\n\nLa distribución de Maxwell–Boltzmann (Maxwell–Boltzmann distribution) es una gráfica que muestra cuántas moléculas de un gas tienen cada energía. Empieza en el origen (ninguna molécula tiene energía cero), no tiene máximo de energía y el área bajo la curva es el número total de moléculas. Si sube la temperatura, la curva se aplana y se mueve a la derecha: muchas más moléculas superan Ea, por eso un pequeño aumento de temperatura acelera mucho la reacción.\n\nTambién aumentan la velocidad: mayor concentración o presión (más choques por segundo), mayor área superficial y los catalizadores (catalysts). Un catalizador ofrece una ruta alternativa con menor Ea y no se consume en la reacción; en la curva de Maxwell–Boltzmann, la línea de Ea se mueve a la izquierda, pero la curva no cambia.", "analogia": "Imagina que la energía de activación es una barda que tienen que saltar las personas para entrar a una fiesta. Subir la temperatura es darles más energía a todos (más saltan); un catalizador es abrir una puerta lateral con una barda más baja; aumentar la concentración es tener más gente intentando entrar.", "ejemplo": "La leche dura más en el refrigerador: a menor temperatura, menos moléculas (y menos enzimas de bacterias) alcanzan la energía de activación, así que las reacciones que la echan a perder son mucho más lentas. Y los convertidores catalíticos de los coches usan platino para acelerar reacciones que eliminan gases tóxicos.", "puntos": ["Teoría de colisiones (collision theory): choque con orientación correcta y energía ≥ Ea.", "Energía de activación (activation energy, Ea): energía mínima para que ocurra una reacción.", "Maxwell–Boltzmann distribution: empieza en el origen, no toca el eje x a energías altas y el área = número total de moléculas.", "A mayor temperatura, la curva se aplana y se desplaza a la derecha; muchas más moléculas tienen E ≥ Ea.", "Mayor concentración o presión (concentration/pressure) → choques más frecuentes → mayor velocidad.", "Un catalizador (catalyst) da una ruta alternativa con menor Ea y no se consume."], "formulas": ["Velocidad (rate) = cambio de concentración / tiempo   (mol dm⁻³ s⁻¹)", "Velocidad ∝ 1 / tiempo de reacción"], "glosario": [{"en": "activation energy", "es": "energía de activación"}, {"en": "collision theory", "es": "teoría de colisiones"}, {"en": "catalyst", "es": "catalizador"}, {"en": "rate of reaction", "es": "velocidad de reacción"}, {"en": "successful collision", "es": "choque eficaz"}], "flashcards": [{"q": "Define energía de activación (activation energy)", "a": "La energía mínima necesaria para que una reacción ocurra."}, {"q": "¿Qué representa el área bajo la curva de Maxwell–Boltzmann?", "a": "El número total de moléculas."}, {"q": "¿Qué pasa con la curva al aumentar T?", "a": "El pico baja y se mueve a la derecha; el área total no cambia."}, {"q": "¿Cómo funciona un catalizador?", "a": "Proporciona una ruta alternativa con menor energía de activación."}, {"q": "¿Por qué una presión más alta acelera una reacción de gases?", "a": "Hay más moléculas por unidad de volumen, así que chocan con más frecuencia."}, {"q": "¿La curva de Maxwell–Boltzmann cambia al añadir un catalizador?", "a": "No; solo se mueve la posición de Ea hacia la izquierda."}], "preguntas": [{"q": "Al aumentar la temperatura, la curva de Maxwell–Boltzmann…", "op": ["Se hace más alta y se mueve a la izquierda", "Se hace más baja y se mueve a la derecha", "No cambia", "Aumenta su área total"], "ok": 1, "exp": "Más moléculas con energía alta: el pico baja y se desplaza a la derecha; el área se mantiene porque el número de moléculas es el mismo."}, {"q": "¿Cuál es la principal razón por la que un aumento pequeño de temperatura acelera mucho una reacción?", "op": ["Las moléculas chocan con mucha más frecuencia", "La energía de activación disminuye", "Una proporción mucho mayor de moléculas tiene
