energía ≥ Ea", "El catalizador se activa"], "ok": 2, "exp": "La frecuencia de choques sube poco; lo decisivo es que muchas más moléculas superan la Ea."}, {"q": "¿Qué NO hace un catalizador?", "op": ["Cambiar el ΔH de la reacción", "Disminuir la energía de activación", "Proporcionar una ruta alternativa", "Aumentar la velocidad de reacción"], "ok": 0, "exp": "El catalizador no cambia la energía de reactivos ni de productos, así que ΔH es el mismo."}, {"q": "Según la curva de Maxwell–Boltzmann, ¿qué afirmación es correcta?", "op": ["Algunas moléculas tienen energía cero", "La curva toca el eje x a energía alta", "Todas las moléculas tienen la misma energía", "La curva empieza en el origen"], "ok": 3, "exp": "Ninguna molécula tiene energía cero (empieza en el origen) y la curva nunca toca el eje x porque no hay energía máxima."}, {"q": "¿Por qué el polvo de magnesio reacciona más rápido con ácido que una cinta de magnesio?", "op": ["Tiene mayor energía de activación", "Tiene mayor área superficial y hay más choques por segundo", "Es un catalizador", "Tiene más protones"], "ok": 1, "exp": "Mayor área superficial (surface area) expone más partículas, así que aumenta la frecuencia de choques eficaces."}], "feynman": "Dibuja (o describe) la curva de Maxwell–Boltzmann como si fuera una gráfica de alturas de personas en una fiesta y explica qué pasa con quienes 'alcanzan' a saltar la barda de Ea cuando sube la temperatura.", "conexion": ["¿Por qué las enzimas (catalizadores biológicos) dejan de funcionar si la temperatura sube demasiado, aunque la teoría de colisiones diga que más calor = más velocidad?", "En la industria, ¿por qué usar un catalizador es mejor para el ambiente y la economía que simplemente subir la temperatura?"], "examen": {"q": "Use the Maxwell–Boltzmann distribution to explain why a small increase in temperature causes a large increase in the rate of a reaction.", "marks": 4, "ms": "1: At higher temperature the distribution curve shifts to the right / peak is lower and moves to higher energy (area unchanged). 2: Many more molecules have energy greater than or equal to the activation energy. 3: More frequent successful collisions (per unit time). 4: The increase in proportion with E ≥ Ea is much larger than the increase in collision frequency, so this is the main reason."}}, {"id": "QUI06", "materia": "Química", "mesa": "AQA", "rama": "Química Física", "tema": "Equilibrio químico", "temaEN": "Chemical equilibria, Le Chatelier's principle and Kc", "explicacion": "Muchas reacciones son reversibles (reversible reactions, símbolo ⇌). En un sistema cerrado (closed system) se alcanza un equilibrio dinámico (dynamic equilibrium): la reacción directa y la inversa ocurren a la misma velocidad, así que las concentraciones se mantienen constantes, aunque las moléculas siguen reaccionando.\n\nEl principio de Le Chatelier (Le Chatelier's principle) dice que si cambiamos una condición, la posición del equilibrio se desplaza para oponerse al cambio. Si aumentamos la concentración de un reactivo, se forma más producto; si subimos la presión, el equilibrio se mueve hacia el lado con menos moles de gas; si subimos la temperatura, se favorece la dirección endotérmica. Un catalizador no mueve el equilibrio, solo hace que se alcance más rápido. En la industria (Haber, etanol, metanol) se elige una condición de compromiso (compromise) entre rendimiento, velocidad y costo.\n\nLa constante de equilibrio (equilibrium constant, Kc) para aA + bB ⇌ cC + dD es Kc = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ, con concentraciones en el equilibrio. Kc solo cambia con la temperatura; cambiar concentraciones o presión mueve la posición del equilibrio, pero Kc se mantiene.", "analogia": "El equilibrio dinámico es como una escalera eléctrica de subida y otra de bajada en un centro comercial: la gente sube y baja todo el tiempo, pero si suben tantas personas como bajan, el número de personas en cada piso no cambia. Le Chatelier es el sistema 'quejándose' y compensando cualquier cambio.", "ejemplo": "Para H₂(g) + I₂(g) ⇌ 2HI(g), en el equilibrio [H₂] = 0.10, [I₂] = 0.10 y [HI] = 0.70 mol dm⁻³. Kc = [HI]² / ([H₂][I₂]) = 0.49 / (0.10 × 0.10) = 49. No tiene unidades porque las unidades se cancelan (mismos moles arriba y abajo).", "puntos": ["Equilibrio dinámico (dynamic equilibrium): velocidades directa e inversa iguales y concentraciones constantes, en un sistema cerrado.", "Principio de Le Chatelier (Le Chatelier's principle): el equilibrio se desplaza para oponerse a un cambio.", "Mayor presión → hacia el lado con menos moles de gas; mayor temperatura → dirección endotérmica.", "Un catalizador (catalyst) no cambia la posición del equilibrio ni Kc; solo acelera llegar a él.", "Kc = [productos]^coeficientes / [reactivos]^coeficientes; las unidades se deducen de la expresión.", "Solo la temperatura cambia el valor de Kc; en la industria se usan condiciones de compromiso (compromise conditions)."], "formulas": ["aA + bB ⇌ cC + dD:   Kc = [C]ᶜ[D]ᵈ / ([A]ᵃ[B]ᵇ)", "N₂(g) + 3H₂(g) ⇌ 2NH₃(g)   ΔH = −92 kJ mol⁻¹", "C₂H₄(g) + H₂O(g) ⇌ C₂H₅OH(g)   ΔH = −46 kJ mol⁻¹", "CO(g) + 2H₂(g) ⇌ CH₃OH(g)   ΔH = −91 kJ mol⁻¹"], "glosario": [{"en": "dynamic equilibrium", "es": "equilibrio dinámico"}, {"en": "reversible reaction", "es": "reacción reversible"}, {"en": "equilibrium constant", "es": "constante de equilibrio"}, {"en": "position of equilibrium", "es": "posición del equilibrio"}, {"en": "compromise conditions", "es": "condiciones de compromiso"}], "flashcards": [{"q": "¿Dos características del equilibrio dinámico?", "a": "Velocidad directa = velocidad inversa; concentraciones constantes (en sistema cerrado)."}, {"q": "¿Qué cambia el valor de Kc?", "a": "Solo la temperatura."}, {"q": "¿Efecto de un catalizador en el equilibrio?", "a": "Ninguno en la posición ni en Kc; se llega al equilibrio más rápido."}, {"q": "Si la reacción directa es exotérmica y subes T, ¿qué pasa?", "a": "El equilibrio se desplaza a la izquierda (dirección endotérmica) y Kc disminuye."}, {"q": "Expresión de Kc para N₂ + 3H₂ ⇌ 2NH₃", "a": "Kc = [NH₃]² / ([N₂][H₂]³), unidades mol⁻² dm⁶."}, {"q": "¿Por qué no se usa una temperatura muy baja en el proceso Haber?", "a": "Daría más NH₃ en equilibrio, pero la velocidad sería demasiado lenta."}], "preguntas": [{"q": "Para N₂(g) + 3H₂(g) ⇌ 2NH₃(g), ¿qué pasa al aumentar la presión?", "op": ["El equilibrio se desplaza a la izquierda", "No hay efecto", "Kc aumenta", "El equilibrio se desplaza a la derecha"], "ok": 3, "exp": "Hay 4 moles de gas a la izquierda y 2 a la derecha; el equilibrio se mueve hacia menos moles de gas para reducir la presión."}, {"q": "¿Cuáles son las unidades de Kc para 2SO₂(g) + O₂(g) ⇌ 2SO₃(g)?", "op": ["mol⁻¹ dm³", "mol dm⁻³", "Sin unidades", "mol⁻² dm⁶"], "ok": 0, "exp": "Kc = [SO₃]² / ([SO₂]²[O₂]) → (mol dm⁻³)² / (mol dm⁻³)³ = (mol dm⁻³)⁻¹ = mol⁻¹ dm³."}, {"q": "¿Qué efecto tiene añadir un catalizador a un sistema en equilibrio?", "op": ["Aumenta el rendimiento del producto", "No cambia la posición del equilibrio", "Aumenta Kc", "Desplaza el equilibrio a la izquierda"], "ok": 1, "exp": "El catalizador acelera por igual la reacción directa y la inversa."}, {"q": "En una reacción exotérmica en equilibrio, al aumentar la temperatura, Kc…", "op": ["aumenta", "no cambia", "disminuye", "se vuelve cero"], "ok": 2, "exp": "Se favorece la dirección endotérmica (inversa), hay menos producto en el equilibrio y Kc disminuye."}, {"q": "En H₂ + I₂ ⇌ 2HI, [H₂] = [I₂] = 0.20 y [HI] = 1.4 mol dm⁻³. ¿Kc?", "op": ["35", "7.0", "0.020", "49"], "ok": 3, "exp": "Kc = 1.4² / (0.20 × 0.20) = 1.96 / 0.040 = 49."}], "feynman": "Explica el equilibrio dinámico usando dos cuartos con gente que pasa de uno a otro por una puerta, y qué pasaría si de repente metes a 20 personas más en uno de los cuartos.", "conexion": ["¿Por qué el proceso Haber usa unos 450 °C y 200 atm en lugar de la temperatura baja y presión altísima que darían más amoníaco?", "¿Cómo se relaciona el equilibrio del CO₂ disuelto en una bebida gaseosa con lo que pasa cuando la abres?"], "examen": {"q": "For the equilibrium 2SO₂(g) + O₂(g) ⇌ 2SO₃(g), ΔH = −197 kJ mol⁻¹: (a) write an expression for Kc and deduce its units; (b) state and explain the effect of increasing the temperature on the value of Kc.", "marks": 4, "ms": "1: Kc = [SO₃]² / ([SO₂]²[O₂]). 2: Units = mol⁻¹ dm³. 3: Kc decreases. 4: Forward reaction is exothermic, so increasing temperature shifts equilibrium to the left / favours the endothermic (backward) reaction, reducing [SO₃]."}}, {"id": "QUI07", "materia": "Química", "mesa": "AQA", "rama": "Química Inorgánica", "tema": "Periodicidad", "temaEN": "Periodicity", "explicacion": "La tabla periódica se divide en bloques s, p, d y f según el subnivel donde está el electrón de mayor energía. La periodicidad (periodicity) es la repetición de tendencias en las propiedades a lo largo de cada periodo. En AQA estudiamos el periodo 3: Na, Mg, Al, Si, P, S, Cl y Ar.\n\nA lo largo del periodo 3, el radio atómico (atomic radius) disminuye porque aumenta el número de protones mientras los electrones entran al mismo nivel con apantallamiento parecido, así que el núcleo los atrae más. Por la misma razón, la primera energía de ionización (first ionisation energy) aumenta en general, con pequeñas caídas en Al y en S.\n\nEl punto de fusión (melting point) depende de la estructura. Na, Mg y Al son metálicos y su punto de fusión sube porque los iones tienen más carga, son más pequeños y hay más electrones deslocalizados. El Si es macromolecular (macromolecular / giant covalent) y tiene el punto de fusión más alto. P₄, S₈, Cl₂ y Ar son moléculas simples (simple molecular) con fuerzas de van der Waals débiles: S₈ > P₄ > Cl₂ > Ar, según el tamaño de la molécula.", "analogia": "Recorrer el periodo 3 es como un equipo que cada vez tiene un jugador más jalando una cuerda (protones) mientras la distancia no cambia: cada vez jalan más fuerte a los electrones, así que el átomo se 'encoge'. En los puntos de fusión, el silicio es como un muro de ladrillos pegados con cemento (enlaces covalentes), mientras que el cloro es como canicas sueltas.", "ejemplo": "El azufre (S₈) funde a ~115 °C y el fósforo (P₄) a ~44 °C. Ambos son moléculas simples, pero el S₈ tiene más electrones, así que sus fuerzas de van der Waals son más fuertes y se necesita más energía para separarlas.", "puntos": ["Los elementos se clasifican en bloques s, p, d, f (s, p, d and f blocks) según el subnivel de mayor energía.", "El radio atómico (atomic radius) disminuye en el periodo 3: más carga nuclear y apantallamiento similar.", "La primera energía de ionización (first ionisation energy) aumenta en general a lo largo del periodo.", "Na → Al: punto de fusión aumenta por enlace metálico (metallic bonding) más fuerte.", "Si: estructura macromolecular (macromolecular) con muchos enlaces covalentes fuertes → punto de fusión máximo.", "P₄, S₈, Cl₂, Ar: moléculas simples (simple molecular); punto de fusión según fuerzas de van der Waals: S₈ > P₄ > Cl₂ > Ar."], "formulas": [], "glosario": [{"en": "periodicity", "es": "periodicidad"}, {"en": "atomic radius", "es": "radio atómico"}, {"en": "melting point", "es": "punto de fusión"}, {"en": "macromolecular", "es": "macromolecular"}, {"en": "nuclear charge", "es": "carga nuclear"}], "flashcards": [{"q": "¿Por qué disminuye el radio atómico en el periodo 3?", "a": "Más protones atraen a los electrones del mismo nivel con apantallamiento similar."}, {"q": "¿Qué elemento del periodo 3 tiene el punto de fusión más alto?", "a": "El silicio (Si), por su estructura macromolecular."}, {"q": "¿Por qué el Al funde más alto que el Na?", "a": "Al³⁺ tiene más carga y es más pequeño, y hay más electrones deslocalizados: enlace metálico más fuerte."}, {"q": "Orden de punto de fusión de las moléculas simples del periodo 3", "a": "S₈ > P₄ > Cl₂ > Ar."}, {"q": "¿En qué bloque está el fósforo?", "a": "Bloque p (su electrón de mayor energía está en 3p)."}, {"q": "¿Por qué el Ar tiene el punto de fusión más bajo?", "a": "Son átomos individuales con muy pocas fuerzas de van der Waals entre ellos."}], "preguntas": [{"q": "¿Qué tendencia sigue el radio atómico de Na a Cl?", "op": ["Aumenta", "Disminuye", "Se mantiene", "Aumenta y luego disminuye"], "ok": 1, "exp": "La carga nuclear aumenta y el apantallamiento es parecido, así que los electrones son más atraídos."}, {"q": "¿Por qué el silicio tiene un punto de fusión muy alto?", "op": ["Tiene enlace metálico fuerte", "Forma puentes de hidrógeno", "Es una red macromolecular con muchos enlaces covalentes fuertes", "Sus moléculas Si₂ son grandes"], "ok": 2, "exp": "Hay que romper muchos enlaces covalentes fuertes en la red gigante (giant covalent)."}, {"q": "¿Qué par está ordenado correctamente por punto de fusión (mayor primero)?", "op": ["S₈ > P₄", "Cl₂ > S₈", "Ar > Cl₂", "P₄ > Si"], "ok": 0, "exp": "S₈ es más grande que P₄, tiene más electrones y fuerzas de van der Waals más fuertes."}, {"q": "¿En qué bloque se encuentra el sodio?", "op": ["Bloque p", "Bloque d", "Bloque f", "Bloque s"], "ok": 3, "exp": "La configuración del Na es [Ne] 3s¹: su electrón de mayor energía está en un subnivel s."}, {"q": "¿Por qué el magnesio tiene mayor punto de fusión que el sodio?", "op": ["El Mg forma moléculas más grandes", "Mg²⁺ tiene más carga y aporta 2 electrones deslocalizados, así que el enlace metálico es más fuerte", "El Mg es macromolecular", "El Na tiene puentes de hidrógeno más débiles"], "ok": 1, "exp": "Más carga en el ion y más electrones deslocalizados → mayor atracción electrostática."}], "feynman": "Explica por qué el silicio y el cloro, estando en el mismo periodo, tienen puntos de fusión tan distintos, usando la imagen de un muro de ladrillos y un montón de canicas.", "conexion": ["¿Cómo se relaciona la tendencia del radio atómico en el periodo 3 con la tendencia de la primera energía de ionización que viste en estructura atómica?", "¿Por qué el aluminio sirve para fabricar latas y el fósforo no, pensando en el tipo de enlace de cada uno?"], "examen": {"q": "Explain why silicon has a much higher melting point than sulfur, and why sulfur (S₈) has a higher melting point than phosphorus (P₄).", "marks": 4, "ms": "1: Silicon is macromolecular / giant covalent. 2: Many strong covalent bonds must be broken, which needs a lot of energy. 3: Sulfur and phosphorus are simple molecular; only weak van der Waals (induced dipole–dipole) forces between molecules are overcome. 4: S₈ is larger / has more electrons than P₄, so stronger van der Waals forces between molecules."}}, {"id": "QUI08", "materia": "Química", "mesa": "AQA", "rama": "Química Inorgánica", "tema": "Grupo 2", "temaEN": "Group 2, the alkaline earth metals", "explicacion": "Los metales del Grupo 2 (alkaline earth metals) son Be, Mg, Ca, Sr y Ba. Todos tienen dos electrones en su subnivel s externo y los pierden para formar iones M²⁺. Al bajar en el grupo, el radio atómico (atomic radius) aumenta porque hay más niveles, y la primera energía de ionización (first ionisation energy) disminuye porque el electrón externo está más lejos y más apantallado. El punto de fusión (melting point) en general disminuye, porque los iones son más grandes y el enlace metálico es más débil.\n\nLa reactividad aumenta al bajar: es más fácil perder los electrones externos. Con agua forman hidróxidos e hidrógeno (M + 2H₂O → M(OH)₂ + H₂); el magnesio reacciona muy lento con agua fría pero arde con vapor (steam) formando MgO y H₂. La solubilidad de los hidróxidos (hydroxides) aumenta al bajar en el grupo, mientras que la de los sulfatos (sulfates) disminuye: el BaSO₄ es insoluble.\n\nEstos compuestos son muy útiles: el Mg(OH)₂ es un antiácido, el Ca(OH)₂ neutraliza suelos ácidos, el CaO o CaCO₃ eliminan SO₂ de los gases de chimeneas, el BaSO₄ se usa en radiografías ('barium meal') y el Mg sirve para extraer titanio del TiCl₄. Además, el BaCl₂ acidificado es la prueba para iones sulfato (sulfate ions): da un precipitado blanco.", "analogia": "Bajar en el Grupo 2 es como si los dos electrones externos vivieran cada vez más lejos de casa (el núcleo) y con más vecinos estorbando (apantallamiento): cada vez les cuesta menos 'irse', por eso los metales de abajo reaccionan con más ganas.", "ejemplo": "Cuando te duele el estómago por acidez, la 'leche de magnesia' (Mg(OH)₂) neutraliza el exceso de ácido: Mg(OH)₂ + 2HCl → MgCl₂ + 2H₂O. Funciona porque es una base poco soluble, así que no daña el cuerpo.", "puntos": ["Al bajar en el grupo: el radio atómico (atomic radius) aumenta y la primera energía de ionización disminuye.", "La reactividad (reactivity) aumenta al bajar: M + 2H₂O → M(OH)₂ + H₂.", "El Mg reacciona con vapor de agua (steam): Mg + H₂O → MgO + H₂.", "La solubilidad de los hidróxidos (hydroxides) aumenta al bajar; la de los sulfatos (sulfates) disminuye.", "Prueba de sulfato (test for sulfate ions): BaCl₂ acidificado (con HCl o HNO₃) → precipitado blanco de BaSO₄.", "Usos: Mg(OH)₂ antiácido, Ca(OH)₂ en agricultura, CaO/CaCO₃ para quitar SO₂ (flue gas desulfurisation), BaSO₄ en rayos X y Mg para extraer Ti."], "formulas": ["M(s) + 2H₂O(l) → M(OH)₂(aq) + H₂(g)", "Mg(s) + H₂O(g) → MgO(s) + H₂(g)", "Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s)", "TiCl₄ + 2Mg → Ti + 2MgCl₂", "CaO + SO₂ → CaSO₃;   CaCO₃ + SO₂ → CaSO₃ + CO₂"], "glosario": [{"en": "alkaline earth metals", "es": "metales alcalinotérreos"}, {"en": "solubility", "es": "solubilidad"}, {"en": "precipitate", "es": "precipitado"}, {"en": "steam", "es": "vapor de agua"}, {"en": "flue gas desulfurisation", "es": "desulfuración de gases de combustión"}], "flashcards": [{"q": "¿Cómo cambia la solubilidad de los hidróxidos del Grupo 2?", "a": "Aumenta al bajar en el grupo (Mg(OH)₂ poco soluble, Ba(OH)₂ soluble)."}, {"q": "¿Cómo cambia la solubilidad de los sulfatos del Grupo 2?", "a": "Disminuye al bajar; el BaSO₄ es insoluble."}, {"q": "¿Por qué se acidifica el BaCl₂ en la prueba de sulfato?", "a": "Para eliminar carbonatos (y sulfitos) que también darían un precipitado blanco."}, {"q": "Ecuación del Mg con vapor", "a": "Mg + H₂O → MgO + H₂"}, {"q": "¿Por qué el BaSO₄ es seguro en una 'barium meal' aunque los iones Ba²⁺ son tóxicos?", "a": "Es insoluble, así que no se absorbe en la sangre."}, {"q": "¿Para qué se usa el Mg en la extracción de titanio?", "a": "Reduce el TiCl₄: TiCl₄ + 2Mg → Ti + 2MgCl₂."}], "preguntas": [{"q": "¿Qué hidróxido del Grupo 2 es el más soluble en agua?", "op": ["Mg(OH)₂", "Ca(OH)₂", "Sr(OH)₂", "Ba(OH)₂"], "ok": 3, "exp": "La solubilidad de los hidróxidos aumenta al bajar en el grupo, así que el Ba(OH)₂ es el más soluble."}, {"q": "¿Qué se observa al añadir BaCl₂ acidificado a una disolución con iones SO₄²⁻?", "op": ["Precipitado blanco", "Gas efervescente", "Disolución azul", "Precipitado amarillo"], "ok": 0, "exp": "Se forma BaSO₄, un sólido blanco insoluble."}, {"q": "¿Por qué la reactividad aumenta al bajar en el Grupo 2?", "op": ["Aumenta la carga nuclear efectiva", "Disminuye el radio atómico", "Los electrones externos están más lejos y más apantallados, así que se pierden más fácilmente", "Los metales tienen más electrones externos"], "ok": 2, "exp": "La menor energía de ionización hace que formar M²⁺ sea más fácil."}, {"q": "¿Qué productos da el magnesio al reaccionar con vapor de agua?", "op": ["Mg(OH)₂ y H₂", "MgO y H₂", "MgO y O₂", "MgH₂ y O₂"], "ok": 1, "exp": "Con vapor, el Mg forma el óxido: Mg + H₂O → MgO + H₂."}, {"q": "¿Qué compuesto se usa para neutralizar suelos ácidos en agricultura?", "op": ["BaSO₄", "MgCl₂", "TiCl₄", "Ca(OH)₂"], "ok": 3, "exp": "El hidróxido de calcio (cal apagada) es una base barata que sube el pH del suelo."}], "feynman": "Explica a tu hermano por qué la prueba con BaCl₂ 'atrapa' a los iones sulfato, usando la idea de una pareja que, al juntarse, se vuelve un sólido que ya no se puede disolver.", "conexion": ["¿Cómo se relaciona la tendencia de la energía de ionización en el Grupo 2 con la reactividad de estos metales con agua?", "¿Por qué quitar el SO₂ de los gases de las centrales eléctricas ayuda a reducir la lluvia ácida (acid rain)?"], "examen": {"q": "Describe a test to show that a solution contains sulfate ions. Explain why the reagent is acidified and write an ionic equation for the reaction.", "marks": 4, "ms": "1: Add acidified barium chloride (or barium nitrate) solution. 2: White precipitate forms. 3: Acid (HCl or HNO₃) removes carbonate (or sulfite) ions, which would also form a white precipitate. 4: Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s)."}}, {"id": "QUI09", "materia": "Química", "mesa": "AQA", "rama": "Química Inorgánica", "tema": "Grupo 7", "temaEN": "Group 7(17), the halogens", "explicacion": "Los halógenos (halogens) son F₂, Cl₂, Br₂ e I₂, moléculas diatómicas. Al bajar en el grupo, la electronegatividad (electronegativity) disminuye porque los átomos son más grandes y el núcleo atrae menos los electrones de enlace; el punto de ebullición (boiling point) aumenta porque las moléculas tienen más electrones y fuerzas de van der Waals más fuertes (Cl₂ gas, Br₂ líquido, I₂ sólido).\n\nLa capacidad oxidante (oxidising ability) disminuye al bajar: un halógeno de arriba desplaza a los haluros de abajo, por ejemplo Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂. En cambio, el poder reductor de los haluros (reducing ability of halides) aumenta al bajar: con ácido sulfúrico concentrado, el NaCl solo da HCl, pero el NaBr también produce SO₂ y Br₂, y el NaI produce además S y H₂S. Para identificar haluros se acidifica con HNO₃ y se añade AgNO₃: AgCl blanco, AgBr crema y AgI amarillo; con amoníaco se confirma.\n\nEl cloro se usa para potabilizar el agua: Cl₂ + H₂O ⇌ HCl + HClO, y el HClO mata bacterias. Con NaOH frío y diluido forma lejía (bleach): Cl₂ + 2NaOH → NaCl + NaClO + H₂O. Ambas son reacciones de dismutación (disproportionation), donde el mismo elemento se oxida y se reduce a la vez. Los beneficios para la salud superan los riesgos del cloro, que es tóxico.", "analogia": "Los halógenos son como imanes que 'roban' electrones: el flúor y el cloro son imanes muy potentes y pequeños, el yodo es un imán grande y débil. Un imán fuerte (Cl₂) puede quitarle el electrón a un ion de un imán débil (Br⁻), pero no al revés.", "ejemplo": "Al añadir agua de cloro a una disolución de KBr, el líquido incoloro se vuelve naranja/amarillo: Cl₂ + 2KBr → 2KCl + Br₂. Si luego agitas con ciclohexano, la capa orgánica se ve naranja (Br₂); si fuera yodo, se vería morada.", "puntos": ["Al bajar en el grupo: electronegatividad (electronegativity) disminuye y punto de ebullición (boiling point) aumenta.", "La capacidad oxidante (oxidising ability) de los halógenos disminuye al bajar: Cl₂ desplaza a Br⁻ e I⁻.", "El poder reductor de los haluros (reducing ability of halides) aumenta al bajar: I⁻ es el mejor agente reductor.", "Prueba de haluros (halide test): HNO₃ y luego AgNO₃ → AgCl blanco, AgBr crema, AgI amarillo; AgF no precipita.", "Confirmación con amoníaco (ammonia): AgCl se disuelve en NH₃ diluido, AgBr en NH₃ concentrado y AgI en ninguno.", "Dismutación (disproportionation): Cl₂ con agua (desinfección) y con NaOH frío (lejía)."], "formulas": ["Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂", "NaCl + H₂SO₄ → NaHSO₄ + HCl", "2HBr + H₂SO₄ → Br₂ + SO₂ + 2H₂O", "8HI + H₂SO₄ → 4I₂ + H₂S + 4H₂O", "Ag⁺(aq) + Cl⁻(aq) → AgCl(s)", "Cl₂ + H₂O ⇌ HCl + HClO;   2Cl₂ + 2H₂O → 4HCl + O₂ (con luz solar)", "Cl₂ + 2NaOH → NaCl + NaClO + H₂O"], "glosario": [{"en": "halogen", "es": "halógeno"}, {"en": "halide", "es": "haluro"}, {"en": "displacement reaction", "es": "reacción de desplazamiento"}, {"en": "disproportionation", "es": "dismutación"}, {"en": "oxidising agent", "es": "agente oxidante"}], "flashcards": [{"q": "¿Cómo cambia la capacidad oxidante de los halógenos al bajar?", "a": "Disminuye: el átomo es más grande y atrae menos un electrón extra."}, {"q": "Color de los precipitados AgCl, AgBr, AgI", "a": "Blanco, crema y amarillo."}, {"q": "¿Por qué se añade HNO₃ antes del AgNO₃?", "a": "Para eliminar carbonatos o hidróxidos que formarían otros precipitados."}, {"q": "¿Qué productos da el NaI con H₂SO₄ concentrado?", "a": "HI, I₂ (sólido negro/morado), SO₂, S (amarillo) y H₂S (olor a huevo podrido)."}, {"q": "Ecuación para hacer lejía", "a": "Cl₂ + 2NaOH → NaCl + NaClO + H₂O"}, {"q": "¿Qué es la dismutación (disproportionation)?", "a": "Una reacción donde el mismo elemento se oxida y se reduce a la vez."}], "preguntas": [{"q": "¿Qué reacción ocurre?", "op": ["Br₂ + 2Cl⁻ → 2Br⁻ + Cl₂", "I₂ + 2Br⁻ → 2I⁻ + Br₂", "Cl₂ + 2I⁻ → 2Cl⁻ + I₂", "I₂ + 2Cl⁻ → 2I⁻ + Cl₂"], "ok": 2, "exp": "Un halógeno más arriba (más oxidante) desplaza a un haluro de más abajo: el Cl₂ oxida al I⁻."}, {"q": "Una disolución con AgNO₃ da un precipitado crema que se disuelve solo en NH₃ concentrado. ¿Qué ion contiene?", "op": ["Br⁻", "Cl⁻", "I⁻", "F⁻"], "ok": 0, "exp": "AgBr es crema y solo se disuelve en amoníaco concentrado."}, {"q": "¿Qué haluro de sodio produce H₂S al reaccionar con H₂SO₄ concentrado?", "op": ["NaF", "NaCl", "NaBr", "NaI"], "ok": 3, "exp": "El I⁻ es el reductor más fuerte y reduce el azufre de +6 hasta −2 (H₂S)."}, {"q": "En Cl₂ + 2NaOH → NaCl + NaClO + H₂O, los estados de oxidación del cloro pasan de 0 a…", "op": ["−1 y +3", "−1 y +1", "+1 y +5", "−1 y +5"], "ok": 1, "exp": "En NaCl el Cl es −1 (reducción) y en NaClO es +1 (oxidación): dismutación."}, {"q": "¿Por qué aumenta el punto de ebullición de F₂ a I₂?", "op": ["Aumentan los puentes de hidrógeno", "Los enlaces covalentes son más fuertes", "Las moléculas son más grandes con más electrones y fuerzas de van der Waals más fuertes", "Aumenta la electronegatividad"], "ok": 2, "exp": "Más electrones → dipolos inducidos (induced dipoles) más grandes → más energía para separar moléculas."}], "feynman": "Explica por qué el cloro puede 'sacar' al bromo de una sal pero el bromo no puede sacar al cloro, como si fuera una competencia de fuerza entre dos personas de distinta altura y brazos.", "conexion": ["¿Cómo se relaciona la tendencia de la electronegatividad en el Grupo 7 con la fuerza de los halógenos como agentes oxidantes (oxidising agents)?", "Clorar el agua salva millones de vidas, pero el cloro es tóxico. ¿Cómo justificarías su uso ante alguien que lo cuestione?"], "examen": {"q": "Solid sodium bromide reacts with concentrated sulfuric acid. State two observations, write an equation for the redox reaction that produces bromine, and explain why sodium chloride does not undergo a similar redox reaction.", "marks": 5, "ms": "1: Misty (white) fumes (of HBr). 2: Orange/brown vapour or liquid (Br₂) (allow colourless choking gas SO₂). 3: 2HBr + H₂SO₄ → Br₂ + SO₂ + 2H₂O (or 2Br⁻ + 2H⁺ + H₂SO₄ → Br₂ + SO₂ + 2H₂O). 4: Chloride ions are weaker reducing agents than bromide ions. 5: Because Cl⁻ is smaller, so its outer electrons are held more strongly / harder to lose; not able to reduce H₂SO₄."}}, {"id": "QUI10", "materia": "Química", "mesa": "AQA", "rama": "Química Orgánica", "tema": "Alcanos", "temaEN": "Alkanes", "explicacion": "Mini intro a la química orgánica: los compuestos se nombran según el número de carbonos de la cadena más larga (met- 1, et- 2, prop- 3, but- 4, pent- 5, hex- 6) y un sufijo según su grupo funcional (functional group), como -ano para alcanos. Una molécula se puede escribir con fórmula molecular (molecular formula, C₄H₁₀), estructural (structural formula, CH₃CH₂CH₂CH₃), desarrollada (displayed formula, todos los enlaces), esqueletal (skeletal formula, solo zigzag) o general (general formula). Una serie homóloga (homologous series) comparte fórmula general y química similar. Los isómeros estructurales (structural isomers) tienen la misma fórmula molecular pero distinta estructura: de cadena, de posición o de grupo funcional.\n\nLos alcanos (alkanes) son hidrocarburos saturados (saturated hydrocarbons) con fórmula CₙH₂ₙ₊₂, solo con enlaces simples. El petróleo crudo (crude oil) se separa por destilación fraccionada (fractional distillation): se calienta y los vapores suben por una columna más fría arriba; las fracciones con moléculas pequeñas y punto de ebullición bajo salen arriba. El craqueo (cracking) rompe alcanos largos en moléculas más útiles: el térmico (thermal cracking, alta presión y alta temperatura) da muchos alquenos; el catalítico (catalytic cracking, zeolita, ~450 °C, presión ligera) da combustibles para motores e hidrocarburos aromáticos.\n\nLos alcanos son buenos combustibles. La combustión completa (complete combustion) da CO₂ y H₂O; la incompleta (incomplete combustion) da CO (tóxico) u hollín (C). Los motores también producen NOₓ y SO₂; los convertidores catalíticos (catalytic converters) eliminan CO, NOₓ e hidrocarburos. Con halógenos y luz UV, los alcanos hacen sustitución por radicales libres (free-radical substitution) en tres etapas: iniciación, propagación y terminación.", "analogia": "La destilación fraccionada es como un edificio donde cada piso es más frío que el de abajo: las moléculas 'pesadas' se quedan en los pisos bajos porque se condensan pronto, y las ligeras suben hasta la azotea. El craqueo es como cortar un espagueti largo en pedazos más útiles para cocinar.", "ejemplo": "Combustión completa del octano (gasolina): C₈H₁₈ + 12½O₂ → 8CO₂ + 9H₂O. Comprueba: C 8 = 8; H 18 = 9 × 2; O 25 = 16 + 9. Si falta oxígeno (por ejemplo, un calentador mal ventilado), se forma CO, un gas sin olor que impide que la sangre transporte oxígeno.", "puntos": ["Nomenclatura (nomenclature): met-, et-, prop-, but-, pent-, hex- + sufijo del grupo funcional (functional group); los alcanos terminan en -ano.", "Los isómeros estructurales (structural isomers) tienen la misma fórmula molecular y distinta fórmula estructural.", "Alcanos (alkanes): hidrocarburos saturados (saturated hydrocarbons), CₙH₂ₙ₊₂.", "Destilación fraccionada (fractional distillation) separa el petróleo por puntos de ebullición; craqueo (cracking) térmico o catalítico rompe cadenas largas.", "Combustión incompleta (incomplete combustion) produce CO y partículas de carbono; los convertidores catalíticos (catalytic converters) reducen contaminantes.", "Sustitución por radicales libres (free-radical substitution): iniciación (initiation), propagación (propagation) y terminación (termination), con luz UV."], "formulas": ["Alcanos: CₙH₂ₙ₊₂", "C₈H₁₈ + 12½O₂ → 8CO₂ + 9H₂O", "CH₄ + 1½O₂ → CO + 2H₂O (incompleta)", "C₁₀H₂₂ → C₈H₁₈ + C₂H₄ (craqueo)", "2CO + 2NO → 2CO₂ + N₂ (convertidor catalítico)", "Iniciación: Cl₂ → 2Cl•", "Propagación: Cl• + CH₄ → •CH₃ + HCl;  •CH₃ + Cl₂ → CH₃Cl + Cl•", "Terminación: •CH₃ + Cl• → CH₃Cl;  2•CH₃ → C₂H₆"], "glosario": [{"en": "homologous series", "es": "serie homóloga"}, {"en": "structural isomer", "es": "isómero estructural"}, {"en": "fractional distillation", "es": "destilación fraccionada"}, {"en": "cracking", "es": "craqueo"}, {"en": "free radical", "es": "radical libre"}], "flashcards": [{"q": "Fórmula general de los alcanos", "a": "CₙH₂ₙ₊₂"}, {"q": "¿Qué es una serie homóloga (homologous series)?", "a": "Compuestos con la misma fórmula general y grupo funcional; cada miembro difiere en CH₂."}, {"q": "Condiciones del craqueo catalítico", "a": "Zeolita como catalizador, ligera presión, ~450 °C; produce combustibles y aromáticos."}, {"q": "¿Qué contaminante se forma por combustión incompleta?", "a": "Monóxido de carbono (CO) y hollín (C)."}, {"q": "¿Qué es un radical libre (free radical)?", "a": "Una especie con un electrón desapareado."}, {"q": "¿Qué condición inicia la cloración del metano?", "a": "Luz ultravioleta (UV), que rompe homolíticamente el Cl₂."}], "preguntas": [{"q": "¿Cuál es el nombre del alcano C₅H₁₂ de cadena recta?", "op": ["Butano", "Hexano", "Propano", "Pentano"], "ok": 3, "exp": "5 carbonos → pent-; alcano → -ano: pentano."}, {"q": "¿Cuál es la principal ventaja del craqueo térmico (thermal cracking)?", "op": ["Produce un alto porcentaje de alquenos", "Produce hidrocarburos aromáticos", "Funciona a baja temperatura", "No necesita presión"], "ok": 0, "exp": "El craqueo térmico (alta presión, alta temperatura) produce muchos alquenos, útiles para polímeros."}, {"q": "¿Qué paso es de propagación en la cloración del metano?", "op": ["Cl₂ → 2Cl•", "Cl• + CH₄ → •CH₃ + HCl", "•CH₃ + Cl• → CH₃Cl", "2Cl• → Cl₂"], "ok": 1, "exp": "En la propagación un radical reacciona y genera otro radical, manteniendo la cadena."}, {"q": "¿Por qué en la destilación fraccionada las fracciones ligeras salen arriba?", "op": ["Son más densas", "Tienen enlaces más fuertes", "Tienen puntos de ebullición más bajos por fuerzas de van der Waals más débiles", "Reaccionan con el aire"], "ok": 2, "exp": "Moléculas pequeñas tienen fuerzas intermoleculares débiles y siguen siendo gas hasta la parte alta y más fría de la columna."}, {"q": "¿Cuál ecuación de combustión completa está balanceada?", "op": ["C₃H₈ + 5O₂ → 3CO₂ + 4H₂O", "C₃H₈ + 3O₂ → 3CO₂ + 4H₂O", "C₃H₈ + 4O₂ → 3CO₂ + 4H₂O", "C₃H₈ + 5O₂ → 3CO + 4H₂O"], "ok": 0, "exp": "O: 5 × 2 = 10 a la izquierda; 3 × 2 + 4 = 10 a la derecha. C y H también cuadran."}], "feynman": "Explica la reacción en cadena de los radicales libres como si fuera un juego de 'la papa caliente' donde quien recibe la papa (el electrón desapareado) tiene que pasarla, y explica qué hace que el juego termine.", "conexion": ["¿Por qué las refinerías craquean (crack) las fracciones pesadas si eso cuesta energía? Piensa en la oferta y la demanda de gasolina.", "¿Cómo se relaciona el aumento del punto de ebullición de los alcanos con las fuerzas de van der Waals que viste en Enlaces químicos?"], "examen": {"q": "Methane reacts with chlorine in the presence of ultraviolet light to form chloromethane. Name the type of mechanism and write equations for the initiation step, the two propagation steps and one termination step.", "marks": 4, "ms": "1: Free-radical substitution AND initiation: Cl₂ → 2Cl•. 2: Propagation: Cl• + CH₄ → •CH₃ + HCl. 3: Propagation: •CH₃ + Cl₂ → CH₃Cl + Cl•. 4: Termination: •CH₃ + Cl• → CH₃Cl (or 2•CH₃ → C₂H₆ or 2Cl• → Cl₂)."}}, {"id": "QUI11", "materia": "Química", "mesa": "AQA", "rama": "Química Orgánica", "tema": "Halogenoalcanos", "temaEN": "Halogenoalkanes", "explicacion": "Los halogenoalcanos (halogenoalkanes) son alcanos con uno o más átomos de halógeno, como el bromoetano (CH₃CH₂Br). El enlace C–X es polar porque el halógeno es más electronegativo: el carbono queda δ+ y puede ser atacado por un nucleófilo (nucleophile), una especie con un par de electrones libre que se dona, como OH⁻, CN⁻ o NH₃. La reactividad depende sobre todo de la entalpía de enlace (bond enthalpy): el C–I es el más débil, así que los yodoalcanos reaccionan más rápido; el C–F es tan fuerte que casi no reacciona.\n\nEn la sustitución nucleófila (nucleophilic substitution), el nucleófilo ataca al carbono δ+ y el halógeno sale como ion haluro. Con NaOH acuoso y caliente (reflux) se forma un alcohol; con KCN en etanol/agua se forma un nitrilo (alarga la cadena un carbono); con amoníaco en exceso en etanol, calentado a presión, se forma una amina. Si usamos KOH en etanol y calor, el OH⁻ actúa como base y ocurre una eliminación (elimination) que forma un alqueno.\n\nLos clorofluorocarbonos (CFCs) dañaron la capa de ozono: la luz UV rompe el enlace C–Cl y libera radicales de cloro (Cl•) que destruyen el ozono en una reacción en cadena. El ozono nos protege absorbiendo la radiación UV dañina, así que los CFC se prohibieron y se sustituyeron por HFC, que no contienen cloro.", "analogia": "Un nucleófilo es como alguien con regalo en mano (un par de electrones) que busca a quien le falte algo: el carbono δ+. Cuando se acerca y entrega su regalo, el halógeno 'se va' llevándose los electrones del enlace, como en un cambio de pareja de baile.", "ejemplo": "Bromoetano con NaOH acuoso caliente: CH₃CH₂Br + NaOH → CH₃CH₂OH + NaBr (sustitución). El mismo bromoetano con KOH en etanol caliente: CH₃CH₂Br + KOH → CH₂=CH₂ + KBr + H₂O (eliminación). ¡El disolvente decide el producto!", "puntos": ["El enlace C–X es polar (polar bond): carbono δ+, halógeno δ−.", "La reactividad está controlada por la entalpía de enlace (bond enthalpy) C–X: C–I reacciona más rápido, C–F el más lento.", "Sustitución nucleófila (nucleophilic substitution) con OH⁻ (acuoso), CN⁻ y NH₃ da alcoholes, nitrilos y aminas.", "Eliminación (elimination) con KOH en etanol caliente: el OH⁻ actúa como base (base) y se forma un alqueno.", "Los CFCs liberan Cl• con UV, que cataliza la destrucción del ozono (ozone depletion).", "Los HFC (hydrofluorocarbons) sustituyen a los CFC porque no contienen cloro."], "formulas": ["CH₃CH₂Br + NaOH → CH₃CH₂OH + NaBr", "CH₃CH₂Br + KCN → CH₃CH₂CN + KBr", "CH₃CH₂Br + 2NH₃ → CH₃CH₂NH₂ + NH₄Br", "CH₃CH₂Br + KOH → CH₂=CH₂ + KBr + H₂O (en etanol)", "CF₂Cl₂ → •CF₂Cl + Cl• (luz UV)", "Cl• + O₃ → ClO• + O₂;   ClO• + O₃ → 2O₂ + Cl•", "Global: 2O₃ → 3O₂"], "glosario": [{"en": "nucleophile", "es": "nucleófilo"}, {"en": "nucleophilic substitution", "es": "sustitución nucleófila"}, {"en": "elimination", "es": "eliminación"}, {"en": "ozone depletion", "es": "agotamiento del ozono"}, {"en": "reflux", "es": "reflujo"}], "flashcards": [{"q": "Define nucleófilo (nucleophile)", "a": "Un donador de un par de electrones."}, {"q": "¿Qué halogenoalcano reacciona más rápido y por qué?", "a": "El yodoalcano: el enlace C–I tiene la menor entalpía de enlace."}, {"q": "Condiciones para sustitución con OH⁻", "a": "NaOH o KOH acuoso, calentar a reflujo."}, {"q": "Condiciones para eliminación", "a": "KOH en etanol, calentar."}, {"q": "¿Por qué el Cl• destruye tanto ozono?", "a": "Se regenera en la propagación: actúa como catalizador en una reacción en cadena."}, {"q": "¿Qué se forma al reaccionar un halogenoalcano con KCN?", "a": "Un nitrilo, con un carbono más en la cadena."}], "preguntas": [{"q": "¿Por qué el carbono del enlace C–Br es atacado por nucleófilos?", "op": ["Tiene un par solitario", "Es δ+ porque el Br es más electronegativo", "Es δ− y atrae cationes", "Es un radical libre"], "ok": 1, "exp": "El Br atrae los electrones del enlace; el C queda parcialmente positivo y atrae al par de electrones del nucleófilo."}, {"q": "¿Qué halogenoalcano se hidroliza más rápido?", "op": ["1-fluoropropano", "1-cloropropano", "1-bromopropano", "1-yodopropano"], "ok": 3, "exp": "El C–I es el enlace más débil (menor bond enthalpy), así que se rompe más fácil."}, {"q": "2-bromopropano + KOH en etanol caliente produce principalmente…", "op": ["Propeno", "Propan-2-ol", "Propanonitrilo", "Propilamina"], "ok": 0, "exp": "En etanol el OH⁻ actúa como base: elimina HBr y se forma propeno."}, {"q": "¿Qué producto se obtiene de CH₃CH₂Br con exceso de NH₃ en etanol?", "op": ["CH₃CH₂OH", "CH₃CH₂CN", "CH₃CH₂NH₂", "CH₂=CH₂"], "ok": 2, "exp": "El NH₃ es el nucleófilo: se forma etilamina (una amina primaria). El exceso evita sustituciones posteriores."}, {"q": "¿Por qué los HFC no dañan la capa de ozono como los CFC?", "op": ["No absorben luz UV", "No contienen cloro que forme radicales Cl•", "Son más reactivos", "No llegan a la atmósfera"], "ok": 1, "exp": "El daño lo causan los radicales Cl•; el enlace C–F es muy fuerte y no forma radicales que destruyan ozono."}], "feynman": "Explica cómo un solo átomo de cloro puede destruir miles de moléculas de ozono, como si fuera un ladrón que nunca es atrapado y vuelve a salir después de cada robo.", "conexion": ["¿Cómo se relaciona la sustitución con KCN con la necesidad de alargar cadenas de carbono para sintetizar medicamentos?", "Usa lo que sabes de entalpía de enlace (bond enthalpy) en Energética para explicar por qué la polaridad del enlace C–X NO es lo que más influye en la velocidad de hidrólisis."], "examen": {"q": "Bromoethane reacts with warm aqueous sodium hydroxide. Name the type of reaction and the mechanism, identify the role of the hydroxide ion, and describe the mechanism in words (the curly arrows you would draw). Explain why iodoethane would react faster.", "marks": 5, "ms": "1: Nucleophilic substitution; OH⁻ acts as a nucleophile (electron pair donor). 2: Curly arrow from lone pair on O of OH⁻ to the δ+ carbon. 3: Curly arrow from C–Br bond to Br, Br⁻ leaves; product CH₃CH₂OH. 4: C–I bond is weaker / has lower bond enthalpy than C–Br. 5: So less energy is needed to break it, giving a faster reaction."}}, {"id": "QUI12", "materia": "Química", "mesa": "AQA", "rama": "Química Orgánica", "tema": "Alquenos", "temaEN": "Alkenes", "explicacion": "Los alquenos (alkenes) son hidrocarburos insaturados (unsaturated hydrocarbons) con al menos un doble enlace C=C; su fórmula general es CₙH₂ₙ. El doble enlace está formado por un enlace σ (sigma) y un enlace π (pi), una zona con alta densidad de electrones (electron density) arriba y abajo del plano. El enlace π impide la rotación (restricted rotation), lo que permite la isomería E/Z (E/Z stereoisomerism): si cada carbono del doble enlace tiene dos grupos distintos, los grupos de mayor prioridad (mayor número atómico, reglas CIP) pueden quedar del mismo lado (Z) o en lados opuestos (E).\n\nComo el doble enlace es rico en electrones, atrae a los electrófilos (electrophiles), que aceptan pares de electrones. La reacción típica es la adición electrófila (electrophilic addition) con HBr, Br₂ o H₂SO₄ concentrado: el doble enlace se rompe y se forma un carbocatión intermediario. Con alquenos asimétricos, el producto principal sale del carbocatión más estable: terciario > secundario > primario. La prueba del bromo: el agua de bromo naranja se vuelve incolora con un alqueno.\n\nLos alquenos forman polímeros de adición (addition polymers), como el poli(eteno) o el PVC, poli(cloroeteno). Las cadenas largas saturadas resultantes son poco reactivas y por eso no son biodegradables. Al PVC se le pueden añadir plastificantes (plasticisers) que separan las cadenas para hacerlo flexible.", "analogia": "El doble enlace es como una piñata llena de dulces (electrones): los electrófilos son los niños que la buscan porque quieren electrones. Y la isomería E/Z es como dos personas sentadas en un columpio de sube y baja: pueden quedar del mismo lado (Z, 'zusammen' = juntos) o en lados opuestos (E, 'entgegen' = opuestos).", "ejemplo": "Propeno + HBr: el H⁺ se une primero y puede formar un carbocatión secundario (más estable) o primario. El secundario lleva al producto principal, 2-bromopropano (CH₃CHBrCH₃); el 1-bromopropano sale en menor cantidad.", "puntos": ["Alquenos (alkenes): CₙH₂ₙ, insaturados, con un enlace σ y un enlace π en el C=C.", "Isomería E/Z (E/Z stereoisomerism): requiere rotación restringida y dos grupos distintos en cada carbono del C=C; se usan prioridades CIP.", "Adición electrófila (electrophilic addition) con HBr, Br₂ y H₂SO₄ vía un carbocatión (carbocation).", "Estabilidad de carbocationes: terciario > secundario > primario; decide el producto principal (major product).", "Prueba (test): agua de bromo (bromine water) pasa de naranja a incolora con un alqueno.", "Polímeros de adición (addition polymers): poli(eteno), poli(propeno), PVC; no biodegradables por ser cadenas saturadas poco reactivas."], "formulas": ["Alquenos: CₙH₂ₙ", "CH₂=CH₂ + Br₂ → CH₂BrCH₂Br", "CH₂=CH₂ + HBr → CH₃CH₂Br", "CH₃CH=CH₂ + HBr → CH₃CHBrCH₃ (producto principal)", "CH₂=CH₂ + H₂SO₄ → CH₃CH₂OSO₂OH;   CH₃CH₂OSO₂OH + H₂O → CH₃CH₂OH + H₂SO₄", "n CH₂=CH₂ → –[CH₂–CH₂]ₙ–"], "glosario": [{"en": "electrophile", "es": "electrófilo"}, {"en": "electrophilic addition", "es": "adición electrófila"}, {"en": "carbocation", "es": "carbocatión"}, {"en": "addition polymer", "es": "polímero de adición"}, {"en": "stereoisomers", "es": "estereoisómeros"}], "flashcards": [{"q": "Define electrófilo (electrophile)", "a": "Un aceptor de un par de electrones."}, {"q": "¿Qué observas al añadir agua de bromo a un alqueno?", "a": "Pasa de naranja a incolora."}, {"q": "¿Por qué existe la isomería E/Z?", "a": "Rotación restringida del C=C y dos grupos distintos en cada carbono."}, {"q": "Orden de estabilidad de carbocationes", "a": "Terciario > secundario > primario."}, {"q": "¿Por qué los polímeros de adición no son biodegradables?", "a": "Sus cadenas son saturadas con enlaces C–C y C–H fuertes y no polares: muy poco reactivas."}, {"q": "¿Qué hace un plastificante (plasticiser) en el PVC?", "a": "Se mete entre las cadenas y las separa, debilitando las fuerzas intermoleculares para hacerlo flexible."}], "preguntas": [{"q": "¿Qué compuesto muestra isomería E/Z?", "op": ["Propeno", "But-2-eno", "But-1-eno", "Eteno"], "ok": 1, "exp": "En but-2-eno (CH₃CH=CHCH₃) cada carbono del doble enlace tiene dos grupos distintos (H y CH₃)."}, {"q": "¿Cuál es el producto principal de propeno + HBr?", "op": ["1-bromopropano", "1,2-dibromopropano", "2-bromopropano", "Propan-2-ol"], "ok": 2, "exp": "Se forma vía el carbocatión secundario, más estable que el primario."}, {"q": "¿Por qué los alquenos reaccionan con electrófilos?", "op": ["El C=C tiene una zona de alta densidad electrónica (enlace π)", "Son saturados", "Tienen carbonos δ+", "Tienen pares solitarios"], "ok": 0, "exp": "El enlace π concentra electrones sobre y bajo el plano, que atraen a especies deficientes en electrones."}, {"q": "¿Cuál es la fórmula de la unidad repetitiva del PVC?", "op": ["–[CH₂–CH₂]–", "–[CH₂–CH(CH₃)]–", "–[CF₂–CF₂]–", "–[CH₂–CHCl]–"], "ok": 3, "exp": "El PVC se forma a partir de cloroeteno, CH₂=CHCl."}, {"q": "¿Qué tipo de enlace se rompe en una adición electrófila al eteno?", "op": ["El enlace σ del C=C", "El enlace π del C=C", "Un enlace C–H", "Los dos enlaces del C=C"], "ok": 1, "exp": "El enlace π es más débil y sus electrones atacan al electrófilo; el enlace σ se mantiene."}], "feynman": "Explica por qué el agua de bromo 'pierde su color' con un alqueno, como si el bromo se 'pegara' a la molécula y dejara de flotar libre en el agua.", "conexion": ["¿Cómo se relaciona el craqueo (cracking) de los alcanos con la producción de plásticos como el poli(eteno)?", "¿Qué ventajas y desventajas tiene incinerar polímeros frente a reciclarlos, considerando lo que sabes de combustión?"], "examen": {"q": "Propene reacts with hydrogen bromide to form two isomeric products. Name the mechanism, name the major product and explain why it is formed in greater amount.", "marks": 4, "ms": "1: Electrophilic addition. 2: Major product is 2-bromopropane. 3: Formed via a secondary carbocation (minor product 1-bromopropane via primary carbocation). 4: Secondary carbocation is more stable than primary because it has more alkyl groups which (positive) inductive effect / push electron density towards the positive carbon."}}, {"id": "QUI13", "materia": "Química", "mesa": "AQA", "rama": "Química Orgánica", "tema": "Alcoholes", "temaEN": "Alcohols", "explicacion": "Los alcoholes (alcohols) tienen el grupo funcional –OH (hidroxilo) y fórmula general CₙH₂ₙ₊₁OH; su nombre termina en -ol (etanol, propan-2-ol). Se clasifican en primarios (primary), secundarios (secondary) o terciarios (tertiary) según cuántos carbonos están unidos al carbono que lleva el –OH (1, 2 o 3).\n\nEl etanol se produce de dos formas. La fermentación (fermentation) de glucosa con levadura a ~35 °C y sin oxígeno es renovable pero lenta y da etanol impuro. La hidratación del eteno (hydration of ethene) con vapor, catalizador de ácido fosfórico, ~300 °C y 60–70 atm es rápida y da etanol puro, pero usa petróleo, que no es renovable. El bioetanol se describe como 'neutro en carbono' (carbon neutral), aunque en la práctica la maquinaria, el transporte y los fertilizantes emiten CO₂.\n\nCon dicromato de potasio acidificado (acidified potassium dichromate(VI), K₂Cr₂O₇/H₂SO₄), que pasa de naranja a verde, los alcoholes primarios se oxidan a aldehídos (aldehydes, destilando) y luego a ácidos carboxílicos (carboxylic acids, a reflujo con exceso de oxidante); los secundarios dan cetonas (ketones); los terciarios no se oxidan. Además, con ácido concentrado (H₂SO₄ o H₃PO₄) y calor, los alcoholes pierden agua en una eliminación (elimination/dehydration) y forman alquenos, una forma de obtener polímeros sin petróleo.", "analogia": "Oxidar un alcohol primario es como subir escalones: primero llegas al aldehído y, si no te 'sacan' rápido de la escalera (destilación), sigues subiendo hasta el ácido carboxílico. Un alcohol terciario es como alguien sin escalera: no tiene H en su carbono para empezar a subir.", "ejemplo": "Cuando el vino se deja abierto se vuelve vinagre: el etanol se oxida a ácido etanoico (CH₃COOH) con el oxígeno del aire, ayudado por bacterias. En el laboratorio: CH₃CH₂OH + 2[O] → CH₃COOH + H₂O.", "puntos": ["Alcoholes (alcohols): grupo –OH; primarios, secundarios y terciarios según los carbonos unidos al C–OH.", "Fermentación (fermentation): C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ con levadura, 30–40 °C, sin aire.", "Hidratación del eteno (hydration of ethene): vapor, H₃PO₄, ~300 °C, 60–70 atm.", "Oxidación con K₂Cr₂O₇ acidificado (naranja → verde): primario → aldehído → ácido carboxílico; secundario → cetona; terciario no reacciona.", "Aldehídos y cetonas se distinguen con el reactivo de Tollens (Tollens' reagent, espejo de plata) o de Fehling (Fehling's solution, azul → precipitado rojo ladrillo).", "Eliminación (elimination/dehydration) con ácido concentrado y calor: alcohol → alqueno + agua."], "formulas": ["C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂", "C₂H₄ + H₂O ⇌ C₂H₅OH", "CH₃CH₂OH + [O] → CH₃CHO + H₂O", "CH₃CH₂OH + 2[O] → CH₃COOH + H₂O", "CH₃CH(OH)CH₃ + [O] → CH₃COCH₃ + H₂O", "CH₃CH₂OH → CH₂=CH₂ + H₂O (H₂SO₄ o H₃PO₄ concentrado, calor)"], "glosario": [{"en": "fermentation", "es": "fermentación"}, {"en": "oxidising agent", "es": "agente oxidante"}, {"en": "aldehyde", "es": "aldehído"}, {"en": "ketone", "es": "cetona"}, {"en": "dehydration", "es": "deshidratación"}], "flashcards": [{"q": "¿Qué se forma al oxidar un alcohol secundario?", "a": "Una cetona (ketone)."}, {"q": "Cambio de color del dicromato acidificado al oxidar", "a": "De naranja a verde."}, {"q": "¿Cómo obtienes un aldehído y no un ácido?", "a": "Destilando el aldehído en cuanto se forma (y sin exceso de oxidante)."}, {"q": "Condiciones de la fermentación", "a": "Levadura, 30–40 °C, sin oxígeno (anaerobic), disolución acuosa."}, {"q": "¿Por qué no se oxida un alcohol terciario?", "a": "El carbono del –OH no tiene un H que se pueda eliminar."}, {"q": "¿Qué observas con Tollens si hay un aldehído?", "a": "Se forma un espejo de plata (silver mirror)."}], "preguntas": [{"q": "¿Qué tipo de alcohol es el 2-metilpropan-2-ol?", "op": ["Primario", "Secundario", "Terciario", "No es un alcohol"], "ok": 2, "exp": "El carbono con el –OH está unido a tres carbonos: es terciario."}, {"q": "¿Qué se obtiene al calentar a reflujo etanol con exceso de dicromato acidificado?", "op": ["Ácido etanoico", "Etanal", "Eteno", "Propanona"], "ok": 0, "exp": "A reflujo, el aldehído no escapa y sigue oxidándose hasta el ácido carboxílico."}, {"q": "¿Cuál es una ventaja de la hidratación del eteno frente a la fermentación?", "op": ["Usa recursos renovables", "Funciona a temperatura ambiente", "Es neutra en carbono", "Es rápida y da etanol puro"], "ok": 3, "exp": "La hidratación es un proceso continuo, rápido y produce etanol puro, aunque usa petróleo."}, {"q": "¿Qué reactivo distingue un aldehído de una cetona?", "op": ["Agua de bromo", "Reactivo de Fehling", "Nitrato de plata acidificado", "Hidróxido de sodio"], "ok": 1, "exp": "El aldehído reduce el Fehling (azul → precipitado rojo ladrillo); la cetona no reacciona."}, {"q": "¿Qué producto se forma al deshidratar propan-1-ol con ácido fosfórico concentrado caliente?", "op": ["Propanal", "Propanona", "Propeno", "Propano"], "ok": 2, "exp": "La eliminación de agua forma el alqueno: CH₃CH₂CH₂OH → CH₃CH=CH₂ + H₂O."}], "feynman": "Explica por qué el bioetanol se llama 'neutro en carbono' y por qué en realidad no lo es del todo, usando la idea de una cuenta bancaria de CO₂.", "conexion": ["¿Cómo se relaciona la deshidratación de alcoholes con la posibilidad de fabricar plásticos sin petróleo?", "¿Qué tienen en común el principio de Le Chatelier y la elección de condiciones en la hidratación del eteno?"], "examen": {"q": "Propan-1-ol can be oxidised to form two different organic products. Identify a suitable oxidising agent, state the colour change, and explain how the conditions can be chosen to obtain each product. Name both products.", "marks": 5, "ms": "1: Acidified potassium dichromate(VI) (K₂Cr₂O₇/H₂SO₄). 2: Orange to green. 3: Propanal (aldehyde) obtained by distilling the product as it forms / limited oxidising agent. 4: Propanoic acid obtained by heating under reflux with excess oxidising agent. 5: Reflux prevents the aldehyde escaping so it is further oxidised."}}, {"id": "QUI14", "materia": "Química", "mesa": "AQA", "rama": "Química Orgánica", "tema": "Técnicas analíticas", "temaEN": "Organic analysis", "explicacion": "Para identificar un compuesto orgánico primero se hacen pruebas en tubo de ensayo (test-tube reactions) para detectar grupos funcionales: el agua de bromo identifica alquenos (naranja → incolora); el dicromato acidificado detecta alcoholes primarios y secundarios (naranja → verde); Tollens o Fehling detectan aldehídos; y el carbonato de sodio o el bicarbonato producen burbujas de CO₂ con ácidos carboxílicos. Antes, a veces hay que purificar o separar la mezcla; la cromatografía (chromatography) es una técnica general de separación, aunque en AQA Year 1 no es el foco.\n\nLa espectrometría de masas (mass spectrometry) da la masa del ion molecular (molecular ion, M⁺) y, por lo tanto, la Mr. La espectrometría de alta resolución (high resolution mass spectrometry) mide la masa con 4 o más decimales, lo que permite distinguir compuestos con la misma Mr entera, por ejemplo C₃H₈, CO₂ y C₂H₄O (todos Mr ≈ 44), usando masas precisas como ¹H = 1.0078, ¹²C = 12.0000 y ¹⁶O = 15.9949.\n\nLa espectroscopía infrarroja (infrared spectroscopy, IR) se basa en que los enlaces absorben radiación IR a frecuencias características (en número de onda, cm⁻¹). Picos clave: O–H de alcohol (3230–3550, ancho), O–H de ácido (2500–3000, muy ancho), C=O (1680–1750) y C–H (2850–3300). La zona por debajo de 1500 cm⁻¹ es la región de huella dactilar (fingerprint region), única para cada molécula. Gases como CO₂, CH₄ y H₂O absorben IR, por eso son gases de efecto invernadero (greenhouse gases).", "analogia": "Analizar un compuesto es como un trabajo de detective: las pruebas en tubo de ensayo son los interrogatorios rápidos, el espectro de masas es la báscula que pesa al sospechoso con muchísima precisión y el espectro IR es la huella dactilar, que confirma su identidad.", "ejemplo": "Un compuesto tiene M⁺ = 44.0262 en alta resolución. C₃H₈ = 3(12.0000) + 8(1.0078) = 44.0624; CO₂ = 12.0000 + 2(15.9949) = 43.9898; C₂H₄O = 2(12.0000) + 4(1.0078) + 15.9949 = 44.0261. ¡Es C₂H₄O! Si además su IR muestra un pico fuerte a ~1730 cm⁻¹ (C=O) y da espejo de plata con Tollens, es el etanal (CH₃CHO).", "puntos": ["Pruebas químicas (test-tube reactions): agua de bromo para alquenos, dicromato para alcoholes, Tollens/Fehling para aldehídos, NaHCO₃ para ácidos carboxílicos.", "El ion molecular (molecular ion, M⁺) en el espectro de masas da la Mr del compuesto.", "La espectrometría de alta resolución (high resolution mass spectrometry) distingue fórmulas moleculares con la misma Mr entera.", "En IR (infrared spectroscopy) los enlaces absorben a números de onda característicos (wavenumber, cm⁻¹).", "Picos clave: O–H alcohol 3230–3550 (ancho), O–H ácido 2500–3000 (muy ancho), C=O 1680–1750, C–H 2850–3300.", "La región de huella dactilar (fingerprint region, < 1500 cm⁻¹) identifica el compuesto comparándolo con una base de datos; la cromatografía (chromatography) sirve para separar mezclas."], "formulas": ["Masas precisas: ¹H = 1.0078, ¹²C = 12.0000, ¹⁴N = 14.0031, ¹⁶O = 15.9949", "Ácido carboxílico: CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂", "Alqueno: CH₂=CH₂ + Br₂ → CH₂BrCH₂Br (naranja → incolora)"], "glosario": [{"en": "molecular ion", "es": "ion molecular"}, {"en": "high resolution mass spectrometry", "es": "espectrometría de masas de alta resolución"}, {"en": "infrared spectroscopy", "es": "espectroscopía infrarroja"}, {"en": "wavenumber", "es": "número de onda"}, {"en": "fingerprint region", "es": "región de huella dactilar"}], "flashcards": [{"q": "¿Qué indica un pico ancho entre 2500 y 3000 cm⁻¹?", "a": "O–H de un ácido carboxílico."}, {"q": "¿Qué indica un pico fuerte en 1680–1750 cm⁻¹?", "a": "Un enlace C=O (aldehído, cetona, ácido o éster)."}, {"q": "¿Para qué sirve la espectrometría de masas de alta resolución?", "a": "Para determinar la fórmula molecular exacta distinguiendo compuestos con la misma Mr entera."}, {"q": "¿Qué es la región de huella dactilar (fingerprint region)?", "a": "La zona por debajo de 1500 cm⁻¹, única para cada compuesto."}, {"q": "Prueba para ácido carboxílico", "a": "Añadir NaHCO₃ o Na₂CO₃: efervescencia de CO₂ que enturbia el agua de cal."}, {"q": "¿Por qué el CO₂ es un gas de efecto invernadero?", "a": "Sus enlaces absorben radiación infrarroja emitida por la Tierra."}], "preguntas": [{"q": "Un espectro IR muestra un pico ancho a 3350 cm⁻¹ y ningún pico en 1680–1750 cm⁻¹. ¿Qué compuesto puede ser?", "op": ["Etanol", "Etanal", "Ácido etanoico", "Propanona"], "ok": 0, "exp": "El O–H de alcohol absorbe en 3230–3550; la ausencia de C=O descarta aldehídos, cetonas y ácidos."}, {"q": "¿Qué reactivo identifica un ácido carboxílico?", "op": ["Agua de bromo", "Reactivo de Tollens", "Bicarbonato de sodio", "Nitrato de plata"], "ok": 2, "exp": "El ácido reacciona con NaHCO₃ y produce efervescencia de CO₂."}, {"q": "En alta resolución, un compuesto tiene M⁺ = 43.9898. ¿Cuál es? (H 1.0078, C 12.0000, O 15.9949)", "op": ["C₃H₈", "C₂H₄O", "CH₃NO", "CO₂"], "ok": 3, "exp": "CO₂ = 12.0000 + 2 × 15.9949 = 43.9898."}, {"q": "¿Qué información da directamente el pico del ion molecular (M⁺)?", "op": ["El grupo funcional", "La Mr del compuesto", "El número de isómeros", "La temperatura de ebullición"], "ok": 1, "exp": "El M⁺ es la molécula entera ionizada, así que su m/z corresponde a la Mr."}, {"q": "¿Qué prueba distingue el propanal de la propanona?", "op": ["Agua de bromo", "Reactivo de Tollens", "Espectro IR en 1680–1750 cm⁻¹", "Mr en el espectro de masas de baja resolución"], "ok": 1, "exp": "Solo el aldehído da espejo de plata. Ambos tienen C=O y la misma Mr (58), así que IR y masa de baja resolución no los distinguen."}], "feynman": "Explica a una amiga cómo la espectroscopía IR puede 'ver' los enlaces de una molécula, comparándolo con cuerdas de guitarra que solo vibran con ciertas notas.", "conexion": ["¿Cómo combinarías la oxidación de alcoholes (de Alcoholes) con un espectro IR para demostrar que un alcohol primario se convirtió en ácido carboxílico?", "¿Cómo se usa la espectroscopía IR en los alcoholímetros de la policía o para vigilar contaminantes en el aire?"], "examen": {"q": "A compound X has the molecular formula C₃H₆O. Its infrared spectrum shows a strong absorption at 1715 cm⁻¹ and no broad absorption between 3230 and 3550 cm⁻¹. X does not react with Tollens' reagent. Identify X, explaining how each piece of evidence supports your answer.", "marks": 4, "ms": "1: Absorption at 1715 cm⁻¹ shows C=O present. 2: No broad absorption at 3230–3550 cm⁻¹ so no O–H / not an alcohol. 3: No silver mirror with Tollens', so not an aldehyde (propanal ruled out); X is a ketone. 4: X is propanone, CH₃COCH₃."}}, {"id": "FIS01", "materia": "Física", "mesa": "AQA", "rama": "Física", "tema": "Mediciones y errores", "temaEN": "Measurements and their errors", "explicacion": "En física todo se mide con unidades del Sistema Internacional (SI units). Las 6 unidades base que pide AQA son: metro (m), kilogramo (kg), segundo (s), ampere (A), kelvin (K) y mol (mol). Las demás son derivadas: por ejemplo, el newton es kg m s⁻². También usarás prefijos (prefixes) como nano (10⁻⁹), micro (10⁻⁶), mili (10⁻³), kilo (10³), mega (10⁶) y giga (10⁹).\n\nNinguna medición es perfecta. El error aleatorio (random error) hace que las lecturas varíen sin patrón alrededor del valor real; se reduce repitiendo y promediando. El error sistemático (systematic error) desplaza todas las lecturas en la misma dirección, por ejemplo un error de cero (zero error) en una balanza; no se quita promediando, hay que calibrar o corregir el instrumento. La precisión (precision) indica qué tan cerca están las lecturas entre sí; la exactitud (accuracy), qué tan cerca están del valor real.\n\nLa incertidumbre (uncertainty) indica el rango donde probablemente está el valor real. Puede ser absoluta (absolute, ±0.1 cm), fraccional o porcentual (percentage). Reglas clave: al sumar o restar cantidades, se suman las incertidumbres absolutas; al multiplicar o dividir, se suman las porcentuales; al elevar a una potencia, se multiplica la incertidumbre porcentual por la potencia. En una gráfica, las barras de error (error bars) y las líneas de mejor y peor ajuste (best fit / worst fit) dan la incertidumbre de la pendiente.", "analogia": "Imagina que juegas a los dardos. Si todos tus dardos caen juntos pero lejos del centro, eres precisa pero no exacta (error sistemático). Si caen repartidos alrededor del centro, eres exacta en promedio pero poco precisa (error aleatorio). Lo ideal: todos juntos y en el centro.", "ejemplo": "Mides V = 6.0 ± 0.1 V e I = 0.50 ± 0.02 A. R = V/I = 12 Ω. Incertidumbre porcentual: 0.1/6.0 = 1.7% y 0.02/0.50 = 4.0%; total = 5.7%. Incertidumbre absoluta = 5.7% de 12 ≈ 0.7 Ω, así que R = 12.0 ± 0.7 Ω.", "puntos": ["Unidades base del SI: m, kg, s, A, K, mol (SI base units).", "Error aleatorio se reduce repitiendo y promediando; el sistemático, calibrando (random / systematic error).", "Precisión = lecturas cercanas entre sí; exactitud = cerca del valor real (precision / accuracy).", "Suma/resta: se suman incertidumbres absolutas; multiplicación/división: se suman porcentuales (combining uncertainties).", "Potencias: la incertidumbre porcentual se multiplica por el exponente (p. ej. r² → 2 × %r).", "La resolución (resolution) de un instrumento es el cambio más pequeño que puede detectar."], "formulas": ["Incertidumbre porcentual = (incertidumbre absoluta ÷ valor medido) × 100%", "Si y = a × b o y = a ÷ b: %y = %a + %b", "Si y = aⁿ: %y = n × %a", "Incertidumbre de una media ≈ rango ÷ 2", "Incertidumbre de la pendiente = |pendiente mejor − pendiente peor|"], "glosario": [{"en": "uncertainty", "es": "incertidumbre"}, {"en": "zero error", "es": "error de cero"}, {"en": "precision", "es": "precisión"}, {"en": "accuracy", "es": "exactitud"}, {"en": "significant figures", "es": "cifras significativas"}], "flashcards": [{"q": "¿Cuáles son las unidades base del SI que pide AQA?", "a": "m, kg, s, A, K y mol."}, {"q": "¿Cómo se reduce un error aleatorio?", "a": "Repitiendo mediciones y calculando la media."}, {"q": "¿Qué es un error de cero?", "a": "Un error sistemático: el instrumento no marca cero cuando debería."}, {"q": "Si r tiene 2% de incertidumbre, ¿cuánto tiene el área πr²?", "a": "4% (2 × 2%)."}, {"q": "Expresa el newton en unidades base", "a": "kg m s⁻²."}, {"q": "¿Qué es la resolución de un instrumento?", "a": "El cambio más pequeño en la cantidad que el instrumento puede detectar."}], "preguntas": [{"q": "¿Cuál NO es una unidad base del SI?", "op": ["kelvin", "ampere", "volt", "mol"], "ok": 2, "exp": "El volt es derivado (kg m² s⁻³ A⁻¹). Kelvin, ampere y mol son unidades base."}, {"q": "Una balanza marca 0.3 g sin nada encima. Esto es...", "op": ["un error sistemático", "un error aleatorio", "un problema de resolución", "un error humano de paralaje"], "ok": 0, "exp": "Es un error de cero, que desplaza todas las lecturas igual: sistemático. Se corrige restando 0.3 g o recalibrando."}, {"q": "L = 2.00 ± 0.02 m. ¿Cuál es la incertidumbre porcentual de L³?", "op": ["1%", "0.3%", "6%", "3%"], "ok": 3, "exp": "%L = 0.02/2.00 = 1%; al elevar al cubo se multiplica por 3: 3%. 1% es solo de L; 6% y 0.3% son errores de cálculo."}, {"q": "a = 5.0 ± 0.2 cm y b = 3.0 ± 0.1 cm. ¿Incertidumbre de a − b?", "op": ["± 0.1 cm", "± 0.3 cm", "± 0.2 cm", "± 0.02 cm"], "ok": 1, "exp": "En una resta se SUMAN las incertidumbres absolutas: 0.2 + 0.1 = 0.3 cm. Nunca se restan."}, {"q": "Lecturas muy parecidas entre sí pero lejos del valor real son...", "op": ["exactas pero no precisas", "precisas y exactas", "precisas pero no exactas", "ni precisas ni exactas"], "ok": 2, "exp": "Estar cerca entre sí es precisión; estar lejos del valor real indica falta de exactitud (probable error sistemático)."}], "feynman": "Explícale a un amigo, usando una báscula de baño y una cinta métrica, la diferencia entre 'medir bien' (exactitud) y 'medir siempre igual' (precisión).", "conexion": ["En química titulas con bureta (±0.05 cm³): ¿cómo calcularías la incertidumbre porcentual de un volumen de 25.00 cm³?", "Cuando una app de clima dice '70% de probabilidad de lluvia', ¿en qué se parece eso a dar un valor con incertidumbre?"], "examen": {"q": "A student measures the diameter of a wire as 0.50 ± 0.01 mm. Calculate the percentage uncertainty in the cross-sectional area of the wire, and state one way to reduce the uncertainty in the diameter.", "marks": 4, "ms": "1. Percentage uncertainty in d = 0.01/0.50 × 100 = 2%. 2. A = πd²/4, so uncertainty doubles because d is squared. 3. Percentage uncertainty in A = 4%. 4. Take repeat readings at different points/orientations along the wire and calculate a mean, or use a micrometer with higher resolution."}}, {"id": "FIS02", "materia": "Física", "mesa": "AQA", "rama": "Física", "tema": "Partículas y radiación", "temaEN": "Particles and radiation", "explicacion": "Un átomo tiene un núcleo con protones (protons) y neutrones (neutrons), rodeado de electrones (electrons). El número de protones es el número atómico Z y protones + neutrones es el número de nucleones A; los isótopos (isotopes) tienen igual Z y distinto A. La carga específica (specific charge) es carga ÷ masa (C kg⁻¹). La fuerza nuclear fuerte (strong nuclear force) mantiene unido el núcleo: es atractiva hasta unos 3 fm y repulsiva por debajo de ~0.5 fm. Los núcleos inestables decaen: en el decaimiento alfa sale un núcleo de helio; en el beta menos (β⁻), un neutrón se convierte en protón y se emiten un electrón y un antineutrino (antineutrino).\n\nCada partícula tiene su antipartícula (antiparticle) con la misma masa y carga opuesta: el positrón (positron) es el antielectrón. Al encontrarse se aniquilan (annihilation) y producen dos fotones; al revés, un fotón con energía suficiente puede crear un par partícula-antipartícula (pair production). Los hadrones (hadrons) sienten la fuerza fuerte y están hechos de quarks: bariones (baryons, 3 quarks, como el protón uud y el neutrón udd) y mesones (mesons, quark + antiquark, como piones y kaones). Los leptones (leptons: electrón, muón, neutrinos) no sienten la fuerza fuerte. En toda interacción se conservan la carga, el número bariónico y el número leptónico; la extrañeza (strangeness) solo se conserva en la fuerza fuerte.\n\nLa luz viaja en paquetes de energía llamados fotones (photons), con E = hf. El efecto fotoeléctrico (photoelectric effect) demuestra esto: la luz arranca electrones de un metal solo si su frecuencia supera la frecuencia umbral (threshold frequency), sin importar la intensidad. Cada fotón da toda su energía a un electrón: hf = φ + Ek(max), donde φ es la función trabajo (work function). Los electrones en los átomos ocupan niveles de energía (energy levels): al bajar de nivel emiten un fotón con energía igual a la diferencia, lo que da los espectros de líneas (line spectra). Y los electrones también se comportan como ondas (wave-particle duality), con λ = h/mv.", "analogia": "El efecto fotoeléctrico es como intentar tumbar una lata con pelotas. Si las pelotas son de papel (frecuencia baja), no importa cuántas lances: la lata no cae. Basta una pelota de béisbol (frecuencia alta) para tumbarla. La intensidad es cuántas pelotas lanzas; la frecuencia es qué tan 'fuerte' es cada una.", "ejemplo": "Luz de λ = 400 nm sobre un metal con φ = 2.3 eV. E = hc/λ = (6.63 × 10⁻³⁴ × 3.00 × 10⁸) ÷ (4.00 × 10⁻⁷) = 4.97 × 10⁻¹⁹ J = 3.11 eV. Ek(max) = 3.11 − 2.3 = 0.81 eV ≈ 1.3 × 10⁻¹⁹ J.", "puntos": ["Isótopos: mismo número de protones, distinto número de neutrones (isotopes).", "Cada partícula tiene una antipartícula de igual masa y carga opuesta (antiparticle).", "Bariones = 3 quarks; mesones = quark + antiquark; leptones no tienen quarks (hadrons / leptons).", "Se conservan carga, número bariónico y número leptónico; la extrañeza solo en interacciones fuertes (conservation laws).", "Efecto fotoeléctrico: solo ocurre si f ≥ frecuencia umbral; la intensidad cambia el número de electrones, no su energía.", "1 eV = 1.60 × 10⁻¹⁹ J; los electrones muestran difracción, prueba de su naturaleza ondulatoria (wave-particle duality)."], "formulas": ["E = hf = hc/λ", "hf = φ + Ek(max)", "f₀ = φ/h (frecuencia umbral)", "hf = E₁ − E₂ (transición entre niveles)", "λ = h/(mv) (longitud de onda de de Broglie)", "h = 6.63 × 10⁻³⁴ J s; c = 3.00 × 10⁸ m s⁻¹; 1 eV = 1.60 × 10⁻¹⁹ J", "Protón = uud; neutrón = udd; β⁻: n → p + e⁻ + ν̄ₑ"], "glosario": [{"en": "work function", "es": "función trabajo"}, {"en": "threshold frequency", "es": "frecuencia umbral"}, {"en": "annihilation", "es": "aniquilación"}, {"en": "strangeness", "es": "extrañeza"}, {"en": "specific charge", "es": "carga específica"}], "flashcards": [{"q": "Composición de quarks del protón y del neutrón", "a": "Protón: uud; neutrón: udd."}, {"q": "¿Qué es la función trabajo?", "a": "La energía mínima necesaria para liberar un electrón de la superficie de un metal."}, {"q": "¿Qué partícula intercambia la interacción débil?", "a": "Los bosones W⁺ y W⁻."}, {"q": "¿Qué ocurre en la aniquilación?", "a": "Partícula y antipartícula se convierten en dos fotones de energía total igual a su masa-energía."}, {"q": "¿Qué cambia al aumentar la intensidad en el efecto fotoeléctrico?", "a": "Se liberan más electrones por segundo, pero su Ek(max) no cambia."}, {"q": "¿Qué es un mesón?", "a": "Un hadrón formado por un quark y un antiquark (p. ej. piones y kaones)."}], "preguntas": [{"q": "¿Qué partícula es un leptón?", "op": ["Protón", "Pion", "Muón", "Neutrón"], "ok": 2, "exp": "El muón es un leptón. Protón y neutrón son bariones y el pion es un mesón; todos ellos son hadrones."}, {"q": "Energía de un fotón de frecuencia 6.0 × 10¹⁴ Hz:", "op": ["4.0 × 10⁻¹⁹ J", "1.1 × 10⁻⁴⁸ J", "9.1 × 10⁻²⁰ J", "4.0 × 10⁻¹⁹ eV"], "ok": 0, "exp": "E = hf = 6.63 × 10⁻³⁴ × 6.0 × 10¹⁴ = 3.98 × 10⁻¹⁹ J. La D tiene las unidades equivocadas y las otras resultan de dividir o usar mal h."}, {"q": "En el decaimiento β⁻ también se emite...", "op": ["un neutrino electrónico", "un positrón", "un protón", "un antineutrino electrónico"], "ok": 3, "exp": "n → p + e⁻ + ν̄ₑ. Se emite un antineutrino para conservar el número leptónico (el e⁻ tiene +1 y el antineutrino −1)."}, {"q": "Si la frecuencia de la luz está por debajo de la umbral y se aumenta la intensidad...", "op": ["se emiten electrones más lentos", "no se emiten electrones", "se emiten más electrones", "aumenta la función trabajo"], "ok": 1, "exp": "Cada fotón sigue teniendo energía menor que φ; más fotones no ayudan porque la interacción es uno a uno."}, {"q": "¿Qué cantidad NO se conserva en la interacción débil?", "op": ["Carga", "Extrañeza", "Número bariónico", "Número leptónico"], "ok": 1, "exp": "La extrañeza puede cambiar en interacciones débiles (p. ej. el decaimiento de kaones). Carga, número bariónico y leptónico se conservan siempre."}], "feynman": "Explícale a tu mamá por qué la luz ultravioleta te quema la piel pero estar horas bajo una luz roja muy brillante no, usando la idea de 'paquetes de energía'.", "conexion": ["En química, los espectros de emisión identifican elementos (prueba de la llama): ¿cómo se relacionan con hf = E₁ − E₂?", "Los paneles solares y las cámaras de tu celular usan el efecto fotoeléctrico: ¿qué limita qué colores de luz pueden detectar?"], "examen": {"q": "Light of wavelength 400 nm is incident on a metal surface with a work function of 2.3 eV. Calculate the maximum kinetic energy of the emitted photoelectrons in joules.", "marks": 4, "ms": "1. E = hc/λ = (6.63 × 10⁻³⁴ × 3.00 × 10⁸) / (4.00 × 10⁻⁷). 2. E = 4.97 × 10⁻¹⁹ J. 3. φ = 2.3 × 1.60 × 10⁻¹⁹ = 3.68 × 10⁻¹⁹ J. 4. Ek(max) = 4.97 × 10⁻¹⁹ − 3.68 × 10⁻¹⁹ = 1.3 × 10⁻¹⁹ J."}}, {"id": "FIS03", "materia": "Física", "mesa": "AQA", "rama": "Física", "tema": "Ondas", "temaEN": "Waves", "explicacion": "Una onda progresiva (progressive wave) transfiere energía sin transferir materia. Tiene amplitud (amplitude), longitud de onda λ (wavelength), frecuencia f (frequency), periodo T = 1/f y rapidez v = fλ. En las ondas transversales (transverse) las partículas oscilan perpendiculares a la dirección de propagación (luz, ondas en una cuerda); en las longitudinales (longitudinal), paralelas (sonido), con compresiones y rarefacciones. Solo las transversales pueden polarizarse (polarisation). La diferencia de fase (phase difference) se mide en grados o radianes.\n\nCuando dos ondas se encuentran se suman (superposition). Una onda estacionaria (stationary wave) se forma al superponerse dos ondas de igual frecuencia que viajan en sentidos opuestos, por ejemplo en una cuerda de guitarra; tiene nodos (nodes, amplitud cero) y antinodos (antinodes, amplitud máxima) y no transfiere energía. En el primer armónico (first harmonic) la longitud de la cuerda es λ/2. La interferencia (interference) necesita fuentes coherentes (coherent): misma frecuencia y diferencia de fase constante. Si la diferencia de camino (path difference) es nλ hay interferencia constructiva; si es (n + ½)λ, destructiva.\n\nLa difracción (diffraction) es cuando una onda se dispersa al pasar por una rendija; es máxima cuando la rendija mide más o menos lo mismo que λ. En la doble rendija de Young (Young's double slit) se ven franjas brillantes y oscuras con separación w = λD/s. La rejilla de difracción (diffraction grating) cumple d sin θ = nλ. La refracción (refraction) es el cambio de dirección al cambiar de rapidez entre medios: n = c/cs y n₁ sin θ₁ = n₂ sin θ₂. Si la luz va a un medio de menor índice con ángulo mayor al ángulo crítico (critical angle), hay reflexión interna total (total internal reflection), base de la fibra óptica (optical fibre).", "analogia": "Una onda en un estadio (la 'ola') es perfecta: la energía da la vuelta al estadio, pero cada persona solo se para y se sienta en su lugar. Una onda estacionaria es como saltar la cuerda: hay puntos (las manos) que no se mueven (nodos) y el centro se mueve muchísimo (antinodo).", "ejemplo": "Doble rendija con λ = 600 nm, separación s = 0.40 mm y pantalla a D = 2.0 m: w = λD/s = (6.0 × 10⁻⁷ × 2.0) ÷ (4.0 × 10⁻⁴) = 3.0 × 10⁻³ m = 3.0 mm entre franjas brillantes.", "puntos": ["v = fλ y T = 1/f para toda onda progresiva (wave equation).", "Transversal: oscilación perpendicular; longitudinal: paralela. Solo las transversales se polarizan (polarisation).", "Ondas estacionarias: nodos y antinodos, sin transferencia neta de energía (stationary waves).", "Interferencia constructiva: diferencia de camino = nλ; destructiva: (n + ½)λ (path difference).", "Fuentes coherentes: misma frecuencia y diferencia de fase constante, como un láser (coherence).", "Reflexión interna total si θ > ángulo crítico y la luz va hacia un medio de menor índice (total internal reflection)."], "formulas": ["v = fλ", "T = 1/f", "f = (1/2L) √(T/μ) (primer armónico de una cuerda)", "w = λD/s (doble rendija de Young)", "d sin θ = nλ (rejilla de difracción)", "n = c/cs; n₁ sin θ₁ = n₂ sin θ₂", "sin θc = n₂/n₁", "Diferencia de fase = 2πd/λ (radianes)"], "glosario": [{"en": "node", "es": "nodo"}, {"en": "coherent", "es": "coherente"}, {"en": "fringe spacing", "es": "separación de franjas"}, {"en": "refractive index", "es": "índice de refracción"}, {"en": "superposition", "es": "superposición"}], "flashcards": [{"q": "¿Qué es una fuente coherente?", "a": "Fuentes con la misma frecuencia y una diferencia de fase constante."}, {"q": "Distancia entre dos nodos consecutivos", "a": "λ/2."}, {"q": "¿Qué pasa con w si aumentas la separación de rendijas s?", "a": "Disminuye, porque w = λD/s."}, {"q": "Condiciones para reflexión interna total", "a": "Ir de un medio de mayor a menor índice y que el ángulo de incidencia supere el crítico."}, {"q": "¿Por qué el sonido no se polariza?", "a": "Porque es longitudinal: las oscilaciones ya son paralelas a la dirección de propagación."}, {"q": "¿Para qué sirve el revestimiento (cladding) de una fibra óptica?", "a": "Tiene menor índice para permitir la reflexión interna total y protege el núcleo (reduce pérdidas y cruce de señales)."}], "preguntas": [{"q": "Una onda tiene f = 50 Hz y λ = 4.0 m. ¿Rapidez?", "op": ["12.5 m s⁻¹", "0.08 m s⁻¹", "54 m s⁻¹", "200 m s⁻¹"], "ok": 3, "exp": "v = fλ = 50 × 4.0 = 200 m s⁻¹. Las demás resultan de dividir o sumar."}, {"q": "En una onda estacionaria, los puntos entre dos nodos consecutivos oscilan...", "op": ["en fase", "en antifase", "con 90° de diferencia", "sin moverse"], "ok": 0, "exp": "Todos los puntos entre dos nodos adyacentes están en fase (con distinta amplitud); los de lados opuestos de un nodo están en antifase."}, {"q": "Rejilla de 300 líneas por mm con luz de 600 nm. ¿Orden máximo visible?", "op": ["3", "6", "5", "10"], "ok": 2, "exp": "d = 1/300 mm = 3.33 × 10⁻⁶ m; n = d/λ = 5.56; como sin θ ≤ 1, n máximo = 5 (siempre se redondea hacia abajo)."}, {"q": "¿Qué propiedad demuestra que la luz es una onda transversal?", "op": ["Refracción", "Polarización", "Difracción", "Reflexión"], "ok": 1, "exp": "Solo las ondas transversales pueden polarizarse. Refracción, difracción y reflexión ocurren en ondas transversales y longitudinales."}, {"q": "Luz pasa de vidrio (n = 1.50) a aire (n = 1.00). ¿Ángulo crítico?", "op": ["41.8°", "48.2°", "33.7°", "56.3°"], "ok": 0, "exp": "sin θc = 1.00/1.50 = 0.667 → θc = 41.8°. 48.2° es su complemento y las demás vienen de usar tan en lugar de sin."}], "feynman": "Explica a tu amiga por qué puedes oír a alguien que habla detrás de una puerta abierta aunque no lo veas, usando la palabra 'difracción' y comparando la longitud de onda del sonido con la de la luz.", "conexion": ["Los audífonos con cancelación de ruido usan interferencia destructiva: ¿qué diferencia de fase debe tener la onda que generan?", "En música, ¿por qué al apretar una cuerda de guitarra más arriba en el mástil suena más agudo? Relaciónalo con f = v/2L."], "examen": {"q": "A diffraction grating has 300 lines per mm. Monochromatic light of wavelength 600 nm is incident normally on it. Calculate the angle of the first-order maximum and the highest order that can be observed.", "marks": 4, "ms": "1. d = 1/(300 × 10³) = 3.33 × 10⁻⁶ m. 2. sin θ = nλ/d = 6.00 × 10⁻⁷ / 3.33 × 10⁻⁶ = 0.18. 3. θ = 10.4° (accept 10°). 4. n = d/λ = 5.56, so highest order = 5."}}, {"id": "FIS04", "materia": "Física", "mesa": "AQA", "rama": "Física", "tema": "Mecánica y materiales", "temaEN": "Mechanics and materials", "explicacion": "Las cantidades escalares (scalars) solo tienen magnitud (masa, rapidez, energía); las vectoriales (vectors) tienen magnitud y dirección (fuerza, velocidad, aceleración). Los vectores se suman con triángulos o se descomponen en componentes (resolving): F cos θ y F sin θ. El momento (moment) de una fuerza es F × distancia perpendicular al pivote; en equilibrio, la suma de momentos horarios es igual a la de antihorarios (principle of moments) y la fuerza resultante es cero.\n\nPara movimiento con aceleración constante se usan las ecuaciones SUVAT. En una gráfica distancia-tiempo, la pendiente es la rapidez; en una velocidad-tiempo, la pendiente es la aceleración y el área es el desplazamiento. En un proyectil (projectile) el movimiento horizontal (velocidad constante) y el vertical (aceleración g = 9.81 m s⁻²) son independientes. Las leyes de Newton dicen: un objeto sigue igual si no hay fuerza resultante (1ª), F = ma (2ª) y las fuerzas aparecen en pares iguale
