: "(Estilo tarjeta oral, Paper 3) \"La familia tradicional está desapareciendo en España.\" ¿Estás de acuerdo? Justifica tu opinión con ejemplos de la sociedad española.", "marks": 20, "ms": "AQA 7692: se valora la comprensión del estímulo y la interacción espontánea (AO1/AO2), la precisión y variedad de la lengua: subjuntivo, conectores, vocabulario temático (AO3), y el conocimiento de la sociedad hispana con opiniones justificadas y ejemplos concretos (AO4)."}}, {"id": "ESP02", "materia": "Español", "mesa": "AQA", "rama": "Cultura hispánica", "tema": "Ciberespacio y redes sociales", "temaEN": "Cyberspace and the influence of idols", "explicacion": "Este bloque une dos subtemas de AQA: El ciberespacio (cyberspace) y La influencia de los ídolos (the influence of idols). Internet y las redes sociales han cambiado cómo nos comunicamos, estudiamos, compramos y nos informamos. En España, casi todos los jóvenes tienen móvil y pasan varias horas al día en redes como Instagram, TikTok o YouTube.\n\nHay ventajas: acceso a la información, mantener el contacto, activismo y nuevas profesiones. Pero también riesgos: ciberacoso (cyberbullying), adicción, noticias falsas (fake news), pérdida de privacidad y presión por la imagen. Los 'influencers' y los ídolos (cantantes, deportistas, actores) pueden ser modelos positivos —por ejemplo, deportistas como Rafa Nadal, conocido por su esfuerzo y deportividad— o fomentar el consumismo y estándares de belleza irreales.\n\nEn el examen tienes que equilibrar los argumentos y dar ejemplos del mundo hispano. Vocabulario clave: \"las redes sociales\", \"los seguidores\", \"compartir\", \"la huella digital\", \"engancharse\". Frase útil: \"Si bien las redes sociales nos conectan, también pueden aislarnos\".", "analogia": "Las redes sociales son como un centro comercial gigante abierto 24 horas: puedes encontrar amigos, ideas y cosas útiles, pero también escaparates que te hacen sentir que nunca tienes suficiente, y gente desconocida observándote.", "ejemplo": "Rosalía, cantante catalana, se hizo mundialmente famosa con \"El mal querer\" (2018), mezclando flamenco y música urbana, y usa las redes para conectar con millones de fans. Debate posible: ¿es un buen modelo por su creatividad y por reivindicar el flamenco, o los ídolos venden una imagen de vida perfecta difícil de imitar?", "puntos": ["Ventajas de internet: información, comunicación, educación, activismo, empleo.", "Riesgos: ciberacoso, adicción, noticias falsas, privacidad, problemas de autoestima.", "Los ídolos pueden ser modelos positivos (esfuerzo, solidaridad) o negativos (consumismo, imagen irreal).", "La 'huella digital' (digital footprint) es lo que dejamos en internet y puede durar para siempre.", "Usa ejemplos hispanos: Rosalía, Shakira, Rafa Nadal, Bad Bunny, youtubers españoles.", "Estructura de opinión equilibrada: ventajas – inconvenientes – conclusión personal."], "formulas": ["Si bien... también... (Si bien las redes nos conectan, también pueden aislarnos.)", "Hay que tener en cuenta que... · Cabe destacar que...", "Me preocupa que + subjuntivo: \"Me preocupa que los jóvenes pasen tanto tiempo conectados.\"", "Si + imperfecto de subjuntivo, condicional: \"Si no existieran las redes, estaríamos más aislados.\"", "Vocabulario: ciberacoso, noticias falsas, seguidores, huella digital, engancharse"], "glosario": [{"en": "Cyberbullying", "es": "Ciberacoso"}, {"en": "Fake news", "es": "Noticias falsas / bulos"}, {"en": "Digital footprint", "es": "Huella digital"}, {"en": "Role model", "es": "Modelo a seguir"}, {"en": "To get hooked", "es": "Engancharse"}], "flashcards": [{"q": "¿Cómo se dice 'cyberbullying' en español?", "a": "Ciberacoso."}, {"q": "¿Qué es la huella digital?", "a": "El rastro de información que dejamos en internet."}, {"q": "Di dos ventajas de las redes sociales.", "a": "Mantener el contacto y acceder rápido a la información (también activismo, empleo)."}, {"q": "Di dos riesgos de las redes sociales.", "a": "Ciberacoso y adicción (también noticias falsas, privacidad)."}, {"q": "Completa: \"Me preocupa que los jóvenes ___ (pasar) tanto tiempo en línea.\"", "a": "pasen (subjuntivo)."}, {"q": "¿Qué álbum de Rosalía (2018) la hizo famosa internacionalmente?", "a": "\"El mal querer\"."}], "preguntas": [{"q": "¿Qué significa 'bulo'?", "op": ["Un seguidor", "Una noticia falsa", "Una contraseña", "Un videojuego"], "ok": 1, "exp": "'Bulo' es sinónimo de noticia falsa."}, {"q": "¿Cuál es correcta?", "op": ["Si no existían las redes, estaríamos aislados", "Si no existen las redes, estaríamos aislados", "Si no existieran las redes, estaríamos más aislados", "Si no existirían las redes, estábamos aislados"], "ok": 2, "exp": "Condicional irreal: si + imperfecto de subjuntivo + condicional."}, {"q": "¿Qué subtemas de AQA cubre este bloque?", "op": ["El ciberespacio y la influencia de los ídolos", "La inmigración y el racismo", "La monarquía y la dictadura", "La música y el cine"], "ok": 0, "exp": "El ciberespacio (Tema 1) y La influencia de los ídolos (Tema 2)."}, {"q": "Un argumento a favor de los ídolos como modelos es que...", "op": ["Fomentan el consumismo", "Imponen cánones de belleza irreales", "Viven vidas privadas perfectas", "Pueden inspirar esfuerzo, disciplina y solidaridad"], "ok": 3, "exp": "Deportistas y artistas pueden transmitir valores positivos."}, {"q": "¿Qué conector introduce una concesión?", "op": ["Por lo tanto", "Si bien", "Además", "Es decir"], "ok": 1, "exp": "'Si bien' = 'aunque': introduce una idea que se reconoce antes de contrastarla."}], "feynman": "Explica en español a tu abuela, con palabras muy sencillas, qué es un 'influencer', por qué puede ser bueno y por qué puede ser peligroso.", "conexion": ["¿Tu ídolo favorito es un buen modelo a seguir? Prepara tres razones en español con ejemplos.", "¿Deberían prohibirse las redes sociales a menores de 16 años? Prepara argumentos a favor y en contra."], "examen": {"q": "(Estilo tarjeta oral, Paper 3) \"Los ídolos de hoy en día tienen una influencia más negativa que positiva en los jóvenes.\" ¿Qué opinas? Da ejemplos de personas famosas del mundo hispano.", "marks": 20, "ms": "AQA 7692: interacción y desarrollo de ideas (AO1/AO2); lengua precisa y variada: subjuntivo, condicionales, conectores, vocabulario del tema (AO3); conocimiento cultural del mundo hispano con ejemplos concretos y opiniones justificadas y equilibradas (AO4)."}}, {"id": "ESP03", "materia": "Español", "mesa": "AQA", "rama": "Cultura hispánica", "tema": "Identidad regional en España", "temaEN": "Regional identity in Spain: traditions, gastronomy, languages", "explicacion": "España es un país muy diverso. Según la Constitución de 1978, se organiza en 17 comunidades autónomas y 2 ciudades autónomas (Ceuta y Melilla), cada una con su propio gobierno y competencias. Muchas regiones tienen una identidad fuerte basada en su historia, su lengua, sus fiestas y su comida.\n\nAdemás del castellano (español), son oficiales en sus territorios el catalán (en Cataluña, Baleares y, como valenciano, en la Comunidad Valenciana), el gallego (Galicia) y el euskera o vasco (País Vasco y parte de Navarra); también el aranés en el Valle de Arán. Durante la dictadura de Franco (1939–1975) estas lenguas fueron reprimidas; con la democracia se recuperaron y hoy se enseñan en las escuelas.\n\nLas tradiciones y la gastronomía también expresan identidad: los castells (torres humanas) de Cataluña, las Fallas de Valencia, los Sanfermines de Pamplona o la Feria de Abril de Sevilla; la paella valenciana, el pulpo a la gallega, los pintxos vascos o el gazpacho andaluz. En el examen puedes debatir si la identidad regional enriquece a España o puede dividirla (por ejemplo, el independentismo catalán).", "analogia": "España es como una familia grande en la que cada hermano tiene su propio carácter, su manera de hablar y su plato favorito, pero todos se sientan a la misma mesa. A veces discuten sobre cuánta independencia quiere cada uno.", "ejemplo": "Los castells de Cataluña: equipos (colles) construyen torres humanas de varios pisos, y un niño (l'enxaneta) sube a la cima. La UNESCO los declaró Patrimonio Cultural Inmaterial de la Humanidad en 2010. Su lema es \"Força, equilibri, valor i seny\" (fuerza, equilibrio, valor y sentido común).", "puntos": ["Constitución de 1978: 17 comunidades autónomas + Ceuta y Melilla.", "Lenguas cooficiales: catalán/valenciano, gallego, euskera (y aranés).", "El franquismo (1939–1975) reprimió las lenguas y culturas regionales.", "Fiestas emblemáticas: castells, Fallas, San Fermín, Feria de Abril, La Tomatina.", "La gastronomía regional (paella, pulpo, pintxos, gazpacho) es parte de la identidad.", "Debate: diversidad que enriquece vs. tensiones nacionalistas e independentistas."], "formulas": ["1978: Constitución española (Estado de las Autonomías)", "Lenguas: catalán · gallego · euskera · (valenciano, aranés)", "Fiestas: Fallas (marzo, Valencia) · San Fermín (7 de julio, Pamplona) · La Tomatina (agosto, Buñol)", "Frase: \"La diversidad regional es una de las mayores riquezas de España.\"", "Frase: \"Para muchos catalanes, la lengua es un símbolo de identidad.\""], "glosario": [{"en": "Autonomous community", "es": "Comunidad autónoma"}, {"en": "Co-official language", "es": "Lengua cooficial"}, {"en": "Regional identity", "es": "Identidad regional"}, {"en": "Human tower", "es": "Castell / torre humana"}, {"en": "Independence movement", "es": "Independentismo"}], "flashcards": [{"q": "¿Cuántas comunidades autónomas tiene España?", "a": "17 (más 2 ciudades autónomas: Ceuta y Melilla)."}, {"q": "¿Dónde se habla euskera?", "a": "En el País Vasco y en parte de Navarra."}, {"q": "¿Qué tradición catalana es Patrimonio Inmaterial de la UNESCO desde 2010?", "a": "Los castells (torres humanas)."}, {"q": "¿Qué pasó con las lenguas regionales durante el franquismo?", "a": "Fueron reprimidas y su uso público se restringió."}, {"q": "¿De qué región es típico el pulpo a la gallega?", "a": "De Galicia."}, {"q": "¿En qué ciudad se celebran los Sanfermines?", "a": "En Pamplona (Navarra)."}], "preguntas": [{"q": "¿Qué documento creó el Estado de las Autonomías?", "op": ["El Tratado de Maastricht", "La Constitución de 1978", "La Ley del Divorcio", "El Estatuto de Gernika de 1936"], "ok": 1, "exp": "La Constitución de 1978 organizó España en comunidades autónomas."}, {"q": "¿Cuál NO es lengua cooficial en España?", "op": ["Gallego", "Catalán", "Portugués", "Euskera"], "ok": 2, "exp": "El portugués no es lengua cooficial en España."}, {"q": "¿En qué ciudad se celebran las Fallas?", "op": ["Valencia", "Sevilla", "Bilbao", "Santiago de Compostela"], "ok": 0, "exp": "Las Fallas se celebran en Valencia en marzo y terminan con la cremà."}, {"q": "¿Qué plato se asocia al País Vasco?", "op": ["El gazpacho", "La paella", "La fabada", "Los pintxos"], "ok": 3, "exp": "Los pintxos son típicos del País Vasco; el gazpacho es andaluz, la paella valenciana y la fabada asturiana."}, {"q": "¿Por qué las lenguas regionales son un tema sensible?", "op": ["Porque nadie las habla", "Porque fueron reprimidas bajo Franco y hoy son símbolo de identidad", "Porque están prohibidas hoy", "Porque solo se usan en internet"], "ok": 1, "exp": "Su represión durante el franquismo y su recuperación en democracia las convierten en símbolo identitario."}], "feynman": "Explica en español a un compañero inglés, en 5 frases, por qué en Barcelona ve carteles en dos idiomas y por qué eso es importante para los catalanes.", "conexion": ["¿Hay algo parecido a la identidad regional española en el Reino Unido (Escocia, Gales, Irlanda del Norte)? Compara.", "¿Crees que la identidad regional es compatible con sentirse español? Prepara argumentos."], "examen": {"q": "(Estilo tarjeta oral, Paper 3) \"Las identidades regionales enriquecen España, pero también la dividen.\" Discute esta afirmación con ejemplos de lenguas, fiestas o gastronomía.", "marks": 20, "ms": "AQA 7692: respuesta al estímulo e interacción (AO1/AO2); lengua compleja y precisa con vocabulario específico (AO3); conocimiento concreto de la diversidad regional española (lenguas, Constitución de 1978, franquismo, fiestas) y opiniones justificadas con matices (AO4)."}}, {"id": "ESP04", "materia": "Español", "mesa": "AQA", "rama": "Cultura hispánica", "tema": "Patrimonio cultural", "temaEN": "Cultural heritage", "explicacion": "El patrimonio cultural (cultural heritage) es el conjunto de bienes que una comunidad hereda y quiere conservar: monumentos, obras de arte, ciudades históricas, música, fiestas y tradiciones. La UNESCO distingue el patrimonio material (edificios, lugares) y el inmaterial (tradiciones vivas, como el flamenco, declarado Patrimonio Inmaterial en 2010).\n\nEl mundo hispano tiene un patrimonio enorme: la Alhambra de Granada (palacio nazarí, de época musulmana), la Sagrada Familia de Gaudí en Barcelona (iniciada en 1882 y aún en construcción), y las civilizaciones prehispánicas: los mayas (Chichén Itzá, México), los aztecas (Tenochtitlán, hoy Ciudad de México) y los incas, con Machu Picchu (Perú), una ciudadela del siglo XV que el explorador Hiram Bingham dio a conocer al mundo en 1911.\n\nTambién las personas forman parte del patrimonio: la soprano catalana Montserrat Caballé (1933–2018), una de las grandes voces de la ópera del siglo XX, cantó con Freddie Mercury \"Barcelona\", canción asociada a los Juegos Olímpicos de 1992. En el examen se debate el turismo masivo: trae dinero, pero puede dañar los monumentos (por eso Machu Picchu limita el número de visitantes).", "analogia": "El patrimonio es como el álbum de fotos y las joyas de la abuela: no se pueden reemplazar, cuentan quiénes somos y hay que cuidarlos para que lleguen a los nietos. Si todo el mundo los toca a la vez, se estropean.", "ejemplo": "Machu Picchu, en los Andes peruanos, fue construida por los incas probablemente bajo el inca Pachacútec en el siglo XV. Es Patrimonio de la Humanidad desde 1983. Por el turismo masivo, hoy se venden entradas con horario y circuitos fijos. Frase útil: \"Es imprescindible encontrar un equilibrio entre el turismo y la conservación\".", "puntos": ["Patrimonio material (monumentos) e inmaterial (tradiciones vivas como el flamenco).", "España: Alhambra, Sagrada Familia, Mezquita de Córdoba, Camino de Santiago.", "Latinoamérica: Machu Picchu (incas), Chichén Itzá (mayas), Teotihuacán.", "Personas como Montserrat Caballé o Gaudí también forman parte del legado cultural.", "El turismo masivo aporta ingresos pero amenaza la conservación.", "Debate: ¿quién debe pagar y decidir sobre la protección del patrimonio?"], "formulas": ["1882: comienza la Sagrada Familia · 2010: flamenco y castells, Patrimonio Inmaterial", "1911: Hiram Bingham da a conocer Machu Picchu · 1983: Machu Picchu, Patrimonio de la Humanidad", "Frase: \"Es imprescindible que + subjuntivo\" (Es imprescindible que protejamos...)", "Frase: \"El turismo es un arma de doble filo.\"", "Frase: \"Las generaciones futuras merecen disfrutar de...\""], "glosario": [{"en": "Cultural heritage", "es": "Patrimonio cultural"}, {"en": "World Heritage Site", "es": "Patrimonio de la Humanidad"}, {"en": "Intangible heritage", "es": "Patrimonio inmaterial"}, {"en": "Mass tourism", "es": "Turismo masivo"}, {"en": "Pre-Hispanic civilisations", "es": "Civilizaciones prehispánicas"}], "flashcards": [{"q": "¿Qué civilización construyó Machu Picchu?", "a": "Los incas, en el siglo XV."}, {"q": "¿Quién diseñó la Sagrada Familia?", "a": "Antoni Gaudí (las obras comenzaron en 1882)."}, {"q": "¿Quién era Montserrat Caballé?", "a": "Una soprano catalana (1933–2018), gran figura de la ópera; cantó \"Barcelona\" con Freddie Mercury."}, {"q": "¿Qué es el patrimonio inmaterial?", "a": "Tradiciones vivas: música, fiestas, saberes (p. ej. el flamenco)."}, {"q": "¿De qué época es la Alhambra?", "a": "De la época nazarí (musulmana) de Granada, siglos XIII–XIV principalmente."}, {"q": "¿Qué civilización construyó Chichén Itzá?", "a": "Los mayas (México)."}], "preguntas": [{"q": "¿Dónde está Machu Picchu?", "op": ["México", "Perú", "Bolivia", "Guatemala"], "ok": 1, "exp": "En los Andes de Perú, cerca de Cusco."}, {"q": "¿Qué tradición española es Patrimonio Inmaterial de la UNESCO desde 2010?", "op": ["La paella", "La siesta", "El flamenco", "La Liga"], "ok": 2, "exp": "El flamenco fue inscrito en 2010."}, {"q": "Montserrat Caballé fue famosa como...", "op": ["Soprano de ópera", "Pintora surrealista", "Arquitecta modernista", "Directora de cine"], "ok": 0, "exp": "Fue una de las sopranos más importantes del siglo XX."}, {"q": "¿Cuál es un inconveniente del turismo masivo?", "op": ["Crea empleo", "Da a conocer la cultura", "Financia la restauración", "Deteriora monumentos y ecosistemas"], "ok": 3, "exp": "El exceso de visitantes puede dañar el patrimonio; por eso se limitan las visitas."}, {"q": "Completa: \"Es imprescindible que ___ el patrimonio.\"", "op": ["protegemos", "protejamos", "protegeremos", "protegíamos"], "ok": 1, "exp": "'Es imprescindible que' exige subjuntivo: protejamos."}], "feynman": "Imagina que eres guía en Machu Picchu. Explica en español, con palabras sencillas, a un grupo de niños por qué no pueden tocar las piedras ni salirse del camino.", "conexion": ["¿Debería limitarse el número de turistas en lugares como la Alhambra o Machu Picchu? ¿Por qué?", "¿Qué parte del patrimonio de tu ciudad o país te parece más importante conservar y por qué?"], "examen": {"q": "(Estilo tarjeta oral, Paper 3) \"El turismo es la mayor amenaza para el patrimonio cultural del mundo hispano.\" ¿Hasta qué punto estás de acuerdo?", "marks": 20, "ms": "AQA 7692: comprensión y respuesta al estímulo, interacción (AO1/AO2); lengua compleja y precisa: subjuntivo, conectores, vocabulario del patrimonio (AO3); conocimiento de ejemplos concretos (Machu Picchu, Alhambra, Sagrada Familia, flamenco) y opinión equilibrada y justificada (AO4)."}}, {"id": "ESP05", "materia": "Español", "mesa": "AQA", "rama": "Cultura hispánica", "tema": "Análisis de una película", "temaEN": "Film study: El laberinto del fauno / Volver", "explicacion": "En el Paper 2 de AQA escribes un ensayo en español sobre una obra estudiada (película o libro). \"El laberinto del fauno\" (2006), de Guillermo del Toro, es una opción muy común. Se sitúa en 1944, en la posguerra española: Ofelia, una niña, llega con su madre embarazada, Carmen, a un molino donde su padrastro, el capitán Vidal, persigue a los maquis (guerrilleros republicanos). Un fauno le dice que es una princesa y le encarga tres pruebas.\n\nTemas clave: la desobediencia frente a la obediencia ciega, la crueldad del fascismo, la inocencia, la fantasía como refugio y la resistencia. Personajes: Ofelia (imaginación y valentía), Vidal (autoritarismo, obsesión por el reloj de su padre y por tener un hijo varón), Mercedes (resistencia valiente) y el doctor Ferreiro, que le dice a Vidal que obedecer por obedecer, sin pensar, es algo que solo hace gente como él. Técnicas: colores fríos (azul, gris) para el mundo real y cálidos (dorado, ámbar) para el mundo mágico; transiciones que unen los dos mundos; el Hombre Pálido como reflejo de Vidal.\n\n\"Volver\" (2006), de Pedro Almodóvar, con Penélope Cruz como Raimunda, trata la maternidad, la muerte, los secretos familiares, la solidaridad femenina y la vida en La Mancha. Para el ensayo: introducción con postura clara, párrafos analíticos con ejemplos de escenas y técnicas, y conclusión. Analiza, no cuentes el argumento. Se recomiendan unas 300 palabras y la calidad de la lengua cuenta tanto como el contenido.", "analogia": "Analizar una película es como ser detective: no basta con contar lo que pasó (eso es el argumento), tienes que explicar por qué el director eligió esa luz, ese color o ese plano, y qué mensaje esconde.", "ejemplo": "Escena final de \"El laberinto del fauno\": Ofelia se niega a entregar a su hermano bebé al fauno, aunque esa desobediencia le cuesta la vida a manos de Vidal. Su negativa conecta con el tema central: desobedecer una orden injusta es un acto de valentía moral, igual que la del doctor Ferreiro y la de Mercedes. Después, la luz dorada del reino mágico contrasta con la oscuridad del laberinto.", "puntos": ["\"El laberinto del fauno\": Guillermo del Toro, 2006, ambientada en 1944 (posguerra española).", "Temas: obediencia vs. desobediencia, fascismo, inocencia, fantasía como refugio, resistencia.", "Personajes: Ofelia, capitán Vidal, Mercedes, Carmen, doctor Ferreiro, el fauno, el Hombre Pálido.", "Técnicas: paleta de colores contrastada, transiciones, simbolismo (llave, reloj, mandrágora).", "\"Volver\" (Almodóvar, 2006): maternidad, muerte, secretos, solidaridad femenina, La Mancha.", "Ensayo: analizar (no narrar), ejemplos concretos, lengua precisa y variada; AO3 + AO4."], "formulas": ["Introducción: obra + director + año + postura (\"En este ensayo voy a demostrar que...\")", "Párrafo: idea → ejemplo de escena/técnica → análisis → enlace con la pregunta", "Frases: \"El director utiliza... para transmitir...\" · \"Esta escena simboliza...\"", "Frases: \"Cabe destacar que...\" · \"Desde mi punto de vista, el personaje más...\"", "AQA Paper 2: ~300 palabras recomendadas · 40 puntos (AO3: 20, AO4: 20)"], "glosario": [{"en": "Director", "es": "Director/a"}, {"en": "Shot (camera shot)", "es": "Plano"}, {"en": "Post-war period", "es": "Posguerra"}, {"en": "Character", "es": "Personaje"}, {"en": "Plot", "es": "Argumento / trama"}], "flashcards": [{"q": "¿Quién dirigió \"El laberinto del fauno\" y en qué año?", "a": "Guillermo del Toro, en 2006."}, {"q": "¿En qué año y contexto se sitúa la película?", "a": "En 1944, en la posguerra española, con maquis resistiendo en el monte."}, {"q": "¿Qué simboliza el capitán Vidal?", "a": "El fascismo y la obediencia ciega; la crueldad del régimen franquista."}, {"q": "¿Cómo usa del Toro el color?", "a": "Tonos fríos (azules, grises) para el mundo real y cálidos (dorados) para el mundo mágico."}, {"q": "¿Quién dirigió \"Volver\" y quién la protagoniza?", "a": "Pedro Almodóvar; Penélope Cruz interpreta a Raimunda."}, {"q": "¿Qué AOs se evalúan en el ensayo de AQA?", "a": "AO3 (lengua) y AO4 (análisis crítico de la obra)."}], "preguntas": [{"q": "¿Dónde se sitúa \"El laberinto del fauno\"?", "op": ["En México durante la Revolución", "En la España de posguerra, en 1944", "En Argentina en los años 70", "En la España de los años 80"], "ok": 1, "exp": "La película transcurre en 1944, tras la Guerra Civil española."}, {"q": "¿Qué personaje representa la resistencia valiente dentro de la casa de Vidal?", "op": ["Carmen", "El fauno", "Mercedes", "El Hombre Pálido"], "ok": 2, "exp": "Mercedes ayuda en secreto a los maquis, entre ellos su hermano."}, {"q": "¿Cuál es un tema central de la película?", "op": ["La desobediencia frente a la autoridad injusta", "El deporte", "La vida en la ciudad moderna", "La inmigración en Europa"], "ok": 0, "exp": "Ofelia, Mercedes y el doctor desobedecen; Vidal representa la obediencia ciega."}, {"q": "¿Qué técnica usa del Toro para separar los dos mundos?", "op": ["Rodar solo en blanco y negro", "Usar únicamente planos aéreos", "Eliminar la música", "Una paleta de colores fríos para la realidad y cálidos para la fantasía"], "ok": 3, "exp": "El contraste cromático es clave para el análisis cinematográfico."}, {"q": "¿Qué debe evitar un buen ensayo de AQA sobre una película?", "op": ["Usar ejemplos de escenas", "Contar el argumento en vez de analizar", "Dar una opinión", "Mencionar técnicas cinematográficas"], "ok": 1, "exp": "Narrar la trama no suma puntos de análisis (AO4)."}], "feynman": "Explica en español, en 5 frases simples, por qué Ofelia se niega a obedecer al fauno al final y qué nos dice eso sobre el mensaje de la película.", "conexion": ["¿Por qué crees que del Toro mezcla un cuento de hadas con la historia de la posguerra española?", "Compara a Vidal y al Hombre Pálido: ¿qué tienen en común y qué critica el director a través de ellos?"], "examen": {"q": "\"En 'El laberinto del fauno', la fantasía es solo una forma de escapar de la realidad.\" ¿Hasta qué punto estás de acuerdo? Justifica tu respuesta con referencias a la película.", "marks": 40, "ms": "AQA 7692 Paper 2: AO4 (20) — análisis crítico y evaluativo de temas, personajes y técnicas cinematográficas, con argumento coherente, ejemplos precisos y conclusiones justificadas; AO3 (20) — lengua precisa, variada y compleja (subjuntivo, conectores, vocabulario de cine). Penaliza narrar la trama o salirse de la pregunta."}}, {"id": "LIT01", "materia": "Literatura Inglesa", "mesa": "Edexcel", "rama": "Literatura", "tema": "Poesía moderna", "temaEN": "Modern poetry: Poems of the Decade and Modernism", "explicacion": "En Edexcel English Literature (9ET0), el Componente 3 es de poesía. En la Sección A comparas un poema no visto (unseen) con uno de la antología \"Poems of the Decade\" (poemas publicados entre 2002 y 2011, como \"Genetics\" de Sinéad Morrissey o \"Look We Have Coming to Dover!\" de Daljit Nagra). En la Sección B estudias a un poeta o un periodo, por ejemplo el Modernismo (Modernism) con T. S. Eliot.\n\nPara analizar un poema usas tres capas: lenguaje (language: imágenes, metáforas, campo semántico), forma (form: soneto, villanela, verso libre) y estructura (structure: orden de las ideas, encabalgamiento o enjambment, cesura o caesura, giro o volta). Siempre explica el EFECTO: ¿qué sentimos o entendemos gracias a esa elección del poeta? Y conecta con el contexto (AO3).\n\n\"The Waste Land\" (1922) de T. S. Eliot es el gran poema modernista: fragmentado, lleno de voces, idiomas y alusiones (allusions), refleja la desilusión de Europa tras la Primera Guerra Mundial. Empieza con \"April is the cruellest month\", invirtiendo la idea tradicional de la primavera como renacimiento. Assessment Objectives clave: AO1 (respuesta argumentada y terminología), AO2 (cómo se crea el significado), AO3 (contexto), AO4 (conexiones entre textos).", "analogia": "Un poema es como una canción con videoclip: la letra es el lenguaje, el ritmo y el formato de la canción son la forma, y el orden de las escenas es la estructura. Analizarlo es explicar por qué el artista eligió cada cosa y qué te hace sentir.", "ejemplo": "\"Genetics\" de Sinéad Morrissey es una villanela (villanelle): 19 versos con dos estribillos que se repiten. La repetición imita cómo los rasgos de los padres se 'repiten' en las manos de la hija: la forma refuerza el tema de la herencia y el amor que une a los padres separados.", "puntos": ["Componente 3 de Edexcel: Poems of the Decade + unseen (Sección A) y poeta/periodo (Sección B).", "Analiza language, form y structure, y siempre el efecto en el lector.", "La forma tiene significado: villanela, soneto, verso libre, monólogo dramático.", "\"The Waste Land\" (1922): fragmentación, alusiones, desilusión de posguerra.", "AO1 argumento y terminología; AO2 análisis; AO3 contexto; AO4 comparación.", "Usa citas cortas integradas en tus frases (embedded quotations)."], "formulas": ["\"April is the cruellest month\" (Eliot, The Waste Land, 1922)", "\"I will show you fear in a handful of dust\" (The Waste Land)", "\"These fragments I have shored against my ruins\" (The Waste Land)", "Frase de análisis: \"The poet uses [technique] in '[quote]' to suggest...\"", "Comparación: \"Whereas X presents..., Y instead...\""], "glosario": [{"en": "Enjambment", "es": "Encabalgamiento"}, {"en": "Caesura", "es": "Cesura"}, {"en": "Free verse", "es": "Verso libre"}, {"en": "Allusion", "es": "Alusión"}, {"en": "Dramatic monologue", "es": "Monólogo dramático"}], "flashcards": [{"q": "¿Cuándo se publicó \"The Waste Land\"?", "a": "En 1922."}, {"q": "¿Cómo empieza \"The Waste Land\"?", "a": "\"April is the cruellest month\"."}, {"q": "¿Qué periodo abarca \"Poems of the Decade\"?", "a": "Poemas publicados entre 2002 y 2011 (Forward Book of Poetry)."}, {"q": "¿Qué es el enjambment?", "a": "Cuando una frase continúa en el verso siguiente sin pausa."}, {"q": "¿Qué forma tiene \"Genetics\" de Sinéad Morrissey?", "a": "Villanela (villanelle)."}, {"q": "¿Qué evalúa AO2?", "a": "El análisis de cómo se crean los significados en los textos (lenguaje, forma, estructura)."}], "preguntas": [{"q": "¿Qué rasgo es típico del Modernismo de Eliot?", "op": ["Rima regular y narrativa lineal", "Fragmentación y múltiples voces y alusiones", "Solo temas de la naturaleza", "Lenguaje sencillo sin referencias"], "ok": 1, "exp": "\"The Waste Land\" mezcla voces, idiomas y alusiones de forma fragmentada."}, {"q": "¿Qué Assessment Objective trata el contexto?", "op": ["AO1", "AO2", "AO3", "AO4"], "ok": 2, "exp": "AO3: significado e influencia de los contextos de producción y recepción."}, {"q": "¿Qué es una cesura?", "op": ["Una pausa en mitad de un verso", "Una rima al final", "Un poema de 14 versos", "Una metáfora extendida"], "ok": 0, "exp": "La caesura es una pausa dentro del verso, normalmente marcada por puntuación."}, {"q": "¿Por qué dice Eliot que abril es 'el mes más cruel'?", "op": ["Porque llueve mucho en Londres", "Porque es el mes de los exámenes", "Porque murió su padre", "Porque la primavera obliga a renacer a un mundo que se siente muerto tras la guerra"], "ok": 3, "exp": "Invierte la imagen tradicional de la primavera: el renacimiento duele en un mundo desilusionado."}, {"q": "¿Quién escribió \"Look We Have Coming to Dover!\"?", "op": ["Simon Armitage", "Daljit Nagra", "Carol Ann Duffy", "Seamus Heaney"], "ok": 1, "exp": "Daljit Nagra; el poema trata la inmigración y la identidad en Gran Bretaña."}], "feynman": "Explica con palabras simples a una amiga por qué la FORMA de un poema (por ejemplo, repetir versos en una villanela) puede tener tanto significado como sus palabras.", "conexion": ["¿Por qué un poema fragmentado como \"The Waste Land\" encaja con la experiencia de Europa después de 1918?", "Elige un poema de \"Poems of the Decade\": ¿qué técnica de forma o estructura usarías para compararlo con un unseen?"], "examen": {"q": "Compare the ways in which the poets present memory and loss in the unseen poem and one other poem of your choice from Poems of the Decade.", "marks": 30, "ms": "Edexcel 9ET0 Componente 3, Sección A: AO1 (respuesta crítica coherente, terminología precisa), AO2 (análisis de lenguaje, forma y estructura con efectos), AO4 (conexiones y comparación sostenida entre ambos poemas). Nivel alto: comparación integrada desde el inicio, análisis perceptivo y citas cortas bien elegidas."}}, {"id": "LIT02", "materia": "Literatura Inglesa", "mesa": "Edexcel", "rama": "Literatura", "tema": "Prosa literaria", "temaEN": "Prose: novels in context (e.g. Nineteen Eighty-Four)", "explicacion": "En el Componente 2 de Edexcel (Prose) comparas dos novelas unidas por un tema (por ejemplo: Science and Society, Women and Society, The Supernatural, Crime and Detection, Childhood o Colonisation and its Aftermath). Comprueba con tu profesor cuáles son tus textos exactos. Las habilidades son las mismas con cualquier novela: narrador, personajes, estructura, lenguaje y contexto.\n\n\"Nineteen Eighty-Four\" de George Orwell (1949) es un ejemplo perfecto de novela en contexto. Escrita tras la Segunda Guerra Mundial y bajo la influencia de los totalitarismos de Hitler y Stalin, muestra Oceanía, un Estado gobernado por el Partido y el Gran Hermano (Big Brother), que vigila todo con telepantallas (telescreens), reescribe el pasado y controla el pensamiento con la neolengua (Newspeak) y el doblepensar (doublethink).\n\nWinston Smith, que trabaja falsificando la historia en el Ministerio de la Verdad, se rebela con un diario y con su amor por Julia, pero es detenido, torturado en la Habitación 101 (Room 101) y acaba destruido: \"He loved Big Brother\". Temas: totalitarismo, verdad y manipulación del lenguaje, memoria e historia, individualidad. Para el contexto (AO3), conecta con el estalinismo, la propaganda y el inicio de la Guerra Fría.", "analogia": "Imagina un instituto donde las cámaras te graban 24 horas, se borran los mensajes antiguos para que nadie recuerde lo que dijo el director, y se eliminan palabras del diccionario para que no puedas ni quejarte. Eso es Oceanía.", "ejemplo": "El famoso inicio: \"It was a bright cold day in April, and the clocks were striking thirteen.\" Todo parece normal hasta que el reloj da 'trece': Orwell crea desde la primera frase un mundo familiar pero inquietante (uncanny), una distopía.", "puntos": ["Componente 2 de Edexcel: comparar dos novelas sobre un tema común (40 puntos).", "\"Nineteen Eighty-Four\" (1949): distopía (dystopia) sobre el totalitarismo.", "Herramientas de control: telepantallas, Policía del Pensamiento, neolengua, doblepensar, reescritura de la historia.", "Winston Smith: rebelde fracasado; el final muestra el triunfo del Partido.", "Contexto: Stalin, Hitler, propaganda de guerra, experiencia de Orwell en la Guerra Civil española.", "Analiza narrador, estructura y lenguaje, no solo la trama (AO2)."], "formulas": ["\"Big Brother is watching you\"", "\"War is peace. Freedom is slavery. Ignorance is strength.\"", "\"Who controls the past controls the future: who controls the present controls the past.\"", "\"It was a bright cold day in April, and the clocks were striking thirteen.\"", "Final: \"He loved Big Brother.\""], "glosario": [{"en": "Dystopia", "es": "Distopía"}, {"en": "Third-person limited narrator", "es": "Narrador en tercera persona limitado"}, {"en": "Surveillance", "es": "Vigilancia"}, {"en": "Totalitarian", "es": "Totalitario"}, {"en": "Doublethink", "es": "Doblepensar"}], "flashcards": [{"q": "¿Cuándo se publicó \"Nineteen Eighty-Four\"?", "a": "En 1949."}, {"q": "¿Cuál es la frase inicial?", "a": "\"It was a bright cold day in April, and the clocks were striking thirteen.\""}, {"q": "¿Qué es el doublethink?", "a": "Creer a la vez dos ideas contradictorias y aceptar ambas."}, {"q": "¿Para qué sirve la neolengua (Newspeak)?", "a": "Para reducir el vocabulario y hacer imposible el pensamiento rebelde."}, {"q": "¿Dónde trabaja Winston?", "a": "En el Ministerio de la Verdad, reescribiendo documentos del pasado."}, {"q": "¿Cómo termina la novela?", "a": "Winston, destruido, \"loved Big Brother\"."}], "preguntas": [{"q": "¿Qué tipo de novela es \"Nineteen Eighty-Four\"?", "op": ["Romance histórico", "Novela gótica", "Distopía", "Novela epistolar"], "ok": 2, "exp": "Presenta una sociedad futura opresiva: una distopía."}, {"q": "¿Qué lema pertenece al Partido?", "op": ["War is peace", "All animals are equal", "Reader, I married him", "April is the cruellest month"], "ok": 0, "exp": "\"War is peace. Freedom is slavery. Ignorance is strength.\""}, {"q": "¿Qué contexto influyó más en Orwell?", "op": ["La Revolución Francesa", "La época victoriana", "La conquista de América", "Los totalitarismos de Stalin y Hitler"], "ok": 3, "exp": "Orwell reaccionó al estalinismo y al nazismo, y a la propaganda de su tiempo."}, {"q": "¿Qué ocurre en la Habitación 101?", "op": ["Winston escribe su diario", "Winston es enfrentado a su peor miedo hasta que traiciona a Julia", "Winston se casa con Julia", "Winston escapa de Oceanía"], "ok": 1, "exp": "Allí lo amenazan con ratas y traiciona a Julia."}, {"q": "¿Qué AO evalúa el contexto en Edexcel?", "op": ["AO1", "AO2", "AO3", "AO5"], "ok": 2, "exp": "AO3: significado e influencia de los contextos."}], "feynman": "Explica a un compañero de 12 años, en 5 frases, cómo controla el Partido a la gente en \"1984\" y por qué Orwell escribió esta novela en 1949.", "conexion": ["¿Qué herramientas de control de \"1984\" ves hoy en el mundo real (vigilancia, noticias falsas, redes)?", "Relaciona \"1984\" con lo que estudias en Historia sobre Stalin: ¿qué paralelos encuentras?"], "examen": {"q": "Compare the ways in which the writers of your two prose texts present the relationship between the individual and those in power.", "marks": 40, "ms": "Edexcel 9ET0 Componente 2: AO1 (argumento coherente, terminología), AO2 (análisis de cómo el lenguaje, la forma y la estructura crean significado), AO3 (contextos relevantes integrados), AO4 (conexiones y comparación sostenida entre ambos textos). Nivel alto: comparación crítica integrada, contexto que ilumina el análisis, citas breves precisas."}}, {"id": "LIT03", "materia": "Literatura Inglesa", "mesa": "Edexcel", "rama": "Literatura", "tema": "Análisis crítico y comparativo", "temaEN": "Critical and comparative analysis (e.g. Pride and Prejudice and Jane Eyre)", "explicacion": "Comparar textos es la habilidad más importante del A-Level. En Edexcel aparece en la prosa, en la poesía y en el coursework (Componente 4, Non-Examination Assessment: un ensayo comparativo de 2.500–3.000 palabras sobre dos textos que tú eliges con tu profesor). Una buena comparación no habla de un libro y luego del otro: los compara en cada párrafo usando conectores como \"whereas\", \"similarly\" o \"in contrast\".\n\nEjemplo clásico: \"Pride and Prejudice\" de Jane Austen (1813) y \"Jane Eyre\" de Charlotte Brontë (1847, publicada como 'Currer Bell'). Ambas tratan el matrimonio, la clase social y la independencia femenina, pero de forma distinta: Austen usa la ironía y el estilo indirecto libre (free indirect discourse) con un narrador en tercera persona; Brontë usa una narradora en primera persona apasionada y elementos góticos (el ático, Bertha Mason). Esto se puede ampliar al siglo XX comparando, por ejemplo, con \"Mrs Dalloway\" (1925) de Virginia Woolf.\n\nLos cinco Assessment Objectives: AO1 respuesta argumentada y terminología; AO2 análisis de lenguaje, forma y estructura; AO3 contexto; AO4 conexiones entre textos; AO5 explorar diferentes interpretaciones (critical views, por ejemplo una lectura feminista o marxista). Usa citas cortas e integradas: no copies párrafos enteros.", "analogia": "Comparar dos novelas es como comparar dos versiones de la misma canción: misma melodía (el tema), pero distinto ritmo, instrumentos y voz. Tu trabajo es explicar qué cambia y por qué cada versión produce un efecto diferente.", "ejemplo": "Austen abre con ironía: \"It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.\" En realidad son las familias las que 'necesitan' al hombre rico. Brontë, en cambio, da voz directa a su heroína: \"I am no bird; and no net ensnares me\", y cierra con \"Reader, I married him\": Jane elige, no es elegida.", "puntos": ["Compara en cada párrafo (integrated comparison), no texto por texto.", "Austen: ironía, diálogo, estilo indirecto libre, sátira social (1813, Regencia).", "Brontë: narradora en primera persona, Bildungsroman, gótico, pasión e independencia (1847, época victoriana).", "AO5: usa interpretaciones críticas (feminista, marxista, poscolonial: p. ej. \"Wide Sargasso Sea\" sobre Bertha).", "Coursework Edexcel (NEA): ensayo comparativo de 2.500–3.000 palabras, 20% de la nota.", "Citas cortas, integradas y analizadas palabra por palabra."], "formulas": ["\"It is a truth universally acknowledged...\" (Austen, 1813)", "\"Reader, I married him.\" (Brontë, 1847)", "\"I am no bird; and no net ensnares me\" (Jane Eyre)", "Conectores: whereas · similarly · in contrast · likewise · conversely", "Párrafo comparativo: Point (ambos textos) → Quote A + análisis → Quote B + análisis → Contexto/AO5 → Juicio"], "glosario": [{"en": "Free indirect discourse", "es": "Estilo indirecto libre"}, {"en": "Irony", "es": "Ironía"}, {"en": "Bildungsroman", "es": "Novela de formación"}, {"en": "First-person narrator", "es": "Narrador en primera persona"}, {"en": "Critical interpretation", "es": "Interpretación crítica"}], "flashcards": [{"q": "¿Cuándo se publicaron \"Pride and Prejudice\" y \"Jane Eyre\"?", "a": "1813 y 1847."}, {"q": "¿Con qué seudónimo publicó Charlotte Brontë?", "a": "Currer Bell."}, {"q": "¿Qué evalúa AO5?", "a": "La exploración de diferentes interpretaciones de los textos."}, {"q": "¿Qué es el estilo indirecto libre?", "a": "Narración en tercera persona que se mezcla con los pensamientos del personaje."}, {"q": "¿Qué novela de Jean Rhys reinterpreta a Bertha Mason?", "a": "\"Wide Sargasso Sea\" (1966)."}, {"q": "¿Cuál es el error típico al comparar?", "a": "Escribir sobre un texto y luego sobre el otro sin conectarlos."}], "preguntas": [{"q": "¿Qué técnica narrativa es típica de Jane Austen?", "op": ["Estilo indirecto libre e ironía", "Narradora en primera persona", "Monólogo interior caótico", "Forma epistolar exclusivamente"], "ok": 0, "exp": "Austen combina narrador en tercera persona, ironía y estilo indirecto libre."}, {"q": "¿Cómo está narrada \"Jane Eyre\"?", "op": ["Por un narrador omnisciente", "Por Rochester", "Por cartas de varios personajes", "Por Jane, en primera persona"], "ok": 3, "exp": "Jane narra su propia vida como adulta, mirando atrás."}, {"q": "¿Qué conector sirve para mostrar contraste?", "op": ["Similarly", "Likewise", "Whereas", "Furthermore"], "ok": 2, "exp": "'Whereas' introduce un contraste entre los dos textos."}, {"q": "Una lectura feminista de \"Jane Eyre\" destacaría...", "op": ["La arquitectura de Thornfield", "La lucha de Jane por la igualdad y la autonomía", "El clima de Yorkshire", "La economía de las Indias Occidentales únicamente"], "ok": 1, "exp": "Jane exige ser tratada como igual y decidir su propio destino."}, {"q": "¿Qué caracteriza a una buena cita en un ensayo A-Level?", "op": ["Es larga y ocupa un párrafo", "No se analiza", "Se pone al final sin comentario", "Es corta, integrada en la frase y analizada"], "ok": 3, "exp": "Las citas breves e integradas permiten un análisis más preciso (AO2)."}], "feynman": "Explica a una amiga, en 5 frases, en qué se parecen y en qué se diferencian Elizabeth Bennet y Jane Eyre como mujeres que no aceptan lo que la sociedad espera de ellas.", "conexion": ["¿Por qué crees que Brontë eligió una narradora en primera persona y Austen un narrador irónico en tercera? ¿Qué efecto tiene en el lector?", "¿Cómo cambia tu lectura de \"Jane Eyre\" si la miras desde la perspectiva de Bertha Mason (\"Wide Sargasso Sea\")?"], "examen": {"q": "Compare the ways in which Austen and Brontë present women's independence in Pride and Prejudice and Jane Eyre. In your response, you should consider relevant contexts and different interpretations.", "marks": 60, "ms": "Edexcel 9ET0 Componente 4 (NEA, 2.500–3.000 palabras, 60 puntos): AO1 (argumento personal coherente, terminología, referencias académicas), AO2 (análisis de lenguaje, forma y estructura), AO3 (contextos de Regencia y época victoriana), AO4 (conexiones y comparación integrada), AO5 (diálogo con interpretaciones críticas, p. ej. feminista o poscolonial)."}}]</script>

function route() {
  var h = decodeURIComponent(location.hash.slice(1)) || 'hoy', html, tab = 'mas', m;
  if (h === 'hoy') { html = vHoy(); tab = 'hoy'; }
  else if (h === 'temario') { html = vTemario(); tab = 'temario'; }
  else if ((m = /^t-([A-Za-z0-9-]+?)(?:-(aprende|subtemas|tarjetas|quiz|feynman|cornell|mapa|examen|repaso))?$/.exec(h))) { html = vTema(m[1], m[2]); tab = 'temario'; }
  else if ((m = /^sesion-(\d)$/.exec(h))) { html = vSesion(+m[1]); tab = 'hoy'; }
  else if (h === 'cierre') { html = vCierre(); tab = 'hoy'; }
  else if (h === 'repaso') { html = vRepaso(); tab = 'evaluar'; }
  else if (h === 'evaluar') { html = vEvaluar(); tab = 'evaluar'; }
  else if (h === 'diagnostico') { html = vDiagnostico(); tab = 'evaluar'; }
  else if (h === 'progreso') { html = vProgreso(); tab = 'progreso'; }
  else if (h === 'logros') { html = vLogros(); tab = 'progreso'; }
  else if (h === 'csv') html = vCSV();
  else if (h === 'calendario') html = vCalendario();
  else if ((m = /^dia-(\d{4}-\d{2}-\d{2})$/.exec(h))) { CALM = m[1].slice(0, 7); html = vCalendario(m[1]); }
  else if (h === 'pomodoro') html = vPomodoro();
  else if (h === 'tecnicas') html = vTecnicas();
  else if (h === 'ayuda') html = vAyuda();
  else if (h === 'ajustes') html = vAjustes();
  else html = vMas();
  app.innerHTML = html;
  document.querySelectorAll('nav.bottom a').forEach(function (a) { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#ptsMini').textContent = totalPts();
  if (/feynman|^sesion/.test(h)) { var tid = (/^t-([A-Za-z0-9-]+?)-feynman$/.exec(h) || [])[1] || (SES && SES.q[SES.i] && SES.q[SES.i].tid); if (tid) audioCargar(tid); }
  if (/^dia-/.test(h)) { var el = document.getElementById('dia'); if (el) el.scrollIntoView({ block: 'start' }); } else window.scrollTo(0, 0);
}
function rerender() { var y = window.scrollY; route(); window.scrollTo(0, y); }
function marcarCSV() { S.csvAct = fC(HOY()) + ' ' + ahoraHM(); }

// ================= eventos =================
app.addEventListener('click', function (e) {

  else if (a === 'sub-ok') { estudiarSub(id); marcarCSV(); save(); rerender(); }

  else if (a === 'ses-sig') { SES.i++; SES.paso = 'contenido'; SES.feedback = null; QZ = null; if (PO.modo !== 'estudio') poStart('estudio'); rerender(); }
  else if (a === 'ses-salir') { SES = null; QZ = null; }
  else if (a === 'save-feyn') { var tt = TID[id], tx = $('#feyn').value; ts(id).feyn = tx; FEYNFB[id] = revisarFeynman(tt, tx); save(); rerender(); }
  else if (a === 'rec') { grabar(id, b); }
  else if (a === 'save-cornell') { ts(id).cornell = { c: $('#cc').value, n: $('#cn').value, s: $('#cr').value }; save(); b.textContent = 'Guardado ✓'; }
  else if (a === 'save-mapa') { ts(id).mapa = $('#mapaTxt').value; save(); rerender(); }
  else if (a === 'reset-mapa') { ts(id).mapa = ''; save(); rerender(); }
  else if (a === 'save-exam') { var s5 = ts(id); s5.exam = { a: $('#exAns').value, p: $('#exPts').value === '' ? null : Math.min(TID[id].examen.marks, +$('#exPts').value), d: HOY(), vista: true }; if (s5.estado === 'pendiente') { s5.estado = 'estudiado'; s5.studied = HOY(); s5.next = add(HOY(), 1); } checkDominado(id); marcarCSV(); save(); rerender(); }
  else if (a === 'rep-q') { repasarTema(id, +b.dataset.q); marcarCSV(); rerender(); }
  else if (a === 'pomo-tema') { PO.tema = id; if (!PO.corre) poStart('estudio'); location.hash = '#pomodoro'; }
  else if (a === 'cal') { var dd = s2d(CALM + '-01'); dd.setMonth(dd.getMonth() + +b.dataset.d); CALM = d2s(dd).slice(0, 7); if (location.hash !== '#calendario') location.hash = '#calendario'; else rerender(); }
  else if (a === 'sim-go') { var sel = $('#simM').value, n = +$('#simN').value, qs = armarSim(sel, n); if (!qs.length) { b.after(Object.assign(document.createElement('div'), { className: 'note warn small', textContent: 'Todavía no hay temas estudiados: empieza con "Todas las materias".' })); return; } nuevoQuiz(qs, 'sim', { n: (n === 40 ? 'Examen global' : 'Simulacro') + ' · ' + ({ adapt: 'adaptativo', estudiadas: 'temas estudiados', todas: 'todas las materias' }[sel] || sel) }); rerender(); }
  else if (a === 'sim-salir') { e.preventDefault(); QZ = null; rerender(); }
  else if (a === 'diag-go') { var mm = b.dataset.m; nuevoQuiz(TOPS.filter(function (t) { return t.materia === mm && t.preguntas && t.preguntas[0]; }).map(function (t) { return Object.assign({ tid: t.id }, t.preguntas[0]); }), 'diag', { m: mm }); rerender(); }
  else if (a === 'diag-salir') { e.preventDefault(); QZ = null; rerender(); }
  else if (a === 'diag-fin') { QZ.qs.forEach(function (q) { S.diag[q.tid] = QZ.fallas.indexOf(q) < 0; }); QZ = null; save(); rerender(); }
  else if (a === 'meta') { S.meta[HOY()] = { res: $('#mRes').value, a: $('#m1').value, b: $('#m2').value, c: $('#m3').value, d: $('#m4').value, e: $('#m5').value }; var hy = HOY(); S.agenda[hy] = S.agenda[hy] || {}; S.agenda[hy].cierre = true; save(); location.hash = '#hoy'; }
  else if (a === 'po-play') { if (PO.corre) { PO.corre = false; PO.rest = (PO.fin - Date.now()) / 1000; } else { PO.corre = true; PO.fin = Date.now() + PO.rest * 1000; } rerender(); }
  else if (a === 'po-reset') { PO.corre = false; PO.modo = 'estudio'; PO.rest = S.cfg.pomo * 60; $('#pomoMini').textContent = mmss(PO.rest); rerender(); }
  else if (a === 'po-skip') { poStart(PO.modo === 'estudio' ? 'descanso' : 'estudio'); rerender(); }
  else if (a === 'exp-csv') { bajar('KAA_CSV_maestro_' + HOY() + '.csv', toCSV(csvActual()), 'text/csv;charset=utf-8'); }
  else if (a === 'exp-maestro') { bajar('KAA_CSV_maestro_original.csv', '﻿' + CSV_BASE, 'text/csv;charset=utf-8'); }
  else if (a === 'exp-cards') { bajar('KAA_tarjetas_' + HOY() + '.csv', toCSV(filasCartas()), 'text/csv;charset=utf-8'); }

  else if (a === 'cf-p') { CF.p += +b.dataset.d; rerender(); }
  else if (a === 'cfg-save') { guardarCfg(); b.textContent = 'Guardado ✓'; }
  else if (a === 'notif') { if (!window.Notification) { b.textContent = 'Este navegador no permite notificaciones'; return; } Notification.requestPermission().then(function (p) { S.cfg.notif = p === 'granted'; save(); if (S.cfg.notif) avisar('KAA Study Hub', 'Notificaciones activadas ✓'); rerender(); }); }
  else if (a === 'ics') { bajar('KAA_Study_Hub_recordatorios.ics', icsCalendario(), 'text/calendar;charset=utf-8'); }
  else if (a === 'theme') { var v = b.dataset.v; if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v); try { localStorage.setItem('kaa-theme', v); } catch (e3) {} rerender(); }
  else if (a === 'borrar') { if (b.dataset.ok) { S = nuevo(); save(); cargarCSV(); location.hash = '#hoy'; } else { b.dataset.ok = '1'; b.textContent = 'Toca otra vez para confirmar: se borra todo'; } }
});
function guardarCfg() { var g = function (i) { var el = $('#' + i); return el ? el.value : null; }; if (g('cfgNombre')) S.cfg.nombre = g('cfgNombre'); if (g('cfgS1')) S.cfg.s1 = g('cfgS1'); if (g('cfgM')) S.cfg.manana = g('cfgM'); if (g('cfgN')) S.cfg.noche = g('cfgN'); if (g('cfgP')) S.cfg.pomo = Math.max(15, Math.min(60, +g('cfgP'))); if (g('cfgD')) S.cfg.desc = Math.max(3, Math.min(20, +g('cfgD'))); if (!PO.corre) PO.rest = S.cfg.pomo * 60; save(); }
app.addEventListener('change', function (e) {
  if (e.target.id === 'poTema') PO.tema = e.target.value || null;

    var fin = function (rows) { var r = importar(rows); msg(r.error ? r.error : 'Importado: ' + r.act + ' filas' + (r.nuevos ? ' (' + r.nuevos + ' nuevas)' : '') + (r.cartas ? ', ' + r.cartas + ' tarjetas nuevas' : '') + '.' + (r.corr.length ? '<br><b>Fechas corregidas al 15/10/2026:</b> ' + r.corr.map(esc).join('; ') : '')); };
    if (/\.xlsx?$/i.test(f.name)) conXLSX(function () { var rd = new FileReader(); rd.onload = function () { var wb = XLSX.read(rd.result, { type: 'array', cellDates: false }); fin(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' })); }; rd.readAsArrayBuffer(f); });
    else { var rd = new FileReader(); rd.onload = function () { fin(parseCSV(rd.result)); }; rd.readAsText(f, 'utf-8'); }
  }
});

try { var th = localStorage.getItem('kaa-theme'); if (th && th !== 'auto') document.documentElement.setAttribute('data-theme', th); } catch (e) {}
