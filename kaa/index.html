ocial (social change)."], "formulas": ["Asch (1951): 123 estudiantes varones de EE.UU.; 36.8% de conformidad; 25% nunca se conformó", "Zimbardo / Haney, Banks y Zimbardo (1973): Stanford Prison Experiment, detenido a los 6 días de 14 previstos", "Milgram (1963): 40 hombres; 65% hasta 450 V; 100% hasta 300 V", "Adorno et al. (1950): personalidad autoritaria (F-scale)", "Rotter (1966): locus de control", "Moscovici, Lage y Naffrechoux (1969): minoría consistente 8.42% vs inconsistente 1.25%"], "glosario": [{"en": "conformity", "es": "conformidad"}, {"en": "obedience", "es": "obediencia"}, {"en": "agentic state", "es": "estado agéntico"}, {"en": "minority influence", "es": "influencia de la minoría"}, {"en": "locus of control", "es": "locus de control"}], "flashcards": [{"q": "¿Qué es la influencia social normativa?", "a": "Conformarse para ser aceptado y no ser rechazado por el grupo."}, {"q": "¿Qué porcentaje obedeció hasta 450 V en Milgram (1963)?", "a": "65% de los 40 participantes."}, {"q": "¿Qué es el estado agéntico?", "a": "Cuando una persona actúa como agente de otra y no se siente responsable de sus actos."}, {"q": "Nombra los tres tipos de conformidad de Kelman.", "a": "Compliance, identification e internalisation."}, {"q": "¿Qué demostró Moscovici (1969)?", "a": "Que una minoría consistente influye más que una inconsistente."}, {"q": "¿Qué factores ayudan a resistir la obediencia?", "a": "El apoyo social (un aliado que desobedece) y un locus de control interno."}], "preguntas": [{"q": "En el estudio de Asch (1951), la tasa media de conformidad en los ensayos críticos fue aproximadamente:", "op": ["65%", "37%", "8%", "100%"], "ok": 1, "exp": "Fue de 36.8%; el 65% corresponde a la obediencia en Milgram."}, {"q": "Una persona acepta en público la opinión del grupo pero en privado sigue pensando distinto. Esto es:", "op": ["Internalización", "Identificación", "Sumisión (compliance)", "Influencia de la minoría"], "ok": 2, "exp": "La sumisión es el nivel más superficial de conformidad."}, {"q": "¿Qué variación de Milgram redujo más la obediencia?", "op": ["Cuando el experimentador daba órdenes por teléfono", "Cuando el estudio se hacía en Yale", "Cuando el experimentador usaba bata", "Cuando había más voltios disponibles"], "ok": 0, "exp": "Con órdenes por teléfono la obediencia cayó a 20.5%, porque la autoridad estaba menos presente."}, {"q": "Según Moscovici, ¿cuál es el factor más importante en la influencia de la minoría?", "op": ["El tamaño", "El estatus social", "La edad", "La consistencia"], "ok": 3, "exp": "Una minoría consistente hace que la mayoría reconsidere su postura."}, {"q": "Una persona con locus de control interno tiende a:", "op": ["Resistir mejor la presión social", "Obedecer más", "Conformarse más", "Culpar a la suerte de lo que le pasa"], "ok": 0, "exp": "Cree que controla su propia conducta, así que depende menos de los demás."}], "feynman": "Explícale a tu hermano por qué alguien podría lastimar a otra persona solo porque 'se lo ordenaron', sin usar la palabra 'malvado'.", "conexion": ["¿Cómo usarías lo aprendido sobre influencia de la minoría para lanzar una campaña de reciclaje en tu escuela?", "¿Crees que los resultados de Asch (1951) se repetirían hoy con adolescentes en redes sociales? ¿Por qué?"], "examen": {"q": "Discuss research into obedience. Refer to Milgram's research in your answer.", "marks": 16, "ms": "AO1 (6): Milgram (1963) procedure and findings (40 men, 65% to 450V); situational variations (proximity, location, uniform); explanations such as agentic state and legitimacy of authority. AO3 (10): strengths/limitations e.g. high internal validity vs low ecological validity (artificial task); ethical issues (deception, right to withdraw, protection from harm); Orne and Holland (1968) argued participants may not have believed shocks were real; supporting replications (e.g. Burger, 2009); historical/cultural bias (US men, 1960s). Levels: 13-16 accurate, detailed, thorough and effective evaluation; 9-12 clear with some detail; 5-8 limited; 1-4 very limited."}}, {"id": "PSI02", "materia": "Psicología", "mesa": "AQA", "rama": "Psicología", "tema": "Memoria", "temaEN": "Memory: multi-store model, working memory model, types of long-term memory, forgetting, eyewitness testimony and the cognitive interview", "explicacion": "El modelo multialmacén (multi-store model, MSM) de Atkinson y Shiffrin (1968) dice que la memoria pasa por tres almacenes: el registro sensorial (sensory register), la memoria a corto plazo (short-term memory, STM) y la memoria a largo plazo (long-term memory, LTM). La información pasa del registro a la STM gracias a la atención (attention) y de la STM a la LTM gracias al repaso (rehearsal). Cada almacén tiene características distintas de codificación (coding), capacidad (capacity) y duración (duration): la STM codifica principalmente de forma acústica, guarda unos 7 ± 2 elementos (Miller, 1956) y dura unos 18 a 30 segundos sin repaso (Peterson y Peterson, 1959); la LTM codifica sobre todo de forma semántica (Baddeley, 1966), tiene capacidad casi ilimitada y puede durar toda la vida (Bahrick et al., 1975). Tulving (1985) distinguió en la LTM la memoria episódica (episodic), de tus experiencias, la semántica (semantic), de los conocimientos, y la procedimental (procedural), de las habilidades.\n\nEl modelo de memoria de trabajo (working memory model, WMM) de Baddeley y Hitch (1974) ve la STM como un sistema activo con varios componentes: el ejecutivo central (central executive), que dirige la atención; el bucle fonológico (phonological loop), para sonidos y palabras; la agenda visoespacial (visuo-spatial sketchpad), para imágenes y espacio; y el búfer episódico (episodic buffer), añadido en 2000, que integra la información y conecta con la LTM. El caso de KF (Shallice y Warrington, 1970), con una STM verbal dañada pero visual intacta, apoya la idea de componentes separados.\n\nOlvidamos por interferencia (interference), cuando unos recuerdos se confunden con otros: proactiva (proactive), cuando lo viejo interfiere con lo nuevo, o retroactiva (retroactive), cuando lo nuevo interfiere con lo viejo; y por fallo de recuperación (retrieval failure), cuando faltan claves (cues) de contexto o de estado (Godden y Baddeley, 1975, con buzos). El testimonio de testigos (eyewitness testimony) puede distorsionarse con información engañosa (misleading information): Loftus y Palmer (1974) mostraron que el verbo 'smashed' llevaba a estimar más velocidad que 'contacted'. También influyen la discusión posterior al evento (Gabbert et al., 2003) y la ansiedad (Johnson y Scott, 1976, sobre el efecto del arma). La entrevista cognitiva (cognitive interview, Fisher y Geiselman, 1992) mejora el recuerdo pidiendo reportar todo, reinstaurar el contexto, cambiar el orden y cambiar la perspectiva.", "analogia": "La memoria es como tu celular: el registro sensorial es la cámara que capta todo por un instante, la STM es la memoria RAM (pocas apps abiertas al mismo tiempo y se borran si no las guardas) y la LTM es el almacenamiento interno con espacio enorme. Olvidar a veces no es haber borrado la foto, sino no encontrarla porque no recuerdas en qué carpeta la guardaste (fallo de recuperación).", "ejemplo": "En el Reino Unido, la policía usa el modelo PEACE de entrevistas, que incorpora técnicas de la entrevista cognitiva para obtener testimonios más precisos. En México, organizaciones como el Innocence Project México han documentado casos en los que identificaciones erróneas de testigos llevaron a condenar a personas inocentes, lo que muestra por qué importa la investigación de Loftus.", "puntos": ["El modelo multialmacén (multi-store model) tiene registro sensorial, STM y LTM, conectados por atención y repaso (rehearsal).", "STM: codificación acústica, 7 ± 2 elementos, ~18-30 s; LTM: codificación semántica, capacidad y duración casi ilimitadas.", "El modelo de memoria de trabajo (working memory model) incluye central executive, phonological loop, visuo-spatial sketchpad y episodic buffer.", "Tipos de LTM: episódica (episodic), semántica (semantic) y procedimental (procedural) (Tulving, 1985).", "El olvido se explica por interferencia proactiva/retroactiva (interference) y fallo de recuperación (retrieval failure) por falta de claves.", "El testimonio de testigos (eyewitness testimony) se afecta por información engañosa y ansiedad; la entrevista cognitiva (cognitive interview) lo mejora."], "formulas": ["Atkinson y Shiffrin (1968): multi-store model", "Miller (1956): capacidad de STM 7 ± 2; Jacobs (1887): digit span", "Peterson y Peterson (1959): duración de STM 18-30 s; Bahrick et al. (1975): duración de LTM (~90% reconocimiento de caras tras 15 años)", "Baddeley (1966): codificación acústica en STM y semántica en LTM; Baddeley y Hitch (1974): working memory model; Baddeley (2000): episodic buffer", "Godden y Baddeley (1975): memoria dependiente del contexto (buzos); McGeoch y McDonald (1931): interferencia", "Loftus y Palmer (1974): 'smashed' ≈ 40.5 mph vs 'contacted' ≈ 31.8 mph; Fisher y Geiselman (1992): cognitive interview"], "glosario": [{"en": "short-term memory", "es": "memoria a corto plazo"}, {"en": "rehearsal", "es": "repaso"}, {"en": "episodic buffer", "es": "búfer episódico"}, {"en": "retroactive interference", "es": "interferencia retroactiva"}, {"en": "eyewitness testimony", "es": "testimonio de testigos"}], "flashcards": [{"q": "¿Cuál es la capacidad de la STM según Miller (1956)?", "a": "7 ± 2 elementos (chunks)."}, {"q": "¿Qué mueve la información de la STM a la LTM en el MSM?", "a": "El repaso (rehearsal)."}, {"q": "Nombra los cuatro componentes del WMM.", "a": "Central executive, phonological loop, visuo-spatial sketchpad y episodic buffer."}, {"q": "¿Qué es la interferencia proactiva?", "a": "Cuando información antigua dificulta recordar información nueva."}, {"q": "¿Qué encontraron Loftus y Palmer (1974)?", "a": "El verbo de la pregunta ('smashed' vs 'contacted') cambiaba la velocidad estimada: la información engañosa distorsiona el recuerdo."}, {"q": "Nombra las cuatro técnicas de la entrevista cognitiva.", "a": "Reportar todo, reinstaurar el contexto, cambiar el orden y cambiar la perspectiva."}], "preguntas": [{"q": "Según Peterson y Peterson (1959), sin repaso la información en la STM dura aproximadamente:", "op": ["2 segundos", "5 minutos", "18-30 segundos", "Toda la vida"], "ok": 2, "exp": "Tras unos 18 segundos el recuerdo cayó a menos del 10%."}, {"q": "¿Qué componente del WMM procesa información de sonidos y palabras?", "op": ["Bucle fonológico (phonological loop)", "Agenda visoespacial", "Búfer episódico", "Ejecutivo central"], "ok": 0, "exp": "El bucle fonológico incluye el almacén fonológico y el proceso articulatorio."}, {"q": "Saber andar en bicicleta es un ejemplo de memoria:", "op": ["Episódica", "Semántica", "Sensorial", "Procedimental (procedural)"], "ok": 3, "exp": "Es una habilidad automática que no requiere recuerdo consciente."}, {"q": "Godden y Baddeley (1975) encontraron que los buzos recordaban mejor cuando:", "op": ["Aprendían en tierra", "El contexto de aprendizaje y de recuerdo coincidía", "Aprendían bajo el agua y recordaban en tierra", "Repasaban más veces"], "ok": 1, "exp": "Apoya el fallo de recuperación por ausencia de claves de contexto."}, {"q": "Aprender un nuevo número de teléfono y luego no poder recordar el antiguo es:", "op": ["Interferencia retroactiva", "Interferencia proactiva", "Efecto del arma", "Desplazamiento"], "ok": 0, "exp": "Lo nuevo interfiere con lo viejo: retroactiva."}], "feynman": "Explícale a tu mamá por qué a veces entras a la cocina y olvidas qué ibas a buscar, pero lo recuerdas en cuanto vuelves a tu cuarto, usando la idea de claves de recuperación.", "conexion": ["¿Cómo podrías aplicar el fallo de recuperación dependiente del contexto para estudiar mejor para tus exámenes de A-Level?", "¿Por qué el caso KF es un problema para el modelo multialmacén pero apoya el modelo de memoria de trabajo?"], "examen": {"q": "Outline and evaluate the multi-store model of memory.", "marks": 16, "ms": "AO1 (6): sensory register, STM and LTM; attention and rehearsal as transfer processes; coding, capacity and duration of each store with supporting research (Miller 1956, Peterson and Peterson 1959, Baddeley 1966). AO3 (10): supporting evidence from research on distinct stores (e.g. Baddeley 1966, case of HM); limitations - case of KF suggests more than one STM store; model is oversimplified (WMM, multiple LTM types per Tulving); rehearsal not always needed for transfer (e.g. flashbulb memories); artificial lab tasks with low ecological validity. Levels: 13-16 accurate, detailed, effective evaluation, clear and coherent; 9-12; 5-8; 1-4."}}, {"id": "PSI03", "materia": "Psicología", "mesa": "AQA", "rama": "Psicología", "tema": "Apego infantil", "temaEN": "Attachment: caregiver-infant interactions, stages of attachment, animal studies, explanations of attachment, Strange Situation and maternal deprivation", "explicacion": "El apego (attachment) es un vínculo emocional fuerte y duradero entre dos personas, como un bebé y su cuidador. Empieza con las interacciones cuidador-bebé (caregiver-infant interactions): la reciprocidad (reciprocity), cuando ambos se responden por turnos como en una conversación, y la sincronía interaccional (interactional synchrony), cuando reflejan las emociones y movimientos del otro (Meltzoff y Moore, 1977). Schaffer y Emerson (1964) estudiaron a 60 bebés de Glasgow y describieron cuatro etapas del apego: asocial (asocial), indiscriminado (indiscriminate), específico (specific attachment, hacia los 7 meses, con ansiedad ante extraños y por separación) y múltiple (multiple attachments). También se investiga el papel del padre (role of the father): Grossmann et al. (2002) sugirieron que los padres aportan más al juego y la estimulación.\n\nLos estudios con animales fueron clave. Lorenz (1935) observó que los gansos siguen a lo primero que ven al nacer (impronta o imprinting) durante un periodo crítico (critical period). Harlow (1958) mostró que las crías de mono rhesus preferían una 'madre' de felpa sin comida a una de alambre con biberón, así que el apego depende del confort de contacto (contact comfort) y no solo de la comida. Esto contradice la teoría del aprendizaje (learning theory), o 'amor de alacena' (cupboard love), que explicaba el apego por condicionamiento clásico y operante. Bowlby (1969) propuso su teoría monotrópica (monotropic theory): el apego es innato y adaptativo, hay una figura principal (monotropy), los bebés usan señales sociales (social releasers), existe un periodo crítico de unos 2 años y medio y se forma un modelo interno de trabajo (internal working model) que guía relaciones futuras.\n\nAinsworth y Bell (1970) crearon la Situación Extraña (Strange Situation), con 8 episodios que observan la búsqueda de proximidad, la exploración, la ansiedad ante extraños, la ansiedad por separación y la conducta de reencuentro. Encontraron apego seguro (secure, ~66%), inseguro-evitativo (insecure-avoidant, ~22%) e inseguro-resistente (insecure-resistant, ~12%). Van IJzendoorn y Kroonenberg (1988) compararon culturas y vieron que el seguro es el más común en todas, aunque con variaciones. La teoría de privación materna (maternal deprivation) de Bowlby (1951) dice que separarse del cuidador en el periodo crítico daña el desarrollo emocional e intelectual; su estudio de 44 ladrones (44 thieves, 1944) la apoyó. Los estudios de huérfanos rumanos (Rutter et al., 2011) mostraron que los niños adoptados antes de los 6 meses se recuperaban mejor, y Hazan y Shaver (1987) relacionaron el tipo de apego con las relaciones amorosas adultas.", "analogia": "El apego es como la base de un castillo de Lego: si la base (la relación con tu cuidador principal) está firme, puedes construir torres altas y explorar sin miedo, porque sabes que hay algo sólido debajo. El modelo interno de trabajo es como el 'manual de instrucciones' que te queda para construir relaciones futuras.", "ejemplo": "En el Reino Unido, la investigación sobre apego cambió las reglas de los hospitales: antes los padres solo podían visitar a sus hijos hospitalizados en horarios muy limitados, y tras el trabajo de Bowlby y del matrimonio Robertson se permitió que los padres se quedaran con ellos. En México, programas de cuidados de 'mamá canguro' en hospitales públicos promueven el contacto piel con piel con bebés prematuros, en línea con la idea de Harlow sobre el confort de contacto.", "puntos": ["Interacciones cuidador-bebé: reciprocidad (reciprocity) y sincronía interaccional (interactional synchrony).", "Schaffer y Emerson (1964): etapas asocial, indiscriminada, específica y múltiple (stages of attachment).", "Lorenz (1935): impronta (imprinting); Harlow (1958): confort de contacto (contact comfort), en contra de la teoría del aprendizaje.", "Bowlby (1969): monotropía (monotropy), periodo crítico (critical period) y modelo interno de trabajo (internal working model).", "Ainsworth y Bell (1970): Situación Extraña (Strange Situation) con apego seguro, evitativo y resistente.", "Privación materna (maternal deprivation, Bowlby, 1951) e institucionalización (Rutter et al., 2011, huérfanos rumanos)."], "formulas": ["Schaffer y Emerson (1964): 60 bebés de Glasgow, estudio longitudinal", "Lorenz (1935): impronta en gansos; Harlow (1958): monos rhesus, madre de felpa vs de alambre", "Bowlby (1944): 44 ladrones (44 thieves); Bowlby (1951): maternal deprivation; Bowlby (1969): monotropic theory", "Ainsworth y Bell (1970): Strange Situation; seguro ~66%, evitativo ~22%, resistente ~12%", "Van IJzendoorn y Kroonenberg (1988): meta-análisis de 32 estudios en 8 países", "Rutter et al. (2011): ERA study de huérfanos rumanos; Hazan y Shaver (1987): love quiz"], "glosario": [{"en": "attachment", "es": "apego"}, {"en": "imprinting", "es": "impronta"}, {"en": "monotropy", "es": "monotropía"}, {"en": "internal working model", "es": "modelo interno de trabajo"}, {"en": "maternal deprivation", "es": "privación materna"}], "flashcards": [{"q": "¿Qué es la sincronía interaccional?", "a": "Cuando bebé y cuidador reflejan las emociones y conductas del otro de manera coordinada."}, {"q": "¿A qué edad aparece el apego específico según Schaffer y Emerson?", "a": "Hacia los 7 meses."}, {"q": "¿Qué demostró Harlow (1958)?", "a": "Que el confort de contacto es más importante que la comida para formar el apego."}, {"q": "¿Qué es la monotropía?", "a": "La idea de Bowlby de que el bebé forma un apego principal y especial con una figura."}, {"q": "¿Cuáles son los tres tipos de apego de Ainsworth?", "a": "Seguro, inseguro-evitativo e inseguro-resistente."}, {"q": "¿Qué encontraron Rutter et al. con los huérfanos rumanos?", "a": "Los adoptados antes de los 6 meses se recuperaban mejor; los adoptados más tarde mostraban más apego desinhibido (disinhibited attachment)."}], "preguntas": [{"q": "Según Schaffer y Emerson (1964), la etapa en que el bebé muestra ansiedad ante extraños es:", "op": ["Asocial", "Indiscriminada", "Específica", "Múltiple"], "ok": 2, "exp": "En la etapa específica (≈7 meses) aparecen la ansiedad ante extraños y la ansiedad por separación."}, {"q": "Los resultados de Harlow (1958) contradicen principalmente:", "op": ["La teoría del aprendizaje (learning theory)", "La teoría de Bowlby", "La impronta de Lorenz", "La Situación Extraña"], "ok": 0, "exp": "Si el apego fuera por comida, los monos preferirían la madre de alambre con biberón."}, {"q": "En la Situación Extraña, un niño que ignora a su madre al reencontrarse probablemente tiene apego:", "op": ["Seguro", "Inseguro-resistente", "Desorganizado", "Inseguro-evitativo"], "ok": 3, "exp": "El evitativo muestra poca angustia al separarse y evita al cuidador en el reencuentro."}, {"q": "El 'internal working model' de Bowlby se refiere a:", "op": ["Un periodo crítico de 2 años y medio", "Una plantilla mental de las relaciones basada en el primer apego", "La conducta de los gansos", "Un tipo de entrevista"], "ok": 1, "exp": "Guía las expectativas sobre relaciones futuras."}, {"q": "Van IJzendoorn y Kroonenberg (1988) encontraron que el tipo de apego más común en todos los países fue:", "op": ["Seguro", "Evitativo", "Resistente", "Desorganizado"], "ok": 0, "exp": "El seguro predominó en todas las culturas, aunque con variaciones dentro de cada país."}], "feynman": "Explica a una niña de 8 años por qué un bebé llora cuando su mamá sale del cuarto y se calma cuando regresa, usando la idea de 'base segura'.", "conexion": ["¿Qué problemas hay al generalizar los estudios de Harlow con monos y Lorenz con gansos a los bebés humanos?", "¿Cómo podría el tipo de apego de una persona influir en sus amistades y relaciones de pareja en la adolescencia?"], "examen": {"q": "Describe and evaluate Bowlby's monotropic theory of attachment.", "marks": 16, "ms": "AO1 (6): attachment as innate and adaptive; monotropy and law of continuity/accumulated separation; social releasers; critical period (around 2.5 years); internal working model and continuity hypothesis. AO3 (10): support from Lorenz (1935) imprinting and Harlow (1958); support from Hazan and Shaver (1987); Schaffer and Emerson (1964) found multiple attachments are common, challenging monotropy; critical period better seen as sensitive period (Rutter et al., 2011); socially sensitive implications for working mothers; temperament hypothesis (Kagan) as alternative. Levels: 13-16; 9-12; 5-8; 1-4."}}, {"id": "PSI04", "materia": "Psicología", "mesa": "AQA", "rama": "Psicología", "tema": "Psicopatología", "temaEN": "Psychopathology: definitions of abnormality; characteristics, explanations and treatments of phobias, depression and OCD", "explicacion": "La psicopatología (psychopathology) estudia los trastornos mentales. AQA pide cuatro definiciones de anormalidad (definitions of abnormality): desviación de las normas sociales (deviation from social norms), cuando una conducta rompe las reglas no escritas de una sociedad; fracaso para funcionar adecuadamente (failure to function adequately), cuando la persona no puede con la vida diaria (Rosenhan y Seligman, 1989); infrecuencia estadística (statistical infrequency), cuando una característica es muy rara, como un CI menor a 70; y desviación de la salud mental ideal (deviation from ideal mental health), basada en los criterios de Jahoda (1958), como la autorrealización, la resistencia al estrés y una percepción precisa de la realidad. Cada una tiene limitaciones, como el relativismo cultural (cultural relativism).\n\nPara cada trastorno debes conocer características conductuales, emocionales y cognitivas (behavioural, emotional, cognitive). Las fobias (phobias) son miedos irracionales; se explican con el modelo de dos procesos (two-process model) de Mowrer (1960): se adquieren por condicionamiento clásico (como Little Albert, Watson y Rayner, 1920) y se mantienen por condicionamiento operante, porque evitar el objeto reduce la ansiedad (reforzamiento negativo). Se tratan con desensibilización sistemática (systematic desensitisation) de Wolpe (1958), que combina una jerarquía de ansiedad (anxiety hierarchy) con relajación, o con inundación (flooding), exposición directa e intensa.\n\nLa depresión (depression) se explica con el enfoque cognitivo: la tríada cognitiva negativa (negative triad) de Beck (1967), que es una visión negativa de uno mismo, del mundo y del futuro, y el modelo ABC de Ellis (1962), en el que un evento activador (A) lleva a creencias irracionales (B) y estas a consecuencias (C). Se trata con terapia cognitivo-conductual (cognitive behavioural therapy, CBT), que cuestiona los pensamientos irracionales; March et al. (2007) la encontraron tan eficaz como los antidepresivos. El trastorno obsesivo-compulsivo (OCD) se explica con el enfoque biológico: genético (genetic explanation, genes candidatos como SERT y COMT, y es poligénico) y neural (neural explanation, bajos niveles de serotonina y actividad anormal en la corteza orbitofrontal). Se trata con fármacos (drug therapy) como los ISRS (SSRIs), que aumentan la serotonina disponible.", "analogia": "Las definiciones de anormalidad son como diferentes 'lentes' para mirar a una persona: una lente mide si es raro (estadística), otra si rompe las reglas (normas sociales), otra si puede con su vida (funcionamiento) y otra si está lejos del ideal (salud mental ideal). Ninguna lente sola ve el cuadro completo.", "ejemplo": "En el Reino Unido, el NHS ofrece CBT gratuita mediante el programa NHS Talking Therapies (antes IAPT) para depresión y ansiedad. En México, según la Secretaría de Salud, la depresión es uno de los trastornos mentales más frecuentes, y el IMSS ofrece tratamiento combinando psicoterapia y antidepresivos como los ISRS.", "puntos": ["Cuatro definiciones de anormalidad: normas sociales, fracaso para funcionar, infrecuencia estadística y salud mental ideal (Jahoda, 1958).", "Fobias: modelo de dos procesos (two-process model) de Mowrer (1960): condicionamiento clásico + operante.", "Tratamientos de fobias: desensibilización sistemática (systematic desensitisation) e inundación (flooding).", "Depresión: tríada negativa de Beck (negative triad) y modelo ABC de Ellis; tratamiento con CBT.", "OCD: explicaciones genéticas (genetic) y neurales (neural: serotonina, orbitofrontal cortex); tratamiento con SSRIs.", "Todos los trastornos se describen con características conductuales, emocionales y cognitivas."], "formulas": ["Jahoda (1958): criterios de salud mental ideal; Rosenhan y Seligman (1989): rasgos de fracaso para funcionar", "Watson y Rayner (1920): Little Albert; Mowrer (1960): two-process model", "Wolpe (1958): systematic desensitisation (reciprocal inhibition)", "Beck (1967): negative triad; Ellis (1962): modelo ABC / REBT", "March et al. (2007): CBT y antidepresivos ~81% eficaces cada uno, ~86% combinados en adolescentes", "Nestadt et al. (2010): concordancia de OCD ~68% en gemelos MZ vs ~31% en DZ"], "glosario": [{"en": "statistical infrequency", "es": "infrecuencia estadística"}, {"en": "systematic desensitisation", "es": "desensibilización sistemática"}, {"en": "negative triad", "es": "tríada negativa"}, {"en": "obsessive-compulsive disorder (OCD)", "es": "trastorno obsesivo-compulsivo"}, {"en": "selective serotonin reuptake inhibitors (SSRIs)", "es": "inhibidores selectivos de la recaptación de serotonina"}], "flashcards": [{"q": "Nombra las cuatro definiciones de anormalidad.", "a": "Desviación de normas sociales, fracaso para funcionar adecuadamente, infrecuencia estadística y desviación de la salud mental ideal."}, {"q": "¿Cómo explica el modelo de dos procesos una fobia?", "a": "Se adquiere por condicionamiento clásico y se mantiene por condicionamiento operante (la evitación se refuerza negativamente)."}, {"q": "¿Qué es la jerarquía de ansiedad?", "a": "Una lista de situaciones temidas ordenadas de menor a mayor ansiedad, usada en la desensibilización sistemática."}, {"q": "¿Qué es la tríada negativa de Beck?", "a": "Visión negativa de uno mismo, del mundo y del futuro."}, {"q": "¿Qué significan las letras del modelo ABC de Ellis?", "a": "Activating event, Beliefs (irracionales) y Consequences."}, {"q": "¿Cómo actúan los ISRS en el OCD?", "a": "Bloquean la recaptación de serotonina, así que hay más disponible en la sinapsis."}], "preguntas": [{"q": "Una limitación de la definición de infrecuencia estadística es que:", "op": ["Es muy subjetiva", "Algunos rasgos raros son deseables, como un CI muy alto", "Depende de la cultura", "Nadie cumple sus criterios"], "ok": 1, "exp": "Ser estadísticamente raro no siempre es negativo."}, {"q": "El tratamiento que usa una jerarquía de ansiedad y técnicas de relajación es:", "op": ["Inundación (flooding)", "CBT", "Fármacos ISRS", "Desensibilización sistemática"], "ok": 3, "exp": "Wolpe (1958): no se pueden sentir relajación y miedo a la vez (reciprocal inhibition)."}, {"q": "Según Beck (1967), la depresión se debe a:", "op": ["Esquemas negativos y la tríada cognitiva negativa", "Baja serotonina únicamente", "Condicionamiento clásico", "Conflictos inconscientes del id"], "ok": 0, "exp": "Es una explicación cognitiva basada en patrones de pensamiento negativos."}, {"q": "En el modelo de dos procesos, la fobia se mantiene porque:", "op": ["El estímulo se vuelve neutral", "La persona imita a otros", "Evitar el estímulo reduce la ansiedad (reforzamiento negativo)", "Hay exceso de dopamina"], "ok": 2, "exp": "La evitación se refuerza negativamente y por eso la fobia persiste."}, {"q": "Una característica cognitiva del OCD es:", "op": ["Lavarse las manos repetidamente", "Pensamientos obsesivos recurrentes e intrusivos", "Evitar situaciones", "Ansiedad intensa"], "ok": 1, "exp": "Las obsesiones son cognitivas; las compulsiones son conductuales y la ansiedad es emocional."}], "feynman": "Explica a un amigo cómo alguien puede desarrollar miedo a los perros después de una mordida y por qué ese miedo no desaparece solo, usando palabras simples.", "conexion": ["¿Por qué podría ser problemático usar la 'desviación de las normas sociales' para definir la anormalidad al comparar el Reino Unido con México?", "¿Por qué combinar CBT con fármacos podría ser más eficaz que cualquiera de los dos por separado en el tratamiento de la depresión?"], "examen": {"q": "Outline and evaluate the cognitive approach to explaining depression.", "marks": 16, "ms": "AO1 (6): Beck's (1967) cognitive theory - faulty information processing, negative self-schemas, negative triad (self, world, future); Ellis's (1962) ABC model - activating event, irrational beliefs, consequences; 'musturbatory' thinking. AO3 (10): research support (e.g. Grazioli and Terry, 2000; Cohen et al., 2019); practical application to CBT (March et al., 2007); does not explain all aspects (e.g. hallucinations, Cotard syndrome) or reactive depression; may blame the individual and ignore situational factors; biological explanations (serotonin) as alternative; cause and effect issue - negative thinking may be a symptom. Levels: 13-16; 9-12; 5-8; 1-4."}}, {"id": "PSI05", "materia": "Psicología", "mesa": "AQA", "rama": "Psicología", "tema": "Enfoques en psicología", "temaEN": "Approaches in psychology: origins of psychology, behaviourist, social learning theory, cognitive, biological, psychodynamic and humanistic approaches", "explicacion": "La psicología como ciencia empezó con Wilhelm Wundt, que en 1879 abrió el primer laboratorio de psicología en Leipzig, Alemania. Usaba la introspección (introspection), que consistía en pedir a personas entrenadas que describieran sus pensamientos y sensaciones de forma controlada y estandarizada. Esto marcó la separación de la filosofía. Más tarde la psicología buscó métodos más científicos y objetivos, con hipótesis comprobables, control de variables y replicabilidad.\n\nEl enfoque conductista (behaviourist approach) estudia solo la conducta observable y dice que todo se aprende. El condicionamiento clásico (classical conditioning), de Pavlov, es aprender por asociación: el perro saliva con una campana. El condicionamiento operante (operant conditioning), de Skinner, es aprender por consecuencias: reforzamiento positivo (positive reinforcement), negativo (negative reinforcement) y castigo (punishment). La teoría del aprendizaje social (social learning theory, SLT) de Bandura añade procesos mentales: aprendemos observando e imitando modelos (modelling), por identificación (identification), reforzamiento vicario (vicarious reinforcement) y cuatro procesos mediacionales (mediational processes): atención, retención, reproducción motora y motivación; se demostró en el experimento del muñeco Bobo (Bandura, Ross y Ross, 1961). El enfoque cognitivo (cognitive approach) estudia procesos mentales internos mediante inferencia, esquemas (schemas) y modelos teóricos y computacionales, y hoy incluye la neurociencia cognitiva (cognitive neuroscience).\n\nEl enfoque biológico (biological approach) explica la conducta por genes, neuroquímica, estructuras cerebrales y evolución; distingue genotipo (genotype) de fenotipo (phenotype) y usa estudios de gemelos. El enfoque psicodinámico (psychodynamic approach) de Freud se centra en el inconsciente (unconscious), en la estructura de la personalidad, con el ello (id), el yo (ego) y el superyó (superego), en los mecanismos de defensa (defence mechanisms) como la represión, la negación y el desplazamiento, y en las etapas psicosexuales (psychosexual stages): oral, anal, fálica, latencia y genital. Por último, el enfoque humanista (humanistic approach) de Maslow y Rogers destaca el libre albedrío (free will), la autorrealización (self-actualisation), la jerarquía de necesidades de Maslow (1943), la congruencia (congruence) entre el yo real y el ideal, las condiciones de valía (conditions of worth) y la terapia centrada en el cliente (client-centred therapy).", "analogia": "Los enfoques son como diferentes cámaras grabando el mismo partido de fútbol: el conductista solo ve lo que hacen los jugadores, el cognitivo trata de leer su estrategia mental, el biológico mira su cuerpo y su energía, el psicodinámico busca motivos ocultos de su infancia y el humanista pregunta qué los hace sentirse realizados. Cada cámara capta algo real, pero ninguna muestra todo.", "ejemplo": "Las apps para aprender idiomas, como Duolingo, usan condicionamiento operante: rachas, puntos y recompensas para reforzar la práctica diaria. En el Reino Unido, el NHS ofrece terapias basadas en el enfoque cognitivo (CBT) y fármacos basados en el enfoque biológico; en México, el debate sobre la violencia en videojuegos y la televisión se relaciona con la teoría del aprendizaje social de Bandura.", "puntos": ["Wundt abrió el primer laboratorio de psicología en Leipzig (1879) y usó la introspección (introspection).", "Conductismo (behaviourism): condicionamiento clásico (Pavlov) y operante (Skinner); solo conducta observable.", "Aprendizaje social (social learning theory): imitación, modelado, reforzamiento vicario y procesos mediacionales (Bandura, 1961).", "Cognitivo (cognitive): esquemas (schemas), modelos computacionales y neurociencia cognitiva.", "Biológico (biological): genes, neuroquímica, evolución y genotipo/fenotipo (genotype/phenotype).", "Psicodinámico (psychodynamic): inconsciente, id/ego/superego, defensas y etapas psicosexuales; humanista (humanistic): libre albedrío, autorrealización y congruencia."], "formulas": ["Wundt (1879): primer laboratorio de psicología, Leipzig", "Pavlov (1890s): condicionamiento clásico con perros; Skinner (1938): condicionamiento operante con ratas y palomas", "Bandura, Ross y Ross (1961): muñeco Bobo", "Freud (1909): caso del pequeño Hans (Little Hans)", "Maslow (1943): jerarquía de necesidades; Rogers (1951): client-centred therapy", "Procesos mediacionales de Bandura: attention, retention, motor reproduction, motivation"], "glosario": [{"en": "introspection", "es": "introspección"}, {"en": "negative reinforcement", "es": "reforzamiento negativo"}, {"en": "vicarious reinforcement", "es": "reforzamiento vicario"}, {"en": "defence mechanisms", "es": "mecanismos de defensa"}, {"en": "self-actualisation", "es": "autorrealización"}], "flashcards": [{"q": "¿Quién abrió el primer laboratorio de psicología y cuándo?", "a": "Wilhelm Wundt, en Leipzig, en 1879."}, {"q": "Diferencia entre reforzamiento negativo y castigo.", "a": "El reforzamiento negativo quita algo desagradable y aumenta la conducta; el castigo la disminuye."}, {"q": "¿Cuáles son los procesos mediacionales de Bandura?", "a": "Atención, retención, reproducción motora y motivación."}, {"q": "¿Qué es un esquema (schema)?", "a": "Un paquete mental de ideas y expectativas basado en la experiencia, que guía cómo procesamos la información."}, {"q": "¿Qué es el superyó (superego)?", "a": "La parte moral de la personalidad según Freud; interioriza las normas de los padres y la sociedad."}, {"q": "¿Qué es la congruencia según Rogers?", "a": "Cuando el yo real y el yo ideal coinciden; es necesaria para la autorrealización."}], "preguntas": [{"q": "Wundt usaba principalmente el método de:", "op": ["Experimentos con ratas", "Psicoanálisis", "Introspección", "Escáneres cerebrales"], "ok": 2, "exp": "La introspección era su método para estudiar la experiencia consciente."}, {"q": "Una niña recibe un premio por ordenar su cuarto y lo vuelve a hacer. Esto es:", "op": ["Reforzamiento positivo", "Reforzamiento negativo", "Condicionamiento clásico", "Castigo"], "ok": 0, "exp": "Se añade algo agradable y la conducta aumenta."}, {"q": "En el experimento del muñeco Bobo, los niños que vieron al modelo agresivo:", "op": ["No imitaron ninguna conducta", "Fueron menos agresivos", "Solo imitaron a mujeres", "Imitaron más conductas agresivas"], "ok": 3, "exp": "Bandura, Ross y Ross (1961) apoyaron el aprendizaje por observación."}, {"q": "¿Qué enfoque destaca el libre albedrío (free will)?", "op": ["Biológico", "Humanista", "Conductista", "Psicodinámico"], "ok": 1, "exp": "Los demás enfoques son más deterministas."}, {"q": "Según Freud, la parte de la personalidad que funciona con el principio del placer es:", "op": ["El ello (id)", "El yo (ego)", "El superyó (superego)", "El inconsciente colectivo"], "ok": 0, "exp": "El id es impulsivo y busca la gratificación inmediata."}], "feynman": "Elige una conducta tuya, como revisar el celular muchas veces al día, y explícala en una frase simple desde cada uno de los seis enfoques.", "conexion": ["¿Por qué el enfoque conductista y el biológico se consideran más 'científicos' que el psicodinámico y el humanista?", "¿Cómo explicarías la agresión en adolescentes combinando la teoría del aprendizaje social con el enfoque biológico?"], "examen": {"q": "Outline and evaluate social learning theory.", "marks": 16, "ms": "AO1 (6): learning through observation and imitation of models; identification; vicarious reinforcement; mediational processes (attention, retention, motor reproduction, motivation); Bandura, Ross and Ross (1961) Bobo doll study. AO3 (10): considers cognitive factors, unlike behaviourism; research support but lab studies lack ecological validity and may show demand characteristics; underestimates biological factors (e.g. testosterone and aggression); reciprocal determinism reduces determinism; real-world application (e.g. media influence, age ratings); difficulty establishing cause and effect. Levels: 13-16; 9-12; 5-8; 1-4."}}, {"id": "PSI06", "materia": "Psicología", "mesa": "AQA", "rama": "Psicología", "tema": "Métodos de investigación", "temaEN": "Research methods: experimental methods, observational techniques, self-report, correlations, sampling, ethics and data handling and analysis", "explicacion": "Los psicólogos investigan con varios métodos. En un experimento se manipula la variable independiente (independent variable, IV) y se mide su efecto en la variable dependiente (dependent variable, DV), controlando las variables extrañas (extraneous variables) para que no se vuelvan variables confusoras (confounding variables). Hay experimentos de laboratorio (laboratory), de campo (field), naturales (natural) y cuasiexperimentos (quasi-experiments). Los diseños experimentales son de grupos independientes (independent groups), de medidas repetidas (repeated measures), donde se usa contrabalanceo (counterbalancing) contra los efectos de orden, y de pares igualados (matched pairs). La hipótesis puede ser direccional (directional), cuando predice la dirección del efecto, o no direccional (non-directional). También hay observaciones (observations: naturalistas o controladas, encubiertas o abiertas, participantes o no participantes), autoinformes (self-report) como cuestionarios y entrevistas, y correlaciones (correlations), que miden la relación entre dos covariables (co-variables) pero no demuestran causa.\n\nEl muestreo (sampling) busca una muestra representativa de la población objetivo (target population). Puede ser aleatorio (random), sistemático (systematic, cada n-ésima persona), estratificado (stratified, proporcional a subgrupos), de oportunidad (opportunity) o voluntario (volunteer). Toda investigación debe seguir el código ético de la British Psychological Society (BPS): consentimiento informado (informed consent), evitar el engaño (deception) o justificarlo con un debriefing, protección contra el daño (protection from harm), derecho a retirarse (right to withdraw) y privacidad y confidencialidad (privacy and confidentiality). También importan la fiabilidad (reliability), es decir, la consistencia, y la validez (validity), es decir, si se mide lo que se pretende; y la revisión por pares (peer review) antes de publicar.\n\nPara analizar datos se distinguen datos cuantitativos (quantitative) y cualitativos (qualitative), primarios (primary) y secundarios (secondary). Las medidas de tendencia central (measures of central tendency) son la media (mean), la mediana (median) y la moda (mode); las de dispersión son el rango (range) y la desviación estándar (standard deviation). Los datos se presentan en tablas, gráficos de barras (bar charts), histogramas, diagramas de dispersión (scattergrams) y distribuciones normales o sesgadas (skewed). El coeficiente de correlación va de −1 a +1. En el primer año también se pide la prueba del signo (sign test) y entender que en psicología se suele usar un nivel de significancia (significance level) de p ≤ 0.05, que significa como máximo un 5% de probabilidad de que el resultado se deba al azar.", "analogia": "Un experimento es como una receta de pastel en la que solo cambias un ingrediente (la IV, por ejemplo más azúcar) y mides qué tan dulce queda (la DV). Si a la vez cambias el horno, la harina y el tiempo, ya no sabrás qué causó la diferencia: esas serían variables confusoras.", "ejemplo": "Durante la pandemia, la Office for National Statistics del Reino Unido usó muestreo aleatorio de hogares para estimar cuántas personas tenían COVID-19. En México, el INEGI usa muestreo estratificado en la Encuesta Nacional de Ocupación y Empleo (ENOE) para que estén representados estados, zonas urbanas y rurales.", "puntos": ["Experimentos: se manipula la IV, se mide la DV y se controlan las variables extrañas (extraneous variables).", "Diseños: grupos independientes (independent groups), medidas repetidas (repeated measures) y pares igualados (matched pairs).", "Las correlaciones (correlations) muestran relación entre covariables pero no causa; el coeficiente va de −1 a +1.", "Muestreo (sampling): aleatorio, sistemático, estratificado, de oportunidad y voluntario.", "Ética BPS: consentimiento informado, engaño, protección contra el daño, derecho a retirarse y confidencialidad.", "Análisis: media, mediana, moda, rango, desviación estándar y prueba del signo (sign test) con p ≤ 0.05."], "formulas": ["Media (mean) = suma de los valores ÷ número de valores", "Rango (range) = valor más alto − valor más bajo (a veces se suma 1)", "Coeficiente de correlación: de −1 (negativa perfecta) a +1 (positiva perfecta); 0 = sin correlación", "Nivel de significancia habitual: p ≤ 0.05 (5%)", "Sign test: S = número de veces que aparece el signo menos frecuente; es significativo si S ≤ valor crítico", "Código ético: BPS Code of Ethics and Conduct (2009, actualizado 2018)"], "glosario": [{"en": "independent variable", "es": "variable independiente"}, {"en": "extraneous variable", "es": "variable extraña"}, {"en": "opportunity sample", "es": "muestra de oportunidad"}, {"en": "informed consent", "es": "consentimiento informado"}, {"en": "standard deviation", "es": "desviación estándar"}], "flashcards": [{"q": "¿Qué es la variable independiente?", "a": "La que el investigador manipula para ver su efecto en la variable dependiente."}, {"q": "¿Qué es el contrabalanceo?", "a": "Alternar el orden de las condiciones (ABBA) para controlar los efectos de orden en medidas repetidas."}, {"q": "¿Qué es una muestra estratificada?", "a": "Una que refleja las proporciones de los subgrupos de la población objetivo, con selección aleatoria dentro de cada uno."}, {"q": "¿Por qué una correlación no prueba causa?", "a": "Porque puede haber una tercera variable o la relación puede ir en ambos sentidos."}, {"q": "¿Qué significa p ≤ 0.05?", "a": "Hay como máximo un 5% de probabilidad de que los resultados se deban al azar."}, {"q": "¿Qué es una hipótesis direccional?", "a": "Una que predice la dirección de la diferencia o la relación (por ejemplo, 'más' o 'menos')."}], "preguntas": [{"q": "En un estudio sobre el efecto de la cafeína en la memoria, la variable dependiente es:", "op": ["La cantidad de cafeína", "La edad de los participantes", "El número de palabras recordadas", "El lugar del estudio"], "ok": 2, "exp": "La DV es lo que se mide; la cafeína es la IV que se manipula."}, {"q": "¿Qué técnica de muestreo usa a quienes están disponibles en ese momento?", "op": ["Aleatoria", "De oportunidad (opportunity)", "Estratificada", "Sistemática"], "ok": 1, "exp": "Es rápida y fácil, pero suele estar sesgada."}, {"q": "Un coeficiente de correlación de −0.85 indica:", "op": ["Correlación negativa fuerte", "Correlación positiva fuerte", "Ausencia de correlación", "Correlación negativa débil"], "ok": 0, "exp": "El signo indica la dirección y el valor cercano a 1 indica fuerza."}, {"q": "Un problema principal del diseño de medidas repetidas es:", "op": ["Las diferencias individuales entre grupos", "Que necesita el doble de participantes", "Que no se puede calcular la media", "Los efectos de orden (order effects)"], "ok": 3, "exp": "Práctica, fatiga o aburrimiento pueden afectar la segunda condición; se controla con contrabalanceo."}, {"q": "La medida de dispersión que usa todos los datos y muestra cuánto se alejan de la media es:", "op": ["Desviación estándar (standard deviation)", "Rango", "Moda", "Mediana"], "ok": 0, "exp": "Es más precisa que el rango, aunque es más difícil de calcular."}], "feynman": "Diseña con palabras simples un experimento para saber si escuchar música ayuda a memorizar vocabulario en inglés, indicando la IV, la DV y una variable que tendrías que controlar.", "conexion": ["¿Qué problemas éticos tendría hoy repetir el estudio de Milgram (1963) y cómo los resolverías?", "¿Por qué una muestra de voluntarios de tu escuela podría no representar a todos los adolescentes de México o del Reino Unido?"], "examen": {"q": "A psychologist wanted to investigate whether revising with music affects recall of vocabulary. Explain how the psychologist could use a repeated measures design for this experiment, and identify one limitation of this design.", "marks": 6, "ms": "AO2 (6): identifies IV (music vs silence) and DV (number of words recalled); same participants complete both conditions; use of different but equivalent word lists; counterbalancing (e.g. ABBA, half do music first) to control order effects; standardised procedure. Limitation: order effects (practice, fatigue, boredom) or demand characteristics as participants may guess the aim. 5-6: clear, coherent and detailed, applied to the scenario; 3-4: some detail; 1-2: limited."}}, {"id": "HIS01", "materia": "Historia", "mesa": "Edexcel", "rama": "Historia", "tema": "Sistemas políticos del siglo XX", "temaEN": "Twentieth-century political systems: revolutions and dictatorships", "explicacion": "En la primera mitad del siglo XX, Europa vivió el choque de tres grandes sistemas: la democracia liberal (liberal democracy), el comunismo (communism) y el fascismo (fascism). Después de la Primera Guerra Mundial (1914–18), muchos países quedaron arruinados, humillados o con gobiernos débiles, y eso abrió la puerta a revoluciones y dictaduras.\n\nEn Rusia, la Revolución de Febrero de 1917 hizo abdicar al zar Nicolás II y dejó al poder un Gobierno Provisional (Provisional Government) débil. En octubre de 1917 los bolcheviques (Bolsheviks) de Lenin tomaron el poder en Petrogrado con el lema \"Paz, pan y tierra\" (Peace, Land and Bread). Tras la guerra civil (1918–21) nació un Estado de partido único (one-party state) que con Stalin se volvió totalitario (totalitarian).\n\nEn Italia, Mussolini llegó al poder tras la Marcha sobre Roma (March on Rome, octubre de 1922). En Alemania, la República de Weimar (Weimar Republic) sufrió la hiperinflación de 1923 y la Gran Depresión; Hitler fue nombrado canciller (Chancellor) el 30 de enero de 1933 y con la Ley Habilitante (Enabling Act, marzo de 1933) se convirtió en dictador. Ojo: Edexcel quiere que expliques causas, cambio y continuidad, no solo que narres los hechos.", "analogia": "Imagina una casa con cimientos rotos después de un terremoto (la Primera Guerra Mundial). Unos vecinos proponen arreglarla entre todos votando (democracia), otros quieren derribarla y repartir todo por igual (comunismo) y otros quieren que un solo 'jefe fuerte' mande sin discutir (fascismo). Cuando la gente tiene miedo y hambre, el que promete orden rápido suele ganar.", "ejemplo": "Alemania, 1933: el 27 de febrero se incendia el Reichstag; Hitler culpa a los comunistas y consigue el Decreto del Incendio del Reichstag (Reichstag Fire Decree), que suspende libertades civiles. Menos de un mes después, el 23 de marzo, el Reichstag aprueba la Ley Habilitante, que permite al gobierno hacer leyes sin el parlamento. En pocas semanas una democracia se convirtió, 'legalmente', en dictadura.", "puntos": ["La Primera Guerra Mundial debilitó a los gobiernos y creó el contexto para revoluciones y dictaduras.", "Rusia 1917: Revolución de Febrero (cae el zar) y Revolución de Octubre (los bolcheviques toman el poder).", "Italia: Mussolini llega al poder en 1922 tras la Marcha sobre Roma, con el apoyo del rey Víctor Manuel III.", "Alemania: crisis de Weimar (1923, 1929) + intrigas de las élites = Hitler canciller en enero de 1933.", "Las dictaduras usaron propaganda, terror (policía secreta: Cheka/NKVD, Gestapo, OVRA) y control de la educación y la juventud.", "En el examen importa explicar causas y juzgar cuál fue el factor más importante (sustained judgement)."], "formulas": ["Feb/Mar 1917: abdica Nicolás II · 25 oct (7 nov) 1917: Revolución de Octubre", "1918–21: Guerra Civil rusa · 1921: NEP · 1928: primer Plan Quinquenal de Stalin", "28 oct 1922: Marcha sobre Roma · 1924: asesinato de Matteotti · 1929: Pactos de Letrán", "Nov 1923: Putsch de Múnich · 30 ene 1933: Hitler canciller · 23 mar 1933: Ley Habilitante", "Jun 1934: Noche de los Cuchillos Largos · 2 ago 1934: muere Hindenburg; Hitler 'Führer'"], "glosario": [{"en": "Totalitarianism", "es": "Totalitarismo"}, {"en": "One-party state", "es": "Estado de partido único"}, {"en": "Provisional Government", "es": "Gobierno Provisional"}, {"en": "Enabling Act", "es": "Ley Habilitante"}, {"en": "Coup d'état", "es": "Golpe de Estado"}], "flashcards": [{"q": "¿Qué lema usó Lenin en 1917 para ganar apoyo?", "a": "\"Paz, pan y tierra\" (Peace, Land and Bread)."}, {"q": "¿Cuándo fue nombrado Hitler canciller?", "a": "El 30 de enero de 1933."}, {"q": "¿Qué fue la Marcha sobre Roma?", "a": "La demostración fascista de octubre de 1922 tras la cual el rey nombró primer ministro a Mussolini."}, {"q": "¿Qué permitió la Ley Habilitante de 1933?", "a": "Que el gobierno de Hitler aprobara leyes sin el Reichstag."}, {"q": "¿Quién dirigía el Gobierno Provisional ruso en otoño de 1917?", "a": "Aleksandr Kérenski."}, {"q": "¿Qué fue la NEP?", "a": "La Nueva Política Económica (1921) de Lenin, que permitió algo de comercio privado tras la guerra civil."}], "preguntas": [{"q": "¿Qué acontecimiento llevó a la abdicación del zar Nicolás II?", "op": ["La Revolución de Octubre", "La Revolución de Febrero de 1917", "La guerra civil rusa", "El Tratado de Brest-Litovsk"], "ok": 1, "exp": "La Revolución de Febrero de 1917 provocó la abdicación del zar y la creación del Gobierno Provisional."}, {"q": "¿En qué año tuvo lugar la Marcha sobre Roma?", "op": ["1919", "1925", "1922", "1933"], "ok": 2, "exp": "Fue en octubre de 1922; Víctor Manuel III nombró a Mussolini primer ministro."}, {"q": "¿Qué medida de marzo de 1933 permitió a Hitler gobernar sin el parlamento?", "op": ["La Ley Habilitante", "Las Leyes de Núremberg", "El Tratado de Versalles", "El Plan Dawes"], "ok": 0, "exp": "La Ley Habilitante (23 de marzo de 1933) dio poderes legislativos al gobierno."}, {"q": "¿Qué rasgo comparten la URSS de Stalin y la Alemania nazi?", "op": ["Elecciones libres con varios partidos", "Una economía de libre mercado sin control estatal", "Respeto a la libertad de prensa", "Policía secreta y propaganda para controlar a la población"], "ok": 3, "exp": "Ambos regímenes usaron terror (NKVD, Gestapo) y propaganda masiva: rasgos del totalitarismo."}, {"q": "¿Qué crisis económica ayudó al crecimiento electoral nazi a partir de 1929?", "op": ["La hiperinflación de 1923", "La crisis del petróleo", "La Gran Depresión", "La NEP"], "ok": 2, "exp": "La Gran Depresión disparó el paro en Alemania; el NSDAP pasó a ser el partido más votado en julio de 1932."}], "feynman": "Explícale a un niño de 10 años, en 4 frases, por qué un país en crisis puede terminar eligiendo o aceptando a un dictador. Usa un ejemplo: Rusia, Italia o Alemania.", "conexion": ["¿En qué se parecen y en qué se diferencian la llegada al poder de Lenin (1917) y la de Hitler (1933)? Piensa en revolución vs. vía 'legal'.", "¿Por qué crees que la Primera Guerra Mundial fue un factor clave en las tres historias (Rusia, Italia, Alemania)?"], "examen": {"q": "How far was the economic crisis of 1929–32 responsible for Hitler's appointment as Chancellor in January 1933?", "marks": 20, "ms": "AO1 (Edexcel, 5 niveles). Nivel alto (17–20): análisis explícito de la causa dada (Depresión, paro, voto nazi) frente a otros factores (debilidad de Weimar, propaganda, intrigas de Papen/Hindenburg, miedo al comunismo); evidencia precisa y relevante; juicio sostenido con criterios claros; estructura lógica. Niveles bajos: narración, poca evidencia, juicio ausente o no justificado."}}, {"id": "HIS02", "materia": "Historia", "mesa": "Edexcel", "rama": "Historia", "tema": "Estudio de fuentes históricas", "temaEN": "Source analysis: provenance, content, context, value and limitations", "explicacion": "Una fuente primaria (primary source) es algo producido en la época que estudias: un discurso, un diario, un cartel de propaganda, una carta. En Edexcel, el Paper 2 (Sección A, dos fuentes) y el Paper 3 (Sección A, una fuente) te piden evaluar fuentes; la habilidad se llama AO2. No basta con resumir: tienes que decir para qué le sirve la fuente a un historiador y hasta dónde se puede confiar en ella.\n\nPara eso analizas tres cosas. Procedencia (provenance): quién la hizo, cuándo, para quién y con qué propósito (nature, origin, purpose). Contenido (content): qué dice o muestra, y qué deja fuera. Contexto (context): tu propio conocimiento de lo que estaba pasando, que te permite comprobar si la fuente es exacta o típica.\n\nCon eso decides el valor (value) y las limitaciones (limitations) para una pregunta concreta. Clave: una fuente parcial (biased) puede ser muy valiosa. Un cartel nazi no dice 'la verdad' sobre los judíos, pero es excelente para estudiar los métodos y objetivos de la propaganda de Goebbels. El valor siempre depende de la pregunta (fitness for purpose).", "analogia": "Es como leer una reseña de restaurante: primero miras quién la escribió (¿el dueño del restaurante o un cliente?), luego qué dice, y por último lo comparas con lo que ya sabes del lugar. Una reseña del dueño no te dice si la comida es buena, pero sí te dice cómo quiere vender su restaurante.", "ejemplo": "Fuente: discurso de Stalin de 1931: \"Estamos 50 o 100 años por detrás de los países avanzados. Debemos recorrer esa distancia en diez años.\" Procedencia: discurso público del líder soviético a dirigentes de la industria, con propósito de motivar. Valor: muestra la urgencia y la justificación oficial de los Planes Quinquenales. Limitación: no revela el coste humano (hambrunas, trabajo forzado); el contexto propio debe completarlo.", "puntos": ["AO2 = analizar y evaluar fuentes de la época en su contexto histórico.", "Procedencia: autor, fecha, tipo de fuente, audiencia y propósito.", "Contenido: qué afirma la fuente y qué omite; usa citas breves de la propia fuente.", "Contexto: tu conocimiento sirve para confirmar, matizar o contradecir la fuente.", "Parcialidad no significa inutilidad: el valor depende de la pregunta (fitness for purpose).", "Paper 2: usar dos fuentes 'together' (juntas); Paper 3: valorar una fuente para dos enquiries."], "formulas": ["Estructura de párrafo: Valor (contenido + procedencia) → Limitación (contenido + procedencia) → Contexto → Mini-juicio", "Preguntas de procedencia: Who? When? Why? For whom? What type?", "Frase útil: \"The source is valuable for revealing... because its author...\"", "Frase útil: \"However, its value is limited by... since it was written to...\"", "Paper 2 (Edexcel): \"How far could the historian make use of Sources 1 and 2 together to investigate...?\""], "glosario": [{"en": "Provenance", "es": "Procedencia"}, {"en": "Primary source", "es": "Fuente primaria"}, {"en": "Bias", "es": "Parcialidad / sesgo"}, {"en": "Reliability", "es": "Fiabilidad"}, {"en": "Limitations", "es": "Limitaciones"}], "flashcards": [{"q": "¿Qué tres elementos analizas en una fuente?", "a": "Procedencia, contenido y contexto."}, {"q": "¿Qué Assessment Objective evalúa las fuentes en Edexcel History?", "a": "AO2."}, {"q": "¿Una fuente propagandística puede ser valiosa?", "a": "Sí: muestra los métodos, valores y objetivos de quien la produjo."}, {"q": "¿Qué significa 'nature, origin, purpose'?", "a": "Tipo de fuente, quién/cuándo la produjo y para qué."}, {"q": "¿Qué error típico hay que evitar?", "a": "Solo resumir la fuente o decir 'es parcial' sin explicar cómo afecta a su valor."}, {"q": "¿Para qué sirve tu propio conocimiento (own knowledge)?", "a": "Para situar la fuente en contexto y comprobar o matizar lo que dice."}], "preguntas": [{"q": "¿Qué describe mejor la 'procedencia' de una fuente?", "op": ["El número de palabras", "Quién la produjo, cuándo, para quién y por qué", "Si el historiador está de acuerdo con ella", "Su resumen en una frase"], "ok": 1, "exp": "La procedencia es el origen, la naturaleza y el propósito de la fuente."}, {"q": "Un cartel de propaganda nazi de 1936 es especialmente valioso para estudiar...", "op": ["La opinión real de todos los alemanes", "Los datos exactos de empleo", "Los métodos y mensajes de la propaganda del régimen", "La política exterior británica"], "ok": 2, "exp": "Muestra lo que el régimen quería que la gente creyera, no lo que realmente pensaba la población."}, {"q": "¿Qué frase muestra mejor una evaluación de nivel alto?", "op": ["La fuente es parcial, así que no sirve", "La fuente tiene muchas palabras importantes", "La fuente es de 1933", "Como discurso público para motivar, exagera los logros, pero revela bien las prioridades oficiales"], "ok": 3, "exp": "Relaciona la procedencia con el contenido y con su valor para una pregunta concreta."}, {"q": "En el Paper 2 de Edexcel, la pregunta de fuentes pide usar dos fuentes...", "op": ["Juntas (together) para investigar un tema", "Solo la más fiable", "Para escribir un ensayo sin contexto", "Para comparar sus fechas únicamente"], "ok": 0, "exp": "La pregunta típica es: How far could the historian make use of Sources 1 and 2 together...?"}, {"q": "¿Para qué sirve el conocimiento contextual en el análisis de fuentes?", "op": ["Para sustituir a la fuente", "Para comprobar, matizar o explicar lo que dice la fuente", "Para escribir una narración larga", "No sirve en el examen"], "ok": 1, "exp": "El contexto debe estar al servicio de la evaluación de la fuente, no ser una narración aparte."}], "feynman": "Elige una foto de Instagram de una famosa. Explica con palabras simples su 'procedencia', su 'contenido' y su 'contexto', y para qué serviría (y para qué no) a un historiador del futuro.", "conexion": ["¿Por qué un diario privado puede ser más sincero que un discurso público, pero también más limitado?", "Si tuvieras que estudiar la opinión pública en la URSS de Stalin, ¿qué problemas tendrían casi todas las fuentes oficiales?"], "examen": {"q": "Assess the value of the source for revealing the aims of Stalin's Five-Year Plans and the methods used to achieve them. Explain your answer, using the source, the information given about its origin and your own knowledge about the historical context.", "marks": 20, "ms": "AO2 (Edexcel, 5 niveles). Nivel alto: interpreta el contenido con inferencias razonadas; evalúa la procedencia (autor, propósito, audiencia) de forma relevante para ambas enquiries; usa conocimiento contextual para confirmar y matizar; juicio sobre el valor basado en criterios válidos. Niveles bajos: parafrasea la fuente, comentarios genéricos sobre parcialidad, contexto narrado sin vínculo."}}, {"id": "HIS03", "materia": "Historia", "mesa": "Edexcel", "rama": "Historia", "tema": "Interpretación de ideologías", "temaEN": "Ideologies: communism, fascism, liberal democracy and the Cold War", "explicacion": "Una ideología (ideology) es un conjunto de ideas sobre cómo debería organizarse la sociedad. La democracia liberal (liberal democracy) defiende elecciones libres, varios partidos, derechos individuales y economía de mercado. El comunismo (communism), basado en Marx y Engels (El Manifiesto Comunista, 1848), busca una sociedad sin clases y con propiedad colectiva; en la práctica soviética se tradujo en un partido único y una economía planificada (planned economy).\n\nEl fascismo (fascism), de Mussolini y, en su versión racial, del nazismo de Hitler, es ultranacionalista, antidemocrático y anticomunista. Exalta al líder, la violencia y la nación por encima del individuo; Mussolini lo resumió así: \"Todo dentro del Estado, nada fuera del Estado, nada contra el Estado\". El nazismo añadió un racismo biológico extremo y el antisemitismo.\n\nTras 1945, la alianza contra Hitler se rompió y comenzó la Guerra Fría (Cold War) entre EE. UU. (capitalismo y democracia liberal) y la URSS (comunismo). Fue 'fría' porque las superpotencias nunca lucharon directamente: hubo carrera armamentística, propaganda y guerras indirectas (proxy wars). Terminó con la caída del Muro de Berlín (1989) y la disolución de la URSS (diciembre de 1991).", "analogia": "Piensa en tres formas de organizar un grupo de clase: votar todo y respetar a las minorías (democracia liberal); repartir todos los materiales por igual y que un comité decida qué hace cada uno (comunismo soviético); o que un 'líder' decida todo en nombre del grupo y excluya a quien no considera 'del grupo' (fascismo).", "ejemplo": "5 de marzo de 1946, Fulton (Missouri): Winston Churchill declara que \"desde Stettin, en el Báltico, hasta Trieste, en el Adriático, ha caído sobre el continente un telón de acero (iron curtain)\". En 1947 llega la Doctrina Truman (contener el comunismo) y el Plan Marshall; en 1948–49, el bloqueo de Berlín.", "puntos": ["Democracia liberal: elecciones libres, pluralismo, derechos individuales y Estado de derecho.", "Comunismo: lucha de clases, propiedad colectiva; en la URSS, partido único y economía planificada.", "Fascismo: nacionalismo extremo, culto al líder, rechazo de la democracia y del comunismo.", "Nazismo = fascismo + racismo biológico y antisemitismo como eje central.", "Guerra Fría (1947–91): EE. UU. vs. URSS, contención (containment), carrera nuclear y guerras indirectas.", "Los historiadores debaten quién fue responsable de la Guerra Fría: visiones ortodoxa, revisionista y post-revisionista."], "formulas": ["1848: Manifiesto Comunista — \"¡Proletarios de todos los países, uníos!\"", "1946: discurso del 'telón de acero' de Churchill · 1947: Doctrina Truman y Plan Marshall", "1949: OTAN (NATO) · 1955: Pacto de Varsovia · 1961: Muro de Berlín", "Oct 1962: crisis de los misiles de Cuba · 9 nov 1989: cae el Muro · dic 1991: fin de la URSS", "Historiografía: ortodoxa (culpa a la URSS) / revisionista (culpa a EE. UU.) / post-revisionista (responsabilidad compartida, p. ej. Gaddis)"], "glosario": [{"en": "Ideology", "es": "Ideología"}, {"en": "Containment", "es": "Contención"}, {"en": "Planned economy", "es": "Economía planificada"}, {"en": "Proxy war", "es": "Guerra indirecta / por delegación"}, {"en": "Superpower", "es": "Superpotencia"}], "flashcards": [{"q": "¿Quiénes escribieron el Manifiesto Comunista y cuándo?", "a": "Karl Marx y Friedrich Engels, en 1848."}, {"q": "¿Qué frase resume el totalitarismo de Mussolini?", "a": "\"Todo dentro del Estado, nada fuera del Estado, nada contra el Estado.\""}, {"q": "¿Qué era la 'contención' (containment)?", "a": "La política de EE. UU. para impedir la expansión del comunismo (Doctrina Truman, 1947)."}, {"q": "¿Por qué se llama 'fría' a la Guerra Fría?", "a": "Porque EE. UU. y la URSS no lucharon directamente entre sí."}, {"q": "¿Cuándo cayó el Muro de Berlín?", "a": "El 9 de noviembre de 1989."}, {"q": "¿Qué dice la visión revisionista de la Guerra Fría?", "a": "Que EE. UU. y su expansión económica tuvieron gran parte de la responsabilidad."}], "preguntas": [{"q": "¿Qué ideología defiende la sociedad sin clases y la propiedad colectiva?", "op": ["Fascismo", "Liberalismo", "Comunismo", "Monarquía absoluta"], "ok": 2, "exp": "El comunismo, según Marx, aspira a una sociedad sin clases."}, {"q": "¿Qué rasgo distingue al nazismo de otros fascismos?", "op": ["El anticomunismo", "El racismo biológico y el antisemitismo como ideas centrales", "El culto al líder", "El uso de propaganda"], "ok": 1, "exp": "Todos los fascismos eran anticomunistas y usaban propaganda; el racismo biológico era central en el nazismo."}, {"q": "¿Quién habló del 'telón de acero' en 1946?", "op": ["Winston Churchill", "Harry Truman", "Iósif Stalin", "John F. Kennedy"], "ok": 0, "exp": "Churchill, en Fulton (Missouri), el 5 de marzo de 1946."}, {"q": "¿Qué alianza militar creó el bloque occidental en 1949?", "op": ["El Pacto de Varsovia", "El Comecon", "La Sociedad de Naciones", "La OTAN (NATO)"], "ok": 3, "exp": "La OTAN se fundó en 1949; el Pacto de Varsovia, en respuesta, en 1955."}, {"q": "La visión post-revisionista de la Guerra Fría sostiene que...", "op": ["Solo Stalin fue culpable", "Solo EE. UU. fue culpable", "La responsabilidad fue compartida por malentendidos y desconfianza mutua", "La Guerra Fría nunca existió"], "ok": 2, "exp": "Historiadores como John Lewis Gaddis hablan de responsabilidad compartida, aunque más tarde Gaddis volvió a subrayar el papel de Stalin."}], "feynman": "Explica las diferencias entre democracia liberal, comunismo y fascismo usando solo un ejemplo de tu instituto (elegir delegado, repartir el material, quién toma las decisiones). Máximo 6 frases.", "conexion": ["¿Por qué EE. UU. y la URSS, aliados contra Hitler, se convirtieron en enemigos tan pronto después de 1945?", "¿Qué tienen en común el comunismo estalinista y el fascismo aunque fueran enemigos ideológicos?"], "examen": {"q": "In the light of differing interpretations, how convincing do you find the view that the Soviet Union was primarily responsible for the outbreak of the Cold War?", "marks": 20, "ms": "AO3 (interpretaciones). Nivel alto: analiza y evalúa los extractos/visiones (ortodoxa, revisionista, post-revisionista) identificando sus argumentos clave; usa conocimiento propio para discutirlos (Yalta, Potsdam, Doctrina Truman, Plan Marshall, Berlín 1948); explica por qué difieren; llega a un juicio sostenido y razonado sobre la visión planteada."}}, {"id": "HIS04", "materia": "Historia", "mesa": "Edexcel", "rama": "Historia", "tema": "Ensayos historiográficos", "temaEN": "Essay writing and historical interpretations (coursework)", "explicacion": "Un buen ensayo de historia A-Level no es una narración: es un argumento (argument). Respondes a preguntas como \"How far...?\" o \"To what extent...?\" con una postura clara desde la introducción, la defiendes con evidencia precisa (fechas, cifras, ejemplos) y terminas con un juicio sostenido (sustained judgement) basado en criterios: ¿qué factor fue más importante y por qué?\n\nLa historiografía (historiography) es el estudio de cómo distintos historiadores interpretan el pasado. Por ejemplo, sobre la Alemania nazi, los intencionalistas (intentionalists) dicen que todo salía de los planes de Hitler, mientras que los estructuralistas o funcionalistas (structuralists/functionalists), como Hans Mommsen, señalan el caos del régimen y la presión de abajo. Ian Kershaw propuso una síntesis: la gente \"trabajaba en la dirección del Führer\" (working towards the Führer).\n\nEn el coursework de Edexcel (Componente 4, aprox. 3.000–4.000 palabras, 20% de la nota) tienes que analizar y evaluar diferentes interpretaciones de una cuestión (AO3) y llegar a tu propia conclusión con conocimiento sólido (AO1). La clave es explicar POR QUÉ los historiadores discrepan (fuentes distintas, época en que escriben, enfoque) y no solo QUÉ dicen.", "analogia": "Es como el VAR en el fútbol: varios comentaristas ven la misma jugada y discrepan sobre si fue penalti. Tu trabajo no es repetir lo que dice cada uno, sino analizar sus argumentos, mirar las imágenes (la evidencia) y dar tu veredicto razonado.", "ejemplo": "Debate sobre la Revolución Rusa: Richard Pipes la presenta como un golpe (coup) de una minoría bolchevique; historiadores revisionistas como Sheila Fitzpatrick subrayan el apoyo real de obreros y soldados; Orlando Figes, en \"A People's Tragedy\" (1996), la ve como una tragedia popular en la que las masas también fueron protagonistas. Un ensayo top compara estas visiones con evidencia (p. ej., el apoyo bolchevique en los sóviets en otoño de 1917).", "puntos": ["Postura clara desde la introducción (line of argument) y coherente hasta la conclusión.", "Cada párrafo: idea principal (point), evidencia precisa, explicación y enlace con la pregunta.", "Evalúa, no describas: compara la importancia relativa de los factores.", "Historiografía: identifica escuelas (p. ej. intencionalistas vs. estructuralistas) y explica por qué difieren.", "AO1 = conocimiento y juicio; AO3 = analizar y evaluar interpretaciones.", "La conclusión debe dar un juicio final justificado, no repetir el ensayo."], "formulas": ["Introducción: contexto breve + factores + postura (\"This essay will argue that...\")", "Párrafo PEEL: Point – Evidence – Explanation – Link", "Frase de juicio: \"Although X was significant, Y was more important because...\"", "Interpretaciones: \"Historian A argues... This is convincing to an extent because... However, B...\"", "Coursework Edexcel: 3.000–4.000 palabras · 40 marcas · AO1 + AO3"], "glosario": [{"en": "Historiography", "es": "Historiografía"}, {"en": "Sustained judgement", "es": "Juicio sostenido"}, {"en": "Interpretation", "es": "Interpretación"}, {"en": "Line of argument", "es": "Línea argumental"}, {"en": "Counter-argument", "es": "Contraargumento"}], "flashcards": [{"q": "¿Qué es la historiografía?", "a": "El estudio de cómo los historiadores interpretan el pasado y por qué discrepan."}, {"q": "¿Qué defienden los intencionalistas sobre la Alemania nazi?", "a": "Que las políticas nazis salían sobre todo de las ideas y planes de Hitler."}, {"q": "¿Qué idea propuso Ian Kershaw?", "a": "\"Working towards the Führer\": los funcionarios actuaban anticipando lo que Hitler quería."}, {"q": "¿Qué significa PEEL?", "a": "Point, Evidence, Explanation, Link."}, {"q": "¿Qué AO evalúa las interpretaciones en Edexcel History?", "a": "AO3."}, {"q": "¿Cuál es el error más común en un ensayo?", "a": "Narrar los hechos en vez de argumentar y juzgar."}], "preguntas": [{"q": "¿Qué caracteriza mejor a un ensayo A-Level de nivel alto?", "op": ["Una narración cronológica detallada", "Muchas fechas sin explicación", "Un argumento claro con evidencia y juicio sostenido", "Una conclusión que no toma partido"], "ok": 2, "exp": "Edexcel premia el análisis y el juicio justificado, no la narración."}, {"q": "Hans Mommsen se asocia con la visión...", "op": ["Estructuralista/funcionalista", "Intencionalista", "Ortodoxa de la Guerra Fría", "Marxista de la Revolución Francesa"], "ok": 0, "exp": "Mommsen describió a Hitler como un 'dictador débil' dentro de un sistema caótico."}, {"q": "¿Por qué pueden discrepar dos historiadores sobre un mismo hecho?", "op": ["Porque uno siempre miente", "Porque la historia no tiene evidencia", "Porque solo uno ha leído libros", "Porque usan fuentes distintas, escriben en épocas distintas o tienen enfoques distintos"], "ok": 3, "exp": "Explicar las razones del desacuerdo es una marca de nivel alto en AO3."}, {"q": "¿Qué libro sobre la Revolución Rusa escribió Orlando Figes?", "op": ["The Russian Revolution, 1899–1919", "A People's Tragedy", "What is History?", "The Tragedy of American Diplomacy"], "ok": 1, "exp": "\"A People's Tragedy\" (1996). El primero es de Pipes, el tercero de E. H. Carr y el cuarto de W. A. Williams."}, {"q": "¿Qué debe hacer una buena conclusión?", "op": ["Introducir un tema nuevo", "Repetir cada párrafo", "Dar un juicio final justificado que responda a la pregunta", "Disculparse por no saber"], "ok": 2, "exp": "La conclusión debe cerrar el argumento con un veredicto razonado."}], "feynman": "Explica a una amiga que no estudia historia, en 5 frases, por qué dos historiadores honestos pueden contar la Revolución Rusa de maneras distintas.", "conexion": ["Elige un tema (p. ej. el ascenso de Hitler). ¿Qué tres factores pondrías y cuál defenderías como el más importante?", "¿Por qué la época en la que escribe un historiador (p. ej. durante la Guerra Fría) puede influir en su interpretación?"], "examen": {"q": "Historians have differing views about the role of Hitler in the Nazi state. Analyse and evaluate these views, and reach your own judgement about the extent to which Hitler was a 'weak dictator'.", "marks": 40, "ms": "Coursework Edexcel (Componente 4): AO1 (organizar y comunicar conocimiento, juicio sustentado) y AO3 (analizar y evaluar al menos tres interpretaciones). Nivel alto: análisis crítico de las interpretaciones (intencionalistas, estructuralistas, síntesis de Kershaw), explicación de por qué difieren, uso de evidencia para probarlas, juicio propio sostenido y bien argumentado; referencias y bibliografía adecuadas."}}, {"id": "ESP01", "materia": "Español", "mesa": "AQA", "rama": "Cultura hispánica", "tema": "Valores familiares", "temaEN": "Traditional and modern values: the family", "explicacion": "Este subtema de AQA (Los valores tradicionales y modernos) trata de cómo ha cambiado la familia en España y en el mundo hispano. La familia tradicional era nuclear y extensa a la vez: padre, madre, muchos hijos y abuelos cerca, con mucha influencia de la Iglesia católica, sobre todo durante la dictadura de Franco (1939–1975).\n\nDesde la Transición, todo cambió muy rápido: el divorcio se legalizó en 1981, España aprobó el matrimonio entre personas del mismo sexo en 2005 (uno de los primeros países del mundo) y hoy hay familias monoparentales, reconstituidas, homoparentales y parejas de hecho. Además, España tiene una de las tasas de natalidad más bajas de Europa y los jóvenes se independizan tarde, a menudo pasados los 30, por el precio de la vivienda y el paro juvenil.\n\nPara el examen oral y escrito, necesitas dar opiniones y justificarlas: \"Desde mi punto de vista, la familia sigue siendo el pilar de la sociedad española, aunque haya cambiado su forma\". Usa conectores (sin embargo, por un lado... por otro lado) y el subjuntivo tras expresiones de opinión negativas o valorativas: \"No creo que la familia tradicional desaparezca\"; \"Es importante que los abuelos participen\".", "analogia": "La familia es como un árbol: las raíces (los valores de solidaridad y apoyo) siguen ahí, pero las ramas han crecido en direcciones nuevas: madres solteras, dos papás, abuelos que crían a los nietos, hijos que vuelven a casa.", "ejemplo": "Los abuelos en España: muchos cuidan a sus nietos a diario mientras los padres trabajan, y durante la crisis de 2008 muchas familias sobrevivieron gracias a la pensión de los abuelos. Frase útil para el oral: \"En España, los abuelos desempeñan un papel fundamental en la crianza de los nietos\".", "puntos": ["Familia tradicional: católica, numerosa, roles de género fijos (padre que trabaja, madre en casa).", "Cambios legales clave: divorcio (1981) y matrimonio igualitario (2005).", "Nuevos modelos: monoparental, reconstituida, homoparental, parejas de hecho.", "Baja natalidad y emancipación tardía de los jóvenes (vivienda cara, paro juvenil).", "Los abuelos siguen siendo una red de apoyo muy importante.", "En el examen: opinión + justificación + ejemplo + conectores + subjuntivo."], "formulas": ["Desde mi punto de vista / A mi juicio...", "No creo que + subjuntivo: \"No creo que la familia esté en crisis.\"", "Es evidente que + indicativo / Es importante que + subjuntivo", "Por un lado... por otro lado... · Sin embargo · Además · Por lo tanto", "Hitos: 1981 ley del divorcio · 2005 matrimonio igualitario"], "glosario": [{"en": "Single-parent family", "es": "Familia monoparental"}, {"en": "Blended family", "es": "Familia reconstituida"}, {"en": "Birth rate", "es": "Tasa de natalidad"}, {"en": "Same-sex marriage", "es": "Matrimonio igualitario / entre personas del mismo sexo"}, {"en": "To leave home (become independent)", "es": "Independizarse / emanciparse"}], "flashcards": [{"q": "¿En qué año se legalizó el divorcio en España?", "a": "En 1981."}, {"q": "¿En qué año aprobó España el matrimonio igualitario?", "a": "En 2005."}, {"q": "¿Cómo se dice 'blended family' en español?", "a": "Familia reconstituida."}, {"q": "¿Por qué los jóvenes españoles se independizan tarde?", "a": "Por el precio de la vivienda, los sueldos bajos y el paro juvenil."}, {"q": "Completa: \"No creo que la familia ___ (estar) en crisis.\"", "a": "esté (subjuntivo)."}, {"q": "¿Qué institución influía mucho en la familia durante el franquismo?", "a": "La Iglesia católica."}], "preguntas": [{"q": "¿Qué cambio legal de 2005 transformó el concepto de familia en España?", "op": ["La ley del divorcio", "El matrimonio entre personas del mismo sexo", "El voto femenino", "La Constitución"], "ok": 1, "exp": "En 2005 España legalizó el matrimonio igualitario."}, {"q": "¿Cuál es la forma correcta?", "op": ["No pienso que los jóvenes tienen dinero", "Es importante que los abuelos ayudan", "No creo que la familia desaparezca", "Creo que la familia sea importante"], "ok": 2, "exp": "'No creo que' exige subjuntivo; 'creo que' en afirmativo va con indicativo."}, {"q": "¿Qué significa 'familia monoparental'?", "op": ["Familia con un solo progenitor", "Familia sin hijos", "Familia con muchos hijos", "Familia de dos padres"], "ok": 0, "exp": "Monoparental = un solo padre o madre a cargo de los hijos."}, {"q": "¿Qué rasgo describe a la sociedad española actual?", "op": ["Una tasa de natalidad muy alta", "Jóvenes que se independizan a los 18 años", "Prohibición del divorcio", "Baja natalidad y emancipación tardía"], "ok": 3, "exp": "España tiene de las natalidades más bajas de Europa y una emancipación juvenil tardía."}, {"q": "¿Qué papel tienen muchos abuelos en España?", "op": ["Ninguno", "Cuidan de los nietos y apoyan económicamente a la familia", "Viven siempre en residencias", "Deciden con quién se casan los nietos"], "ok": 1, "exp": "Son una red de apoyo clave, sobre todo en tiempos de crisis."}], "feynman": "Explica en español, en 5 frases sencillas, cómo era una familia típica española en 1960 y cómo puede ser hoy. Usa al menos un 'sin embargo' y un subjuntivo.", "conexion": ["¿En qué se parece y en qué se diferencia la familia española de la familia en tu país o en Londres?", "¿Crees que la tecnología une o separa a las familias? Da dos argumentos para cada lado."], "examen": {"q"
