let tab="home";
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const TABS=["home","quinton","evid","proto","salt","books","stm","dir","diary","search","pay"];
const PREMIUM=new Set(["proto","salt","books","stm","dir"]);
const lock=t=>`<div class="lock"><strong>🔒 ${t.locked}</strong><p><button class="pri" onclick="go('pay')">${t.sub}</button></p></div>`;
const grams=(v,g)=>(Math.round(v*g*100)/100).toString();

function views(t){
 return {
 home:()=>`<div class="card"><h2>${t.homeT}</h2><p>${t.homeB}</p></div>
  <div class="warn"><strong>${t.flagsT}</strong><ul>${t.flags.map(f=>`<li>${f}</li>`).join("")}</ul></div>
  <div class="card"><h3>${t.noT}</h3><ul>${t.no.map(f=>`<li>🔴 ${f}</li>`).join("")}</ul></div>
  ${active()?"":`<div class="lock">${t.banner} <button class="pri" onclick="go('pay')">${t.sub}</button></div>`}`,

 quinton:()=>{const q=QUINTON;return `<div class="card"><h2>René Quinton (1866–1925)</h2><p>Biólogo y fisiólogo francés. Su tesis, expuesta en 1904, sostiene que el agua de mar fue el medio original de la vida y que los líquidos del organismo conservan una composición salina comparable a la del mar. Es una teoría histórica de principios del siglo XX, no evidencia clínica actual. Fue también un destacado impulsor de la aviación francesa.</p></div>
 <div class="card"><h3>Vida: cronología</h3><table>${q.bio.map(b=>`<tr><td><strong>${b[0]}</strong></td><td>${b[1]}</td></tr>`).join("")}</table></div>
 <div class="card"><h3>Obras</h3>${q.works.map(w=>`<p><strong>${esc(w[0])}</strong><br>Traducción: <em>${esc(w[1])}</em><br><span class="mu">${esc(w[2])} · ${esc(w[3])}</span><br><a href="${esc(w[4])}" rel="noopener noreferrer" target="_blank">Fuente 1</a>${w[5]?` · <a href="${esc(w[5])}" rel="noopener noreferrer" target="_blank">Fuente 2 (Gallica, texto original)</a>`:""}</p>`).join("")}
 <p class="mu">No se ha localizado una bibliografía completa de Quinton en las fuentes consultadas; la lista se amplía solo con títulos verificables. Las traducciones de títulos son del equipo; no se transcriben pasajes del original sin cotejarlos con la edición.</p></div>
 <div class="card"><h3>Precursores de la talasoterapia y del agua de mar</h3><p class="mu">Contexto histórico. Lo que aquí se describe es lo que cada autor sostuvo en su época; no es una recomendación de la app ni evidencia clínica actual.</p>${PRECURSORES.map(x=>`<p><strong>${esc(x[0])}</strong> <span class="mu">· ${esc(x[1])}</span><br>${esc(x[2])}<br><span class="mu">${esc(x[3])}</span> <a href="${esc(x[4])}" rel="noopener noreferrer" target="_blank">Fuente</a></p>`).join("")}<p class="mu">Lista no exhaustiva: las fuentes consultadas son sobre todo divulgativas o de historia local, y las fechas varían entre ellas. Se amplía solo con datos verificables.</p></div>
 <div class="card"><h3>Fuentes</h3><ul>${q.refs.map(r=>`<li><a href="${esc(r[1])}" rel="noopener noreferrer" target="_blank">${esc(r[0])}</a></li>`).join("")}</ul></div>`},
 evid:()=>`<div class="card"><h2>${t.evidT}</h2><p class="mu">${t.evidIntro}</p><table><tr><th>${t.cols.use}</th><th>${t.cols.sem}</th><th>${t.cols.why}</th></tr>${t.uses.map(u=>`<tr><td>${u[0]}</td><td><span class="dot ${u[1]}"></span></td><td>${u[2]}</td></tr>`).join("")}</table><p class="mu">${t.evNote}</p></div>`,
 proto:()=>!active()?lock(t):`<div class="card"><h2>${t.protoT}</h2><p class="mu">${t.protoNote}</p></div>`+t.protos.map(p=>`<div class="card"><h3>${p.t}</h3>${Object.keys(t.lbl).map(k=>`<p><strong>${t.lbl[k]}:</strong> ${p[k]}</p>`).join("")}</div>`).join("")+`<div class="card"><h3>${t.noT}</h3><ul>${t.no.map(f=>`<li>${f}</li>`).join("")}</ul></div>`,
 salt:()=>!active()?lock(t):`<div class="card"><h2>${t.saltT}</h2><p>${t.saltI}</p></div>`+t.sol.map(s=>`<div class="card"><h3>${s[0]}</h3><p>${s[2]}</p></div>`).join("")+
  `<div class="warn">${t.hyper}</div>
  <div class="card"><h3>${t.calcT}</h3><label>${t.calcV} <input id="cv" type="number" min="0" step="0.1" value="1"></label>
  <label>${t.calcG} <select id="cg">${t.sol.map(s=>`<option value="${s[1]}">${s[1]} g/L — ${s[0]}</option>`).join("")}</select></label>
  <p><strong>${t.calcR} <span id="cr"></span> g</strong></p></div>
  <div class="card"><h3>${t.scanT}</h3>${t.scan.map((s,i)=>`<label><input type="checkbox" class="sc" data-i="${i}"> ${s}</label>`).join("")}<p id="sr" class="mu"></p></div>`,
 books:()=>!active()?lock(t):`<div class="card"><h2>${t.booksT}</h2><p>${t.booksIntro}</p></div><div class="warn">${t.booksW}</div>`+BOOKS.map(b=>`<div class="card"><h3>${esc(b[0])}</h3><p class="mu">${esc(b[1])} · ${esc(b[3])} · ISBN/${t.verif} · ${t.verif}</p><p>${t.bookC}</p><p class="mu">⚠ ${t.pend}: <a href="${esc(b[2])}" rel="noopener noreferrer" target="_blank">${esc(new URL(b[2]).hostname)}</a></p></div>`).join(""),
 stm:()=>!active()?lock(t):`<div class="card"><h2>${t.stmT}</h2><p>${t.stmN}</p><p><strong>${t.stmL}</strong></p><ul>${STATEMENTS.map(x=>`<li><a href="${esc(x[0]===""?"":x[1])}" rel="noopener noreferrer" target="_blank">${esc(x[0])}</a></li>`).join("")}</ul></div><div class="warn">🔴 ${t.no[0]}</div>`,
 dir:()=>{const v=PROVIDERS.filter(verified),c=new Set(v.map(p=>p.country)).size;
  const head=`<div class="card"><h2>MarVerif.com</h2><p><strong>${t.dirCount(v.length,c)}</strong></p>`;
  const list=!v.length?`<p>${t.dirEmpty}</p>`:(active()?v.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.city||"")} ${esc(p.country)}</p><p class="mu">${esc(p.web||"")} ${esc(p.phone||"")} ${esc(p.email||"")}</p><p class="mu">${esc(p.product||"")} · ${esc(p.intake||"")} · ${esc(p.source)}</p></div>`).join(""):v.map(p=>`<p>${esc(p.name)} — ${esc(p.country)}</p>`).join("")+lock(t));
  return head+`<ul>${t.dirCrit.map(x=>`<li>${x}</li>`).join("")}</ul></div>`+list},
 diary:()=>`<div class="card"><h2>${t.diaryT}</h2><p class="mu">${t.diaryWarn}</p><textarea id="dn" rows="3" style="width:100%" placeholder="${esc(t.diaryPh)}"></textarea><p><button class="pri" id="ds">${t.save}</button></p><div id="dl"></div></div>`,
 search:()=>`<div class="card"><input id="q" style="width:100%" placeholder="${esc(t.searchPh)}"><div id="qr"></div></div>`,
 pay:()=>`<div class="card"><h2>${t.payT}</h2><ul>${t.payL.map(x=>`<li>${x}</li>`).join("")}</ul>
  <p><button class="pri" onclick="buy('monthly')">${t.monthly}</button> <button class="pri" onclick="buy('yearly')">${t.yearly}</button></p>
  <p class="mu">PayPal: <button onclick="buy('monthly','paypal')">${t.monthly}</button> <button onclick="buy('yearly','paypal')">${t.yearly}</button></p>
  ${active()?`<p><button onclick="manage()">${t.manage}</button></p>`:""}<p class="mu">${t.cancel}</p><p class="mu">${t.badge}</p><p id="pm" class="mu"></p></div>`};
}

function render(){
 const t=tr();
 $("#discTx").textContent=t.disc;$("#subBtn").textContent=active()?t.subActive:t.sub;$("#subBtn").onclick=()=>go("pay");
 $("#nav").innerHTML=TABS.map(k=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${t.nav[k]}${PREMIUM.has(k)&&!active()?" 🔒":""}</button>`).join("");
 $("#view").innerHTML=views(t)[tab]();
 bind(t);
}
function go(k){tab=k;render();scrollTo(0,0)}
function bind(t){
 if(tab==="salt"&&active()){const u=()=>$("#cr").textContent=grams(+$("#cv").value||0,+$("#cg").value);$("#cv").oninput=$("#cg").onchange=u;u();
  document.querySelectorAll(".sc").forEach(c=>c.onchange=()=>{const all=[...document.querySelectorAll(".sc")].every(x=>x.checked);$("#sr").textContent=all?t.scanOk:t.scanBad});$("#sr").textContent=t.scanBad}
 if(tab==="diary"){const draw=()=>{$("#dl").innerHTML=store.get("mv_diary",[]).slice().reverse().map(e=>`<p class="mu">${esc(e.d)}<br><span style="color:var(--tx)">${esc(e.n)}</span></p>`).join("")};draw();
  $("#ds").onclick=()=>{const n=$("#dn").value.trim();if(!n)return;const a=store.get("mv_diary",[]);a.push({d:new Date().toLocaleString(),n});store.set("mv_diary",a);$("#dn").value="";draw()}}
 if(tab==="search"){$("#q").oninput=()=>{const q=$("#q").value.toLowerCase().trim(),out=[];if(q){
   BOOKS.forEach(b=>{if((b[0]+b[1]).toLowerCase().includes(q))out.push("📖 "+b[0])});
   t.protos.forEach(p=>{if(p.t.toLowerCase().includes(q))out.push("📋 "+p.t)});
   PROVIDERS.filter(verified).forEach(p=>{if([p.name,p.country,p.city,p.product,p.intake].join(" ").toLowerCase().includes(q))out.push("🏢 "+p.name+" — "+p.country)})}
   const shown=active()?out:out.slice(0,2);
   $("#qr").innerHTML=q?(shown.length?shown.map(x=>`<p>${esc(x)}</p>`).join("")+(!active()&&out.length>2?`<p class="mu">${t.searchTrunc}</p>`:""):`<p>${t.none}</p>`):""}}
}
async function api(path,body){const r=await fetch(API_BASE+path,body?{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}:undefined);return r.json()}
async function buy(plan,via){ // Stripe Checkout: la tarjeta se introduce en la página de Stripe, nunca en la app
 const t=tr(),m=$("#pm");
 if(!API_BASE){m.textContent=t.noApi;return}
 try{const j=await api(via==="paypal"?"/api/paypal/checkout":"/api/checkout",{plan});if(!j.url)throw 0;location.href=j.url}catch(e){m.textContent=t.noApi}
}
async function manage(){try{if(sub.pp){await api("/api/paypal/cancel",{token:sub.token});await syncSub();return}const j=await api("/api/portal",{token:sub.token});if(j.url)location.href=j.url}catch(e){}}
// Al volver de Checkout o al abrir la app, el acceso se concede solo si el backend confirma el pago.
async function syncSub(){
 if(!API_BASE)return;
 try{const sid=new URLSearchParams(location.search).get("session_id");
  const pid=new URLSearchParams(location.search).get("subscription_id");
  if(pid){const j=await api("/api/paypal/status?subscription_id="+encodeURIComponent(pid));history.replaceState(null,"",location.pathname);
   if(j.validated){sub={validated:true,until:j.until,plan:j.plan,token:j.token,pp:true};store.set("mv_sub",sub)}}
  else if(sid){const j=await api("/api/status?session_id="+encodeURIComponent(sid));history.replaceState(null,"",location.pathname);
   if(j.validated){sub={validated:true,until:j.until,plan:j.plan,token:j.token};store.set("mv_sub",sub)}}
  else if(sub&&sub.token){const j=await api("/api/verify",{token:sub.token});sub=j.validated?{...sub,validated:true,until:j.until,plan:j.plan}:null;store.set("mv_sub",sub)}
  render()}catch(e){}
}

/* ===== Arranque ===== */
const ls=$("#lang");ls.innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
ls.value=store.get("mv_lang",(navigator.language||"es").slice(0,2) in LANGS?(navigator.language||"es").slice(0,2):"es");
ls.onchange=()=>{store.set("mv_lang",ls.value);document.documentElement.lang=ls.value;document.documentElement.dir=ls.value==="ar"?"rtl":"ltr";render()};
ls.onchange();syncSub();
if(!store.get("mv_consent",false)){const t=tr();$("#cT").textContent=t.consentT;$("#cB").textContent=t.consentB;$("#cOk").textContent=t.accept;$("#consent").showModal();$("#cOk").onclick=()=>{store.set("mv_consent",true);$("#consent").close()}}
</script></body></html>
