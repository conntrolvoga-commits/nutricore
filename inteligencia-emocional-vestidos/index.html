<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vestidos con Corazón – Inteligencia Emocional para Venta y Renta</title>
<meta name="theme-color" content="#8a2f5b">
<style>
:root{--bg:#fdf5f7;--card:#fff;--ink:#2e2430;--mute:#7a6b78;--pri:#8a2f5b;--pri2:#c0588a;--acc:#f3c9d9;--ok:#3f7d5a;--no:#b0463c;--line:#efdde4}
@media(prefers-color-scheme:dark){:root{--bg:#1c161d;--card:#272029;--ink:#f1e9ee;--mute:#b3a3b0;--pri:#e59bc0;--pri2:#f0b4d1;--acc:#6a3a50;--ok:#7fcf9f;--no:#f09088;--line:#3b323d}}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:var(--bg);color:var(--ink);line-height:1.6}
h1,h2,h3,button,nav,label,input,select,textarea{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:22px 16px 14px;text-align:center}
header h1{margin:0;font-size:1.45rem}header p{margin:4px 0 0;opacity:.92;font-size:.95rem}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:8px}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--ink);padding:8px 12px;border-radius:20px;font-size:.88rem;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
h2{color:var(--pri);margin:6px 0 8px}h3{color:var(--pri);margin:14px 0 6px;font-size:1.05rem}
.say,.avoid{border-left:4px solid var(--ok);padding:6px 10px;margin:6px 0;background:rgba(63,125,90,.08);border-radius:0 8px 8px 0}
.avoid{border-color:var(--no);background:rgba(176,70,60,.08)}.say b{color:var(--ok)}.avoid b{color:var(--no)}
details{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card)}
summary{cursor:pointer;padding:12px 14px;font-family:system-ui,sans-serif;font-weight:600;color:var(--pri)}
details>div{padding:0 14px 12px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:.92rem;cursor:pointer}
.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.95rem}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-family:system-ui;font-size:.86rem}
th,td{border:1px solid var(--line);padding:7px;vertical-align:top;text-align:left}th{background:var(--acc);color:#3a1026}
@media(prefers-color-scheme:dark){th{color:#fff}}
.ev{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:9px 0}
.ev small{color:var(--mute);display:block}.days{font-family:system-ui;font-weight:700;color:var(--pri);min-width:70px;text-align:right}
.hint{color:var(--mute);font-size:.88rem;font-family:system-ui}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:20px}
</style>
</head>
<body>
<header><h1>👗 Vestidos con Corazón</h1><p>Inteligencia emocional para la <b>venta</b> y la <b>renta</b> de vestidos</p></header>
<nav id="nav"></nav><main id="app"></main>
<footer>Tus clientas y recordatorios se guardan solo en este dispositivo.</footer>
<script>
const C={
 renta:{icon:"🔁",t:"Renta de vestidos",
  emo:"La clienta suele sentir <b>urgencia y miedo a que algo salga mal</b>: que no le quede, que se manche, que llegue tarde o que haya cobros extra. Tu misión emocional: darle <b>tranquilidad y seguridad</b>.",
  pasos:[
   ["Recibe y pregunta por el evento","«¿Para qué ocasión es? Cuéntame.» Mostrar interés baja la ansiedad y te da datos (fecha, estilo, presupuesto, clima, lugar)."],
   ["Explica las reglas ANTES","Fechas de entrega y devolución, depósito, ajustes permitidos, qué pasa con manchas, daños o retrasos. Lo no explicado se convierte en enojo."],
   ["Prueba con privacidad y respeto","Probador cómodo, ayuda solo si lo desea, cero comentarios sobre peso o edad. Resalta lo que le favorece."],
   ["Confirma por escrito","Mensaje con modelo, fecha, talla, ajustes, monto y depósito. Evita malentendidos."],
   ["Antes del evento","Un mensaje 2–3 días antes: «¡Todo listo! Cualquier duda aquí estoy.» Genera confianza."],
   ["Después del evento","«¿Cómo te fue? Me encantaría ver una foto.» Cierra la experiencia y activa recomendaciones."]],
  di:["«Te explico cómo funciona para que no haya sorpresas.»","«Si algo no te convence, probamos otro.»","«Lo importante es que te sientas segura y tú misma.»"],
  evita:["«Ese no te queda por tu cuerpo.»","Cobros o condiciones no avisadas antes.","Presionar para decidir en el momento."],
  dificiles:[
   ["Pide cambio de último minuto","Mantén la calma; revisa disponibilidad; ofrece alternativas. «Veamos qué opciones tenemos para tu fecha.»"],
   ["Devuelve el vestido tarde","Sin acusar: «Noté que la devolución se pasó de la fecha; ¿hubo algún problema?» Aplica la política con amabilidad."],
   ["Mancha o daño","Evita la acusación: «Encontré esta marca, revisemos cómo resolverlo.» Muestra evidencia con respeto y aplica lo acordado."],
   ["Ajuste que no le convence","Valida («entiendo que quieres sentirte cómoda») y ofrece una nueva prueba o ajuste con fecha clara."],
   ["Cancelación","Agradece el aviso y aplica la política con empatía; deja la puerta abierta para otra ocasión."]],
  plantillas:[
   ["Confirmación","Hola [nombre] 💗 confirmo tu renta del vestido [modelo] para el [fecha]. Entrega: [día]. Devolución: [día]. Depósito: [monto]. Cualquier duda aquí estoy."],
   ["Recordatorio de entrega","Hola [nombre], mañana es la entrega de tu vestido. ¿A qué hora te queda bien pasar?"],
   ["Antes del evento","¡Faltan pocos días! Estoy segura de que te verás hermosa. ¿Necesitas algo más?"],
   ["Recordatorio de devolución","Hola [nombre], te recuerdo que la devolución del vestido es el [fecha]. ¡Gracias por tu cuidado!"],
   ["Después","¿Cómo te fue en tu evento? Me encantaría ver una foto, ¡me alegra haber sido parte de ese día!"]]
 },
 venta:{icon:"🛍️",t:"Venta de vestidos",
  emo:"La clienta siente <b>ilusión, pero también el peso de la inversión</b>: «¿y si me arrepiento?». Tu misión emocional: darle <b>confianza en su decisión</b>, sin presión.",
  pasos:[
   ["Recibe con calidez","Saluda por su nombre, ofrécele agua o café, y deja que mire a su ritmo."],
   ["Escucha antes de proponer","¿Qué ocasión es? ¿Qué estilo la hace sentir ella misma? ¿Qué le preocupa de su cuerpo o de su presupuesto?"],
   ["Reduce las opciones","Muestra 2–3 vestidos, no 15. Demasiada elección genera ansiedad."],
   ["Prueba y validación","Pregunta: «¿Cómo te sientes con él?» Su emoción es la mejor guía; lo que ella siente vale más que tu opinión."],
   ["Acompaña la decisión","Resume lo que le gustó: «Este te hace sentir segura y cómoda.» Si duda, ofrece apartarlo, no la presiones."],
   ["Cierre y seguimiento","Deja claras políticas de cambios, arreglos y garantías. Escribe después: «¿Qué tal tu vestido? ¿Cómo te fue?»"]],
  di:["«¿Cómo te sientes con él?»","«No hay prisa, decide con tranquilidad.»","«Este color te hace brillar, pero tú eres quien decide.»"],
  evita:["«Si no lo llevas hoy, se acaba.»","Comparar con otras clientas.","Opinar sobre su cuerpo."],
  dificiles:[
   ["Clienta indecisa","Pregunta qué emoción quiere sentir ese día. Reduce opciones y ofrece apartar el vestido."],
   ["Regatea el precio","Reconoce su interés: «Entiendo que cuides tu presupuesto»; explica el valor y ofrece alternativas (otro modelo, un accesorio incluido)."],
   ["Arrepentimiento después de comprar","Escucha, valida y aplica la política de cambios con amabilidad; evita culparla."],
   ["Acompañantes que opinan distinto","Dirígete a la clienta; reconoce a las acompañantes. «Gracias por tu opinión; ¿cómo se siente ella?»"],
   ["Inseguridad corporal","Sé honesta pero cuidadosa: enfócate en cortes y colores que la hagan sentir cómoda. Nunca la hagas sentir «fuera de talla»."]],
  plantillas:[
   ["Información","Hola [nombre] 💗 gracias por escribirnos. Cuéntame para qué evento buscas vestido y te muestro opciones que te encanten."],
   ["Apartado","Listo [nombre], aparté tu vestido hasta el [fecha]. Si tienes dudas, aquí estoy."],
   ["Entrega o arreglo","Hola [nombre], tu vestido estará listo el [fecha]. ¿A qué hora te queda bien pasar por él?"],
   ["Seguimiento","Hola [nombre], ¿cómo te fue con tu vestido? Tu opinión es muy valiosa para nosotros."],
   ["Agradecimiento","Gracias por confiar en nosotras para un momento tan especial. Si necesitas algo más, aquí estamos."]]
 }
};
const TABS=[["inicio","🏠 Inicio"],["renta","🔁 Renta"],["venta","🛍️ Venta"],["comparar","⚖️ Renta vs Venta"],["clientas","📒 Mis clientas"],["practica","🌱 Práctica"]];
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let clientas=S.get("vcc_clientas",[]);let tab=(location.hash||"#inicio").slice(1);if(!TABS.find(t=>t[0]===tab))tab="inicio";
function go(t){tab=t;location.hash=t;render();scrollTo(0,0)}
function nav(){$("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join("")}
function vInicio(){return `<div class="card"><h2>Bienvenida</h2><p>Una clienta no solo compra o renta tela: busca <b>confianza, ilusión y seguridad</b> para un momento especial. Esta app te ayuda a atenderla con inteligencia emocional, ya sea en <b>renta</b> o en <b>venta</b>.</p>
<div class="row"><button class="btn" onclick="go('renta')">🔁 Renta</button><button class="btn" onclick="go('venta')">🛍️ Venta</button><button class="btn ghost" onclick="go('comparar')">⚖️ Comparar</button><button class="btn ghost" onclick="go('clientas')">📒 Mis clientas</button></div></div>
<div class="card"><h3>Principios para ambas</h3><ul><li><b>Escucha antes de ofrecer.</b></li><li><b>Cuida su cuerpo y su dignidad:</b> nunca comentarios sobre peso o edad.</li><li><b>Honestidad amable:</b> di lo que le favorece, sin engañar.</li><li><b>Cumple lo prometido</b> en fechas, ajustes y precios.</li><li><b>Da seguimiento:</b> la clienta recuerda cómo la hiciste sentir.</li></ul></div>`}
function vModo(k){const m=C[k];return `<div class="card"><h2>${m.icon} ${m.t}</h2><p>${m.emo}</p></div>
<h3>Paso a paso</h3>${m.pasos.map((p,i)=>`<details ${i===0?'open':''}><summary>${i+1}. ${p[0]}</summary><div><p>${p[1]}</p></div></details>`).join("")}
<div class="card"><h3>✔ Frases que ayudan</h3>${m.di.map(d=>`<div class="say">${esc(d)}</div>`).join("")}<h3>✖ Evita</h3>${m.evita.map(d=>`<div class="avoid">${esc(d)}</div>`).join("")}</div>
<h3>Situaciones difíciles</h3>${m.dificiles.map(p=>`<details><summary>${p[0]}</summary><div><p>${p[1]}</p></div></details>`).join("")}
<h3>💬 Plantillas de WhatsApp</h3>${m.plantillas.map((p,i)=>`<div class="card"><b>${p[0]}</b><p id="pl${k}${i}">${esc(p[1])}</p><button class="btn ghost" onclick="cp('pl${k}${i}')">Copiar</button></div>`).join("")}`}
function cp(id){const t=document.getElementById(id).textContent;try{navigator.clipboard.writeText(t)}catch(e){}}
function vComp(){return `<div class="card"><h2>⚖️ Renta vs Venta</h2><div style="overflow-x:auto"><table><tr><th></th><th>Renta</th><th>Venta</th></tr>
<tr><td>Emoción principal</td><td>Urgencia y miedo a que algo salga mal</td><td>Ilusión y peso de la inversión</td></tr>
<tr><td>Tu misión</td><td>Dar tranquilidad y seguridad</td><td>Dar confianza en la decisión</td></tr>
<tr><td>Qué aclarar</td><td>Fechas, depósito, daños, devolución</td><td>Precio, cambios, arreglos, garantía</td></tr>
<tr><td>Riesgo de conflicto</td><td>Daños, retrasos, cobros extra</td><td>Arrepentimiento y comparación de precios</td></tr>
<tr><td>Tono</td><td>Cálido y muy claro; reglas antes</td><td>Cálido y sin presión</td></tr>
<tr><td>Relación</td><td>Clienta recurrente por evento</td><td>Venta única, recomendaciones</td></tr>
<tr><td>Seguimiento</td><td>Antes y después del evento</td><td>Cómo le fue con su vestido</td></tr></table></div></div>
<div class="card"><h3>Lo que es igual</h3><p>Recibir con calidez, escuchar, cuidar el cuerpo y la dignidad, ser honesta, cumplir y dar seguimiento.</p></div>`}
const EV={boda:"💒 Boda",xv:"👑 XV años",grad:"🎓 Graduación",gala:"✨ Gala/Fiesta",cumple:"🎂 Cumpleaños de clienta",otro:"📌 Otro"};
function dias(f){const h=new Date();h.setHours(0,0,0,0);const [y,m,d]=f.split("-").map(Number);return Math.round((new Date(y,m-1,d)-h)/864e5)}
function vCli(){const l=clientas.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
return `<div class="card"><h2>📒 Mis clientas y fechas</h2><p class="hint">Guarda a tus clientas, la fecha de su evento y un detalle personal para felicitar y dar seguimiento.</p>
<div class="row"><input id="cn" placeholder="Nombre"><input id="cf" type="date"></div>
<div class="row"><select id="cm"><option value="renta">Renta</option><option value="venta">Venta</option></select><select id="ce">${Object.entries(EV).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
<input id="cd" placeholder="Detalle (talla, modelo, color, preferencias, WhatsApp)"><button class="btn" style="margin-top:8px" onclick="addC()">Guardar</button></div>
<div class="card">${l.length?l.map(c=>{const d=dias(c.fecha);return `<div class="ev"><div><b>${esc(c.n)}</b> · ${c.m==="renta"?"🔁 Renta":"🛍️ Venta"}<small>${EV[c.e]} · ${c.fecha}${c.d?" · "+esc(c.d):""}</small></div><div class="days">${d<0?"pasó":d===0?"¡Hoy!":d+" días"}<br><button class="btn ghost" style="padding:2px 8px;font-size:.75rem" onclick="delC('${c.id}')">🗑</button></div></div>`}).join(""):'<p class="hint">Aún no hay clientas.</p>'}</div>`}
function addC(){const n=$("#cn").value.trim(),f=$("#cf").value;if(!n||!f){alert("Nombre y fecha");return}clientas.push({id:"c"+Date.now(),n,fecha:f,m:$("#cm").value,e:$("#ce").value,d:$("#cd").value.trim()});S.set("vcc_clientas",clientas);render()}
function delC(id){if(confirm("¿Eliminar?")){clientas=clientas.filter(c=>c.id!==id);S.set("vcc_clientas",clientas);render()}}
function vPrac(){return `<div class="card"><h2>🌱 Práctica de inteligencia emocional</h2>
<details open><summary>Método ABC para quejas</summary><div><p><b>A – Aceptar</b> la emoción: «Tienes razón en sentirte así».<br><b>B – Buscar</b> la solución con un plazo concreto.<br><b>C – Cumplir</b> y confirmar que quedó conforme.</p></div></details>
<details><summary>Pausa de 3 respiraciones</summary><div><p>Antes de responder un reclamo o un mensaje difícil, respira tres veces. Tu tono no se nota en el texto, pero sí tu calma.</p></div></details>
<details><summary>Lectura de la emoción</summary><div><p>Antes de atender pregúntate: ¿viene con ilusión, con miedo, con prisa o con enojo? Ajusta tu tono a esa emoción.</p></div></details>
<details><summary>Cuidado del cuerpo y la dignidad</summary><div><p>Habla de <b>cortes, telas, colores y comodidad</b>, nunca de «defectos». Pregunta qué quiere resaltar y qué le hace sentir bien.</p></div></details>
<details><summary>Tu propio bienestar</summary><div><p>Temporadas altas (bodas, graduaciones) estresan. Define horarios de atención, descansa y pide apoyo antes de agotarte.</p></div></details></div>
<div class="card"><h3>Reflexión semanal</h3><ul><li>¿Qué clienta se fue más feliz y por qué?</li><li>¿Qué reclamo aprendí a resolver mejor?</li><li>¿Qué mensaje puedo mejorar?</li></ul></div>`}
function render(){nav();$("#app").innerHTML=tab==="inicio"?vInicio():tab==="renta"||tab==="venta"?vModo(tab):tab==="comparar"?vComp():tab==="clientas"?vCli():vPrac()}
addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(TABS.find(x=>x[0]===t)&&t!==tab){tab=t;render()}});render();
</script>
</body></html>
