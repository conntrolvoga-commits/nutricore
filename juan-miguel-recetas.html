function abrir(k){var nn=u8(D.n),ct=u8(D.c),all=new Uint8Array(nn.length+ct.length);all.set(nn);all.set(ct,nn.length);
 if(!NCC.eq(NCC.hmac(k.mac,all),u8(D.m)))return false;var p=NCC.chacha(k.enc,nn,ct),h='';for(var i=0;i<p.length;i+=32768)h+=String.fromCharCode.apply(null,p.subarray(i,i+32768));
 document.open();document.write(h);document.close();return true}
try{var g=localStorage.getItem(KEY);if(g){var o=JSON.parse(g);if(!abrir({enc:u8(o.e),mac:u8(o.m)}))localStorage.removeItem(KEY)}}catch(e){}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();var E=document.getElementById('e'),pw=document.getElementById('pw').value,rec=document.getElementById('rec').checked;E.style.color='';E.textContent='Abriendo\u2026 (unos segundos)';
 setTimeout(function(){try{var k=NCC.keys(pw,u8(D.s),D.i);var ok=false;var save=JSON.stringify({e:b64(k.enc),m:b64(k.mac)});
  if(rec){try{localStorage.setItem(KEY,save)}catch(e){}}
  ok=abrir(k);if(!ok){try{localStorage.removeItem(KEY)}catch(e){}E.style.color='#c0392b';E.textContent='Contrase\u00f1a incorrecta. Revisa letras y n\u00fameros.'}}
  catch(err){E.textContent='No se pudo abrir aqu\u00ed ('+err.message+'). \u00c1brelo con Chrome o Safari.';document.getElementById('tip').hidden=false}},50)});
</script></body></html>
