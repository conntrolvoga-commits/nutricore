/* ----- calendario ----- */
function proxFecha(e){ // próxima ocurrencia
 const hoy=new Date();hoy.setHours(0,0,0,0);const [y,m,d]=e.fecha.split("-").map(Number);
 let f=new Date(y,m-1,d);
 if(e.anual||["cumple","aniv"].includes(e.tipo)){f=new Date(hoy.getFullYear(),m-1,d);if(f<hoy)f=new Date(hoy.getFullYear()+1,m-1,d)}
 return f;
}
function proximos(){const hoy=new Date();hoy.setHours(0,0,0,0);
 return eventos.map(e=>({...e,prox:proxFecha(e)})).filter(e=>e.prox>=hoy).sort((a,b)=>a.prox-b.prox)}
function diasPara(f){const hoy=new Date();hoy.setHours(0,0,0,0);return Math.round((f-hoy)/864e5)}
function evRow(e){const d=diasPara(e.prox);const edad=(e.tipo==="cumple"||e.tipo==="aniv")?(()=>{const y=+e.fecha.slice(0,4);const a=e.prox.getFullYear()-y;return a>0&&y>1900?` · ${a} ${e.tipo==="cumple"?"años":"años de casados/aniversario"}`:""})():"";
 return `<div class="ev"><div><b>${esc(e.nombre)}</b> <span class="tag">${REL[e.rel]||""}</span><small>${TIPOS[e.tipo]} · ${e.prox.toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"})}${edad}${e.nota?" · "+esc(e.nota):""}</small></div>
 <div class="days">${d===0?"¡Hoy! 🎉":d===1?"Mañana":d+" días"}</div></div>`}
let mesVer=new Date().getMonth(), anioVer=new Date().getFullYear();
function vCal(){
 const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
 const primer=new Date(anioVer,mesVer,1).getDay(); const dim=new Date(anioVer,mesVer+1,0).getDate();
 const hoy=new Date();
 const marcados={};eventos.forEach(e=>{const p=proxFecha(e);const [y,m,d]=e.fecha.split("-").map(Number);
   const rec=e.anual||["cumple","aniv"].includes(e.tipo);
   if((rec&&m-1===mesVer)||(!rec&&y===anioVer&&m-1===mesVer))marcados[d]=(marcados[d]||[]).concat(e.nombre)});
 let cel=["D","L","M","M","J","V","S"].map(x=>`<div class="h">${x}</div>`).join("")+"<div></div>".repeat(primer);
 for(let d=1;d<=dim;d++){const es=hoy.getDate()===d&&hoy.getMonth()===mesVer&&hoy.getFullYear()===anioVer;
  cel+=`<div class="${marcados[d]?'has':''} ${es?'today':''}" ${marcados[d]?`title="${esc(marcados[d].join(', '))}"`:''}>${d}</div>`}
 const pr=proximos();
 const delMes=pr.length?'':'';
 return `<div class="card"><h2>📅 Calendario de fechas</h2>
 <div class="ev" style="border:0"><button class="btn ghost" onclick="cambiaMes(-1)">◀</button><b>${meses[mesVer]} ${anioVer}</b><button class="btn ghost" onclick="cambiaMes(1)">▶</button></div>
 <div class="grid">${cel}</div></div>
 <div class="card"><h3>➕ Agregar fecha</h3>
 <div class="row"><input id="en" placeholder="Nombre (ej. Mamá, Ana, Sra. Pérez)">
 <input id="ef" type="date"></div>
 <div class="row"><select id="et">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
 <select id="er">${Object.entries(REL).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
 <input id="eno" placeholder="Nota (ej. le gustan las flores, prefiere WhatsApp)"><label class="hint"><input type="checkbox" id="ea" style="width:auto"> Se repite cada año</label><br>
 <button class="btn" style="margin-top:8px" onclick="addEv()">Guardar</button></div>
 <div class="card"><h3>🔔 Próximas fechas</h3>${pr.length?pr.map(e=>evRow(e)+`<div style="text-align:right" class="noprint"><button class="btn ghost" style="padding:3px 9px;font-size:.78rem" onclick="msgEv('${e.id}')">✉️ Mensaje</button> <button class="btn ghost" style="padding:3px 9px;font-size:.78rem" onclick="delEv('${e.id}')">🗑</button></div>`).join(""):'<p class="hint">Sin fechas guardadas.</p>'}</div>
 <div id="msgbox"></div>
 <div class="card noprint"><button class="btn ghost" onclick="exportIcs()">⬇️ Exportar a mi calendario (.ics)</button></div>`;
}
function cambiaMes(n){mesVer+=n;if(mesVer<0){mesVer=11;anioVer--}if(mesVer>11){mesVer=0;anioVer++}render()}
function addEv(){const n=$("#en").value.trim(),f=$("#ef").value;if(!n||!f){alert("Escribe un nombre y una fecha.");return}
 eventos.push({id:"e"+Date.now(),nombre:n,fecha:f,tipo:$("#et").value,rel:$("#er").value,nota:$("#eno").value.trim(),anual:$("#ea").checked});
 S.set("ief_eventos",eventos);render()}
function delEv(id){if(!confirm("¿Eliminar esta fecha?"))return;eventos=eventos.filter(e=>e.id!==id);S.set("ief_eventos",eventos);render()}
function msgEv(id){const e=eventos.find(x=>x.id===id);let m=MENSAJES[e.rel]||MENSAJES.otro;
 m=m.includes("[nombre]")?m.replace("[nombre]",e.nombre):e.nombre+", "+m.charAt(0).toLowerCase()+m.slice(1);
 $("#msgbox").innerHTML=`<div class="card"><h3>✉️ Mensaje sugerido</h3><textarea id="gm" rows="3">${esc(m)}</textarea><button class="btn ghost" style="margin-top:6px" onclick="copiar()">Copiar</button></div>`;
 $("#msgbox").scrollIntoView({behavior:"smooth"})}
function exportIcs(){const p=n=>String(n).padStart(2,"0");
 const l=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Corazon en Familia//ES"];
 eventos.forEach(e=>{const d=e.fecha.replace(/-/g,"");const rec=(e.anual||["cumple","aniv"].includes(e.tipo))?["RRULE:FREQ=YEARLY"]:[];

function vLimites(){
 return `<div class="card"><h2>🚧 Respetar los límites de los demás</h2>
 <p>Un límite es una frase invisible que dice: «hasta aquí me siento cómodo(a)». Respetarlo no te aleja de las personas: les demuestra que son seguras contigo. Invadir, aunque sea con buena intención, daña la confianza.</p></div>
 <details open><summary>📜 10 reglas generales para todas las relaciones</summary><div><ol>${LIM.reglas.map(r=>`<li><b>${r[0]}.</b> ${r[1]}</li>`).join("")}</ol></div></details>
 <h3 style="margin-top:18px">👥 Cómo respetar a cada tipo de relación</h3>
 ${LIM.rel.map(r=>`<details><summary>${r[0]}</summary><div><p>${r[1]}</p><div class="say"><b>✔</b> ${esc(r[2].split("  Evita:")[0].replace("Di: ",""))}</div><div class="avoid"><b>✖</b> ${esc((r[2].split("Evita:")[1]||"").trim())}</div></div></details>`).join("")}
 <h3 style="margin-top:18px">🌱 Prácticas</h3>
 ${LIM.practicas.map(r=>`<details><summary>${r[0]}</summary><div><p>${r[1]}</p></div></details>`).join("")}
 <div class="card"><h3>🔍 Autoevaluación: ¿invado límites?</h3><p class="hint">Marca lo que haces con frecuencia.</p>
 ${LIM.test.map((t,i)=>`<label style="display:block;margin:6px 0"><input type="checkbox" class="lt" style="width:auto" onchange="resTest()"> ${esc(t)}</label>`).join("")}
 <p id="lr" style="font-weight:700;color:var(--pri)"></p></div>
 <div class="card"><h3>💬 Cómo poner tu propio límite</h3><div class="say"><b>Fórmula:</b> «Cuando ___, me siento ___; necesito ___. Gracias por entenderme.»</div>
 <div class="say">«Prefiero no hablar de eso. ¿Hablamos de otra cosa?»</div><div class="say">«Hoy no puedo, pero me gustaría vernos el sábado.»</div>
 <div class="say">«Entiendo tu intención, y esa decisión la tomaré yo.»</div></div>`;
}

 $("#lr").textContent=n===0?"Excelente: vas por buen camino. Sigue preguntando antes de entrar.":n<=3?"Hay detalles por cuidar. Practica la pausa de 3 segundos y la pregunta de permiso.":"Conviene trabajarlo: empieza con el Semáforo de límites y la Revisión semanal."}

function vTipos(){
 return `<div class="card"><h2>🌟 Diferentes tipos de inteligencia emocional</h2>
 <p>La inteligencia emocional tiene muchas caras. Aquí encontrarás sus componentes, las inteligencias cercanas y sus aplicaciones en distintas áreas de la vida. Cada una trae una descripción, una práctica y una frase de ejemplo.</p>
 <input id="tq" placeholder="🔍 Buscar (ej. duelo, liderazgo, empatía)" oninput="filtraTipos()"></div><div id="tl">${tiposHtml("")}</div>`;
}
function tiposHtml(q){q=q.toLowerCase();let h="";
 TIPOS_IE.forEach(g=>{const it=g.items.filter(i=>!q||(i[0]+i[1]+i[2]+i[3]).toLowerCase().includes(q));if(!it.length)return;
  h+=`<h3 style="margin-top:18px">${g.g}</h3>`+it.map(i=>`<details ${q?'open':''}><summary>${esc(i[0])}</summary><div><p>${esc(i[1])}</p><div class="say"><b>Práctica:</b> ${esc(i[2])}</div><div class="say"><b>Frase:</b> ${esc(i[3])}</div></div></details>`).join("")});
 return h||'<p class="hint">Sin resultados.</p>'}
function filtraTipos(){$("#tl").innerHTML=tiposHtml($("#tq").value.trim())}

function vDiario(){
 const hist=diario.slice().reverse().slice(0,15);
 return `<div class="card"><h2>📝 Diario emocional</h2><p class="hint">¿Cómo te sientes hoy? Nombrar la emoción ya te ayuda a regularla.</p>

 <h3>¿Qué la provocó?</h3><textarea id="dq" rows="2" placeholder="Situación o persona…"></textarea>
 <h3>¿Qué necesito? ¿Qué puedo hacer?</h3><textarea id="dn" rows="2" placeholder="Necesito… Puedo…"></textarea>

 <div class="card"><h3>Mis registros</h3>${hist.length?hist.map(d=>`<div class="ev"><div><b>${esc(d.emo)}</b><small>${new Date(d.f).toLocaleDateString("es",{day:"numeric",month:"short"})} · ${esc(d.q)} → ${esc(d.n)}</small></div></div>`).join(""):'<p class="hint">Aún no hay registros.</p>'}
 ${hist.length?'<button class="btn ghost noprint" onclick="clearD()">Borrar diario</button>':''}</div>`;

function saveD(){if(!sel){alert("Elige una emoción.");return}diario.push({f:Date.now(),emo:sel,q:$("#dq").value,n:$("#dn").value});S.set("ief_diario",diario);sel=null;render()}
function clearD(){if(confirm("¿Borrar todo el diario?")){diario=[];S.set("ief_diario",diario);render()}}
