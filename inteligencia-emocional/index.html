   {n:"Actitud base: de «perder un hijo» a «ganar un miembro»",pts:["Reconoce tus emociones: miedo a perder lugar, nostalgia, celos o preocupación son normales. Nómbralas y no las descargues en la pareja de tu hijo.","Tu hijo o hija formó un nuevo hogar: sus decisiones son de ellos. Tu rol es de apoyo, no de supervisión.","Pasa de la autoridad a la invitación: «cuando quieran», «si les sirve».","Recibe a la persona como es, no como la imaginabas ni como era tu ex nuera o tu propio yerno anterior.","Recuerda que ella o él también es hijo o hija de alguien: trátalo como te gustaría que trataran al tuyo."],
    di:["«Me alegra que seas parte de nuestra familia.»","«Esta es tu casa también.»"],evita:["«Mi hijo/a antes no era así.»","Comparar con otras nueras o yernos."]},
   {n:"Con tu nuera",pts:["Reconoce su valor como persona, no solo como esposa o madre de tus nietos.","Evita críticas sobre la casa, la cocina, la ropa, el trabajo o la crianza. Si algo te preocupa de verdad, dilo una vez, con cariño y en privado.","No compitas por ser «la mujer de su vida»: tu lugar y el de ella son distintos y ambos importan.","Ofrece ayuda concreta («¿te llevo comida el sábado?»), no consejos no pedidos.","Valida su carga: trabajo, hijos, hogar. Un «gracias» y un «lo estás haciendo muy bien» valen mucho.","Evita preguntas invasivas: cuándo tendrán hijos, por qué no cocina, cuánto gana."],
    di:["«Admiro cómo te organizas con todo.»","«Si quieres, me quedo con los niños para que descansen.»"],evita:["«En mi casa se hacía de otra forma.»","Opinar sobre su cuerpo o su forma de criar."]},
   {n:"Con tu yerno",pts:["Reconoce su esfuerzo como pareja y como proveedor o compañero; evita medirlo solo por el dinero o el éxito.","No lo trates como «el que se llevó a mi hija»: es un adulto con quien compartes el cariño por ella.","Evita interrogatorios y pruebas de lealtad; conversa de temas comunes (deporte, trabajo, intereses).","Respeta su rol en el hogar y la crianza; no lo corrijas delante de su pareja o de sus hijos.","Cuida las bromas: lo que en confianza parece gracioso puede lastimar.","Si tienes una preocupación sobre su trato a tu hija, habla con calma y con hechos, no con rumores."],
    di:["«Gracias por cuidar de mi hija y de los niños.»","«Cuando quieras platicar, aquí estoy.»"],evita:["«Mi hija merecía algo mejor.»","Hablar con tu hija en su contra."]},
   {n:"Situaciones difíciles y cómo manejarlas",pts:["<b>Intromisión en la crianza:</b> antes de opinar, pregunta «¿cómo prefieren que lo haga?». Si no piden consejo, no lo des.","<b>Celos o sensación de desplazamiento:</b> habla de lo que sientes con tu pareja o una amistad, no con tu hijo ni su pareja. Pide tiempo juntos sin exigirlo.","<b>Comparaciones entre hijos y parejas:</b> evítalas; generan heridas y rivalidad.","<b>Desacuerdos entre ellos:</b> no tomes partido ni seas mensajera. Escucha y devuelve: «ustedes sabrán cómo resolverlo».","<b>Visitas y fechas especiales:</b> pregunta con tiempo, ofrece alternativas y acepta un «no» sin drama; la pareja también tiene su otra familia.","<b>Dinero y favores:</b> aclara si es regalo o préstamo; no lo uses como control.","<b>Después de un conflicto:</b> da el primer paso con un mensaje breve y sincero: «Me importa que estemos bien»."],
    di:["«Si necesitan mi apoyo, me lo dicen; si no, confío en ustedes.»","«Lo siento, me excedí. Gracias por decírmelo.»"],evita:["Silencios castigadores, ironías o indirectas.","Contar a otros lo que tu hijo/a te confía."]},
   {n:"Tu espacio y bienestar como suegro/a",pts:["Cultiva tu propia vida: amistades, hobbies, pareja, salud. Quien tiene vida propia no depende emocionalmente de las visitas.","Acepta que las prioridades de la pareja cambian con trabajo, hijos y cansancio; menos tiempo no significa menos cariño.","Mantén contacto sin presión: un mensaje corto, un saludo, un detalle sin esperar respuesta inmediata.","Si sientes tristeza o soledad intensa, busca apoyo; no se lo pidas a tus hijos como obligación."],
    di:["«Te extraño, y me alegra que estés bien con tu familia.»"],evita:["«Ya casi no vienen.»","Usar la culpa o la enfermedad para que visiten."]}
  ],
  ejercicios:["Escribe tres cualidades de tu nuera o yerno y díselas esta semana, en persona o por mensaje.","Antes de dar un consejo, cuenta hasta diez y pregunta: «¿Quieres mi opinión?».","Planea un detalle mensual sin motivo: un café, una receta, una llamada para preguntar cómo está.","Escribe una carta (aunque no la envíes) con lo que sientes por la nueva familia y revisa qué parte es miedo y cuál es amor."]},

 politica:{icon:"🏡",nombre:"Familia política",titulo:"Inteligencia emocional con la familia política",

 amigos:{icon:"🫶",nombre:"Amigos",titulo:"Inteligencia emocional para la amistad",

   {n:"Cuando la amistad duele",pts:["Habla en privado y pronto: «Me sentí mal cuando… ¿podemos hablarlo?»","Distingue un mal momento de un patrón: si siempre hay crítica o manipulación, está bien tomar distancia.","Despedirte con gratitud también es una forma de cuidar."],

 pareja:{icon:"💞",nombre:"Pareja y matrimonio",titulo:"Inteligencia emocional en pareja y matrimonio",

   {n:"De esposo a esposa (complemento)",pts:["Escucha sin querer arreglar: pregunta «¿quieres consejo o apoyo?»","Valida: «tiene sentido que te sientas así».","Detalles pequeños diarios: un mensaje, un abrazo, ayuda con la casa sin que te lo pidan.","Cuida tu tono: lo que dices importa, pero cómo lo dices importa más."],

const S={ get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let eventos=S.get("ief_eventos",[]); let diario=S.get("ief_diario",[]); let vistos=S.get("ief_vistos",[]);
const TABS=[["inicio","🏠 Inicio"],["libro","📖 Libros"],["hijos","🧒 Hijos"],["yernos","🤝 Yernos/Nueras"],["suegros","👵 Suegros"],["politica","🏡 Fam. política"],["amigos","🫶 Amigos"],["pareja","💞 Pareja"],["limites","🚧 Límites"],["tipos","🌟 Tipos de IE"],["estudio","📚 Estudio"],["personas","👥 Personas"],["escuchar","🎧 Escuchar"],["negocios","💼 Negocios"],["calendario","📅 Calendario"],["diario","📝 Diario"]];
let tab=(location.hash||"#inicio").slice(1); if(!TABS.find(t=>t[0]===tab))tab="inicio";

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function nav(){ $("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join("");
 $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.t)); }
function go(t){tab=t;location.hash=t;render();window.scrollTo(0,0)}

 const f=FRASES[new Date().getDate()%FRASES.length];
 const prox=proximos().slice(0,3);
 return `<div class="card"><h2>Bienvenida</h2><p>«${esc(f)}»</p>
 <p class="hint">Elige una sección para empezar. Cada módulo tiene frases para decir, frases para evitar y ejercicios prácticos.</p></div>
 <div class="row">${Object.entries(MODULOS).map(([k,m])=>`<button class="btn ghost" onclick="go('${k}')">${m.icon} ${m.nombre}</button>`).join("")}
 <button class="btn ghost" onclick="go('libro')">📖 Libros</button><button class="btn ghost" onclick="go('limites')">🚧 Límites</button><button class="btn ghost" onclick="go('tipos')">🌟 Tipos de IE</button><button class="btn ghost" onclick="go('personas')">👥 Personas</button><button class="btn ghost" onclick="go('estudio')">📚 Estudio</button><button class="btn ghost" onclick="go('escuchar')">🎧 Escuchar</button><button class="btn ghost" onclick="go('calendario')">📅 Calendario</button></div>
 <div class="card"><h3>🔔 Próximas fechas</h3>${prox.length?prox.map(evRow).join(""):'<p class="hint">Aún no hay fechas. Agrega cumpleaños y eventos en el Calendario.</p>'}</div>
 <div class="card"><h3>Mi progreso</h3><p>Capítulos leídos: <b>${vistos.length}/${LIBROS.reduce((a,l)=>a+l.capitulos.length,0)}</b></p>
 <div style="background:var(--line);border-radius:8px;height:10px"><div style="width:${vistos.length/LIBROS.reduce((a,l)=>a+l.capitulos.length,0)*100}%;background:var(--pri);height:10px;border-radius:8px"></div></div></div>`;
}
function vLibro(){
 const L=LIBROS[libroSel];
 return `<div class="card"><div class="pill-row noprint" style="margin-bottom:10px">${LIBROS.map((x,i)=>`<button class="btn ${i===libroSel?'':'ghost'}" onclick="libroSel=${i};render()">📖 Libro ${i+1}</button>`).join("")}</div>
 <h2>${esc(L.titulo)}</h2><p><i>${esc(L.subtitulo)}</i></p><p class="hint">Marca cada capítulo como leído para ver tu progreso.</p>${listenBtn("libro"+libroSel)}</div>`+
 L.capitulos.map((c,i)=>{const k=vk(libroSel,i),on=vistos.includes(k);return `<details><summary>${on?'✅ ':''}${esc(c.t)}</summary><div>${c.p.map(p=>`<p>${p}</p>`).join("")}
 <button class="btn ${on?'ghost':''}" onclick="marcar(${libroSel},${i})">${on?'Marcar como no leído':'Marcar como leído'}</button></div></details>`}).join("")+
 `<div class="card noprint"><button class="btn" onclick="window.print()">🖨️ Imprimir / guardar PDF</button></div>`;
}
function marcar(b,i){const k=vk(b,i),x=vistos.indexOf(k);x>=0?vistos.splice(x,1):vistos.push(k);S.set("ief_vistos",vistos);const y=window.scrollY;render();window.scrollTo(0,y)}
function vModulo(k){
 const m=MODULOS[k];
 return `<div class="card"><h2>${m.icon} ${esc(m.titulo)}</h2><p>${m.intro}</p>${listenBtn("m:"+k)}</div>`+
 m.etapas.map(e=>`<details open><summary>${esc(e.n)}</summary><div><ul>${e.pts.map(p=>`<li>${p}</li>`).join("")}</ul>
 ${e.di.map(d=>`<div class="say"><b>✔ Di:</b> ${esc(d)}</div>`).join("")}${e.evita.map(d=>`<div class="avoid"><b>✖ Evita:</b> ${esc(d)}</div>`).join("")}</div></details>`).join("")+
 `<div class="card"><h3>🌱 Ejercicios prácticos</h3><ul>${m.ejercicios.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
 <div class="card"><h3>✉️ Generador de mensaje</h3><p class="hint">Escribe un nombre y copia un mensaje cálido.</p>
 <input id="gn" placeholder="Nombre (opcional)"><div class="pill-row" style="margin-top:8px">
 <button class="btn" onclick="gen('${k}')">Crear mensaje</button></div><textarea id="gm" rows="3" style="margin-top:8px" placeholder="Aquí aparece el mensaje"></textarea>
 <button class="btn ghost" style="margin-top:6px" onclick="copiar()">Copiar</button></div>`;
}
const MKEY={hijos:"hijo",yernos:"yerno",suegros:"yerno",politica:"politica",amigos:"amigo",pareja:"pareja",negocios:"clienta"};
function gen(k){const n=$("#gn").value.trim();let m=MENSAJES[MKEY[k]];m=m.replace("[nombre]",n||"").replace(/\s+,/g,",");if(n&&!/\[nombre\]/.test(MENSAJES[MKEY[k]]))m=n+", "+m.charAt(0).toLowerCase()+m.slice(1);$("#gm").value=m}
function copiar(){const t=$("#gm");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}}

/* ----- calendario ----- */
function proxFecha(e){ // próxima ocurrencia
 const hoy=new Date();hoy.setHours(0,0,0,0);const [y,m,d]=e.fecha.split("-").map(Number);
 let f=new Date(y,m-1,d);
 if(e.anual||["cumple","aniv"].includes(e.tipo)){f=new Date(hoy.getFullYear(),m-1,d);if(f<hoy)f=new Date(hoy.getFullYear()+1,m-1,d)}
 return f;
}
function proximos(){const hoy=new Date();hoy.setHours(0,0,0,0);
 return eventos.map(e=>({...e,prox:proxFecha(e)})).filter(e=>e.prox>=hoy).sort((a,b)=>a.prox-b.prox)}
function diasPara(f){const hoy=new Date();hoy.setHours(0,0,0,0);return Math.round((f-hoy)/864e5)}

 let cel=["D","L","M","M","J","V","S"].map(x=>`<div class="h">${x}</div>`).join("")+"<div></div>".repeat(primer);

 <select id="er">${Object.entries(REL).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>

const WAIT={wait:true};
const WMSG="Tómate un momento para reflexionar o hacer el ejercicio. Cuando quieras seguir, di continúa, o toca el botón Continuar.";
const ESC_OPTS=[["todo","📚 Toda la app"],["libro0","📖 Libro 1: El Arte de Querer Bien"],["libro1","📖 Libro 2: De Padres a Amigos"],["m:hijos","🧒 Hijos"],["m:yernos","🤝 Yernos y nueras"],["m:suegros","👵 Suegros hacia nueras y yernos"],["m:politica","🏡 Familia política"],["m:amigos","🫶 Amigos"],["m:pareja","💞 Pareja y matrimonio"],["m:negocios","💼 Negocios y clientes"],["limites","🚧 Límites"],["tipos","🌟 Tipos de inteligencia emocional"],["estudio","📚 Técnicas de estudio"],["personas","👥 Guías de mis personas"]];
function qLibro(b){const L=LIBROS[b],q=[{t:L.titulo+". "+L.subtitulo}];L.capitulos.forEach(c=>{q.push({t:c.t});c.p.forEach(p=>{q.push({t:T(p)});if(/^<b>(Práctica|Carta)/.test(p))q.push(WAIT)})});return q}
function qModulo(k){const m=MODULOS[k],q=[{t:m.titulo},{t:T(m.intro)}];m.etapas.forEach(e=>{q.push({t:e.n});e.pts.forEach(p=>q.push({t:T(p)}));e.di.forEach(d=>q.push({t:"Puedes decir: "+d}));e.evita.forEach(d=>q.push({t:"Evita decir: "+d}))});q.push({t:"Ejercicios prácticos."});m.ejercicios.forEach(x=>{q.push({t:x});q.push(WAIT)});return q}
function qLimites(){const q=[{t:"Respetar los límites de los demás. Un límite dice: hasta aquí me siento cómodo."},{t:"Diez reglas generales."}];LIM.reglas.forEach((r,i)=>q.push({t:(i+1)+". "+r[0]+". "+r[1]}));q.push({t:"Cómo respetar a cada tipo de relación."});LIM.rel.forEach(r=>{q.push({t:r[0].replace(/^\S+\s/,"")+". "+r[1]});q.push({t:r[2].replace("Di:","Puedes decir:").replace("Evita:","Evita decir:")})});q.push({t:"Prácticas."});LIM.practicas.forEach(r=>{q.push({t:r[0]+". "+r[1]});q.push(WAIT)});return q}
function qTipos(){const q=[{t:"Diferentes tipos de inteligencia emocional."}];TIPOS_IE.forEach(g=>{q.push({t:g.g});g.items.forEach(i=>{q.push({t:i[0]+". "+i[1]});q.push({t:"Práctica: "+i[2]});q.push({t:"Frase de ejemplo: "+i[3]})});q.push(WAIT)});return q}
function qRol(p){const q=[];guiaRol(p).forEach(([k,t])=>q.push({t:k==="say"?"Puedes decir: "+t:k==="avoid"?"Evita decir: "+t:t}));q.push(WAIT);return q}
function buildQ(sc){
 if(sc==="todo")return [].concat(qLibro(0),qLibro(1),Object.keys(MODULOS).flatMap(k=>qModulo(k)),qLimites(),qTipos());
 if(sc.startsWith("libro"))return qLibro(+sc.slice(5));
 if(sc.startsWith("m:"))return qModulo(sc.slice(2));
 if(sc==="estudio")return qEstudio();if(sc==="limites")return qLimites(); if(sc==="tipos")return qTipos();
 if(sc==="personas"){const l=personas.filter(p=>p.nombre.trim());return (l.length?l:personas).flatMap(p=>qRol(p))}
 if(sc.startsWith("rol:")){const p=personas.find(x=>x.id===sc.slice(4));return p?qRol(p):[]}
 return []}
const SP={q:[],i:0,st:"idle",tok:0,rec:null,sc:"todo",rate:1,vi:"",pausar:true,voz:true};
const synth=window.speechSynthesis;
function clean(t){return t.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,"").replace(/[✔✖«»]/g,"")}
function chunk(t){const o=[];(t.match(/[^.!?]+[.!?]*\s*/g)||[t]).forEach(x=>{if(o.length&&(o[o.length-1].length+x.length)<160)o[o.length-1]+=x;else o.push(x)});return o}
function say(text,cb){if(!synth){return}synth.cancel();const my=++SP.tok;const parts=chunk(clean(text));let k=0;
 const next=()=>{if(my!==SP.tok||SP.st!=="play")return;if(k>=parts.length){cb();return}const u=new SpeechSynthesisUtterance(parts[k++]);u.lang="es-MX";u.rate=SP.rate;const v=synth.getVoices().find(x=>x.name===SP.vi);if(v){u.voice=v;u.lang=v.lang}u.onend=next;u.onerror=()=>{};synth.speak(u)};
 setTimeout(next,60)}
function step(){if(SP.st!=="play")return;
 if(SP.i>=SP.q.length){ui();say("Hemos terminado. Gracias por escuchar.",()=>{SP.st="idle";SP.i=0;ui()});return}
 const it=SP.q[SP.i];ui();
 if(it.wait){if(!SP.pausar){SP.i++;step();return}say(WMSG,()=>{SP.st="wait";ui();startRec()});return}
 say(it.t,()=>{SP.i++;step()})}
function empezar(sc){stopRec();SP.sc=sc||SP.sc;SP.q=buildQ(SP.sc);SP.i=0;if(!SP.q.length){ui();return}SP.st="play";step()}
function pausar(){if(SP.st==="play"){SP.st="paused";SP.tok++;if(synth)synth.cancel();ui()}}
function continuar(){if(SP.st==="idle"){return}stopRec();const it=SP.q[SP.i];if(it&&it.wait)SP.i++;SP.st="play";step()}
function detener(){SP.st="idle";SP.tok++;if(synth)synth.cancel();stopRec();SP.i=0;ui()}
function jump(d){if(SP.st==="idle")return;stopRec();SP.i=Math.max(0,Math.min(SP.q.length-1,SP.i+d));SP.st="play";step()}
function startRec(){stopRec();if(!SP.voz)return;const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;
 try{const r=new R();r.lang="es-MX";r.continuous=true;r.interimResults=false;
  r.onresult=e=>{const t=Array.from(e.results).map(x=>x[0].transcript).join(" ").toLowerCase();if(/contin|sigue|seguir|adelante/.test(t))continuar()};
  r.onend=()=>{if(SP.st==="wait"&&SP.rec===r){try{r.start()}catch(e){}}};r.onerror=()=>{};SP.rec=r;r.start()}catch(e){}}
function stopRec(){const r=SP.rec;SP.rec=null;if(r){try{r.abort()}catch(e){}}}
function ui(){const c=$("#lcur");if(!c)return;const it=SP.q[SP.i];
 const m={idle:"Detenido",play:"Leyendo…",paused:"En pausa",wait:"🧘 Tiempo para reflexionar. Di «continúa» o toca Continuar."}[SP.st];
 $("#lst").textContent=m+(SP.q.length?" ("+Math.min(SP.i+1,SP.q.length)+"/"+SP.q.length+")":"");
 c.textContent=it?(it.wait?"Espacio para reflexionar o hacer el ejercicio…":it.t):"Elige qué escuchar y toca Empezar."}

  ["Plan semanal sugerido","Una forma práctica de estudiar la inteligencia emocional con esta app.","Lun: leer un capítulo. Mar: practicar el ejercicio. Mié: repasar con recuerdo activo. Jue: aplicar con una persona. Vie: reflexionar en el diario. Sáb: repaso espaciado. Dom: descanso.","Cada semana.","Un capítulo por semana, con repaso a los 1, 3 y 7 días."],
  ["Aprender haciendo","La inteligencia emocional se aprende practicando en situaciones reales.","Elige una persona y un rol (pestaña Personas) y aplica una frase esta semana.","Diario.","Usa la pausa de 3 segundos con tu familia."],
  ["Escuchar y reflexionar","Combinar audio (modo lectura) con pausas de reflexión.","Escucha un módulo con audífonos y escribe en «Mis reflexiones» durante la pausa.","3–4 veces por semana.","Escucha el módulo de pareja caminando."]]}
];
function vEstudio(){
 return `<div class="card"><h2>📚 Técnicas y métodos de estudio</h2>
 <p>Métodos para aprender y recordar mejor: nemotecnia, repetición espaciada, mapas, técnicas de tiempo y más. Cada uno trae cómo usarlo, con qué frecuencia y un ejemplo.</p>
 <div class="pill-row"><button class="btn ghost noprint" onclick="listen('estudio')">🎧 Escuchar esta sección</button></div>
 <input id="eq" placeholder="🔍 Buscar (ej. nemotecnia, repaso, Pomodoro)" oninput="filtraEst()" style="margin-top:8px"></div>
 <div class="card"><h3>🗓️ Plan de repasos (repetición espaciada)</h3><p class="hint">Escribe lo que aprendiste y la fecha de estudio. Te armo los días de repaso y los puedes agregar al calendario.</p>
 <div class="row"><input id="rt" placeholder="Tema (ej. Libro 1 – Cap. 3)"><input id="rf" type="date" value="${hoyISO()}"></div>
 <button class="btn" onclick="planRep()">Generar plan</button><div id="rp"></div></div>
 <div id="el">${estHtml("")}</div>`}
function hoyISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function sumDias(f,n){const [y,m,d]=f.split("-").map(Number);const x=new Date(y,m-1,d+n);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function estHtml(q){q=q.toLowerCase();let h="";
 ESTUDIO.forEach(g=>{const it=g.items.filter(i=>!q||i.join(" ").toLowerCase().includes(q));if(!it.length)return;
  h+=`<h3 style="margin-top:18px">${g.g}</h3>`+it.map(i=>`<details ${q?'open':''}><summary>${esc(i[0])}</summary><div><p>${esc(i[1])}</p><div class="say"><b>Cómo:</b> ${esc(i[2])}</div><div class="say"><b>Cuándo / frecuencia:</b> ${esc(i[3])}</div><p class="hint"><b>Ejemplo:</b> ${esc(i[4])}</p></div></details>`).join("")});
 return h||'<p class="hint">Sin resultados.</p>'}
function filtraEst(){$("#el").innerHTML=estHtml($("#eq").value.trim())}
let planActual=null;
function planRep(){const t=$("#rt").value.trim(),f=$("#rf").value;if(!t||!f){alert("Escribe el tema y la fecha.");return}
 planActual={t,f};$("#rp").innerHTML=REPASO.map(r=>{const d=sumDias(f,r[0]);return `<div class="ev"><div><b>${esc(r[1])}</b><small>${d}</small></div></div>`}).join("")+`<button class="btn" style="margin-top:8px" onclick="planCal()">➕ Agregar al calendario</button>`}
function planCal(){if(!planActual)return;REPASO.slice(1).forEach(r=>eventos.push({id:"e"+Date.now()+r[0],nombre:"📚 Repasar: "+planActual.t,fecha:sumDias(planActual.f,r[0]),tipo:"otro",rel:"otro",nota:r[1],anual:false}));
 S.set("ief_eventos",eventos);alert("Listo: agregué "+(REPASO.length-1)+" repasos al calendario.")}
function qEstudio(){const q=[{t:"Técnicas y métodos de estudio."}];ESTUDIO.forEach(g=>{q.push({t:g.g});g.items.forEach(i=>{q.push({t:i[0]+". "+i[1]});q.push({t:"Cómo: "+i[2]});q.push({t:"Frecuencia: "+i[3]});q.push({t:"Ejemplo: "+i[4]})});q.push(WAIT)});return q}

/* ----- diario ----- */
let sel=null;
function vDiario(){
 const hist=diario.slice().reverse().slice(0,15);
 return `<div class="card"><h2>📝 Diario emocional</h2><p class="hint">¿Cómo te sientes hoy? Nombrar la emoción ya te ayuda a regularla.</p>
 <div class="emo">${EMOCIONES.map(e=>`<button class="${sel===e?'on':''}" onclick="sel='${e}';render()">${e}</button>`).join("")}</div>
 <h3>¿Qué la provocó?</h3><textarea id="dq" rows="2" placeholder="Situación o persona…"></textarea>
 <h3>¿Qué necesito? ¿Qué puedo hacer?</h3><textarea id="dn" rows="2" placeholder="Necesito… Puedo…"></textarea>
 <button class="btn" style="margin-top:8px" onclick="saveD()">Guardar</button></div>
 <div class="card"><h3>Mis registros</h3>${hist.length?hist.map(d=>`<div class="ev"><div><b>${esc(d.emo)}</b><small>${new Date(d.f).toLocaleDateString("es",{day:"numeric",month:"short"})} · ${esc(d.q)} → ${esc(d.n)}</small></div></div>`).join(""):'<p class="hint">Aún no hay registros.</p>'}
 ${hist.length?'<button class="btn ghost noprint" onclick="clearD()">Borrar diario</button>':''}</div>`;
}
function saveD(){if(!sel){alert("Elige una emoción.");return}diario.push({f:Date.now(),emo:sel,q:$("#dq").value,n:$("#dn").value});S.set("ief_diario",diario);sel=null;render()}
function clearD(){if(confirm("¿Borrar todo el diario?")){diario=[];S.set("ief_diario",diario);render()}}

/* ============ RENDER ============ */
function render(){nav();$("#app").innerHTML= tab==="inicio"?vInicio():tab==="libro"?vLibro():tab==="calendario"?vCal():tab==="diario"?vDiario():tab==="limites"?vLimites():tab==="tipos"?vTipos():tab==="personas"?vPersonas():tab==="estudio"?vEstudio():tab==="escuchar"?vEscuchar():vModulo(tab);if(tab==="escuchar")ui()}
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(TABS.find(x=>x[0]===t)&&t!==tab){tab=t;render()}});
render();
</script>
